    const parado = Math.abs(G3.alvo - G3.t) < 0.002;
    if (parado && G3.alvo === 0){
      G3.t = 0; desenhaG3(canvas); G3.laco = 0; return;
    }
    G3.laco = requestAnimationFrame(passo);
  };
  if (!G3.laco) G3.laco = requestAnimationFrame(passo);
}

/* --- entradas e saídas --- */
function abreRede(it, modo, px, py, largura, altura){
  const slide = it.closest('.slide');
  const cv = slide && slide.querySelector('.q3d');
  if (!cv || !iniciaG3(cv)) return;
  montaCena(modo || 'pedra');
  G3.px = px !== undefined ? px : parseFloat(it.style.left);
  G3.py = py !== undefined ? py : parseFloat(it.style.top);
  G3.px0 = G3.px; G3.py0 = G3.py;
  G3.slide = slide;
  if (REDES[modo] && largura){
    enquadraRede(G3.px, G3.py, largura, altura);
    /* A camera comeca de dentro do cristal e recua ate o enquadramento:
       e o fim do mergulho que o grao comecou ao crescer na tela. */
    G3.distAlvo = G3.dist;
    G3.dist = Math.max(60, G3.dist * 0.16);
    G3.voo = 1;
  }
  const q = slide.querySelector('.quantum');
  if (q){
    q.style.setProperty('--qox', G3.px + 'px');
    q.style.setProperty('--qoy', G3.py + 'px');
  }
  slide.classList.add('quantum-on');
  poeRotuloRede(slide);
  slide.classList.toggle('rede-on', !!REDES[modo]);
  /* o quadro recebe o nome do composto: o mesmo da legenda da imagem */
  const tit = slide.querySelector('.qb-tit');
  if (tit){
    const cap = slide.querySelector('.reveal-item.fixo .cap');
    tit.textContent = (REDES[modo] && cap) ? cap.textContent.trim() : '';
  }
  if (REDES[modo]) slide.dataset.mergulhou = '1';   /* já entrou uma vez */
  G3.alvo = 1;
  lacoG3(cv);
}
/* Sair do retículo pelo botão Voltar: a câmera volta a mergulhar no
   cristal enquanto o mundo quântico se apaga, e o grão encolhe de volta
   ao tamanho que tinha. É o inverso exato da entrada. */
function saiDaRede(slide){
  if (!slide) return;
  const caco = slide.querySelector('.caco');
  if (REDES[G3.modo]){
    G3.distAlvo = Math.max(60, G3.dist * 0.16);
    G3.voo = 1;
  }
  if (caco){
    caco.classList.remove('mergulha');
    void caco.offsetWidth;
    caco.classList.add('volta-grao');
    setTimeout(() => {
      caco.classList.remove('volta-grao');
      caco.style.opacity = '';
    }, 640);
  }
  fechaRede(slide);
}

function fechaRede(it){
  const slide = it.closest ? it.closest('.slide') : it;
  if (!slide) return;
  slide.classList.remove('quantum-on', 'rede-on', 'rede-livre');
  G3.lupa = null; G3.lupaCv = null; G3.lupaClip = '';
  const rot = slide.querySelector('.cel-rot');
  if (rot) rot.classList.remove('on');
  const rr = slide.querySelector('.rede-rot');
  if (rr) rr.classList.remove('on');
  G3.slide = null;
  /* quem estiver mergulhando termina de voltar sozinho, pela animação */
  slide.querySelectorAll('.caco:not(.volta-grao)')
       .forEach(c => { c.classList.remove('mergulha'); c.style.opacity = ''; });
  G3.alvo = 0; G3.celOff = [0, 0, 0]; G3.volta = 0; G3.pulso = 0;
  G3.drama = 0; G3.celQ = null;
  const cv = slide.querySelector('.q3d');
  if (cv && iniciaG3(cv)) lacoG3(cv);
}
function orbitaG3(dx, dy){
  G3.az -= dx * 0.006;
  G3.el = Math.max(-1.45, Math.min(1.45, G3.el + dy * 0.006));
}
/* posicao da camera e seus eixos, do jeito que desenhaG3 os monta */
function camG3(){
  const ce = Math.cos(G3.el), se = Math.sin(G3.el);
  const sa = Math.sin(G3.az), ca = Math.cos(G3.az);
  return {
    olho: [ sa * ce * G3.dist, se * G3.dist, ca * ce * G3.dist ],
    dir:  [ ca, 0, -sa ],                     /* direita da camera */
    cim:  [ -sa * se, ce, -ca * se ]          /* cima da camera */
  };
}
/* onde um ponto do mundo cai no palco de 1280x720 */
function paraTela(p){
  const c = camG3();
  const proj = m4perspectiva(0.85, 1280 / 720, 10, 4000);
  proj[8] = -((G3.px / 1280) * 2 - 1);
  proj[9] = -(1 - (G3.py / 720) * 2);
  const view = m4olhar(c.olho, [0, 0, 0], [0, 1, 0]);
  const mul = (M, v) => [0,1,2,3].map(r =>
    M[r]*v[0] + M[4+r]*v[1] + M[8+r]*v[2] + M[12+r]*v[3]);
  const q = mul(proj, mul(view, [p[0], p[1], p[2], 1]));
  const w = q[3] || 1;
  return { x: (q[0]/w * 0.5 + 0.5) * 1280, y: (1 - (q[1]/w * 0.5 + 0.5)) * 720 };
}
/* A célula tem giro próprio, separado do da rede. Guardado como quatérnio
   para poder somar giros em qualquer ordem e voltar suavemente ao zero
   quando ela se reencaixa. */
function qEixo(u, a){
  const s = Math.sin(a / 2);
  return [Math.cos(a / 2), u[0] * s, u[1] * s, u[2] * s];
}
function qMul(a, b){
  return [ a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
           a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
           a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
           a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0] ];
}
function qNorm(q){
  const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0]/n, q[1]/n, q[2]/n, q[3]/n];
}
function qMat(q){
  const w = q[0], x = q[1], y = q[2], z = q[3];
  return [ 1-2*(y*y+z*z), 2*(x*y-w*z),   2*(x*z+w*y),
           2*(x*y+w*z),   1-2*(x*x+z*z), 2*(y*z-w*x),
           2*(x*z-w*y),   2*(y*z+w*x),   1-2*(x*x+y*y) ];
}
function ap3(M, v){
  return [ M[0]*v[0] + M[1]*v[1] + M[2]*v[2],
           M[3]*v[0] + M[4]*v[1] + M[5]*v[2],
           M[6]*v[0] + M[7]*v[1] + M[8]*v[2] ];
}
const Q0 = [1, 0, 0, 0];
function celGirada(){ return G3.celQ && G3.celQ[0] < 0.99999; }
/* de onde o íon da célula sai depois de encolher e girar */
function desloCel(p, enc){
  const cC = G3.celC;
  let d = [0,1,2].map(e => (p[e] - cC[e]) * enc);
  if (celGirada()) d = ap3(qMat(G3.celQ), d);
  return d;
}
/* arrastar em cima da célula solta gira só ela */
function giraCelula(dx, dy){
  const c = camG3();
  const q = qMul(qEixo(c.dir, dy * 0.008),
                 qEixo(c.cim, dx * 0.008));
  G3.celQ = qNorm(qMul(q, G3.celQ || Q0));
}

/* quanto a celula esta encolhida agora */
function encAtual(){
  return 1 - (1 - CEL_ESC) * Math.min(1, celFora() / CEL_MAX);
}
/* onde um atomo esta no mundo neste instante */
function mundoDoAtomo(a){
  const enc = encAtual();
  let q = a.rede.slice();
  if (a.cel){
    const d = desloCel(a.rede, enc);
    q = [0,1,2].map(e => G3.celC[e] + d[e] + G3.celOff[e]);
  }
  if (a.solto && a.off) q = [0,1,2].map(e => q[e] + a.off[e]);
  return q;
}
/* qual atomo esta embaixo do dedo; entre os que servem, o da frente */
function atomoNoPonto(x, y, filtro, folga){
  const c = camG3();
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  const enc = encAtual();
  let melhor = null, dmin = Infinity;
  G3.atomos.forEach(a => {
    if (filtro && !filtro(a)) return;
    const p = mundoDoAtomo(a);
    const prof = [0,1,2].reduce((sm, e) => sm + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
    if (prof < 60) return;
    const t = paraTela(p);
    const r = a.raio * (a.cel ? enc : 1) * 720 / (2 * prof * Math.tan(0.85 / 2))
            * (folga || 1);
    if (Math.hypot(t.x - x, t.y - y) > r) return;
    if (prof < dmin){ dmin = prof; melhor = a; }
  });
  return melhor;
}
/* Marca como celula o bloco 3x3x3 centrado no atomo que o dedo tocou:
   assim qualquer celula do reticulo pode ser arrancada, nao so a da frente. */
function celulaNoPonto(x, y){
  const a = atomoNoPonto(x, y);
  if (!a || !a.ijk) return false;
  const C = G3.celula || { tam: 3, alinha: 0 };
  const tri = v => Array.isArray(v) ? v : [v, v, v];
  const T = tri(C.tam), A = tri(C.alinha);
  const N = tri(G3.nRede || Math.round(Math.cbrt(G3.atomos.length)));
  /* eixo com "alinha": a célula encaixa na malha (antifluorita, lamelas).
     eixo sem: o bloco fica centrado no íon que o dedo tocou (sal-gema). */
  const o = a.ijk.map((v, e) => A[e]
    ? Math.max(0, Math.min(N[e] - T[e], Math.floor(v / A[e]) * A[e]))
    : Math.max(0, Math.min(N[e] - T[e], v - Math.floor(T[e] / 2))));
  G3.atomos.forEach(b => {
    b.cel = !!(b.ijk && b.ijk.every((v, e) => v >= o[e] && v < o[e] + T[e]));
  });
  const dc = G3.atomos.filter(b => b.cel);
  G3.celC = [0,1,2].map(e => dc.reduce((sm, b) => sm + b.rede[e], 0) / dc.length);
  return true;
}
/* arranca a celula da rede: as hastes rompem e a cena sacode */
function quebraCelula(){
  G3.celOff = [0, 0, 0];
  G3.volta = 0; G3.pulso = 0;
  G3.drama = 1;
}
/* arranca um atomo da celula */
function arrancaAtomo(a){
  a.solto = true; a.voltando = false; a.off = [0, 0, 0]; a.fx = 1;
  if (G3.drama < 0.55) G3.drama = 0.55;
}
/* devolve o atomo ao lugar dele na celula */
function devolveAtomo(a){ a.voltando = true; a.fx = 1; }
/* leva um atomo solto para onde o dedo for */
function moveAtomo(a, dx, dy){
  if (!a) return;
  if (!a.off) a.off = [0, 0, 0];
  const k = fitScale || 1;
  const c = camG3();
  const p = mundoDoAtomo(a);
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  const prof = [0,1,2].reduce((sm, e) => sm + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
  const ppw = 2 * Math.max(60, prof) * Math.tan(0.85 / 2) / 720;
  const ex = (dx / k) * ppw, ey = -(dy / k) * ppw;
  for (let e = 0; e < 3; e++) a.off[e] += c.dir[e] * ex + c.cim[e] * ey;
}
/* tudo de volta ao lugar dentro do reticulo */
function reiniciaRede(slide){
  G3.celOff = [0, 0, 0];
  G3.volta = 0; G3.pulso = 0; G3.drama = 0; G3.celQ = null;
  G3.atomos.forEach(a => {
    a.cel = false; a.solto = false; a.voltando = false; a.off = null; a.fx = 0;
  });
  G3.az = -0.42; G3.el = 0.28;
  G3.dist = G3.dist0 !== undefined ? G3.dist0 : 470;
  if (G3.px0 !== undefined){ G3.px = G3.px0; G3.py = G3.py0; }
  const rot = slide && slide.querySelector('.cel-rot');
  if (rot) rot.classList.remove('on');
  poeRotuloRede(slide);
}
/* A celula segue o dedo, sem direcao nem curso fixos: o arrasto na tela
   vira deslocamento nos eixos da camera, entao ela anda onde se leva. */
function puxaCelula(dx, dy){
  const k = fitScale || 1;
  const c = camG3();
  /* Quanto de mundo cabe num px do palco. Tem que ser medido na
     profundidade da propria celula, nao na do centro do reticulo: ela
     esta na frente, projeta maior, e usaria escala errada. */
  const p = [0,1,2].map(e => G3.celC[e] + G3.celOff[e]);
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  const prof = [0,1,2].reduce((s, e) => s + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
  const ppw = 2 * Math.max(60, prof) * Math.tan(0.85 / 2) / 720;
  const ex = (dx / k) * ppw, ey = -(dy / k) * ppw;
  for (let e = 0; e < 3; e++) G3.celOff[e] += c.dir[e] * ex + c.cim[e] * ey;
}
function celFora(){ return Math.hypot(G3.celOff[0], G3.celOff[1], G3.celOff[2]); }
const ENCAIXE = 70;        /* perto assim, ela se encaixa de volta na rede */

/* arrasta o reticulo inteiro: desloca o ponto do palco em que a cena e vista */
function moveRede(dx, dy){ G3.px += dx; G3.py += dy; }

/* ------------------------------------------------------------
   REVELAÇÃO, ARRASTE E PINÇA
   clique no "?" .......: solta o próximo elemento
   clique depois do último: recolhe tudo e volta ao início
   arrastar ............: mouse, caneta ou dedo
   pinça (2 dedos) .....: aumenta ou diminui — no computador, Ctrl + roda
   ------------------------------------------------------------ */
const K_MIN = .35, K_MAX = 4;
const QM_BIG = 5;                          /* o toque na molécula leva a 500% */
/* o que se arrasta e se redimensiona: os elementos do slide e,
   dentro do mundo quântico, as próprias moléculas */
/* a ordem não importa: closest() devolve o mais próximo que casar.
   Num átomo de ponta casa o próprio átomo; no central, casa a molécula. */
const PEGAVEL = '.reveal-item, .qm, .q-board.on, .qat.end, .qmol,'
              + ' .cam.solta, .cam.valencia, .caco';

/* Uma molécula fica instável por duas razões: falta um átomo dela,
   ou um átomo solto está encostando nela. */
const marcaInstavel = (mol) => mol && mol.classList.toggle('unstable',
  !!mol.querySelector('.qat.torn') || mol.dataset.near === '1');

/* ------------------------------------------------------------
   As moléculas se juntam em volta do objeto, e não pela tela toda:
   o mergulho é numa gota daquela substância, no lugar onde ela está.
   Se o objeto estiver muito na borda, o grupo escorrega o mínimo
   necessário para caber inteiro no palco.
   ------------------------------------------------------------ */
function agrupaEmVolta(bolas, cx, cy){
  if (!bolas.length) return;
  const grande = bolas[0].classList.contains('qmol');
  const cols = bolas.length > 8 ? 5 : 3;
  const lin  = Math.ceil(bolas.length / cols);
  const px = grande ? 330 : 150, py = grande ? 250 : 132;

  const meiaL = ((cols - 1) * px + (lin > 1 ? px / 2 : 0)) / 2 + px / 2;
  const meiaA = ((lin - 1) * py) / 2 + py / 2;
  const gx = Math.max(meiaL + 20, Math.min(1260 - meiaL, cx));
  const gy = Math.max(meiaA + 20, Math.min(700 - meiaA, cy));

  bolas.forEach((m, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const desloca = r % 2 ? px / 2 : 0;     /* fileiras alternadas, como tijolo */
    const cx2 = gx + (c - (cols - 1) / 2) * px + desloca;
    const cy2 = gy + (r - (lin - 1) / 2) * py;
    /* .qmol é centrada pelo transform; .qm é posicionada pelo canto */
    let lx = cx2, ly = cy2;
    if (!m.classList.contains('qmol')){
      const k = parseFloat(m.style.getPropertyValue('--k')) || 1;
      lx -= 26 * k; ly -= 19 * k;
    }
    m.style.left = lx.toFixed(0) + 'px';
    m.style.top  = ly.toFixed(0) + 'px';
    m.dataset.ox = 0; m.dataset.oy = 0;
    /* o átomo arrancado volta para a casa dele dentro da nova posição */
    m.querySelectorAll('.qat.end').forEach(a => {
      a.classList.remove('torn', 'jitter', 'flyback');
      a.style.left = a.dataset.hx + 'px';
      a.style.top  = a.dataset.hy + 'px';
    });
    m.querySelectorAll('.qbond').forEach(b => b.classList.remove('snap', 'broken'));
    m.classList.remove('unstable');
  });
}

/* raio que a receita ocupa dentro da caixa de 52 x 38 */
const raioBase = (rec) => Math.max(...rec.map(([el, x, y, r]) =>
  Math.hypot(x / 100 * 52 - 26, y / 100 * 38 - 19) + r));

/* congela a deriva e anota o deslocamento atual de cada bola */
function congelaBolas(campo){
  if (!campo) return;
  campo.classList.add('freeze');
  campo.querySelectorAll('.qm').forEach(m => {
    const t = getComputedStyle(m).transform;
    let ox = 0, oy = 0;
    if (t && t !== 'none'){
      const n = t.slice(t.indexOf('(') + 1, -1).split(',').map(Number);
      if (t.indexOf('matrix3d') === 0){ ox = n[12] || 0; oy = n[13] || 0; }
      else                            { ox = n[4]  || 0; oy = n[5]  || 0; }
    }
    m.dataset.ox = ox; m.dataset.oy = oy;
  });
}
const soltaBolas = (campo) => campo && campo.classList.remove('freeze');

const medeBola = (m) => {
  const k = parseFloat(m.style.getPropertyValue('--k')) || 1;
  return { el: m,
    x: parseFloat(m.style.left) + 26 * k + (+m.dataset.ox || 0),
    y: parseFloat(m.style.top)  + 19 * k + (+m.dataset.oy || 0),
    r: (parseFloat(m.dataset.rad) || 15) * k, bate: false };
};
/* devolve os pares que estão se encostando */
function paresEncostados(campo){
  const todas = [...campo.querySelectorAll('.qm')].map(medeBola);
  const pares = [];
  for (let i = 0; i < todas.length; i++)
    for (let j = i + 1; j < todas.length; j++){
      const a = todas[i], b = todas[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) <= a.r + b.r + 4){
        a.bate = b.bate = true; pares.push([a, b]);
      }
    }
  return { todas, pares };
}

let conflitoT = null, conflitoEtapas = [];

function paraConflito(){
  clearTimeout(conflitoT); conflitoT = null;
  conflitoEtapas.forEach(clearTimeout); conflitoEtapas = [];
}

/* Soltou o dedo com as bolas encostadas: sem a mão segurando, a
   tensão sobe de uma vez e elas se arremessam. */
function escalaESepara(campo){
  if (conflitoT || !campo) return;
  const sobe = (cls) => campo.querySelectorAll('.qm.unstable')
    .forEach(m => m.classList.add(cls));
  sobe('u2');                                /* já solta no nível agressivo */
  conflitoEtapas = [ setTimeout(() => sobe('u3'), 600) ];
  conflitoT = setTimeout(() => repeleBolas(campo), 1400);
}

const decora = (campo, cls, x, y, extra) => {
  const el = document.createElement('i');
  el.className = cls;
  if (x !== undefined){ el.style.left = x + 'px'; el.style.top = y + 'px'; }
  if (extra) el.style.background = extra;
  campo.appendChild(el);
  setTimeout(() => el.remove(), 700);
};

/* estouram e se arremessam para longe uma da outra */
function repeleBolas(campo){
  paraConflito();
  const { todas, pares } = paresEncostados(campo);
  if (!pares.length){ limpaConflito(campo); return; }

  const empurra = new Map();
  pares.forEach(([a, b]) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    [[a, -ux, -uy], [b, ux, uy]].forEach(([q, vx, vy]) => {
      const v = empurra.get(q.el) || { x: 0, y: 0 };
      empurra.set(q.el, { x: v.x + vx, y: v.y + vy });
    });
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    decora(campo, 'qburst', mx, my);
    decora(campo, 'qflash', undefined, undefined,
      `radial-gradient(circle at ${mx}px ${my}px,rgba(255,190,130,.55),rgba(255,140,80,0) 62%)`);
  });

  campo.classList.add('freeze');             /* o arremesso não disputa com a deriva */
  empurra.forEach((v, el) => {
    const n = Math.hypot(v.x, v.y) || 1;
    el.classList.add('repel');
    el.style.left = Math.max(-30, Math.min(1230,
      parseFloat(el.style.left) + v.x / n * 210)) + 'px';
    el.style.top  = Math.max(-20, Math.min(660,
      parseFloat(el.style.top)  + v.y / n * 210)) + 'px';
  });

  setTimeout(() => limpaConflito(campo), 640);
}

function limpaConflito(campo){
  if (!campo) return;
  campo.querySelectorAll('.qm').forEach(m =>
    m.classList.remove('repel', 'unstable', 'u2', 'u3'));
  campo.classList.remove('freeze');
}

/* bolas que se encostam ficam instáveis — inclusive as que já estavam
   paradas juntas, por isso a varredura é de todas contra todas */
function checaBolas(campo){
  if (!campo || campo.dataset.mono !== '1') return;   /* só gás nobre */
  const { todas, pares } = paresEncostados(campo);
  /* em tempo real, enquanto o dedo leva a bola: as duas que se encostam
     ficam instáveis na hora. A escalada só vem quando o dedo sai. */
  todas.forEach(a => {
    a.el.classList.toggle('unstable', a.bate);
    if (!a.bate) a.el.classList.remove('u2', 'u3');
  });
}

/* posição e raio de um átomo em coordenadas do palco */
function atomoNoPalco(at){
  const mol = at.closest('.qmol');
  if (!mol) return null;
  return {
    x: parseFloat(mol.style.left) - SPLIT_W / 2 + parseFloat(at.style.left),
    y: parseFloat(mol.style.top)  - SPLIT_H / 2 + parseFloat(at.style.top),
    r: parseFloat(at.style.getPropertyValue('--r')) || 0
  };
}

/* o átomo arrancado desestabiliza quem ele encostar pelo caminho */
function checaVizinhanca(at){
  const campo = at.closest('.quantum, .pn-q');
  const minha = at.closest('.qmol');
  const meu = atomoNoPalco(at);
  if (!campo || !meu) return;

  campo.querySelectorAll('.qmol').forEach(mol => {
    if (mol === minha) return;
    let encosta = false;
    mol.querySelectorAll('.qat').forEach(o => {
      if (encosta) return;
      const p = atomoNoPalco(o);
      if (p && Math.hypot(p.x - meu.x, p.y - meu.y) <= p.r + meu.r + 6) encosta = true;
    });
    if ((mol.dataset.near === '1') !== encosta){
      mol.dataset.near = encosta ? '1' : '';
      marcaInstavel(mol);
    }
  });
}

/* solto o átomo, ninguém mais está sendo perturbado */
function acalmaVizinhanca(campo){
  if (!campo) return;
  campo.querySelectorAll('.qmol[data-near="1"]').forEach(mol => {
    mol.dataset.near = '';
    marcaInstavel(mol);
  });
}

const pecaDe = (mol, sel, i) => mol && mol.querySelector(`${sel}[data-for="${i}"]`);
const repete = (el, cls) => { if (el){ el.classList.remove(cls); void el.offsetWidth;
                                      el.classList.add(cls); } };

/* rompe a ligação do átomo arrancado */
function breakBond(at){
  const mol    = at.closest('.qmol');
  const bond   = pecaDe(mol, '.qbond',   at.dataset.i);
  const spark  = pecaDe(mol, '.qspark',  at.dataset.i);
  const splash = pecaDe(mol, '.qsplash', at.dataset.i);

  at.classList.remove('flyback', 'snapped', 'jitter');
  void at.offsetWidth;
  at.classList.add('torn');
  if (mol) mol.classList.remove('settled');
  /* o coice vem primeiro; o tremor entra quando ele termina */
  setTimeout(() => { if (at.classList.contains('torn')) at.classList.add('jitter'); }, 420);

  if (bond){
    bond.classList.remove('form', 'broken');
    void bond.offsetWidth;
    bond.classList.add('snap');
    /* passado o estouro, sobra o coto piscando: a valência que ficou aberta */
    setTimeout(() => {
      if (!at.classList.contains('torn')) return;
      bond.classList.remove('snap');
      bond.classList.add('broken');
    }, 380);
  }
  repete(spark, 'go');
  repete(splash, 'go');                    /* o esguicho de estilhaços */
  marcaInstavel(mol);
}

/* solto, o átomo volta voando e a ligação se refaz */
function healBond(at){
  const mol   = at.closest('.qmol');
  const bond  = pecaDe(mol, '.qbond',  at.dataset.i);
  const spark = pecaDe(mol, '.qspark', at.dataset.i);

  acalmaVizinhanca(at.closest('.quantum, .pn-q'));
  at.classList.remove('jitter');           /* volta em linha reta, sem tremer */
  at.classList.add('flyback');
  at.style.left = at.dataset.hx + 'px';
  at.style.top  = at.dataset.hy + 'px';
  repete(spark, 'join');                   /* o anel se fecha enquanto ele volta */

  setTimeout(() => {
    at.classList.remove('flyback', 'torn', 'jitter');
    marcaInstavel(mol);                    /* completa de novo: para de tremer */
    repete(at, 'snapped');
    if (bond){
      bond.classList.remove('snap', 'broken');
      void bond.offsetWidth;
      bond.classList.add('form');
    }
    if (mol && !mol.classList.contains('unstable')) repete(mol, 'settled');
    setTimeout(() => {
      at.classList.remove('snapped');
      if (mol) mol.classList.remove('settled');
    }, 620);
  }, 420);
}
const ORBIT_RX = -17, ORBIT_RY = 27;       /* inclinação de partida da rede aberta */
let zoomAbertoEm = 0;                      /* instante da última abertura do zoom */
const FOLLOW_MS = 380;                     /* intervalo padrão da cascata automática
                                              (follow: 0 faz sair no mesmo instante) */

/* mergulho no mundo quântico: o copo vai ao centro do palco e cresce */
function openQuantum(it){
  const slide = it.closest('.slide');
  if (!slide) return;
  /* o copo não sai do lugar: é a câmera que vai até ele, e tudo
     no fundo se abre a partir deste ponto */
  const q = slide.querySelector('.quantum');
  if (q){
    q.style.setProperty('--qox', parseFloat(it.style.left) + 'px');
    q.style.setProperty('--qoy', parseFloat(it.style.top)  + 'px');
    /* cada substância mostra a sua própria molécula */
    const key = it.dataset.mol || 'h2o';
    const rec = RECIPES[key] || RECIPES.h2o;
    const desenho = MOL_SVG(key);
    const raio = raioBase(rec);
    /* gás nobre é uma esfera só: sai maior, para ocupar o mesmo peso visual */
    const mono = rec.length === 1;
    const escala = mono ? 2 : 1.2;         /* molécula 20% maior; átomo isolado, o dobro */
    /* Só átomo isolado se incomoda com a vizinhança. Molécula encostando
       em molécula é o normal da matéria — ali não há instabilidade nenhuma. */
    q.dataset.mono = mono ? '1' : '';
    q.classList.remove('freeze');
    const bolas = [...q.querySelectorAll('.qm')];
    bolas.forEach(m => {
      m.style.background = '';               /* o desenho é SVG, não fundo */
      m.innerHTML = desenho;                 /* cada substância, a sua molécula */
      m.dataset.rad = raio;
      m.dataset.k0  = escala;
      m.style.setProperty('--k', escala);
      m.classList.remove('unstable', 'big');
    });
    agrupaEmVolta([...q.querySelectorAll('.qm, .qmol')],
                  parseFloat(it.style.left), parseFloat(it.style.top));
  }
  it.classList.add('zoomed');
  slide.classList.add('quantum-on');
  /* a partir daqui o objeto fica pointer-events:none, então o "click"
     desta mesma tocada será roteado para o fundo. Marcamos a hora para
     o ouvinte global não confundir a abertura com um pedido de saída. */
  zoomAbertoEm = Date.now();
}
function closeQuantum(it){
  if (!it.classList.contains('zoomed')) return;
  it.classList.remove('zoomed');
  const slide = it.closest('.slide');
  if (!slide) return;
  slide.classList.remove('quantum-on', 'rede-on', 'rede-livre');
  paraConflito();
  limpaConflito(slide.querySelector('.quantum'));
  const q = slide.querySelector('.q-board');   /* o quadro não fica para o próximo */
  if (q) q.classList.remove('on');
}

/* devolve a pedra ao estado inteiro: sem órbita, sem zoom, sem rede */
function restoreRock(it){
  if (!it.classList.contains('broken')) return;
  it.classList.remove('broken');
  fechaRede(it);
}

/* devolve o barquinho ao estado montado */
function restoreLego(it){
  if (it.classList.contains('exploded')) rebuildLego(it);
}
const gestures = new Map();   /* elemento -> ponteiros ativos */
let gesturing = false;        /* trava o swipe de troca de slide */

const getK = (it) => parseFloat(getComputedStyle(it).getPropertyValue('--k')) || 1;
const setK = (it, k) =>
  it.style.setProperty('--k', Math.min(K_MAX, Math.max(K_MIN, k)).toFixed(3));

const itemsOf  = (slide) => [...slide.querySelectorAll('.reveal-item')];
const parentOf = (slide, it) => it.dataset.from
  ? slide.querySelector(`.reveal-item[data-id="${it.dataset.from}"]`)
  : null;

const cubeOf  = (slide) => slide.querySelector('.reveal-item.cube');
const faceNow = (slide) => { const c = cubeOf(slide);
  return c && !c.hidden ? +c.dataset.face : -1; };

/* um elemento só pode sair se não pertence a face nenhuma,
   ou se pertence à face que o cubo está mostrando agora */
/* item "manual" não entra na sequência de cliques: quem manda nele
   é o botão de ajuda */
const eligible = (it, face) =>
  it.dataset.manual === undefined &&
  (it.dataset.of === undefined || +it.dataset.of === face);

/* o que o próximo toque no "?" vai fazer */
function nextAction(slide){
  const face = faceNow(slide);
  const it = itemsOf(slide).find(o => o.hidden && !o.classList.contains('retract')
                                   && eligible(o, face));
  if (it) return { type: 'reveal', it };
  const c = cubeOf(slide);
  if (c && !c.hidden && +c.dataset.face < +c.dataset.faces - 1) return { type: 'turn' };
  return { type: 'reset' };
}

/* acende o ponto no que ainda guarda algo, e acerta o "?" */
function syncReveals(slide){
  const items = itemsOf(slide);
  const face = faceNow(slide);
  items.forEach(it => {
    const holds = !!it.dataset.id &&
      items.some(o => o.hidden && o.dataset.from === it.dataset.id && eligible(o, face));
    it.classList.toggle('has-more', holds && !it.hidden);
  });
  const btn = slide.querySelector('.reveal-btn');
  if (!btn) return;
  /* slide só com elementos automáticos: não há o que revelar, some a caixa */
  btn.hidden = items.every(it => it.dataset.auto || it.dataset.manual !== undefined);
  const act = nextAction(slide).type;
  btn.classList.toggle('done', act === 'reset');
  btn.textContent = act === 'reset' ? '↺' : '?';
  btn.title = act === 'reset' ? 'Recomeçar'
            : act === 'turn' ? 'Girar o cubo para o próximo postulado'
            : 'Revelar o próximo elemento';
  atualizaBarra();
}

/* o elemento volta para dentro de onde saiu e some */
function retractItem(it){
  const slide = it.closest('.slide');
  aplicaAcao(slide, it.dataset.acao, false);
  apagaDigitado(it);
  closeQuantum(it);                        /* se estava ampliado, volta antes de sumir */
  it.classList.remove('pop', 'has-more');
  it.classList.add('retract');
  setTimeout(() => {
    if (!it.classList.contains('retract')) return;   /* foi revelado de novo no meio */
    it.classList.remove('retract');
    it.hidden = true;
    it.style.left = it.dataset.x + 'px';
    it.style.top  = it.dataset.y + 'px';
    if (slide) syncReveals(slide);
  }, 520);
}

/* ------------------------------------------------------------
   UM PASSO PARA TRÁS
   desfaz o último evento da sequência, na ordem inversa do "?":
   1. recolhe o último elemento do postulado que está à mostra
   2. gira o cubo de volta, devolvendo o postulado anterior inteiro
   3. recolhe os elementos soltos (o cubo, o título)
   devolve false quando não há mais nada a desfazer.
   ------------------------------------------------------------ */
const busy = (it) => it.hidden || it.dataset.auto || it.dataset.manual !== undefined
  || it.classList.contains('retract');

/* uma cascata saiu num clique só, então tem que voltar num passo só */
function retractGroup(items, i){
  const face = items[i].dataset.of;
  let a = i, b = i;
  while (a > 0 && items[a].dataset.follow && items[a - 1].dataset.of === face) a--;
  while (b + 1 < items.length && items[b + 1].dataset.follow
         && items[b + 1].dataset.of === face) b++;
  for (let k = a; k <= b; k++) if (!busy(items[k])) retractItem(items[k]);
}

function stepBack(slide){
  const items = itemsOf(slide);
  const cube = cubeOf(slide);
  const face = faceNow(slide);

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (busy(it) || it.dataset.of === undefined || +it.dataset.of !== face) continue;
    retractGroup(items, i);
    return true;
  }

  if (cube && !cube.hidden && +cube.dataset.face > 0){
    const back = +cube.dataset.face - 1;
    cube.dataset.face = back;
    cube.style.setProperty('--face', back);
    paintCube(cube, back);
    items.forEach(it => {                    /* o postulado anterior volta como estava */
      if (it.dataset.of !== undefined && +it.dataset.of === back){
        it.classList.remove('pop', 'retract');
        it.hidden = false;
        it.style.left = it.dataset.x + 'px';
        it.style.top  = it.dataset.y + 'px';
      }
    });
    /* cada face tem o seu exemplo: voltando, ele volta junto */
    if (cube.dataset.exemplos) trocaExemplo(slide, back, -1);
    syncReveals(slide);
    return true;
  }

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (busy(it) || it.dataset.of !== undefined) continue;
    retractGroup(items, i);
    return true;
  }
  return false;
}

/* a seta só apaga quando não há mais nem passo nem slide adiante */
function atualizaBarra(){
  const slide = slides[current];
  const temBotao = slide && slide.querySelector('.reveal-btn');
  const faltaAqui = temBotao && nextAction(slide).type !== 'reset';
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if (p) p.disabled = current === 0 && !temBotao;
  if (n) n.disabled = current === SLIDES.length - 1 && !faltaAqui;
}

/* as setas do teclado e as da barra percorrem a sequência;
   esgotada, trocam de slide */
/* Nos slides que guardam um retículo, o próximo slide fica trancado até
   se ter entrado no mundo quântico ao menos uma vez — e não se sai de lá
   pela seta, só pelo botão Voltar. A imagem pisca para dizer o que falta. */
function podeAvancar(slide){
  if (!slide || !slide.querySelector('.reveal-item.fixo')) return true;
  if (slide.classList.contains('quantum-on')) return false;
  return !!slide.dataset.mergulhou;
}
function pedeMergulho(slide){
  const img = slide.querySelector('.reveal-item.fixo');
  if (!img || slide.classList.contains('quantum-on')) return;
  img.classList.remove('pede');
  void img.offsetWidth;
  img.classList.add('pede');
  setTimeout(() => img.classList.remove('pede'), 900);
}

function stepForward(){
  const slide = slides[current];
  if (slide && slide.querySelector('.reveal-btn')){
    const act = nextAction(slide);
    if (act.type === 'reveal'){ revealItem(slide, act.it); return; }
    if (act.type === 'turn'){ turnCube(slide, cubeOf(slide)); return; }
  }
  if (!podeAvancar(slide)){ pedeMergulho(slide); return; }
  go(current + 1);
}
function stepBackward(){
  const slide = slides[current];
  if (slide && slide.querySelector('.reveal-btn') && stepBack(slide)) return;
  go(current - 1);
}

/* gira o cubo: recolhe o que era do postulado que sai */
function turnCube(slide, cube){
  const face = +cube.dataset.face;
  itemsOf(slide).forEach(it => {
    if (it.dataset.of !== undefined && +it.dataset.of === face && !it.hidden) retractItem(it);
  });
  cube.dataset.face = face + 1;
  cube.style.setProperty('--face', face + 1);
  paintCube(cube, face + 1);
  /* cubo de exemplos: o átomo e o gás nobre saem e entram com a face */
  if (cube.dataset.exemplos) trocaExemplo(slide, face + 1, 1);
  syncReveals(slide);
}

function resetReveals(slide){
  itemsOf(slide).forEach(it => {
    it.hidden = !it.dataset.auto;          /* o que é "auto" fica na tela desde o início */
    it.classList.remove('pop', 'has-more', 'emitting', 'pressing', 'retract', 'aberto');
    /* o que nasce com a distribuição aberta volta a nascer assim: sem
       isto, depois do primeiro recomeço o gás da ajuda saía sem ela */
    if (it.dataset.aberto) it.classList.add('aberto');
    /* o exercício do octeto volta ao começo: o subnível doado retorna à
       distribuição, no lugar dele, e os destaques se apagam */
    it.classList.remove('doado');
    it.querySelectorAll('.gas-dist .cam').forEach(cam => {
      cam.classList.remove('valencia', 'octeto8', 'indo', 'voltando');
      if (cam.classList.contains('solta')){ cam.style.left = '0px'; cam.style.top = '0px'; }
    });
    restoreRock(it);
    restoreLego(it);
    closeQuantum(it);
    it.style.left = it.dataset.x + 'px';
    it.style.top  = it.dataset.y + 'px';
    it.style.setProperty('--k', 1);
    it.style.removeProperty('--dx');
    it.style.removeProperty('--dy');
  });
  /* sai do retículo antes de desfazer o resto */
  if (slide.classList.contains('quantum-on')) fechaRede(slide);
  /* o grão arrancado refaz o caminho até o buraco, e a imagem se fecha */
  slide.querySelectorAll('.caco').forEach(devolveCaco);
  /* as famílias voltam ao ponto de partida */
  slide.querySelectorAll('.ex-el .fam').forEach(x => {
    x.style.removeProperty('--fx');
    x.style.removeProperty('--fy');
  });
  const c = cubeOf(slide);
  /* No cubo de exemplos o Refazer não volta ao primeiro: ele refaz o
     átomo da face que está à vista, que é o que se está resolvendo. */
  if (c && c.dataset.exemplos) poeExemplo(slide, +c.dataset.face);
  else if (c){ c.dataset.face = 0; c.style.setProperty('--face', 0); paintCube(c, 0); }
  const aj = slide.querySelector('.ajuda');
  if (aj) aj.classList.remove('on');
  slide.classList.remove('acertou');       /* some o brilho de acerto */
  slide.querySelectorAll('.eletron, .rastro-e, .onda-e').forEach(x => x.remove());
  slide.querySelectorAll('.pd').forEach(refazPedra);
  const b = slide.querySelector('.reveal-btn');
  if (b) b.classList.remove('emit');
  syncReveals(slide);
}

const DIGITA_MS = 28;                      /* velocidade média da digitação */

/* escreve o texto letra a letra, com o cursor piscando no fim */
function digita(el){
  const txt = el.dataset.txt || '';
  clearInterval(el._t);
  el.textContent = '';
  el.classList.add('digitando');
  let i = 0;
  el._t = setInterval(() => {
    el.textContent = txt.slice(0, ++i);
    if (i >= txt.length){
      clearInterval(el._t); el._t = null;
      el.classList.remove('digitando');
    }
  }, DIGITA_MS);
}
function apagaDigitado(it){
  it.querySelectorAll('.cx-corpo[data-txt]').forEach(el => {
    clearInterval(el._t); el._t = null;
    el.classList.remove('digitando');
    el.textContent = '';
  });
}

const CACO = 4.4;                          /* o grão, em px do palco */
let cacoN = 0;

/* contorno irregular: sete vértices com raio e ângulo sorteados,
   diferente a cada grão arrancado */
function contornoCaco(){
  const r = rng(9001 + (++cacoN) * 137);
  const n = 7, pts = [];
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 + (r() - .5) * .55;
    const d = 33 + r() * 17;
    pts.push(`${(50 + Math.cos(a) * d).toFixed(1)}% ${(50 + Math.sin(a) * d).toFixed(1)}%`);
  }
  return `polygon(${pts.join(',')})`;
}

/* Tira um pedaço da imagem no ponto em que o dedo encostou: deixa a
   falha no lugar e devolve o caco, já pronto para ser arrastado. */
function arrancaCaco(item, e){
  const img = item.querySelector('img');
  if (!img || e.target !== img) return null;
  const slide = item.closest('.slide');
  if (!slide) return null;
  /* um grão de cada vez: enquanto o primeiro estiver na tela, a imagem
     não solta outro */
  if (slide.querySelector('.caco')) return null;

  const r = img.getBoundingClientRect();
  const st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const larg = r.width / k, alt = r.height / k;   /* tamanho exibido, no palco */
  const fx = (e.clientX - r.left) / r.width;      /* onde pegou, em fração */
  const fy = (e.clientY - r.top)  / r.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return null;

  const forma = contornoCaco();            /* o mesmo contorno no grão e na falha */

  const buraco = document.createElement('i');
  buraco.className = 'buraco';
  buraco.style.setProperty('--w', CACO + 'px');
  buraco.style.clipPath = forma;
  buraco.style.left = (fx * larg).toFixed(1) + 'px';
  buraco.style.top  = (fy * alt).toFixed(1) + 'px';
  item.appendChild(buraco);

  const caco = document.createElement('i');
  caco.className = 'caco';
  caco.style.left = ((e.clientX - st.left) / k).toFixed(1) + 'px';
  caco.style.top  = ((e.clientY - st.top)  / k).toFixed(1) + 'px';
  const grao = document.createElement('b');
  grao.style.setProperty('--w',   CACO + 'px');
  grao.style.setProperty('--img', `url("${img.getAttribute('src')}")`);
  grao.style.setProperty('--bw',  larg.toFixed(1) + 'px');
  grao.style.setProperty('--bh',  alt.toFixed(1) + 'px');
  grao.style.setProperty('--bx',  (CACO / 2 - fx * larg).toFixed(1) + 'px');
  grao.style.setProperty('--by',  (CACO / 2 - fy * alt).toFixed(1) + 'px');
  grao.style.clipPath = forma;
  caco.appendChild(grao);
  caco._buraco = buraco;
  caco._novo = true;
  slide.appendChild(caco);
  return caco;
}

/* Devolve o grão ao buraco de onde ele saiu: ele refaz o caminho, a
   falha se fecha, e a imagem volta a ficar inteira. */
function devolveCaco(caco){
  const b = caco._buraco;
  caco.classList.remove('mergulha', 'volta-grao');
  caco.style.opacity = '';
  if (!b || !b.isConnected){ caco.remove(); return; }
  const p = noPalco(b);
  caco.classList.add('voltando-grao');
  void caco.offsetWidth;
  caco.style.left = p.x.toFixed(1) + 'px';
  caco.style.top  = p.y.toFixed(1) + 'px';
  setTimeout(() => { b.classList.add('fecha'); caco.classList.add('sumindo'); }, 280);
  setTimeout(() => { b.remove(); caco.remove(); }, 640);
}

/* Dois cliques no grão: duas ampliações e, na terceira, o mergulho
   no retículo cristalino, no lugar exato onde o grão estava. */
let ultimoToque = 0, ultimoAlvo = null;

function duploNoGrao(caco){
  const agora = Date.now();
  const duplo = (caco === ultimoAlvo) && (agora - ultimoToque < 420);
  ultimoToque = agora; ultimoAlvo = caco;
  if (!duplo) return;

  /* O retículo nasce onde o grão está, mas com o tamanho da imagem de
     onde ele foi arrancado. Mede-se o <img>, não o item inteiro: o item
     carrega a legenda embaixo, que aumentaria a medida. */
  const slide = caco.closest('.slide');
  const fixo  = slide && slide.querySelector('.reveal-item.fixo');
  const foto  = fixo && fixo.querySelector('img');
  const p     = noPalco(caco);                 /* posição: a do grão */
  const k     = fitScale || 1;
  const r     = foto ? foto.getBoundingClientRect() : null;
  const larg  = r ? r.width  / k : 280;        /* tamanho: o da imagem */
  const alt   = r ? r.height / k : 280;
  caco.classList.remove('volta-grao');
  void caco.offsetWidth;                       /* reinicia a animação */
  caco.classList.add('mergulha');              /* cresce até engolir a tela */
  abreRede(caco, (fixo && fixo.dataset.rede) || 'nacl', p.x, p.y, larg, alt);
  ultimoAlvo = null;
}

/* jorro de confete a partir de um ponto do palco */
function confete(slide, x, y){
  const cores = ['#45C7B0', '#F0B44A', '#E8F1F5', '#7FD8E8', '#AB5CF2'];
  const rnd = rng(31337);
  const cx = document.createElement('div');
  cx.className = 'confete';
  cx.style.left = x + 'px'; cx.style.top = y + 'px';
  let bits = '';
  for (let i = 0; i < 30; i++){
    const a = rnd() * Math.PI * 2, d = 110 + rnd() * 230;
    const dx = Math.cos(a) * d;
    const dy = Math.sin(a) * d + 140 + rnd() * 170;   /* o peso puxa para baixo */
    bits += `<i style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;`
          + `--r:${(rnd() * 900 - 450).toFixed(0)}deg;`
          + `--t:${(1 + rnd() * .8).toFixed(2)}s;--c:${cores[i % cores.length]};`
          + `--w:${(6 + rnd() * 7).toFixed(0)}px;--h:${(9 + rnd() * 9).toFixed(0)}px"></i>`;
  }
  cx.innerHTML = bits;
  slide.appendChild(cx);

  const anel = document.createElement('i');
  anel.className = 'acerto-anel';
  anel.style.left = x + 'px'; anel.style.top = y + 'px';
  slide.appendChild(anel);

  setTimeout(() => { cx.remove(); anel.remove(); }, 2200);
}

/* ------------------------------------------------------------
   TABELA PERIÓDICA -> REPRESENTAÇÃO DE LEWIS
   Clicar numa família a levanta e mostra quantos elétrons de valência
   ela tem. Só a família levantada aceita a escolha de um elemento, e o
   escolhido aparece do outro lado em notação de Lewis.
   ------------------------------------------------------------ */
function limpaLewis(slide){
  const a = slide && slide.querySelector('.lw-stage');
  if (!a) return;
  a.innerHTML = LEWIS_VAZIO;
  a.classList.remove('inst1', 'inst2', 'inst3', 'inst4', 'certo');
  const item = a.closest('.reveal-item');
  if (item){                               /* sem elemento, não há o que mexer */
    delete item.dataset.alvo;
    delete item.dataset.sim;
    delete item.dataset.val;
    delete item.dataset.delta;
  }
}

function levantaFamilia(col){
  const tp = col.closest('.tp'), slide = col.closest('.slide');
  const jaEstava = col.classList.contains('sobe');
  /* a anterior desce e o número dela some junto */
  tp.querySelectorAll('.tp-col.sobe').forEach(c => c.classList.remove('sobe'));
  tp.querySelectorAll('.tp-el.escolhido').forEach(x => x.classList.remove('escolhido'));
  if (!jaEstava) col.classList.add('sobe');
  limpaLewis(slide);
}

function mostraLewis(el){
  const col = el.closest('.tp-col'), slide = el.closest('.slide');
  const area = slide && slide.querySelector('.lw-stage');
  if (!area) return;
  col.closest('.tp').querySelectorAll('.tp-el.escolhido')
     .forEach(x => x.classList.remove('escolhido'));
  el.classList.add('escolhido');
  const sim = el.dataset.sim, val = +col.dataset.val;
  const item = area.closest('.reveal-item');
  area.innerHTML = LEWIS(sim, val);
  if (item){
    item.dataset.sim   = sim;
    item.dataset.val   = val;
    item.dataset.delta = 0;
    item.dataset.alvo  = alvoLewis(sim, val);
    marcaEstado(item);                     /* nasce instável, como no slide 7 */
  }
}

/* O alvo é a COLUNA inteira, não só a faixa do cabeçalho — que era um
   fio de 12px e quase não se acerta. E a leitura é por ponteiro, como no
   resto do app, para não depender do clique sintetizado do toque.
     coluna abaixada  -> levanta a família
     coluna levantada -> escolhe o elemento
     cabeçalho        -> levanta ou abaixa */
let tpToque = null;
deck.addEventListener('pointerdown', (e) => {
  if (!e.target.closest || !e.target.closest('.tp')) return;
  tpToque = { x: e.clientX, y: e.clientY, alvo: e.target };
});
deck.addEventListener('pointerup', (e) => {
  const d = tpToque;
  tpToque = null;
  if (!d || !d.alvo.closest) return;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12) return;   /* arrastou */
  const col = d.alvo.closest('.tp-col');
  if (!col) return;
  const noCab = !!d.alvo.closest('.tp-cab');
  const cel   = d.alvo.closest('.tp-el');
  if (noCab || !col.classList.contains('sobe')) levantaFamilia(col);
  else if (cel) mostraLewis(cel);
});

/* O que a legenda diz a cada estágio: a batida é a pergunta, o texto é
   a resposta química. */
const PD_DICAS = [
  'bata na pedra',
  'os planos de íons deslizaram',
  'cargas iguais frente a frente se repelem',
  'o cristal clivou em faces planas'
];

/* a onda do impacto e o pó que salta do ponto onde o dedo bateu */
function poDaBatida(svg, px, py){
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  const org = px.toFixed(1) + 'px ' + py.toFixed(1) + 'px';
  const onda = document.createElementNS(NS, 'circle');
  onda.setAttribute('class', 'pd-onda');
  onda.setAttribute('cx', px.toFixed(1));
  onda.setAttribute('cy', py.toFixed(1));
  onda.setAttribute('r', '14');
  onda.style.transformOrigin = org;
  svg.appendChild(onda);
  setTimeout(() => onda.remove(), 540);
  for (let i = 0; i < 11; i++){
    /* para cima e para os lados; o +16 do fim é a gravidade puxando */
    const ang = Math.PI * (1.08 + Math.random() * 0.84);
    const d = 16 + Math.random() * 26;
    const g = document.createElementNS(NS, 'circle');
    g.setAttribute('class', 'pd-po');
    g.setAttribute('cx', px.toFixed(1));
    g.setAttribute('cy', py.toFixed(1));
    g.setAttribute('r', (0.9 + Math.random() * 1.7).toFixed(2));
    g.style.setProperty('--px', (Math.cos(ang) * d).toFixed(1) + 'px');
    g.style.setProperty('--py', (Math.sin(ang) * d + 16).toFixed(1) + 'px');
    g.style.transformOrigin = org;
    g.style.animationDelay = (Math.random() * 0.06).toFixed(3) + 's';
    svg.appendChild(g);
    setTimeout(() => g.remove(), 960);
  }
}

/* Cada batida abre mais um plano de clivagem. Depois da terceira o
   cristal já está partido: quem volta ao começo é o botão refazer. */
function bateNaPedra(pd, ev){
  if (!pd) return;
  const e = +pd.dataset.e || 0;
  const svg = pd.querySelector('.pd-svg');
  let px = 100, py = 62;
  if (ev && svg && ev.clientX != null){
    const r = svg.getBoundingClientRect();
    if (r.width){
      px = (ev.clientX - r.left) / r.width * 200;
      py = (ev.clientY - r.top) / r.height * 152;
    }
  }
  poDaBatida(svg, px, py);
  pd.classList.remove('bate');
  void pd.offsetWidth;
  pd.classList.add('bate');
  if (e >= 3) return;                     /* já partiu: só o refazer volta */
  const novo = e + 1;
  pd.dataset.e = novo;
  if (novo <= 2){
    const l = pd.querySelector(novo === 1 ? '.pd-rach.a' : '.pd-rach.b');
    if (l){ l.classList.remove('flash'); void pd.offsetWidth; l.classList.add('flash'); }
  }
  /* o retículo dentro da lupa parte no mesmo instante */
  G3.clivaAlvo = novo;
  const d = pd.querySelector('.pd-dica');
  if (d) d.textContent = PD_DICAS[novo];
}

/* o cristal se recompõe, para a demonstração poder ser repetida */
function refazPedra(pd){
  if (!pd) return;
  pd.dataset.e = 0;
  pd.classList.remove('bate');
  pd.querySelectorAll('.pd-rach').forEach(l => l.classList.remove('flash'));
  G3.clivaAlvo = 0;                     /* o retículo se refaz junto */
  const d = pd.querySelector('.pd-dica');
  if (d) d.textContent = PD_DICAS[0];
}

/* ------------------------------------------------------------
   O SAL NO FOGO
   A intensidade da chama define até onde a temperatura sobe e com que
   pressa. Em fogo baixo ela estaciona longe do ponto de fusão — é
   preciso abrir a chama para o sal derreter.
   ------------------------------------------------------------ */
const BK_AMB = 25, BK_MAX = 1000;          /* ambiente e o teto da chama cheia */

function bicoAlvo(bk){
  if (!bk.classList.contains('aceso')) return BK_AMB;
  const i = (+bk.dataset.int || 55) / 100;
  return BK_AMB + (BK_MAX - BK_AMB) * i;
}

function bicoAnda(bk){
  if (bk._t) cancelAnimationFrame(bk._t);
  const num = bk.querySelector('.bk-num'), merc = bk.querySelector('.bk-merc');
  let T = +bk.dataset.temp || BK_AMB;
  const passo = () => {
    const i = (+bk.dataset.int || 55) / 100;
    const alvo = bicoAlvo(bk);
    /* chama mais forte também aquece mais depressa */
    const taxa = bk.classList.contains('aceso') ? 0.006 + 0.013 * i : 0.011;
    T += (alvo - T) * taxa;
    if (Math.abs(alvo - T) < 0.6) T = alvo;
    bk.dataset.temp = T.toFixed(1);
    if (num) num.textContent = Math.round(T) + ' °C';
    if (merc) merc.style.height =
      ((T - BK_AMB) / (BK_MAX - BK_AMB) * 100).toFixed(1) + '%';
    bk.classList.toggle('derreteu', T >= FUSAO_NACL);
    /* em tempo real: o que acontece na cápsula acontece no retículo */
    G3.agita = Math.max(0, Math.min(1, (T - BK_AMB) / (FUSAO_NACL - BK_AMB)));
    G3.fundeAlvo = T >= FUSAO_NACL ? 1 : 0;
    bk._t = (T === alvo) ? 0 : requestAnimationFrame(passo);
  };
  passo();
}

function bicoLiga(bk){
  if (!bk) return;
  bk.classList.toggle('aceso');            /* o botão acende em verde sozinho */
  bicoIntensidade(bk);
  bicoAnda(bk);
}

/* a chama cresce com a barra: de um terço da altura até o dobro */
function bicoIntensidade(bk){
  const r = bk.querySelector('.bk-rng');
  const i = r ? +r.value : 55;
  bk.dataset.int = i;
  bk.style.setProperty('--ch', (0.35 + 1.15 * (i / 100)).toFixed(2));
  if (bk.classList.contains('aceso')) bicoAnda(bk);
}

/* ------------------------------------------------------------
   O ELÉTRON QUE SE ENTREGA
   Nos exemplos em que o átomo GANHA elétrons, segurar o dedo no vazio
   faz nascer um elétron. Arrastando-o até a bola, ele entra: a bola
   pisca e a distribuição se refaz na hora, com o subnível e a conta do
   nível já atualizados.
   ------------------------------------------------------------ */
let segurandoE = null;

function criaEletron(slide, x, y){
  const el = document.createElement('i');
  el.className = 'eletron';
  el.style.left = x.toFixed(0) + 'px';
  el.style.top  = y.toFixed(0) + 'px';
  el.innerHTML = '<b></b><s></s>';
  slide.appendChild(el);
  return el;
}
/* deixa uma faísca no ponto por onde o elétron acabou de passar */
function faisca(slide, x, y, v){
  const t = document.createElement('i');
  t.className = 'rastro-e';
  t.style.setProperty('--s', (8 + Math.min(12, v * 0.5)).toFixed(0) + 'px');
  t.style.left = x.toFixed(0) + 'px';
  t.style.top  = y.toFixed(0) + 'px';
  slide.appendChild(t);
  setTimeout(() => t.remove(), 480);
}

/* o corpo do átomo: a esfera no slide 7, o símbolo no slide 8 */
const bolaDo = (at) => at &&
  at.querySelector(at.dataset.eatom === 'lewis' ? '.lw' : '.gas-ball');
function centroBola(at){
  const b = bolaDo(at);
  if (!b) return null;
  const r = b.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (r.left + r.width / 2 - st.left) / k,
           y: (r.top  + r.height / 2 - st.top)  / k };
}
/* estilhaços em roda, para a carga não sumir sem deixar nada */
function dissipa(slide, x, y){
  for (let i = 0; i < 7; i++){
    const a = (i / 7) * Math.PI * 2;
    faisca(slide, x + Math.cos(a) * 13, y + Math.sin(a) * 13, 16);
  }
}
/* Alvo da entrega: o átomo INTEIRO — a bola e a distribuição ao lado.
   Só a bola era um alvo pequeno demais, e o elétron se perdia a cada
   solta um pouco fora. O mergulho continua sendo até o centro da bola. */
function sobreAtomo(at, e){
  if (!at) return false;
  const r = at.getBoundingClientRect(), m = 14;
  return e.clientX >= r.left - m && e.clientX <= r.right  + m
      && e.clientY >= r.top  - m && e.clientY <= r.bottom + m;
}

/* O átomo treme enquanto não fecha o octeto, e o tremor afrouxa quando
   falta pouco. Ao acertar, para de tremer e comemora. */
function marcaEstado(at){
  /* no Lewis quem recebe as classes é a área do desenho */
  const alvo = at.dataset.eatom === 'lewis'
    ? (at.querySelector('.lw-stage') || at) : at;
  const falta = Math.abs(+at.dataset.alvo - (+at.dataset.delta || 0));
  alvo.classList.remove('inst1', 'inst2', 'inst3', 'inst4', 'certo');
  if (!falta) alvo.classList.add('certo');
  /* um elétron de distância já agita; quatro ou mais é o grau máximo */
  else alvo.classList.add('inst' + Math.min(4, falta));
}

/* a onda que confirma o elétron entrando na bola */
function ondaNaBola(at){
  const b = bolaDo(at), slide = at.closest('.slide');
  if (!b || !slide) return;
  const r = b.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const o = document.createElement('i');
  o.className = 'onda-e';
  o.style.left = ((r.left + r.width / 2 - st.left) / k).toFixed(0) + 'px';
  o.style.top  = ((r.top  + r.height / 2 - st.top)  / k).toFixed(0) + 'px';
  slide.appendChild(o);
  setTimeout(() => o.remove(), 700);
}

/* Refaz o átomo com o novo saldo de elétrons e diz se ele chegou lá. */
function mudaEletrons(at, d){
  const slide = at.closest('.slide');
  const antes = +at.dataset.delta === +at.dataset.alvo;
  at.dataset.delta = d;
  if (at.dataset.eatom === 'lewis'){
    const alvoLw = at.querySelector('.lw-stage') || at;
    alvoLw.innerHTML = LEWIS(at.dataset.sim, (+at.dataset.val || 0) + d, d > 0);
  } else {
    at.innerHTML = GAS(at.dataset.sim, { dentro: true, conta: true, delta: d });
  }
  const bola = bolaDo(at);
  if (bola){ void bola.offsetWidth; bola.classList.add('recebe'); }
  const cams = at.querySelectorAll('.gas-dist .cam');
  const u = cams[cams.length - 1];
  if (u) u.classList.add('mudou');

  marcaEstado(at);
  const certo = d === +at.dataset.alvo;
  if (slide) slide.classList.toggle('acertou', certo);
  /* a festa é só na chegada, não a cada elétron depois dela */
  if (certo && !antes && slide){
    const p = noPalco(at);
    confete(slide, p.x, p.y);
  }
}

deck.addEventListener('pointerdown', (e) => {
  const slide = e.target.closest('.slide');
  if (!slide || segurandoE) return;
  const at = slide.querySelector('.reveal-item[data-eatom]');
  if (!at || at.dataset.alvo === undefined || at.hidden) return;

  /* dedo na bola: puxar arranca um elétron de dentro dela */
  if (e.target.closest('.reveal-item[data-eatom] .gas-ball, .reveal-item[data-eatom] .lw')){
    segurandoE = { id: e.pointerId, slide, at, modo: 'tira', el: null,
                   x: e.clientX, y: e.clientY };
    e.preventDefault();
    return;
  }
  /* SEGURAR faz nascer um elétron. Antes isso só valia no vazio, e neste
     slide o vazio é uma faixa estreita entre o cubo, o átomo e o gás
     nobre — daí a sensação de que o gesto falhava. Agora vale em quase
     toda a tela: fora só o que tem função própria no toque. */
  /* o átomo é o destino, então não é lugar de fazer nascer elétron:
     se fosse, soltar sem sair do lugar já o entregaria sem querer */
  if (e.target.closest('.tp,'
                     + ' .reveal-item[data-eatom],'
                     + ' .reveal-item[data-id="vizinho"], .reveal-item.cube,'
                     + ' .q-board, button')) return;
  if ((+at.dataset.delta || 0) >= MAX_E) return;        /* no teto de entrada */
  const p = pontoPalco(e);
  segurandoE = { id: e.pointerId, slide, at, modo: 'traz', el: null,
                 x: e.clientX, y: e.clientY, px: p.x, py: p.y };
  segurandoE.t = setTimeout(() => {
    const g = segurandoE;
    /* nasce onde o dedo está agora, não onde ele encostou */
    if (g && g.modo === 'traz' && !g.el) g.el = criaEletron(g.slide, g.px, g.py);
  }, 260);
  /* com a captura, o arrasto chega até nós mesmo passando por cima de
     outros elementos */
  if (e.target.setPointerCapture){
    try { e.target.setPointerCapture(e.pointerId); } catch (_){}
  }
  e.preventDefault();
});

document.addEventListener('pointermove', (e) => {
  if (!segurandoE || e.pointerId !== segurandoE.id) return;
  const g = segurandoE, p = pontoPalco(e);
  if (g.modo === 'traz' && !g.el){
    /* o dedo treme; só um movimento claro desiste do elétron */
    g.px = p.x; g.py = p.y;
    if (Math.hypot(e.clientX - g.x, e.clientY - g.y) > 24){
      clearTimeout(g.t); segurandoE = null;
    }
    return;
  }
  if (g.modo === 'tira' && !g.el){
    /* o elétron só se destaca depois de um puxão; aí a conta já muda */
    if (Math.hypot(e.clientX - g.x, e.clientY - g.y) < 18) return;
    /* no fundo do poço: não sai mais nada, e o puxão deixa de ser gesto */
    const dd = +g.at.dataset.delta || 0;
    const vazio = g.at.dataset.eatom === 'lewis'
      && (+g.at.dataset.val || 0) + dd - 1 < 0;
    if (dd - 1 < -MAX_E || vazio){ g.modo = 'nada'; return; }
    const c = centroBola(g.at);
    g.el = criaEletron(g.slide, c.x, c.y);
    mudaEletrons(g.at, (+g.at.dataset.delta || 0) - 1);
    g.tirou = true;
  }
  if (!g.el) return;
  /* a faísca fica onde ele estava, não onde ele está: é isso que dá
     a sensação de esteira em vez de um borrão em volta */
  if (g.lx !== undefined){
    const v = Math.hypot(p.x - g.lx, p.y - g.ly);
    if (v > 6){ faisca(g.slide, g.lx, g.ly, v); g.lx = p.x; g.ly = p.y; }
  } else { g.lx = p.x; g.ly = p.y; }
  g.el.style.left = p.x.toFixed(0) + 'px';
  g.el.style.top  = p.y.toFixed(0) + 'px';
});

function soltaEletron(e){
  if (!segurandoE || (e && e.pointerId !== segurandoE.id)) return;
  const g = segurandoE;
  segurandoE = null;
  clearTimeout(g.t);
  if (!g.el){
    /* Clique seco na bola, sem puxar nada: mostra ou esconde a
       distribuição. Puxar é o outro gesto, e ele já teria criado o
       elétron a esta altura. */
    if (g.modo === 'tira') g.at.classList.toggle('aberto');
    return;
  }
  const d = +g.at.dataset.delta || 0;
  /* além do limite do sandbox, o desenho de Lewis só comporta 8 */
  const cabe = d + 1 <= MAX_E
    && (g.at.dataset.eatom !== 'lewis' || (+g.at.dataset.val || 0) + d + 1 <= 8);
  const naBola = e && sobreAtomo(g.at, e) && cabe;
  if (naBola && (g.modo === 'traz' || g.tirou)){
    ondaNaBola(g.at);                      /* o estouro da incorporação */
    mudaEletrons(g.at, d + 1);
  }
  if (naBola){
    /* mede o caminho que falta até o centro, para ele mergulhar lá */
    const c = centroBola(g.at);
    if (c){
      g.el.style.setProperty('--tx',
        (c.x - parseFloat(g.el.style.left)).toFixed(0) + 'px');
      g.el.style.setProperty('--ty',
        (c.y - parseFloat(g.el.style.top)).toFixed(0) + 'px');
    }
    g.el.classList.add('entra');
  } else {
    dissipa(g.slide, parseFloat(g.el.style.left), parseFloat(g.el.style.top));
    g.el.classList.add('some');
  }
  setTimeout(() => g.el.remove(), 460);
}
document.addEventListener('pointerup', soltaEletron);
document.addEventListener('pointercancel', soltaEletron);


/* ------------------------------------------------------------
   MUNDOS QUÂNTICOS CONFINADOS
   Cada caixa tem o seu, dentro do próprio retângulo e independente do
   outro. O da esquerda é a rede 3D; o da direita, as moléculas soltas.
   A cena 3D é desenhada no palco inteiro, como sempre, e recortada ao
   retângulo da caixa — assim toda a matemática de projeção, arrasto e
   célula continua valendo sem mudar uma linha.
   ------------------------------------------------------------ */
const SAIDA_PN = 44;              /* faixa de baixo, reservada ao botão */

function retanguloPainel(pn){
  const r = pn.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const x0 = (r.left - st.left) / k, y0 = (r.top - st.top) / k;
  return { x0, y0, x1: x0 + r.width / k, y1: y0 + r.height / k - SAIDA_PN };
}

/* O retículo que faz parte do slide: nasce junto com o elemento e fica.
   Aproveita tudo o que a cena 3D já sabe fazer — girar com um dedo,
   arrastar com dois, pinçar e arrancar a célula unitária. */
/* onde está o vidro da lupa, em coordenadas do palco */
function geoLupa(){
  const v = G3.lupa.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (v.left - st.left) / k + v.width / k / 2,
           y: (v.top  - st.top)  / k + v.height / k / 2,
           r: v.width / k / 2 - 9 };        /* por dentro do aro */
}
/* prende o centro da cena e o recorte ao vidro, quadro a quadro */
function segueLupa(){
  if (!G3.lupa || !G3.lupa.isConnected) return;
  const g = geoLupa();
  G3.px = g.x; G3.py = g.y;
  const clip = `circle(${g.r.toFixed(0)}px at ${g.x.toFixed(0)}px ${g.y.toFixed(0)}px)`;
  if (G3.lupaCv && clip !== G3.lupaClip){
    G3.lupaCv.style.clipPath = clip;        /* só escreve quando muda */
    G3.lupaClip = clip;
  }
}

/* Aqui a cena NÃO é recortada: o retângulo do elemento só diz onde e de
   que tamanho o retículo nasce. Recortando, ele ficava preso dentro de
   uma caixa invisível e sumia nas bordas ao ser girado ou afastado. */
function abreReticulo(it){
  const slide = it.closest('.slide');
  const cv = slide && slide.querySelector('.q3d');
  if (!cv) return;
  const r = it.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const x0 = (r.left - st.left) / k, y0 = (r.top - st.top) / k;
  const x1 = x0 + r.width / k,       y1 = y0 + r.height / k;
  if (it.dataset.lupa){
    /* Dentro da lupa a cena é recortada no vidro — é o que faz parecer
       que olhamos através dela. A lupa vira a dona da cena: o laço
       recoloca o recorte e o centro nela a cada quadro, então o retículo
       a acompanha em vez de ficar parado onde ela estava. */
    const vidro = it.querySelector('.lupa-vidro');
    G3.lupa = vidro; G3.lupaCv = cv; G3.lupaClip = '';
    const g = geoLupa();
    slide.classList.add('quantum-on');
    abreRede(it, it.dataset.rede || 'nacl', g.x, g.y, g.r * 1.6, g.r * 1.6);
    segueLupa();
  } else {
    cv.style.clipPath = '';
    slide.classList.add('quantum-on', 'rede-livre');
    abreRede(it, it.dataset.rede || 'nacl', (x0 + x1) / 2, (y0 + y1) / 2,
             (x1 - x0) * 0.9, (y1 - y0) * 0.9);
  }
  /* Montar a cena zera o estado, mas a pedra do cubo pode já estar
     partida: quem sai do slide e volta tem de reencontrar o retículo no
     mesmo estado em que deixou a pedra. Aqui ele reassume, sem animar. */
  const pd = slide.querySelector('.pd');
  if (pd){ G3.clivaAlvo = +pd.dataset.e || 0; G3.cliva = G3.clivaAlvo; }

  /* enquadramento afinado na tela e trazido de volta pelo painel C */
  const cam = it.dataset.cam && it.dataset.cam.split(',').map(Number);
  if (cam && cam.length === 5 && cam.every(v => !isNaN(v))){
    G3.px = cam[0]; G3.py = cam[1];
    G3.dist = cam[2]; G3.az = cam[3]; G3.el = cam[4];
    G3.px0 = G3.px; G3.py0 = G3.py; G3.dist0 = G3.dist;
    G3.voo = 0;                            /* já chega no lugar */
  }
}

function abrePainel(pn){
  const slide = pn.closest('.slide');
  if (!slide || pn.classList.contains('q-on')) return;
  pn.classList.add('q-on');
  slide.classList.add('quantum-on');
  if (pn.dataset.rede){
    const cv = slide.querySelector('.q3d');
    const r  = retanguloPainel(pn);
    if (cv) cv.style.clipPath =
      `inset(${r.y0.toFixed(0)}px ${(1280 - r.x1).toFixed(0)}px `
      + `${(720 - r.y1).toFixed(0)}px ${r.x0.toFixed(0)}px)`;
    abreRede(pn, pn.dataset.rede, (r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2,
             (r.x1 - r.x0) * 0.86, (r.y1 - r.y0) * 0.86);
  }
}

function fechaPainel(pn){
  const slide = pn.closest('.slide');
  if (!slide) return;
  pn.classList.remove('q-on');
  if (pn.dataset.rede){
    const cv = slide.querySelector('.q3d');
    fechaRede(slide);
    if (cv) cv.style.clipPath = '';
  }
  /* o outro mundo pode continuar aberto: a classe do slide segue ele */
  if (slide.querySelector('.pn.q-on')) slide.classList.add('quantum-on');
  else slide.classList.remove('quantum-on');
}

/* centro de um elemento em coordenadas do palco */
function noPalco(el){
  const a = stage.getBoundingClientRect(), b = el.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (b.left + b.width / 2 - a.left) / k,
           y: (b.top  + b.height / 2 - a.top) / k };
}

/* Largou o subnível: longe o bastante, ele se vai e a camada de baixo
   assume como valência; perto, volta para o lugar. */
function largaSubnivel(cam){
  const d = Math.hypot(parseFloat(cam.style.left) || 0,
                       parseFloat(cam.style.top)  || 0);
  const item = cam.closest('.reveal-item');
  if (d < 60){
    cam.classList.add('voltando');
    cam.style.left = '0px'; cam.style.top = '0px';
    setTimeout(() => cam.classList.remove('voltando'), 400);
    return;
  }
  const p = noPalco(cam);
  cam.classList.add('indo');
  setTimeout(() => {
    cam.classList.remove('indo');
    cam.style.left = '0px'; cam.style.top = '0px';
    if (!item) return;
    item.classList.add('doado');
    /* a que passou a ser a última fica clicável, mas ainda sem destaque */
    const cams = [...item.querySelectorAll('.gas-dist .cam')];
    const nova = cams[cams.length - 2];
    if (nova) nova.classList.add('valencia');
    const slide = item.closest('.slide');
    if (slide){
      slide.classList.add('acertou');       /* as duas configurações se igualam */
      confete(slide, p.x, p.y);
    }
  }, 420);
}

/* estados que um item de ação liga no slide, e desliga ao voltar */
function aplicaAcao(slide, nome, ligar){
  if (!slide || !nome) return;
  if (nome === 'octeto'){
    slide.classList.toggle('octeto', ligar);
    return;
  }
  /* dist:He -> desenrola a distribuição daquele gás. O toque na esfera
     continua valendo; isto só põe o mesmo gesto na sequência de cliques. */
  if (nome.indexOf('dist:') === 0){
    const g = slide.querySelector(`.reveal-item.gas[data-sim="${nome.slice(5)}"]`);
    if (g) g.classList.toggle('aberto', ligar);
  }
}

/* solta um elemento: ele nasce de dentro do pai (ou da caixa "?") e voa até o lugar */
function revealItem(slide, it){
  const btn = slide.querySelector('.reveal-btn');
  const pai = parentOf(slide, it);
  let ox, oy;

  /* "esq": entra sempre da caixa "?", mesmo nascendo de outro elemento —
     é o que faz uma lista inteira voar da esquerda para a direita */
  if (pai && !pai.hidden && it.dataset.esq === undefined){
    ox = parseFloat(pai.style.left);
    oy = parseFloat(pai.style.top);
    /* o filho acompanha o pai: guarda o afastamento planejado entre os dois */
    it.style.left = (ox + (+it.dataset.x - +pai.dataset.x)) + 'px';
    it.style.top  = (oy + (+it.dataset.y - +pai.dataset.y)) + 'px';
    pai.classList.remove('emitting');
    void pai.offsetWidth;
    pai.classList.add('emitting');
  } else {
    ox = btn.offsetLeft + btn.offsetWidth / 2;
    oy = btn.offsetTop  + btn.offsetHeight / 2;
    btn.classList.remove('emit');
    void btn.offsetWidth;
    btn.classList.add('emit');
  }

  it.hidden = false;
  it.style.setProperty('--dx', (ox - parseFloat(it.style.left)) + 'px');
  it.style.setProperty('--dy', (oy - parseFloat(it.style.top))  + 'px');
  it.classList.remove('pop', 'retract');   /* cancela um recolhimento em curso */
  void it.offsetWidth;                     /* reinicia a animação de entrada */
  it.classList.add('pop');
  it.querySelectorAll('.cx-corpo[data-txt]').forEach(digita);
  /* o retículo do slide sobe assim que o elemento entra */
  /* espera a lupa terminar de voar: enquadrar no meio do caminho deixaria
     a cena parada no lugar por onde ela passou */
  if (it.classList.contains('reticulo'))
    setTimeout(() => abreReticulo(it), it.dataset.lupa ? 680 : 60);
  aplicaAcao(slide, it.dataset.acao, true);
  syncReveals(slide);

  /* o seguinte marcado como "follow" sai sozinho; com atraso 0, sai junto */
  const list = itemsOf(slide);
  const nxt = list[list.indexOf(it) + 1];
  if (nxt && nxt.dataset.follow !== undefined && nxt.hidden){
    const espera = +nxt.dataset.follow;
    if (espera > 0){
      setTimeout(() => {
        if (nxt.hidden && !it.hidden) revealItem(slide, nxt);
      }, espera);
    } else {
      revealItem(slide, nxt);              /* mesmo instante, mesma animação */
    }
  }
}

/* a caixa "?" solta o próximo da lista; depois do último, recolhe tudo */

/* ------------------------------------------------------------
   BARQUINHO: espalhar e juntar
   os alvos são calculados em coordenadas do palco, então as peças
   se espalham pela tela toda, e não só em volta do barquinho.
   ------------------------------------------------------------ */
function explodeLego(it){
  const bricks = [...it.querySelectorAll('.brick')];
  if (!bricks.length) return;
  const cs = getComputedStyle(it);
  const base = parseFloat(cs.getPropertyValue('--base')) || 200;
  const sc = (base / LEGO_W) * (getK(it) || 1);   /* escala do barquinho no palco */
  const cx = parseFloat(it.style.left), cy = parseFloat(it.style.top);
  const rnd = rng(4711);

  /* uma grade de destinos cobrindo o palco, embaralhada sempre do mesmo jeito */
  const slots = [];
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 5; c++) slots.push([150 + c * 245, 190 + r * 225]);
  for (let i = slots.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [slots[i], slots[j]] = [slots[j], slots[i]];
  }

  bricks.forEach((b, i) => {
    const [tx, ty] = slots[i % slots.length];
    const gx = tx + (rnd() - .5) * 90;             /* destino no palco */
    const gy = ty + (rnd() - .5) * 70;
    const hx = +b.dataset.hx, hy = +b.dataset.hy;
    /* onde o centro desta peça está agora, em coordenadas do palco */
    const nx = cx + (hx + b.dataset.w * 12 - LEGO_W / 2) * sc;
    const ny = cy + (hy + 13 - LEGO_H / 2) * sc;
    b.style.setProperty('--sx', (hx + (gx - nx) / sc).toFixed(1) + 'px');
    b.style.setProperty('--sy', (hy + (gy - ny) / sc).toFixed(1) + 'px');
    b.style.setProperty('--sr', ((rnd() - .5) * 320).toFixed(0) + 'deg');
    b.style.setProperty('--d', (i * 18) + 'ms');
  });
  it.classList.add('exploded');
}

function rebuildLego(it){
  const bricks = [...it.querySelectorAll('.brick')];
  /* na volta, as últimas a sair são as primeiras a chegar */
  bricks.forEach((b, i) => b.style.setProperty('--d', ((bricks.length - i) * 16) + 'ms'));
  it.classList.remove('exploded');
}

/* tocar numa palavra solta o que estiver guardado dentro dela */
function tapItem(it){
  /* molécula desmontável: quem manda é o arrasto, o toque não faz nada */
  if (it.classList.contains('qmol') || it.classList.contains('qat')) return;
  /* tocar no quadro fecha o quadro */
  if (it.classList.contains('q-board')){ it.classList.remove('on'); return; }
  /* caixa de comparação: o toque entra no mundo quântico dela */
  if (it.classList.contains('painel')){
    const pn = it.querySelector('.pn');
    if (pn && (pn.dataset.rede || pn.dataset.campo)) abrePainel(pn);
    return;
  }
  /* molécula do campo: um toque leva a 500%, outro devolve ao normal */
  if (it.classList.contains('qm')){
    const grande = it.classList.toggle('big');
    it.style.setProperty('--k', grande ? QM_BIG : (+it.dataset.k0 || 1));
    return;
  }
  if (it.classList.contains('lego')){
    if (!it.classList.contains('exploded')) explodeLego(it);
    return;
  }
  /* camada de valência: o clique acende os 8, e o seguinte apaga */
  if (it.classList.contains('valencia')){ it.classList.toggle('octeto8'); return; }
  /* grão da imagem: dois cliques ampliam, e o terceiro par entra no retículo */
  if (it.classList.contains('caco')){ duploNoGrao(it); return; }
  /* botão de ajuda: mostra o alvo, e o toque seguinte o recolhe */
  if (it.classList.contains('ajuda')){
    const slide = it.closest('.slide');
    const alvo = slide && slide.querySelector(
      `.reveal-item[data-id="${it.dataset.alvo}"]`);
    if (alvo){
      if (it.classList.toggle('on')) revealItem(slide, alvo);
      else retractItem(alvo);
    }
    return;
  }
  /* gás nobre vindo da ajuda: o toque devolve ele ao botão */
  if (it.classList.contains('gas') && it.dataset.manual !== undefined){
    const slide = it.closest('.slide');
    const bt = slide && slide.querySelector(`.ajuda[data-alvo="${it.dataset.id}"]`);
    if (bt) bt.classList.remove('on');
    retractItem(it);
    return;
  }
  /* gás nobre: o toque desenrola a distribuição, e o seguinte recolhe */
  if (it.classList.contains('gas')){ it.classList.toggle('aberto'); return; }
  /* recipiente: um toque entra no mundo quântico, outro toque volta */
  if (it.classList.contains('zoomable')){
    if (it.classList.contains('zoomed')) closeQuantum(it); else openQuantum(it);
    return;
  }
  const slide = it.closest('.slide');
  if (!slide) return;
  const face = faceNow(slide);
  if (it.dataset.id){
    const next = itemsOf(slide).find(o => o.hidden && o.dataset.from === it.dataset.id
                                       && eligible(o, face));
    if (next){ revealItem(slide, next); return; }
  }
  /* cubo sem nada guardado na face atual: o toque gira para o próximo postulado */
  if (it.classList.contains('cube') && nextAction(slide).type === 'turn') turnCube(slide, it);
}

deck.addEventListener('pointerdown', (e) => {
  /* botões são botões, não alças de arrasto */
  if (e.target.closest('.lego-redo, .q-board-btn, .pn-sair')) return;
  /* a família tem arrasto próprio, dentro da face: o cubo não a leva */
  if (e.target.closest('.ex-el .fam')) return;
  /* na tabela periódica o toque escolhe, não arrasta */
  if (e.target.closest('.tp')) return;
  /* o bico e a pedra têm interação própria: o cubo não gira por causa deles */
  if (e.target.closest('.bk, .pd')) return;
  /* O átomo do octeto é fixo: a bola arranca elétron e o resto da área
     dele serve para fazer nascer um elétron. Nada ali move o átomo. */
  if (e.target.closest('.reveal-item[data-eatom]')) return;
  let it = e.target.closest(PEGAVEL);
  /* o quadro está atrás do retículo: o canvas recebe o toque por ele */
  if (!it && e.target.classList && e.target.classList.contains('q3d')){
    it = sobreQuadro(e);
  }
  /* imagem fixa: ela não sai do lugar. O que se leva é um pedaço dela. */
  const fixo = e.target.closest('.reveal-item.fixo');
  if (fixo && !e.target.closest('.caco')){
    it = arrancaCaco(fixo, e);
    if (!it) return;
  }
  if (!it) return;
  e.preventDefault();
  it.setPointerCapture(e.pointerId);

  let g = gestures.get(it);
  if (!g){ g = { pts: new Map() }; gestures.set(it, g); }
  g.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  gesturing = true;

  if (g.pts.size === 1){
    startDrag(it, g, e.clientX, e.clientY);
    g.moved = false;                       /* sem arrasto até prova em contrário */
    it.classList.add('dragging');
    if (it.classList.contains('qat')) breakBond(it);
    if (it.classList.contains('qm')){
      paraConflito();                        /* a mão retoma o controle */
      it.closest('.quantum, .pn-q').querySelectorAll('.qm')
        .forEach(m => m.classList.remove('u2', 'u3', 'repel'));
      congelaBolas(it.closest('.quantum, .pn-q'));
    }
    if (it.classList.contains('rock')){    /* segurar parado desmonta a pedra */
      it.classList.add('pressing');        /* brilho na hora, sem esperar nada */
      clearTimeout(g.holdT);
      g.holdT = setTimeout(() => {
        if (g.moved) return;
        g.mode = 'hold';
        it.classList.add('broken');
        abreRede(it);                        /* escurece tudo e sobe a rede 3D */
      }, 180);
    }
  } else if (g.pts.size === 2){
    g.moved = true;                        /* pinça nunca conta como toque */
    /* a molécula do campo só muda de tamanho no toque, nunca na pinça */
    if (it.classList.contains('qm')) return;
    const [a, b] = [...g.pts.values()];
    g.mode = 'pinch';
    g.dist0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    g.k0 = getK(it);
  }
});

function startDrag(it, g, x, y){
  g.mode = 'drag';
  g.x0 = x; g.y0 = y;
  g.left0 = parseFloat(it.style.left);
  g.top0  = parseFloat(it.style.top);
}

deck.addEventListener('pointermove', (e) => {
  const it = e.target.closest(PEGAVEL);
  if (!it) return;
  const g = gestures.get(it);
  if (!g || !g.pts.has(e.pointerId)) return;
  g.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  /* pedra desmontada: o arrasto deixa de mover e passa a girar a câmera */
  if (g.mode === 'hold'){
    if (g.ox === undefined){ g.ox = e.clientX; g.oy = e.clientY; }
    orbitaG3(e.clientX - g.ox, e.clientY - g.oy);
    g.ox = e.clientX; g.oy = e.clientY;
    return;
  }

  if (g.mode === 'drag'){
    const k = fitScale || 1;               /* o palco está escalado: converte px de tela em px de slide */
    if (Math.abs(e.clientX - g.x0) > 4 || Math.abs(e.clientY - g.y0) > 4){
      g.moved = true;
      clearTimeout(g.holdT);               /* andou: era arrasto, não era pra desmontar */
      it.classList.remove('pressing');
    }
    /* as caixas de comparação são fixas: o arrasto nelas não as move */
    if (it.classList.contains('painel')) return;
    const nx = g.left0 + (e.clientX - g.x0) / k;
    const ny = g.top0  + (e.clientY - g.y0) / k;
    /* o átomo arrancado anda em coordenadas da molécula: sem trava do palco */
    const livre = it.classList.contains('qat') || it.classList.contains('solta');
    it.style.left = (livre ? nx : Math.min(1270, Math.max(10, nx))) + 'px';
    it.style.top  = (livre ? ny : Math.min(710,  Math.max(10, ny))) + 'px';
    if (it.classList.contains('torn')) checaVizinhanca(it);
    if (it.classList.contains('qm'))   checaBolas(it.closest('.quantum, .pn-q'));
  } else if (g.mode === 'pinch' && g.pts.size >= 2){
    const [a, b] = [...g.pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    setK(it, g.k0 * (d / g.dist0));
  }
});

function endPointer(e){
  const it = e.target.closest && e.target.closest(PEGAVEL);
  if (!it) return;
  const g = gestures.get(it);
  if (!g) return;
  g.pts.delete(e.pointerId);

  if (g.pts.size === 0){
    clearTimeout(g.holdT);
    it.classList.remove('dragging', 'pressing');
    restoreRock(it);                       /* soltou: os átomos voltam a ser pedra */
    if (it.classList.contains('torn')) healBond(it);
    if (it.classList.contains('solta')) largaSubnivel(it);
    /* Só o grão recém-arrancado é desfeito quando se solta sem arrastar.
       Um grão que já está na tela precisa aceitar cliques: é assim que
       ele amplia. */
    if (it.classList.contains('caco')){
      if (it._novo && !g.moved){
        if (it._buraco) it._buraco.remove();
        it.remove();
      }
      it._novo = false;
    }
    /* soltou encostado: escalada e arremesso. Soltou livre: a deriva volta. */
    if (it.classList.contains('qm')){
      const campo = it.closest('.quantum, .pn-q');
      if (it.classList.contains('unstable')) escalaESepara(campo);
      else soltaBolas(campo);
    }
    /* o zoom NÃO se desfaz aqui: agora ele é alternado no toque, em tapItem */
    gestures.delete(it);
    gesturing = false;
    if (!g.moved && g.mode !== 'hold') tapItem(it);
  } else if (g.pts.size === 1){
    const p = [...g.pts.values()][0];      /* soltou um dedo: volta a arrastar com o que ficou */
    startDrag(it, g, p.x, p.y);
  }
}

/* As famílias se arrastam dentro da face do cubo. O deslocamento é medido
   na escala da face — o cubo é escalado por --base/360 e o palco por
   fitScale —, senão a peça andaria mais ou menos que o dedo.
   Depois de posicionadas, o painel C entrega os números para fixá-las. */
function escalaCubo(el){
  const cubo = el.closest('.reveal-item.cube');
  const k = fitScale || 1;
  if (!cubo) return k;
  const cs = getComputedStyle(cubo);
  const base = parseFloat(cs.getPropertyValue('--base')) || 360;
  const kk   = parseFloat(cs.getPropertyValue('--k'))    || 1;
  return (base / 360) * kk * k;
}
let arrastaFam = null;
deck.addEventListener('pointerdown', (e) => {

    el: fam, id: e.pointerId, x: e.clientX, y: e.clientY,
    fx: parseFloat(cs.getPropertyValue('--fx')) || 0,
    fy: parseFloat(cs.getPropertyValue('--fy')) || 0,
    k:  escalaCubo(fam)
  };
  try { fam.setPointerCapture(e.pointerId); } catch (_){}
  fam.classList.add('pegando');
});
document.addEventListener('pointermove', (e) => {
  if (!arrastaFam || e.pointerId !== arrastaFam.id) return;
  const a = arrastaFam;
  a.el.style.setProperty('--fx', (a.fx + (e.clientX - a.x) / a.k).toFixed(1) + 'px');
  a.el.style.setProperty('--fy', (a.fy + (e.clientY - a.y) / a.k).toFixed(1) + 'px');
});
function soltaFam(e){
