/* ------------------------------------------------------------
   A NOTA DE AJUDA ANDA.
   Ela é consulta posta por cima da cena, e a cena muda: o lugar bom
   para ela depende de onde está a molécula que a turma tenta montar.
   Arrasta-se por qualquer ponto — não há nada dentro dela que peça o
   dedo para outra coisa.

   O deslocamento é medido em px do PALCO, e não da janela: a nota vive
   nas coordenadas do slide, então o caminho do dedo é dividido pela
   escala do fit — senão ela andaria mais, ou menos, que a mão.
   ------------------------------------------------------------ */
let levaPoli = null;
deck.addEventListener('pointerdown', (e) => {
  const nota = e.target.closest('.poli-nota');
  if (!nota || !nota.closest('.slide.poli-on')) return;
  e.preventDefault();
  levaPoli = { el: nota, id: e.pointerId, x: e.clientX, y: e.clientY,
               nx: parseFloat(nota.style.left) || 0,
               ny: parseFloat(nota.style.top)  || 0,
               k: fitScale || 1 };
  try { nota.setPointerCapture(e.pointerId); } catch (_){}
  nota.classList.add('pegando');
});
document.addEventListener('pointermove', (e) => {
  const g = levaPoli;
  if (!g || e.pointerId !== g.id) return;
  g.el.style.left = (g.nx + (e.clientX - g.x) / g.k).toFixed(0) + 'px';
  g.el.style.top  = (g.ny + (e.clientY - g.y) / g.k).toFixed(0) + 'px';
});
function soltaPoli(e){
  if (!levaPoli || (e && e.pointerId !== levaPoli.id)) return;
  levaPoli.el.classList.remove('pegando');
  levaPoli = null;
}
document.addEventListener('pointerup', soltaPoli);
document.addEventListener('pointercancel', soltaPoli);

/* ------------------------------------------------------------
   BARQUINHO: espalhar e juntar
   os alvos são calculados em coordenadas do palco, então as peças
   se espalham pela tela toda, e não só em volta do barquinho.
   ------------------------------------------------------------ */
function explodeLego(it){
  const bricks = [...it.querySelectorAll('.brick')];
  if (!bricks.length) return;
  const cs = getComputedStyle(it);
  const base = parseFloat(cs.getPropertyValue('--base')) || 200;
  const sc = (base / LEGO_W) * (getK(it) || 1);   /* escala do barquinho no palco */
  const cx = parseFloat(it.style.left), cy = parseFloat(it.style.top);
  const rnd = rng(4711);

  /* As peças se desmontam EM VOLTA do barquinho, não pelo palco inteiro.
     Espalhadas de ponta a ponta da tela, elas cruzavam os textos e a
     pedra e a turma perdia a ligação entre o objeto e o que saiu dele —
     que é justamente o que este barquinho serve para mostrar.

     A grade é 3x5 medida no próprio barquinho (largura W e altura H que
     ele tem NO PALCO), então ela acompanha o tamanho e a posição dele:
     mudar base ou x/y no slide continua funcionando sozinho. O centro
     sobe um pouco (H * .06) para a fiada de baixo não cair em cima do
     botão Refazer, que nasce logo abaixo do barquinho. */
  const W = LEGO_W * sc, H = LEGO_H * sc;
  const px = W * 0.48, py = H * 0.46;            /* passo da grade */
  const ox = cx, oy = cy - H * 0.06;
  const slots = [];
  for (let r = -1; r <= 1; r++)
    for (let c = -2; c <= 2; c++) slots.push([ox + c * px, oy + r * py]);
  for (let i = slots.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [slots[i], slots[j]] = [slots[j], slots[i]];
  }

  bricks.forEach((b, i) => {
    const [tx, ty] = slots[i % slots.length];
    /* o tremido também é medido no barquinho: tira o ar de grade sem
       jogar peça nenhuma para fora do grupo */
    const gx = tx + (rnd() - .5) * W * 0.26;       /* destino no palco */
    const gy = ty + (rnd() - .5) * H * 0.24;
    const hx = +b.dataset.hx, hy = +b.dataset.hy;
    /* onde o centro desta peça está agora, em coordenadas do palco */
    const nx = cx + (hx + b.dataset.w * 12 - LEGO_W / 2) * sc;
    const ny = cy + (hy + 13 - LEGO_H / 2) * sc;
    b.style.setProperty('--sx', (hx + (gx - nx) / sc).toFixed(1) + 'px');
    b.style.setProperty('--sy', (hy + (gy - ny) / sc).toFixed(1) + 'px');
    b.style.setProperty('--sr', ((rnd() - .5) * 320).toFixed(0) + 'deg');
    b.style.setProperty('--d', (i * 18) + 'ms');
    /* espalhar de novo desfaz o que já tinha sido encaixado */
    b.classList.remove('posta', 'encaixou', 'pegando', 'perto');
  });
  it.classList.remove('completo');
  it.classList.add('exploded');
}

function rebuildLego(it){
  const bricks = [...it.querySelectorAll('.brick')];
  /* na volta, as últimas a sair são as primeiras a chegar */
  bricks.forEach((b, i) => {
    b.style.setProperty('--d', ((bricks.length - i) * 16) + 'ms');
    b.classList.remove('posta', 'encaixou', 'pegando', 'perto');
  });
  it.classList.remove('exploded', 'completo');
}

/* ------------------------------------------------------------
   REMONTAR O BARQUINHO, PEÇA POR PEÇA
   Espalhar é meio caminho: o que fecha a ideia é juntar de novo com a
   própria mão. Cada tijolo se arrasta sozinho e conhece a casa dele
   (--hx/--hy, as mesmas coordenadas com que o barquinho foi desenhado);
   chegando perto, ele entra no lugar sozinho. A peça não some do dedo
   por capricho: encaixar no meio do gesto é o que faz o encaixe
   parecer ímã, e não sorte.
   ------------------------------------------------------------ */
const ENCAIXE_PECA = 32;   /* raio do encaixe, medido no desenho do barquinho */

/* do desenho (240x200) até o pixel da tela: a escala do próprio
   barquinho vezes a do palco */
function escalaLego(it){
  const cs = getComputedStyle(it);
  const base = parseFloat(cs.getPropertyValue('--base')) || LEGO_W;
  const k    = parseFloat(cs.getPropertyValue('--k'))    || 1;
  return (base / LEGO_W) * k * (fitScale || 1);
}

/* onde a peça está agora, nas coordenadas do desenho */
function poseBrick(b){
  const cs = getComputedStyle(b);
  return { x: parseFloat(cs.getPropertyValue('--sx')) || 0,
           y: parseFloat(cs.getPropertyValue('--sy')) || 0 };
}
const casaBrick = (b) => ({ x: +b.dataset.hx, y: +b.dataset.hy });
const longeDaCasa = (b, x, y) => {
  const c = casaBrick(b);
  return Math.hypot(x - c.x, y - c.y);
};

let arrastaBrick = null;
deck.addEventListener('pointerdown', (e) => {
  const b = e.target.closest && e.target.closest('.brick');
  if (!b) return;
  const it = b.closest('.reveal-item.lego');
  /* montado, o toque no barquinho é o que o desmonta: aqui não é lugar
     de arrastar peça. E peça já encaixada fica quieta. */
  if (!it || !it.classList.contains('exploded')) return;
  if (b.classList.contains('posta') || it.classList.contains('completo')) return;
  e.preventDefault();
  const p = poseBrick(b);
  arrastaBrick = { b, it, id: e.pointerId, x: e.clientX, y: e.clientY,
                   sx: p.x, sy: p.y, k: escalaLego(it) };
  try { b.setPointerCapture(e.pointerId); } catch (_){}
  b.classList.add('pegando');
});

document.addEventListener('pointermove', (e) => {
  const a = arrastaBrick;
  if (!a || e.pointerId !== a.id) return;
  const nx = a.sx + (e.clientX - a.x) / a.k;
  const ny = a.sy + (e.clientY - a.y) / a.k;
  a.b.style.setProperty('--sx', nx.toFixed(1) + 'px');
  a.b.style.setProperty('--sy', ny.toFixed(1) + 'px');
  const d = longeDaCasa(a.b, nx, ny);
  /* o aviso vem antes do encaixe: dá para ver que ela vai entrar */
  a.b.classList.toggle('perto', d < ENCAIXE_PECA * 1.9);
  if (d < ENCAIXE_PECA){ encaixaBrick(a.b, a.it); soltaBrick(); }
});

function soltaBrick(e){
  const a = arrastaBrick;
  if (!a || (e && e.pointerId !== a.id)) return;
  arrastaBrick = null;
  a.b.classList.remove('pegando', 'perto');
  /* soltou longe da casa: a peça fica onde parou, e a rotação com que
     ela caiu não volta — quem a pegou já a endireitou */
  if (!a.b.classList.contains('posta')) a.b.style.setProperty('--sr', '0deg');
}
document.addEventListener('pointerup', soltaBrick);
document.addEventListener('pointercancel', soltaBrick);

/* a peça entra na casa dela e dá o estalo */
function encaixaBrick(b, it){
  b.classList.remove('pegando', 'perto', 'encaixou');
  b.classList.add('posta');
  void b.offsetWidth;                      /* reinicia o clarão */
  b.classList.add('encaixou');
  const faltam = [...it.querySelectorAll('.brick')]
    .filter(x => !x.classList.contains('posta')).length;
  if (!faltam) legoCompleto(it);
}

/* A última peça: o barquinho inteiro cresce, acende e assenta. A ênfase
   é maior de propósito — é o fim do gesto, e o que ela diz é que aquilo
   ali voltou a ser UM objeto, e não treze pedaços no mesmo lugar. */
function legoCompleto(it){
  const slide = it.closest('.slide');
  it.classList.add('completo');
  if (slide) confete(slide, parseFloat(it.style.left), parseFloat(it.style.top));
  setTimeout(() => {
    /* sai do estado desmontado: daqui em diante o barquinho é de novo o
       barquinho, e um toque nele torna a espalhar as peças */
    it.classList.remove('completo', 'exploded');
    it.querySelectorAll('.brick').forEach(b => {
      b.classList.remove('posta', 'encaixou');
      b.style.setProperty('--d', '0ms');
    });
  }, 1000);
}

/* tocar numa palavra solta o que estiver guardado dentro dela */
/* true no segundo toque, se ele vier logo depois do primeiro */
function segundoToque(it){
  const agora = Date.now(), antes = +it.dataset.tap || 0;
  if (agora - antes < 460){ it.dataset.tap = 0; return true; }
  it.dataset.tap = agora;
  return false;
}

function tapItem(it){
  /* molécula desmontável: quem manda é o arrasto, o toque não faz nada */
  if (it.classList.contains('qmol') || it.classList.contains('qat')) return;
  /* tocar no quadro fecha o quadro */
  if (it.classList.contains('q-board')){
    it.classList.remove('on'); sincronizaQuadro(); return;
  }
  /* caixa de comparação: o toque entra no mundo quântico dela */
  if (it.classList.contains('painel')){
    const pn = it.querySelector('.pn');
    if (pn && (pn.dataset.rede || pn.dataset.campo)) abrePainel(pn);
    return;
  }
  /* Molécula do campo: um toque leva a 500%, outro devolve ao normal.
     Ampliada, ela troca o desenho por uma camada em que cada átomo se
     pega pelo dedo; encolhendo, volta a ser o desenho de sempre. */
  if (it.classList.contains('qm')){
    const grande = !it.classList.contains('big');
    /* UMA DE CADA VEZ.
       Ampliar uma molécula devolve as outras ao tamanho delas. Duas
       grandes no mesmo campo disputam a cena, e a que ficou para trás
       vira estorvo: ninguém está olhando para ela, e ela continua
       tapando o resto. */
    if (grande){
      const campo = it.closest('.quantum, .pn-q');
      if (campo) campo.querySelectorAll('.qm.big').forEach(m => {
        if (m !== it) encolheMol(m);
      });
    }
    it.classList.toggle('big', grande);
    it.style.setProperty('--k', grande ? QM_BIG : (+it.dataset.k0 || 1));
    /* A molécula 3D não se desmonta: ela já está montada em profundidade
       e o que se faz com ela é virá-la. Ampliar é só chegar mais perto. */
    if (eh3D(it.dataset.mol)) return;
    if (grande) montaSeparavel(it);
    else {
      it.classList.remove('assentou');
      it.innerHTML = MOL_SVG(it.dataset.mol || 'h2o');
    }
    return;
  }
  if (it.classList.contains('lego')){
    if (!it.classList.contains('exploded')) explodeLego(it);
    return;
  }
  /* camada de valência: o clique acende os 8, e o seguinte apaga */
  if (it.classList.contains('valencia')){ it.classList.toggle('octeto8'); return; }
  /* grão da imagem: dois cliques ampliam, e o terceiro par entra no retículo */
  if (it.classList.contains('caco')){ duploNoGrao(it); return; }
  /* botão de ajuda: mostra o alvo, e o toque seguinte o recolhe */
  if (it.classList.contains('ajuda')){
    const slide = it.closest('.slide');
    const alvo = slide && slide.querySelector(
      `.reveal-item[data-id="${it.dataset.alvo}"]`);
    if (alvo){
      if (it.classList.toggle('on')) revealItem(slide, alvo);
      else retractItem(alvo);
      /* Onde houver tabela, a ajuda também acende o gás nobre DENTRO
         dela: a resposta deixa de ser uma ficha solta ao lado e passa a
         ter endereço. Apaga junto quando a ajuda se recolhe. */
      acendeNobre(slide, it.classList.contains('on') ? alvo.dataset.sim : null);
    }
    return;
  }
  /* gás nobre vindo da ajuda: o toque devolve ele ao botão */
  if (it.classList.contains('gas') && it.dataset.manual !== undefined){
    const slide = it.closest('.slide');
    const bt = slide && slide.querySelector(`.ajuda[data-alvo="${it.dataset.id}"]`);
    if (bt) bt.classList.remove('on');
    retractItem(it);
    return;
  }
  /* gás nobre: o toque desenrola a distribuição, e o seguinte recolhe */
  if (it.classList.contains('gas')){ it.classList.toggle('aberto'); return; }
  /* recipiente: um toque entra no mundo quântico, outro toque volta.
     Alguns pedem dois toques para entrar, como o grão da imagem — é o
     gesto de "olhar mais de perto", e evita entrar sem querer ao
     arrastar o objeto pela tela. */
  if (it.classList.contains('zoomable')){
    if (it.classList.contains('zoomed')){ closeQuantum(it); return; }
    if (it.dataset.duplo !== undefined && !segundoToque(it)) return;
    openQuantum(it);
    return;
  }
  const slide = it.closest('.slide');
  if (!slide) return;
  const face = faceNow(slide);
  if (it.dataset.id){
    const next = itemsOf(slide).find(o => o.hidden && o.dataset.from === it.dataset.id
                                       && eligible(o, face));
    if (next){ revealItem(slide, next); return; }
  }
  /* cubo sem nada guardado na face atual: o toque gira para o próximo postulado */
  if (it.classList.contains('cube')){
    if (soltaCarga(it)) return;          /* as cargas da face vêm antes */
    if (nextAction(slide).type === 'turn') turnCube(slide, it);
  }
}

deck.addEventListener('pointerdown', (e) => {
  /* botões são botões, não alças de arrasto */
  if (e.target.closest('.lego-redo, .pn-sair, .poli-btn, .poli-nota')) return;
  /* molécula tridimensional ampliada: o dedo nela GIRA, não leva. Pequena
     ela continua sendo arrastada como todas as outras. */
  if (e.target.closest('.qm.tri.big')) return;
  /* a família e o símbolo têm arrasto próprio, dentro da face: o cubo
     não os leva junto, nem gira por causa deles */
  if (e.target.closest(ARRASTA_FACE)) return;
  /* na tabela periódica o toque escolhe, não arrasta */
  if (e.target.closest('.tp')) return;
  /* peça de lego solta: ela tem arrasto próprio (arrastaBrick), e o
     barquinho inteiro não pode sair do lugar junto com ela */
  if (e.target.closest('.lego.exploded .brick')) return;
  /* átomo da molécula ampliada: idem — quem anda é o átomo, não a
     molécula inteira (levaAtomo cuida dele) */
  if (e.target.closest('.qsp-at')) return;
  /* o bico, a pedra e o béquer têm interação própria: o cubo não gira
     nem se arrasta por causa deles */
  if (e.target.closest('.bk, .pd, .bq')) return;
  /* O átomo do octeto é fixo: a bola arranca elétron e o resto da área
     dele serve para fazer nascer um elétron. Nada ali move o átomo. */
  if (e.target.closest('.reveal-item[data-eatom]')) return;
  let it = e.target.closest(PEGAVEL);
  /* o quadro está atrás do retículo: o canvas recebe o toque por ele */
  if (!it && e.target.classList && e.target.classList.contains('q3d')){
    it = sobreQuadro(e);
  }
  /* imagem fixa: ela não sai do lugar. O que se leva é um pedaço dela. */
  const fixo = e.target.closest('.reveal-item.fixo');
  if (fixo && !e.target.closest('.caco')){
    it = arrancaCaco(fixo, e);
    if (!it) return;
  }
  if (!it) return;
  e.preventDefault();
  it.setPointerCapture(e.pointerId);

  let g = gestures.get(it);
  if (!g){ g = { pts: new Map() }; gestures.set(it, g); }
  g.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  gesturing = true;

  if (g.pts.size === 1){
    startDrag(it, g, e.clientX, e.clientY);
    g.moved = false;                       /* sem arrasto até prova em contrário */
    it.classList.add('dragging');
    if (it.classList.contains('qat')) breakBond(it);
    if (it.classList.contains('qm')){
      paraConflito();                        /* a mão retoma o controle */
      it.closest('.quantum, .pn-q').querySelectorAll('.qm')
        .forEach(m => m.classList.remove('u2', 'u3', 'repel'));
      congelaBolas(it.closest('.quantum, .pn-q'));
    }
    if (it.classList.contains('rock')){    /* segurar parado desmonta a pedra */
      it.classList.add('pressing');        /* brilho na hora, sem esperar nada */
      clearTimeout(g.holdT);
      g.holdT = setTimeout(() => {
        if (g.moved) return;
        g.mode = 'hold';
        it.classList.add('broken');
        abreRede(it);                        /* escurece tudo e sobe a rede 3D */
      }, 180);
    }
  } else if (g.pts.size === 2){
    g.moved = true;                        /* pinça nunca conta como toque */
    /* a molécula do campo só muda de tamanho no toque, nunca na pinça */
    if (it.classList.contains('qm')) return;
    const [a, b] = [...g.pts.values()];
    g.mode = 'pinch';
    g.dist0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    g.k0 = getK(it);
  }
});

function startDrag(it, g, x, y){
  g.mode = 'drag';
  g.x0 = x; g.y0 = y;
  g.left0 = parseFloat(it.style.left);
  g.top0  = parseFloat(it.style.top);
}

deck.addEventListener('pointermove', (e) => {
  const it = e.target.closest(PEGAVEL);
  if (!it) return;
  const g = gestures.get(it);
  if (!g || !g.pts.has(e.pointerId)) return;
  g.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  /* pedra desmontada: o arrasto deixa de mover e passa a girar a câmera */
  if (g.mode === 'hold'){
    if (g.ox === undefined){ g.ox = e.clientX; g.oy = e.clientY; }
    orbitaG3(e.clientX - g.ox, e.clientY - g.oy);
    g.ox = e.clientX; g.oy = e.clientY;
    return;
  }

  if (g.mode === 'drag'){
    const k = fitScale || 1;               /* o palco está escalado: converte px de tela em px de slide */
    if (Math.abs(e.clientX - g.x0) > 4 || Math.abs(e.clientY - g.y0) > 4){
      g.moved = true;
      clearTimeout(g.holdT);               /* andou: era arrasto, não era pra desmontar */
      it.classList.remove('pressing');
    }
    /* as caixas de comparação são fixas: o arrasto nelas não as move */
    if (it.classList.contains('painel')) return;
    const nx = g.left0 + (e.clientX - g.x0) / k;
    const ny = g.top0  + (e.clientY - g.y0) / k;
    /* o átomo arrancado anda em coordenadas da molécula: sem trava do palco */
    const livre = it.classList.contains('qat') || it.classList.contains('solta');
    it.style.left = (livre ? nx : Math.min(1270, Math.max(10, nx))) + 'px';
    it.style.top  = (livre ? ny : Math.min(710,  Math.max(10, ny))) + 'px';
    if (it.classList.contains('torn')) checaVizinhanca(it);
    if (it.classList.contains('qm'))   checaBolas(it.closest('.quantum, .pn-q'));
  } else if (g.mode === 'pinch' && g.pts.size >= 2){
    const [a, b] = [...g.pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    setK(it, g.k0 * (d / g.dist0));
  }
});

function endPointer(e){
  const it = e.target.closest && e.target.closest(PEGAVEL);
  if (!it) return;
  const g = gestures.get(it);
  if (!g) return;
  g.pts.delete(e.pointerId);

  if (g.pts.size === 0){
    clearTimeout(g.holdT);
    it.classList.remove('dragging', 'pressing');
    restoreRock(it);                       /* soltou: os átomos voltam a ser pedra */
    if (it.classList.contains('torn')) healBond(it);
    if (it.classList.contains('solta')) largaSubnivel(it);
    /* Só o grão recém-arrancado é desfeito quando se solta sem arrastar.
       Um grão que já está na tela precisa aceitar cliques: é assim que
       ele amplia. */
    if (it.classList.contains('caco')){
      if (it._novo && !g.moved){
        if (it._buraco) it._buraco.remove();
        it.remove();
      }
      it._novo = false;
    }
    /* soltou encostado: escalada e arremesso. Soltou livre: a deriva volta. */
    if (it.classList.contains('qm')){
      const campo = it.closest('.quantum, .pn-q');
      if (it.classList.contains('unstable')) escalaESepara(campo);
      else soltaBolas(campo);
    }
    /* o zoom NÃO se desfaz aqui: agora ele é alternado no toque, em tapItem */
    gestures.delete(it);
    gesturing = false;
    if (!g.moved && g.mode !== 'hold') tapItem(it);
  } else if (g.pts.size === 1){
    const p = [...g.pts.values()][0];      /* soltou um dedo: volta a arrastar com o que ficou */
    startDrag(it, g, p.x, p.y);
  }
}
deck.addEventListener('pointerup', endPointer);
deck.addEventListener('pointercancel', endPointer);

/* o toque longo na pedra não pode abrir o menu do navegador */
deck.addEventListener('contextmenu', (e) => {
  if (e.target.closest(PEGAVEL)) e.preventDefault();
});

/* SÍMBOLOS ARRASTÁVEIS — provisório, como o QTIT_MOVEL dos rótulos.
   Com isto em true, o símbolo do elemento (o "Na", o "O") se arrasta
   dentro da face do cubo, e o painel do C devolve onde ele parou.
   Depois é só voltar para false: ele deixa de pegar o dedo e a face
   inteira volta a girar o cubo ao toque, que é como a aula precisa
   dela. A família continua arrastável nos dois casos — ela é pequena e
   quase não disputa a face. */
const EX_SIM_MOVEL = true;
/* A carga é arrastável SEMPRE, e não só no modo de posicionamento:
   movê-las é o gesto da aula. A família também, como já era. O símbolo
   é o único que depende do interruptor — ele tem 64px e, pegável, toma
   a face que precisa girar o cubo ao toque. */
const ARRASTA_FACE = '.ex-el .carga, .ex-el .fam'
                   + (EX_SIM_MOVEL ? ', .ex-el .sim' : '');
document.body.classList.toggle('sim-movel', EX_SIM_MOVEL);

/* As peças da face se arrastam dentro dela. O deslocamento é medido na
   escala da face — o cubo é escalado por --base/360 e o palco por
   fitScale —, senão a peça andaria mais ou menos que o dedo.
   Depois de posicionadas, o painel C entrega os números para fixá-las. */
function escalaCubo(el){
  const cubo = el.closest('.reveal-item.cube');
  const k = fitScale || 1;
  if (!cubo) return k;
  const cs = getComputedStyle(cubo);
  const base = parseFloat(cs.getPropertyValue('--base')) || 360;
  const kk   = parseFloat(cs.getPropertyValue('--k'))    || 1;
  return (base / 360) * kk * k;
}
let arrastaFam = null;
deck.addEventListener('pointerdown', (e) => {
  const fam = e.target.closest && e.target.closest(ARRASTA_FACE);
  if (!fam) return;
  e.preventDefault();
  const cs = getComputedStyle(fam);
  arrastaFam = {
    el: fam, id: e.pointerId, x: e.clientX, y: e.clientY,
    fx: parseFloat(cs.getPropertyValue('--fx')) || 0,
    fy: parseFloat(cs.getPropertyValue('--fy')) || 0,
    k:  escalaCubo(fam)
  };
  try { fam.setPointerCapture(e.pointerId); } catch (_){}
  fam.classList.add('pegando');
});
document.addEventListener('pointermove', (e) => {
  if (!arrastaFam || e.pointerId !== arrastaFam.id) return;
  const a = arrastaFam;
  a.el.style.setProperty('--fx', (a.fx + (e.clientX - a.x) / a.k).toFixed(1) + 'px');
  a.el.style.setProperty('--fy', (a.fy + (e.clientY - a.y) / a.k).toFixed(1) + 'px');
});
function soltaFam(e){
  if (!arrastaFam || (e && e.pointerId !== arrastaFam.id)) return;
  arrastaFam.el.classList.remove('pegando');
  arrastaFam = null;
}
document.addEventListener('pointerup', soltaFam);
document.addEventListener('pointercancel', soltaFam);

/* No retículo, arrastar sobre o fundo puxa a célula unitária para fora;
   ao soltar, ela ganha o rótulo. */
/* Gestos do reticulo:
     um dedo arrastando ................ gira a cena em 3D
     dois dedos ........................ arrasta a rede e muda o tamanho (pinca)
     Ctrl + arrasto do mouse ........... o mesmo arrasto, no Chromebook
     Ctrl + roda / pinca do touchpad ... aproxima e afasta
     toque duplo segurando o segundo ... arranca a celula que estiver ali
       (com a celula fora, arranca um atomo dela)
       e, com o dedo na tela, leva o que foi arrancado onde quiser
     toque simples fora de tudo ........ sai do reticulo
     botao Resetar ..................... devolve tudo ao lugar             */
let puxando = null;
let ultimoDown = 0, ultimoPt = { x: 0, y: 0 };
const ATOMO_VOLTA = 46;    /* perto assim, o atomo se encaixa de volta */

/* coloca o rotulo embaixo de onde a celula esta agora */
function poeRotulo(slide, soSeJaEsta){
  const rot = slide.querySelector('.cel-rot');
  if (!rot) return;
  if (soSeJaEsta && !rot.classList.contains('on')) return;
  if (celFora() <= ENCAIXE){ rot.classList.remove('on'); return; }
  const t = paraTela([ G3.celC[0] + G3.celOff[0],
                       G3.celC[1] + G3.celOff[1],
                       G3.celC[2] + G3.celOff[2] ]);
  rot.style.left = t.x.toFixed(0) + 'px';
  rot.style.top  = (t.y + 96).toFixed(0) + 'px';
  rot.classList.add('on');
}

/* devolve a celula ao lugar de onde saiu, com encaixe e o nome sumindo */
function devolveCelula(slide){
  G3.volta = 1;
  const rot = slide.querySelector('.cel-rot');
  if (rot) rot.classList.remove('on');       /* some em fade out */
}

/* O canvas do retículo cobre a cena inteira e fica na frente do quadro.
   Para o quadro continuar pegável, um toque dentro do retângulo dele é
   devolvido a ele, e não à cena 3D. */
function sobreQuadro(e){
  const q = e.target.closest && e.target.closest('.quantum');
  const board = q && q.querySelector('.q-board.on');
  if (!board) return null;
  const r = board.getBoundingClientRect();
  return (e.clientX >= r.left && e.clientX <= r.right
       && e.clientY >= r.top  && e.clientY <= r.bottom) ? board : null;
}

/* ponto do palco (1280x720) onde o dedo encostou */
function pontoPalco(e){
  const st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (e.clientX - st.left) / k, y: (e.clientY - st.top) / k };
}

deck.addEventListener('pointerdown', (e) => {
  const slide = e.target.closest('.slide.quantum-on');
  if (!slide || !REDES[G3.modo]) return;
  if (e.target.closest(PEGAVEL)) return;
  if (e.target.closest('.q-board, .q-reset, .q-refazer, .q-voltar, .q-tit')) return;
  if (sobreQuadro(e)) return;               /* o toque é do quadro, atrás da cena */

  /* segundo dedo: o gesto vira arrasto da rede com pinca */
  if (puxando){
    puxando.dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (puxando.dedos.size >= 2){
      /* o segundo dedo em cima da célula que já estava sendo levada
         troca o gesto: em vez de arrastar a cena, gira a célula */
      if (puxando.modo === 'cel'){ puxando.modo = 'giracel'; return; }
      const v = [...puxando.dedos.values()];
      puxando.modo  = 'dois';
      puxando.d0    = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
      puxando.c0    = { x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2 };
      puxando.dist0 = G3.dist;
    }
    return;
  }

  const agora = Date.now();
  const perto = Math.hypot(e.clientX - ultimoPt.x, e.clientY - ultimoPt.y) < 44;
  const duplo = (agora - ultimoDown < 420) && perto;
  ultimoDown = agora; ultimoPt = { x: e.clientX, y: e.clientY };

  const p = pontoPalco(e);
  /* "nada" é o padrão: arrastar no vazio não mexe em nada. Girar exige
     que o dedo comece em cima da estrutura — na rede gira a cena, na
     célula solta gira só a célula. */
  let modo = 'nada', alvo = null;
  /* Chromebook: sem dois dedos na tela, Ctrl + arrasto faz o mesmo
     que os dois dedos fariam — leva a rede e a célula juntas. */
  if (e.ctrlKey || e.metaKey){
    modo = 'arrasta';
  } else {
    if (duplo){
      if (celFora() > 4 || G3.drama > 0.02){
        /* celula ja fora: o toque duplo pega um atomo dela */
        const a = atomoNoPonto(p.x, p.y, b => b.cel || b.solto);
        if (a){
          if (!a.solto) arrancaAtomo(a);
          else a.voltando = false;           /* pegou de novo um que voltava */
          modo = 'atomo'; alvo = a;
        }
      } else if (celulaNoPonto(p.x, p.y)){
        quebraCelula();
        modo = 'cel';
      }
    }
    if (modo === 'nada'){
      /* folga de 1,5 raio para o dedo pegar também as hastes entre os íons */
      const a = atomoNoPonto(p.x, p.y, null, 1.5);
      /* célula já fora: um dedo em cima dela a leva (e ela encaixa de
         volta se for solta perto de casa); dois dedos nela a giram */
      if (a && a.cel && !a.solto && celFora() > 4) modo = 'cel';
      else if (a) modo = 'gira';
    }
  }
  if (modo === 'cel'){
    const rot0 = slide.querySelector('.cel-rot');
    if (rot0) rot0.classList.remove('on');
  }

  puxando = { id: e.pointerId, slide, andou: 0, modo, alvo,
              dedos: new Map([[e.pointerId, { x: e.clientX, y: e.clientY }]]) };
  /* Sem captura, um gesto que sai de cima do canvas deixa de nos alcancar
     e o arrasto morre pela metade. Com captura, os eventos vem ate o fim. */
  if (e.target.setPointerCapture){
    try { e.target.setPointerCapture(e.pointerId); } catch (_){}
  }
  e.preventDefault();
});

document.addEventListener('pointermove', (e) => {
  if (!puxando) return;
  const d = puxando.dedos.get(e.pointerId);
  if (!d) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  d.x = e.clientX; d.y = e.clientY;
  const k = fitScale || 1;

  if (puxando.modo === 'dois'){
    const v = [...puxando.dedos.values()];
    if (v.length < 2) return;
    const dd = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) || 1;
    const cc = { x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2 };
    /* afastar os dedos aproxima a camera: a cena cresce */
    G3.voo = 0;                             /* a mão assume o comando */
    G3.dist = Math.max(150, Math.min(1500, puxando.dist0 * (puxando.d0 / dd)));
    moveRede((cc.x - puxando.c0.x) / k, (cc.y - puxando.c0.y) / k);
    puxando.c0 = cc;
    poeRotulo(puxando.slide, true);
    poeRotuloRede(puxando.slide);
    return;
  }
  /* so o primeiro dedo comanda: os dois somados andariam o dobro */
  if (e.pointerId !== puxando.id) return;
  puxando.andou += Math.abs(dx) + Math.abs(dy);
  if (puxando.modo === 'gira'){
    orbitaG3(dx, dy);
    poeRotulo(puxando.slide, true);
    poeRotuloRede(puxando.slide);
  } else if (puxando.modo === 'giracel'){
    giraCelula(dx, dy);
  } else if (puxando.modo === 'arrasta'){
    moveRede(dx / k, dy / k);
    poeRotulo(puxando.slide, true);
    poeRotuloRede(puxando.slide);
  } else if (puxando.modo === 'cel'){
    puxaCelula(dx, dy);
  } else if (puxando.modo === 'atomo'){
    moveAtomo(puxando.alvo, dx, dy);
  }
});

function soltaCelula(e){
  if (!puxando) return;
  if (e && puxando.dedos.has(e.pointerId)) puxando.dedos.delete(e.pointerId);
  if (e && puxando.dedos.size > 0){
    /* sobrou um dedo: o gesto continua como giro, a partir de onde ele esta */
    if (puxando.modo === 'dois'){
      puxando.modo = 'gira';
      puxando.id = [...puxando.dedos.keys()][0];
    }
    return;
  }
  const slide = puxando.slide;
  const modo = puxando.modo, alvo = puxando.alvo;
  puxando = null;

  if (modo === 'cel'){
    /* soltou perto de casa: encaixa de volta e o nome some */
    if (celFora() < ENCAIXE) devolveCelula(slide);
    else poeRotulo(slide);
    return;
  }
  if (modo === 'atomo'){
    const d = alvo && alvo.off
      ? Math.hypot(alvo.off[0], alvo.off[1], alvo.off[2]) : 0;
    if (alvo && d < ATOMO_VOLTA) devolveAtomo(alvo);
    return;
  }
  /* nada mais fecha o reticulo: so o botao Voltar */
}
document.addEventListener('pointerup', soltaCelula);
/* o navegador cancela o gesto (rolagem, dedo demais): nao pode deixar
   estado preso, ou o proximo arrasto nasce quebrado */
document.addEventListener('pointercancel', soltaCelula);


/* com o mundo quântico aberto, um toque em qualquer lugar da tela volta.
   O próprio objeto é exceção: lá quem alterna é o tapItem, e este
   ouvinte não pode desfazer a abertura que acabou de acontecer. */
document.addEventListener('click', (e) => {
  const z = deck.querySelector('.reveal-item.zoomed');
  if (!z) return;
  if (Date.now() - zoomAbertoEm < 350) return;        /* clique da própria abertura */
  if (!e.target.closest) return;
  /* mexer na barra ou nos painéis não é pedido de saída: abrir as
     anotações no meio do mergulho não pode desfazer o mergulho */
  if (e.target.closest('#bar, #puxador, #notes, #coords, #overview')) return;
  const alvo = e.target.closest('.reveal-item');
  /* mexer nas moléculas, no quadro ou na bola dele não é pedido de saída */
  if (alvo === z || e.target.closest('.qm, .qmol, .q-board, .q-refazer, .q-tit')) return;
  closeQuantum(z);
});

/* a barra da intensidade da chama */
deck.addEventListener('input', (e) => {
  const r = e.target.closest && e.target.closest('.bk-rng');
  if (r) bicoIntensidade(r.closest('.bk'));
});

/* no notebook, a pinça do touchpad chega como Ctrl + roda */
deck.addEventListener('wheel', (e) => {
  /* No retículo, Ctrl + roda (e a pinça do touchpad, que o Chrome manda
     como Ctrl + roda) aproxima e afasta a câmera. O passo acompanha o
     tamanho do delta: a roda do mouse dá saltos, o touchpad dá fatias. */
  const q = e.target.closest('.slide.quantum-on');
  if (q && REDES[G3.modo] && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    G3.voo = 0;                             /* a mão assume o comando */
    const f = Math.exp(Math.max(-0.3, Math.min(0.3, e.deltaY * 0.0016)));
    G3.dist = Math.max(150, Math.min(1500, G3.dist * f));
    poeRotulo(q, true);
    poeRotuloRede(q);
    return;
  }
  const it = e.target.closest(PEGAVEL);
  if (!it || it.classList.contains('qm')) return;   /* molécula: só o toque */
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  setK(it, getK(it) * (e.deltaY < 0 ? 1.08 : 1 / 1.08));
}, { passive: false });

/* ---------- controles ---------- */
document.getElementById('prev').onclick = () => stepBackward();
document.getElementById('next').onclick = () => stepForward();
/* A tela cheia saiu da barra, mas a tecla F continua servindo: ela não
   ocupa espaço nos controles e é o atalho que se usa antes de começar. */
function telaCheia(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen();
}
document.getElementById('over').onclick = () => toggleOverview();

/* ------------------------------------------------------------
   O QUADRO, DE QUALQUER SLIDE
   Antes o quadro só existia onde alguém tivesse posto a bola
   "Quadro" na cena, e o gesto mudava de lugar de slide para
   slide. Agora o pedido é um só — o ícone da barra — e vale em
   toda a apresentação: ele abre o quadro do slide em que se
   está e, se aquele slide nunca teve um, faz nascer o quadro
   ali na hora, no meio do palco, de onde já se arrasta.

   Dentro do mundo quântico quem responde é o quadro de lá, que
   nasce ATRÁS das moléculas e do retículo: é o fundo onde se
   escreve, não uma folha por cima da cena. Fora dele o quadro é
   solto e fica por cima do slide.
   ------------------------------------------------------------ */
const quadroBtn = document.getElementById('quadro-btn');

/* o quadro que o slide de agora usa: o do mergulho, enquanto ele está
   aberto; senão o solto — criado neste instante, se ainda não houver */
function quadroDoSlide(cria){
  const sl = slides[current];
  if (!sl) return null;
  if (sl.classList.contains('quantum-on')){
    const q = sl.querySelector('.quantum .q-board');
    if (q) return q;
  }
  let solto = sl.querySelector(':scope > .q-board');
  if (!solto && cria){
    sl.insertAdjacentHTML('beforeend', BOARD(640, 330, 1, 'solto'));
    solto = sl.querySelector(':scope > .q-board');
  }
  return solto;
}

/* o ícone acende enquanto o quadro daquele slide está aberto — e se
   apaga sozinho quando o quadro se fecha pelo toque ou pela subida do
   mergulho, que não passam por aqui */
function sincronizaQuadro(){
  if (!quadroBtn) return;
  const q = quadroDoSlide(false);
  quadroBtn.classList.toggle('on', !!(q && q.classList.contains('on')));
}

function modoQuadro(){
  const q = quadroDoSlide(true);
  if (!q) return;
  q.classList.toggle('on');
  sincronizaQuadro();
}
quadroBtn.onclick = modoQuadro;

/* ============================================================
   A TELA NÃO APAGA
   Numa aula o slide fica parado enquanto o professor fala, e o
   sistema entende parado como abandonado: escurece a tela e
   depois entra em espera. Quem resolve isso é o Wake Lock, que
   pede ao sistema para manter a tela acesa enquanto esta página
   estiver à vista.

   A trava é solta pelo próprio navegador sempre que a aba sai de
   cena — trocar de janela, minimizar, bloquear a máquina. Por
   isso ela é PEDIDA DE NOVO a cada volta: sem isso, valeria só
   até a primeira troca de janela da aula.
   ============================================================ */
let travaTela = null;

async function seguraTela(){
  if (!('wakeLock' in navigator) || document.hidden) return;
  if (travaTela) return;
  try {
    travaTela = await navigator.wakeLock.request('screen');
    /* o navegador avisa quando solta; a marca zerada deixa pedir de novo */
    travaTela.addEventListener('release', () => { travaTela = null; });
  } catch (err){ travaTela = null; }       /* negado ou sem suporte: a aula segue */
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) seguraTela();
});
/* Alguns navegadores só concedem a trava depois de um gesto do usuário.
   O primeiro toque na apresentação serve de gesto — daí em diante quem
   cuida é o visibilitychange. */
document.addEventListener('pointerdown', seguraTela, { once: true });
seguraTela();

/* ============================================================
   A CANETA
   Escrever por cima do slide sem nunca disputar o gesto com o
   arrasto. Quem separa as duas coisas é o TIPO DO PONTEIRO, e não
   um modo que desliga a tela: armada a caneta, a ponta dela risca
   e o dedo continua mexendo nos elementos, ao mesmo tempo, sem se
   atrapalharem. São duas ferramentas na mesma tela — que é como
   funciona um quadro de verdade.

   O traço é guardado por slide, em coordenadas do palco (1280x720),
   e redesenhado a cada troca: escrever no slide 4, ir ao 9 e voltar
   devolve o que estava escrito. Vive na memória da sessão; fechar a
   página limpa o quadro.
   ============================================================ */
const tinta   = document.getElementById('tinta');
const penBtn  = document.getElementById('pen-btn');
const penCor  = document.getElementById('pen-cor');
const penLimpa= document.getElementById('pen-limpa');
const ctx     = tinta.getContext('2d');

const CORES = ['#F0B44A', '#45C7B0', '#FF7A5C', '#E8F1F5'];
let corAtual = 0;
const TRACO = 4.5;                         /* espessura, em px do palco */
const riscos = {};                         /* índice do slide -> lista de traços */
let riscando = null;

/* A folha acompanha o palco: o desenho é guardado em px de palco, mas o
   bitmap nasce no tamanho REAL em que ele vai aparecer — densidade da
   tela vezes o fator do fit. Sem isto, num projetor grande o traço sairia
   esticado e borrado. Refeito a cada fit(), e o desenho é repintado. */
function ajustaTinta(){
  const s = Math.min(3, (window.devicePixelRatio || 1) * (fitScale || 1));
  tinta.width  = Math.round(1280 * s);
  tinta.height = Math.round(720  * s);
  ctx.setTransform(s, 0, 0, s, 0, 0);
  repintaTinta();
}

function repintaTinta(){
  ctx.clearRect(0, 0, 1280, 720);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  (riscos[current] || []).forEach(t => {
    if (t.p.length < 2) {                  /* um toque só: vira um ponto */
      ctx.beginPath();
      ctx.fillStyle = t.c;
      ctx.arc(t.p[0][0], t.p[0][1], t.w / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.strokeStyle = t.c;
    ctx.lineWidth = t.w;
    ctx.moveTo(t.p[0][0], t.p[0][1]);
    /* curva por pontos médios: tira o serrilhado do traço à mão */
    for (let i = 1; i < t.p.length - 1; i++){
      const mx = (t.p[i][0] + t.p[i + 1][0]) / 2;
      const my = (t.p[i][1] + t.p[i + 1][1]) / 2;
      ctx.quadraticCurveTo(t.p[i][0], t.p[i][1], mx, my);
    }
    const u = t.p[t.p.length - 1];
    ctx.lineTo(u[0], u[1]);
    ctx.stroke();
  });

  /* o anel da borracha, enquanto ela está encostada: sem ele não se vê
     o alcance e apaga-se sempre mais do que se queria */
  if (riscando && riscando.apaga){
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(232,241,245,.75)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.arc(riscando.x, riscando.y, RAIO_BORRACHA, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

/* A BOLINHA DO PONTEIRO, na cor da tinta de agora.
   Vai como imagem no cursor, desenhada aqui porque a cor muda a cada
   toque no botão de cor — em CSS ela teria de ser quatro regras, uma
   por cor, e uma quinta no dia em que entrasse a quinta cor. */
function cursorDaTinta(){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">'
    + '<circle cx="10" cy="10" r="5.5" fill="' + CORES[corAtual] + '"'
    + ' stroke="rgba(3,12,22,.55)" stroke-width="1.5"/></svg>';
  stage.style.setProperty('--cur-tinta',
    'url("data:image/svg+xml,' + encodeURIComponent(svg) + '") 10 10, crosshair');
}

function modoCaneta(v){
  const abrir = v === undefined ? !stage.classList.contains('escrevendo') : !!v;
  stage.classList.toggle('escrevendo', abrir);
  penBtn.classList.toggle('on', abrir);
  penCor.hidden = penLimpa.hidden = !abrir;
  penCor.style.color = CORES[corAtual];
  cursorDaTinta();
  penBtn.title = abrir ? 'Fechar a caneta (P)' : 'Escrever na tela (P)';
}

penBtn.onclick = () => modoCaneta();
penCor.onclick = () => {
  corAtual = (corAtual + 1) % CORES.length;
  penCor.style.color = CORES[corAtual];
  cursorDaTinta();                         /* o ponteiro troca junto */
};

/* ------------------------------------------------------------
   O LASER
   Um ponto vermelho que segue a ponta da caneta. Não risca, não
   pega em nada e não deixa rastro: serve para apontar, que numa
   aula é meio caminho da explicação.

   Só a CANETA o acende, pelo mesmo critério da escrita: quem
   aponta é a mão do professor. Com o mouse fazendo o ponto, o
   laser apareceria sozinho toda vez que alguém encostasse no
   computador.

   E ele se apaga depois de parado, como um laser de verdade
   solto na mão apagaria — a luz esquecida num canto da tela
   viraria só mais uma coisa acesa.
   ------------------------------------------------------------ */
const laser    = document.getElementById('laser');
const laserBtn = document.getElementById('laser-btn');
let laserLigado = false, laserT;

function modoLaser(v){
  laserLigado = v === undefined ? !laserLigado : !!v;
  laserBtn.classList.toggle('on', laserLigado);
  laserBtn.title = laserLigado ? 'Desligar o laser (L)' : 'Apontar com o laser (L)';
  if (!laserLigado){ clearTimeout(laserT); laser.classList.remove('on'); }
}
laserBtn.onclick = () => modoLaser();

document.addEventListener('pointermove', (e) => {
  if (!laserLigado || e.pointerType !== 'pen') return;
  laser.style.left = e.clientX + 'px';
  laser.style.top  = e.clientY + 'px';
  laser.classList.add('on');
  clearTimeout(laserT);
  laserT = setTimeout(() => laser.classList.remove('on'), 2200);
}, { passive: true });

/* a caneta saiu do alcance da tela: a luz se apaga na hora */
document.addEventListener('pointerout', (e) => {
  if (e.pointerType === 'pen'){ clearTimeout(laserT); laser.classList.remove('on'); }
});
penLimpa.onclick = () => { riscos[current] = []; repintaTinta(); };

/* QUEM RISCA E QUEM ARRASTA.
   Só a ponta da caneta escreve. Dedo e mouse fazem a mesma coisa que
   sempre fizeram — pegar molécula, girar cubo, puxar átomo —, e fazem
   isso mesmo com a caneta armada. São duas ferramentas na mesma tela,
   cada uma com a sua função, valendo ao mesmo tempo. */
const canetaRisca = (e) => stage.classList.contains('escrevendo')
                        && e.pointerType === 'pen';

/* A CANETA VIRA BORRACHA.
   As lousas anunciam isso de dois jeitos, e qual deles chega depende do
   driver — então os dois valem:
     buttons & 32 -> a ponta-borracha (virar a caneta ao contrário)
     buttons &  2 -> o botão lateral segurado
   Como o botão lateral entra somado ao contato da ponta (1|2 = 3), a
   conta é sobre a máscara 34, e não uma comparação de igualdade. */
const BORRACHA = 34;                       /* 32 (ponta-borracha) | 2 (botão) */
const eBorracha = (e) => (e.buttons & BORRACHA) !== 0;
const RAIO_BORRACHA = 20;                  /* em px do palco */

/* Apaga por PEDAÇO, e não o traço inteiro: a borracha corta o risco onde
   passa e o que sobra de cada lado continua na tela. É o que se espera de
   uma borracha — quem quer limpar tudo tem o botão da barra. */
function apagaEm(x, y){
  const lista = riscos[current];
  if (!lista || !lista.length) return;
  const saida = [];
  let mudou = false;
  lista.forEach(t => {
    let pedaco = [];
    t.p.forEach(pt => {
      if (Math.hypot(pt[0] - x, pt[1] - y) <= RAIO_BORRACHA){
        mudou = true;
        if (pedaco.length > 1) saida.push({ c: t.c, w: t.w, p: pedaco });
        pedaco = [];
      } else pedaco.push(pt);
    });
    if (pedaco.length === t.p.length) saida.push(t);          /* nem encostou */
    else if (pedaco.length > 1) saida.push({ c: t.c, w: t.w, p: pedaco });
  });
  if (mudou){ riscos[current] = saida; repintaTinta(); }
}

/* Os ouvintes ficam na FASE DE CAPTURA, acima de tudo: quando o risco
   começa, o evento morre ali e nenhum gesto do slide chega a nascer.
   Se não for para riscar, ele segue o caminho normal, intacto. */
stage.addEventListener('pointerdown', (e) => {
  if (!canetaRisca(e)) return;
  e.preventDefault();
  e.stopPropagation();
  const p = pontoPalco(e);
  if (eBorracha(e)){
    riscando = { id: e.pointerId, apaga: true, x: p.x, y: p.y };
    apagaEm(p.x, p.y);
    repintaTinta();
    return;
  }
  riscando = { id: e.pointerId, t: { c: CORES[corAtual], w: TRACO, p: [[p.x, p.y]] } };
  (riscos[current] = riscos[current] || []).push(riscando.t);
  repintaTinta();
}, true);

window.addEventListener('pointermove', (e) => {
  if (!riscando || e.pointerId !== riscando.id) return;
  e.stopPropagation();
  const p = pontoPalco(e);
  if (riscando.apaga){
    riscando.x = p.x; riscando.y = p.y;
    apagaEm(p.x, p.y);
    repintaTinta();                        /* redesenha o anel da borracha */
    return;
  }
  const u = riscando.t.p[riscando.t.p.length - 1];
  /* pontos quase no mesmo lugar só engordam a lista sem mudar o traço */
  if (Math.hypot(p.x - u[0], p.y - u[1]) < 1.6) return;
  riscando.t.p.push([p.x, p.y]);
  repintaTinta();
}, true);

function largaRisco(e){
  if (!riscando || (e && e.pointerId !== riscando.id)) return;
  if (e) e.stopPropagation();
  const apagava = riscando.apaga;
  riscando = null;
  if (apagava) repintaTinta();             /* tira o anel da tela */
}
window.addEventListener('pointerup', largaRisco, true);
window.addEventListener('pointercancel', largaRisco, true);
/* o botão lateral da caneta chega como clique direito: com a caneta
   armada ele é borracha, não menu do navegador */
stage.addEventListener('contextmenu', (e) => {
  if (stage.classList.contains('escrevendo')) e.preventDefault();
}, true);
grid.onclick = (e) => {
  const b = e.target.closest('[data-go]');
  if (b){ go(+b.dataset.go); toggleOverview(false); }
};
/* ------------------------------------------------------------
   FERRAMENTA DE MONTAGEM
   C (ou o botão da barra) mostra as posições e tamanhos atuais
   dos elementos do slide, no formato que vai direto pro código.
   ------------------------------------------------------------ */
const coords = document.getElementById('coords');
const coordsTxt = document.getElementById('coords-txt');
const coordsMsg = document.getElementById('coords-msg');

const esc = (t) => String(t)
  .replace(/\\/g, '\\\\')
  .replace(/'/g, "\\'")
  .replace(/\n/g, '\\n');

function coordsFor(slide){
  const items = [...slide.querySelectorAll('.reveal-item')];
  if (!items.length) return '/* este slide ainda não tem elementos reveláveis */';

  const rows = items.map(it => {
    const cs   = getComputedStyle(it);
    const img  = it.querySelector('img');
    const txt  = it.querySelector('.txt');
    const kind = ['rock','lego','sphere','cube','molecule','glass','vessel','gas',
                  'painel','tabela','lewis','reticulo']
      .find(t => it.classList.contains(t));
    const cap = it.querySelector('.cap');
    const capTxt = cap ? `, caption: '${esc(cap.textContent)}'` : '';
    const what = kind
      ? `kind: '${kind}'`
        + (it.dataset.sim   ? `, sim: '${it.dataset.sim}'`     : '')
        + (it.dataset.shape ? `, shape: '${it.dataset.shape}'` : '')
        + (it.dataset.mol   ? `, mol: '${it.dataset.mol}'`     : '')
        + (it.dataset.field ? `, field: '${it.dataset.field}'` : '')
        + (it.dataset.tag   ? `, tag: '${esc(it.dataset.tag)}'` : '')
        + (it.dataset.label ? `, label: '${esc(it.dataset.label)}'` : '')
        + (it.dataset.color ? `, color: '${it.dataset.color}'` : '')
        + (it.dataset.tit    ? `, tit: '${esc(it.dataset.tit)}'`       : '')
        + (it.dataset.estilo ? `, estilo: '${it.dataset.estilo}'`      : '')
        + (it.dataset.corpo  ? `, corpo: '${it.dataset.corpo}'`        : '')
        + (it.querySelector('.pn img')
             ? `, img: '${esc(it.querySelector('.pn img').getAttribute('src'))}'` : '')
        + capTxt
      : img
      ? `img: '${esc(img.getAttribute('src'))}'` + capTxt
      : `text: '${esc(txt ? txt.textContent : '')}'`;
    const k    = parseFloat(cs.getPropertyValue('--k'))    || 1;
    const base = parseFloat(cs.getPropertyValue('--base')) || 40;
    const tone = it.classList.contains('aqua')  ? 'aqua'
               : it.classList.contains('amber') ? 'amber' : '';
    const wch = it.style.getPropertyValue('--wch');
    return `      { ${it.dataset.auto ? `auto: true, ` : ''}`
         + `${it.dataset.follow !== undefined
              ? `follow: ${+it.dataset.follow === FOLLOW_MS
                   ? 'true' : it.dataset.follow}, ` : ''}`
         + `${it.classList.contains('nowrap') ? `nowrap: true, ` : ''}`
         + `${it.classList.contains('bullet') ? `bullet: true, ` : ''}`
         + `${it.dataset.id ? `id: '${it.dataset.id}', ` : ''}${what}`
         + `, x: ${Math.round(parseFloat(it.style.left))}`
         + `, y: ${Math.round(parseFloat(it.style.top))}`
         + `, base: ${Math.round(base * k * 10) / 10}`
         + `${wch ? `, wch: ${wch.trim()}` : ''}`
         + `${it.dataset.of !== undefined ? `, face: ${it.dataset.of}` : ''}`
         + `, tone: '${tone}'`
         + `${it.dataset.entra ? `, entra: '${it.dataset.entra}'` : ''}`
         + `${it.dataset.sai ? `, sai: '${it.dataset.sai}'` : ''}`
         + `${it.dataset.from ? `, from: '${it.dataset.from}'` : ''} }`;
  });

  /* Câmera do retículo: onde ele está, o zoom e o ângulo. Isto não sai
     das coordenadas do elemento — é estado da cena 3D. */
  let camTxt = '';
  if (slide.querySelector('.reveal-item.reticulo') && G3.modo && G3.atomos.length){
    camTxt = `\n\n    /* retículo — cole como cam: [...] no elemento\n`
      + `      cam: [${Math.round(G3.px)}, ${Math.round(G3.py)}, `
      + `${Math.round(G3.dist)}, ${G3.az.toFixed(3)}, ${G3.el.toFixed(3)}]\n    */`;
  }

  /* Posição das peças dentro da face do cubo — o símbolo do elemento e a
     família dele —, para poder fixá-las no CSS depois de acertadas. Sai
     já como a regra que se cola: quem lê isto quer copiar, não traduzir. */
  const pecas = [...slide.querySelectorAll('.ex-el .carga, .ex-el .sim, .ex-el .fam')];
  let extra = '';
  if (pecas.length){
    const linhas = pecas.map(x => {
      const cs = getComputedStyle(x);
      const fx = Math.round((parseFloat(cs.getPropertyValue('--fx')) || 0) * 10) / 10;
      const fy = Math.round((parseFloat(cs.getPropertyValue('--fy')) || 0) * 10) / 10;
      const el = x.closest('.ex-el');
      const par = x.closest('.ex-par');
      const lado = (par && el === par.firstElementChild) ? 'first' : 'last';
      const que  = x.classList.contains('sim')   ? 'sim'
                 : x.classList.contains('carga') ? 'carga' : 'fam';
      return `      .ex-par .ex-el:${lado}-child .${que}`
           + `{--fx:${fx}px;--fy:${fy}px}   /* ${x.textContent.trim()} */`;
    });
    /* uma peça por lado basta: os quatro exemplos usam a mesma regra */
    const vistas = new Set();
    const unicas = linhas.filter(l => {
      const chave = l.slice(0, l.indexOf('{'));
      if (vistas.has(chave)) return false;
      vistas.add(chave); return true;
    });
    extra = `\n\n    /* peças no cubo — cole no CSS\n${unicas.join('\n')}\n    */`;
  }

  /* Os rótulos escritos DENTRO do mundo quântico. Também não são
     reveal-items — moram no .quantum —, então saem à parte, já no
     formato que se cola de volta no recipiente. */
  const tits = [...slide.querySelectorAll('.q-tit')];
  if (tits.length){
    const linhas = tits.map(t => {
      const cls = [...t.classList]
        .filter(c => c !== 'q-tit' && c !== 'movel' && c !== 'pegando');
      return `        ['${esc(t.textContent.trim())}', `
        + `${Math.round(parseFloat(t.style.left) || 0)}, `
        + `${Math.round(parseFloat(t.style.top)  || 0)}`
        + `${cls.length ? `, '${cls[0]}'` : ''}]`;
    });
    extra += `\n\n    /* rótulos do mundo quântico — cole como qtit no recipiente\n`
           + `      qtit: [\n${linhas.join(',\n')}\n      ]\n    */`;
  }

  /* O béquer, quando está em modo de posicionamento. Ele não é um
     reveal-item — mora dentro de uma face do cubo —, então sai à parte,
     como o deslocamento que ele ganhou em relação ao lugar de origem. */
  const bqs = [...slide.querySelectorAll('.bq')];
  if (bqs.length){
    const linhas = bqs.map(b => {
      const cs = getComputedStyle(b);
      const bx = Math.round((parseFloat(cs.getPropertyValue('--bqx')) || 0) * 10) / 10;
      const by = Math.round((parseFloat(cs.getPropertyValue('--bqy')) || 0) * 10) / 10;
      return `      bqx ${bx}px, bqy ${by}px`;
    });
    extra += `\n\n    /* béquer, deslocamento dentro da face\n`
           + `${linhas.join('\n')}\n    */`;
  }

  /* AS MOLÉCULAS DO MUNDO QUÂNTICO.
     Elas não são reveal-items — vivem dentro de .quantum —, e por isso
     nunca saíam neste painel: arrumá-las à mão e apertar C devolvia um
     bloco sem elas, e o mergulho seguinte as reembaralhava. Agora saem,
     prontas para colar como qmols no recipiente.
     São coordenadas de CENTRO, e não do canto como o style guarda: assim
     mudar o qk depois não desloca a arrumação. */
  const qms = [...slide.querySelectorAll('.quantum .qm')];
  let molTxt = '';
  if (qms.length){
    const pares = qms.map(m => {
      const k = parseFloat(m.style.getPropertyValue('--k')) || 1;
      return `[${Math.round(parseFloat(m.style.left) + 26 * k)}, `
           + `${Math.round(parseFloat(m.style.top)  + 19 * k)}]`;
    });
    const linhas = [];
    for (let i = 0; i < pares.length; i += 4)
      linhas.push('        ' + pares.slice(i, i + 4).join(', '));
    molTxt = `\n\n    /* moléculas do mundo quântico — cole no recipiente\n`
      + `      qmols: [\n${linhas.join(',\n')}\n      ]\n    */`;
  }

  return `    reveals: [\n${rows.join(',\n')}\n    ]${camTxt}${molTxt}${extra}`;
}

function showCoords(){
  coordsTxt.value = coordsFor(slides[current]);
  coords.hidden = false;
  coordsTxt.focus();
  coordsTxt.select();
  coordsMsg.textContent = '';
  const done = (ok) => {
    coordsMsg.textContent = ok
      ? 'copiado para a área de transferência'
      : 'selecionado — copie com Ctrl+C';
  };
  try {
    navigator.clipboard.writeText(coordsTxt.value).then(() => done(true), () => done(false));
  } catch (err){ done(false); }
}
function hideCoords(){ coords.hidden = true; }

/* A caixa das posições não tem mais botão na barra — quem a chama é a
   tecla C. A função fica: ela é o que devolve as coordenadas depois de
   arrastar os elementos pelo palco. */
document.getElementById('coords-close').onclick = hideCoords;

/* ------------------------------------------------------------
   ANOTAÇÕES DO SLIDE
   O caderno do professor: uma caixa de texto por slide, aberta
   pelo botão da barra ou pela tecla A, gravada no fechar.
   Mora no localStorage desta máquina — o arquivo da aula não
   muda, e por isso a anotação sobrevive a uma nova versão dele.
   ------------------------------------------------------------ */
const notes     = document.getElementById('notes');
const notesTxt  = document.getElementById('notes-txt');
const notesMsg  = document.getElementById('notes-msg');
const notesTit  = document.getElementById('notes-slide');
const notesBtn  = document.getElementById('notes-btn');
const NOTES_KEY = 'lq:anotacoes';

/* A chave é o título do slide, não o número: enquanto a aula está sendo
   montada, um slide novo no meio empurraria todos os índices e cada
   anotação iria parar no slide errado. Título só repete se for um
   descuido, e aí o número desempata. */
const chaveNota = (i) => (SLIDES[i] && SLIDES[i].title) || `slide ${i + 1}`;

/* Navegador com o armazenamento fechado (aba anônima, file:// em alguns
   casos, política do sistema) não pode derrubar a aula: nesse caso as
   anotações valem só enquanto a página estiver aberta. */
let notasMem = null;
function leNotas(){
  if (notasMem) return notasMem;
  try {
    notasMem = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}') || {};
  } catch (err){ notasMem = {}; }
  return notasMem;
}
function gravaNotas(){
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(notasMem || {})); return true; }
  catch (err){ return false; }
}

/* a bolinha âmbar no botão da barra: este slide tem algo escrito */
function marcaNota(){
  if (notesBtn) notesBtn.classList.toggle('tem', !!(leNotas()[chaveNota(current)] || '').trim());
}

let notaAberta = -1;                       /* de que slide é a caixa aberta */
function showNotes(){
  if (!notes.hidden) return;
  notaAberta = current;
  notesTit.textContent = chaveNota(current);
  notesTxt.value = leNotas()[chaveNota(current)] || '';
  notesMsg.textContent = '';
  notes.hidden = false;
  notesTxt.focus();
  /* o cursor vai para o fim do que já estava escrito, não para o começo */
  notesTxt.setSelectionRange(notesTxt.value.length, notesTxt.value.length);
}

/* Fechar é salvar: não há botão de descartar, e é essa a intenção —
   quem abriu o caderno no meio da aula não deveria ter de confirmar.
   Fecham a caixa: o X, a tecla Esc e um clique no fundo do painel. */
function hideNotes(){
  if (notes.hidden) return;
  salvaNota();
  notes.hidden = true;
  notaAberta = -1;
}
function salvaNota(){
  if (notes.hidden || notaAberta < 0) return;
  const k = chaveNota(notaAberta);
  const t = notesTxt.value;
  const mapa = leNotas();
  if (t.trim()) mapa[k] = t; else delete mapa[k];   /* caixa vazia não deixa rastro */
  gravaNotas();
  marcaNota();
}

notesBtn.onclick = showNotes;
document.getElementById('notes-close').onclick = hideNotes;

/* ------------------------------------------------------------
   A FOLHA ANDA.
   Ela se põe sobre o slide, e o slide muda: num o desenho está à
   esquerda, no outro à direita. Arrastando-a pelo cabeçalho, o
   professor tira a nota da frente do que ela comenta.

   O centro é preso à janela — nunca sai dela inteira —, e o lugar
   escolhido vale para as próximas aberturas desta sessão: quem
   achou o canto bom não deveria ter de reachá-lo a cada slide.
   ------------------------------------------------------------ */
const notesCab = document.getElementById('notes-cab');
let levaNota = null;
if (notesCab) notesCab.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;      /* o X é botão, não alça */
  const r = notes.getBoundingClientRect();
  levaNota = { id: e.pointerId, x: e.clientX, y: e.clientY,
               nx: r.left + r.width / 2, ny: r.top + r.height / 2 };
  try { notesCab.setPointerCapture(e.pointerId); } catch (_){}
  notes.classList.add('levando');
  e.preventDefault();
});
document.addEventListener('pointermove', (e) => {
  if (!levaNota || e.pointerId !== levaNota.id) return;
  const r = notes.getBoundingClientRect();
  const mx = r.width / 2 + 6, my = r.height / 2 + 6;
  const w = window.innerWidth, h = window.innerHeight;
  notes.style.setProperty('--nx',
    Math.min(w - mx, Math.max(mx, levaNota.nx + e.clientX - levaNota.x)).toFixed(0) + 'px');
  notes.style.setProperty('--ny',
    Math.min(h - my, Math.max(my, levaNota.ny + e.clientY - levaNota.y)).toFixed(0) + 'px');
});
function soltaNota(e){
  if (!levaNota || (e && e.pointerId !== levaNota.id)) return;
  levaNota = null;
  notes.classList.remove('levando');
}
document.addEventListener('pointerup', soltaNota);
document.addEventListener('pointercancel', soltaNota);
/* rede de segurança: fechar a aba ou trocar de janela com a caixa aberta
   não pode perder o que foi escrito */
window.addEventListener('beforeunload', salvaNota);
document.addEventListener('visibilitychange', () => { if (document.hidden) salvaNota(); });

/* Cada miniatura é o próprio slide clonado e reduzido, com tudo o que os
   cliques revelariam já à mostra: é para dar uma ideia do que tem dentro.
   Monta na hora de abrir, para refletir o estado atual da apresentação. */
function montaMiniaturas(){
  [...grid.querySelectorAll('.card')].forEach((card, i) => {
    const alvo = card.querySelector('.mini-palco');
    const fonte = slides[i];
    if (!alvo || !fonte) return;

    const copia = fonte.cloneNode(true);
    copia.removeAttribute('id');
    copia.removeAttribute('hidden');
    copia.classList.remove(...FX_CLASSES, 'quantum-on', 'rede-on');
    copia.classList.add('is-active');
    /* fora o que não é conteúdo do slide, o que não sobrevive a um clone
       (a tela 3D) e o que não pode ficar dentro de um botão */
    copia.querySelectorAll('.quantum, canvas, button, .caco, .buraco, .cel-rot, .rede-rot')
         .forEach(n => n.remove());
    /* o que só apareceria a cada clique já entra na miniatura */
    copia.querySelectorAll('.reveal-item[hidden]')
         .forEach(n => n.removeAttribute('hidden'));

    alvo.replaceChildren(copia);
    alvo.style.transform = `scale(${card.clientWidth / 1280})`;
    card.classList.toggle('current', i === current);
  });
}

function toggleOverview(force){
  const show = force !== undefined ? force : overview.hidden;
  overview.hidden = !show;
  if (show) montaMiniaturas();
}

document.addEventListener('keydown', (e) => {
  if (!coords.hidden){                       /* painel aberto: só Esc responde */
    if (e.key === 'Escape') hideCoords();
    return;
  }
  /* Com a caixa de anotações aberta, o teclado é dela: espaço e setas
     estão escrevendo, não passando slide. Só o Esc sai — salvando. */
  if (!notes.hidden){
    if (e.key === 'Escape') hideNotes();
    return;
  }
  if (e.key === 'Escape'){                   /* Esc sai do zoom dos recipientes */
    const z = deck.querySelector('.reveal-item.zoomed');
    if (z){ closeQuantum(z); return; }
    /* do retículo, quem sai é o botão Voltar, e mais ninguém */
  }
  if (e.key === 'Escape' && !overview.hidden){ toggleOverview(false); return; }
  /* por último: com a visão geral fechada e ninguém mergulhado, o Esc
     recolhe os controles — o mesmo que o X faz */
  if (e.key === 'Escape' && !bar.classList.contains('hidden')){ mostraBarra(false); return; }
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ': case 'Enter':
      e.preventDefault(); stepForward(); break;
    case 'ArrowLeft':  case 'PageUp':  case 'Backspace':
      e.preventDefault(); stepBackward(); break;
    case 'Home': go(0); break;
    case 'End':  go(SLIDES.length-1); break;
    case 'f': case 'F': telaCheia(); break;
    case 'p': case 'P': modoCaneta(); break;
    case 'o': case 'O': toggleOverview(); break;
    case 'c': case 'C': showCoords(); break;
    case 'a': case 'A': showNotes(); break;
    case 'q': case 'Q': modoQuadro(); break;
    case 'l': case 'L': modoLaser(); break;
  }
});

/* Nao ha deslize que troque de slide: todo arrasto na tela pertence ao
   objeto que esta embaixo do dedo. A troca e pelas setas ou pela barra. */

/* ------------------------------------------------------------
   A BARRA E O PUXADOR
   Durante a aula a tela é só o slide. Os controles moram embaixo
   da borda de baixo e sobem quando se chama a alça; o botão de
   fechar os manda de volta pelo mesmo caminho, que é a subida ao
   contrário — mesma curva, mesmo tempo, só o estado invertido.
   ------------------------------------------------------------ */
const puxador = document.getElementById('puxador');

function mostraBarra(v){
  const abrir = v === undefined ? bar.classList.contains('hidden') : !!v;
  bar.classList.toggle('hidden', !abrir);
  /* a alça se recolhe enquanto a barra está em cena: quem fecha dali
     em diante é o X, e duas coisas no mesmo lugar só atrapalhariam */
  puxador.classList.toggle('fora', abrir);
  puxador.setAttribute('aria-expanded', abrir ? 'true' : 'false');
}
puxador.onclick = () => mostraBarra(true);
document.getElementById('bar-close').onclick = () => mostraBarra(false);

/* nasce escondida: a aula começa com a tela limpa */
mostraBarra(false);

window.addEventListener("resize", fit);
window.addEventListener("orientationchange", fit);
document.addEventListener("fullscreenchange", fit);
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
document.getElementById('ver').textContent = VERSION;
render(); fit(); go(0, true);
slides.forEach(sl => { if (temReveals(sl)) resetReveals(sl); });
</script>
<script>
/* Registra o service worker, que é o que guarda a aula inteira para ela
   abrir sem rede. Só vale servido por http(s): aberto direto do disco
   (file://) o navegador não permite, e aí o app roda como sempre rodou. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
