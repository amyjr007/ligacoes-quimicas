   do giro, troca de costas e reaparece do outro lado. */
function viraLupa(slide, face){
  const it = slide && slide.querySelector('.reveal-item.reticulo[data-lupa]');
  const cv = slide && slide.querySelector('.q3d');
  const tipo = REDE_DA_FACE[face];
  if (!it || it.hidden || !cv || !tipo || G3.modo === tipo) return;
  /* a medida da lente é tirada agora, de frente, e guardada para a
     troca lá no meio do giro */
  const g = geoLupa();
  it.classList.remove('virando');
  void it.offsetWidth;
  it.classList.add('virando');
  /* A medida de frente é guardada e vale por todo o giro; o recorte
     estreita sozinho com o ângulo, em segueLupa. Sem fade nenhum: quem
     esconde a troca é a própria lente, de perfil. */
  G3.lupaPara = 1;
  G3.lupaG = g;
  G3.giro = performance.now();
  /* na metade do giro a lente está de perfil e não há um pixel na tela:
     é ali, e só ali, que o cristal é trocado */
  setTimeout(() => { trocaRedeDaLupa(slide, tipo, g); }, LUPA_GIRO / 2);
  setTimeout(() => {
    it.classList.remove('virando');
    G3.lupaPara = 0;
    G3.giro = 0;
    segueLupa();
  }, LUPA_GIRO + 20);
}

/* o cristal se recompõe, para a demonstração poder ser repetida */
function refazPedra(pd){
  if (!pd) return;
  pd.dataset.e = 0;
  pd.classList.remove('bate');
  pd.querySelectorAll('.pd-rach').forEach(l => l.classList.remove('flash'));
  G3.clivaAlvo = 0;                     /* o retículo se refaz junto */
  const d = pd.querySelector('.pd-dica');
  if (d) d.textContent = PD_DICAS[0];
}

/* ------------------------------------------------------------
   O SAL NO FOGO
   A intensidade da chama define até onde a temperatura sobe e com que
   pressa. Em fogo baixo ela estaciona longe do ponto de fusão — é
   preciso abrir a chama para o sal derreter.
   ------------------------------------------------------------ */
const BK_AMB = 25, BK_MAX = 1000;          /* ambiente e o teto da chama cheia */

function bicoAlvo(bk){
  if (!bk.classList.contains('aceso')) return BK_AMB;
  const i = (+bk.dataset.int || 55) / 100;
  return BK_AMB + (BK_MAX - BK_AMB) * i;
}

function bicoAnda(bk){
  if (bk._t) cancelAnimationFrame(bk._t);
  const num = bk.querySelector('.bk-num'), merc = bk.querySelector('.bk-merc');
  let T = +bk.dataset.temp || BK_AMB;
  const passo = () => {
    const i = (+bk.dataset.int || 55) / 100;
    const alvo = bicoAlvo(bk);
    /* chama mais forte também aquece mais depressa */
    const taxa = bk.classList.contains('aceso') ? 0.006 + 0.013 * i : 0.011;
    T += (alvo - T) * taxa;
    if (Math.abs(alvo - T) < 0.6) T = alvo;
    bk.dataset.temp = T.toFixed(1);
    if (num) num.textContent = Math.round(T) + ' °C';
    if (merc) merc.style.height =
      ((T - BK_AMB) / (BK_MAX - BK_AMB) * 100).toFixed(1) + '%';
    bk.classList.toggle('derreteu', T >= FUSAO_NACL);
    /* em tempo real: o que acontece na cápsula acontece no retículo */
    G3.agita = Math.max(0, Math.min(1, (T - BK_AMB) / (FUSAO_NACL - BK_AMB)));
    G3.fundeAlvo = T >= FUSAO_NACL ? 1 : 0;
    bk._t = (T === alvo) ? 0 : requestAnimationFrame(passo);
  };
  passo();
}

/* Virar a face troca de assunto, e cada assunto pede o retículo inteiro.
   Se o sal ficou derretido na face anterior, o próximo golpe na pedra
   não teria o que clivar: uma poça não tem planos. Então a face que sai
   leva o fogo consigo — a chama se apaga com a animação de sempre, a
   cápsula esfria, e o retículo volta na hora, pronto para a interação
   seguinte. */
function esfriaBico(slide){
  const bk = slide && slide.querySelector('.bk');
  if (!bk) return;
  const estava = bk.classList.contains('aceso') || (+bk.dataset.temp || BK_AMB) > BK_AMB + 1;
  bk.classList.remove('aceso', 'derreteu');
  if (bk._t){ cancelAnimationFrame(bk._t); bk._t = 0; }
  bk.dataset.temp = BK_AMB;
  const num = bk.querySelector('.bk-num'), merc = bk.querySelector('.bk-merc');
  if (num) num.textContent = BK_AMB + ' °C';
  if (merc) merc.style.height = '0%';
  if (!estava) return;
  /* o retículo não espera os 3,3s do resfriamento: ele reassume inteiro */
  G3.agita = 0; G3.funde = 0; G3.fundeAlvo = 0;
}

function bicoLiga(bk){
  if (!bk) return;
  bk.classList.toggle('aceso');            /* o botão acende em verde sozinho */
  bicoIntensidade(bk);
  bicoAnda(bk);
}

/* a chama cresce com a barra: de um terço da altura até o dobro */
function bicoIntensidade(bk){
  const r = bk.querySelector('.bk-rng');
  const i = r ? +r.value : 55;
  bk.dataset.int = i;
  bk.style.setProperty('--ch', (0.35 + 1.15 * (i / 100)).toFixed(2));
  if (bk.classList.contains('aceso')) bicoAnda(bk);
}

/* ------------------------------------------------------------
   O ELÉTRON QUE SE ENTREGA
   Nos exemplos em que o átomo GANHA elétrons, segurar o dedo no vazio
   faz nascer um elétron. Arrastando-o até a bola, ele entra: a bola
   pisca e a distribuição se refaz na hora, com o subnível e a conta do
   nível já atualizados.
   ------------------------------------------------------------ */
let segurandoE = null;

function criaEletron(slide, x, y){
  const el = document.createElement('i');
  el.className = 'eletron';
  el.style.left = x.toFixed(0) + 'px';
  el.style.top  = y.toFixed(0) + 'px';
  el.innerHTML = '<b></b><s></s>';
  slide.appendChild(el);
  return el;
}
/* deixa uma faísca no ponto por onde o elétron acabou de passar */
function faisca(slide, x, y, v){
  const t = document.createElement('i');
  t.className = 'rastro-e';
  t.style.setProperty('--s', (8 + Math.min(12, v * 0.5)).toFixed(0) + 'px');
  t.style.left = x.toFixed(0) + 'px';
  t.style.top  = y.toFixed(0) + 'px';
  slide.appendChild(t);
  setTimeout(() => t.remove(), 480);
}

/* o corpo do átomo: a esfera no slide 7, o símbolo no slide 8 */
const bolaDo = (at) => at &&
  at.querySelector(at.dataset.eatom === 'lewis' ? '.lw' : '.gas-ball');
function centroBola(at){
  const b = bolaDo(at);
  if (!b) return null;
  const r = b.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (r.left + r.width / 2 - st.left) / k,
           y: (r.top  + r.height / 2 - st.top)  / k };
}
/* estilhaços em roda, para a carga não sumir sem deixar nada */
function dissipa(slide, x, y){
  for (let i = 0; i < 7; i++){
    const a = (i / 7) * Math.PI * 2;
    faisca(slide, x + Math.cos(a) * 13, y + Math.sin(a) * 13, 16);
  }
}
/* Alvo da entrega: o átomo INTEIRO — a bola e a distribuição ao lado.
   Só a bola era um alvo pequeno demais, e o elétron se perdia a cada
   solta um pouco fora. O mergulho continua sendo até o centro da bola. */
function sobreAtomo(at, e){
  if (!at) return false;
  const r = at.getBoundingClientRect(), m = 14;
  return e.clientX >= r.left - m && e.clientX <= r.right  + m
      && e.clientY >= r.top  - m && e.clientY <= r.bottom + m;
}

/* O átomo treme enquanto não fecha o octeto, e o tremor afrouxa quando
   falta pouco. Ao acertar, para de tremer e comemora. */
function marcaEstado(at){
  /* no Lewis quem recebe as classes é a área do desenho */
  const alvo = at.dataset.eatom === 'lewis'
    ? (at.querySelector('.lw-stage') || at) : at;
  const falta = faltaPara(at);
  alvo.classList.remove('inst1', 'inst2', 'inst3', 'inst4', 'certo');
  if (!falta) alvo.classList.add('certo');
  /* um elétron de distância já agita; quatro ou mais é o grau máximo */
  else alvo.classList.add('inst' + Math.min(4, falta));
  poeCarga(at);
}

/* A carga acompanha o gesto: sai do zero no instante em que o elétron se
   destaca da bola e volta ao zero se ele for devolvido. É esse vaivém
   que liga "arranquei um elétron" a "virou cátion" — se a carga só
   aparecesse no fim, a conta ficaria sendo um resultado, e não uma
   consequência do que a mão fez.
   Roda dentro de marcaEstado porque mudaEletrons reescreve o innerHTML
   do átomo a cada elétron: o selo precisa ser refeito junto. */
function poeCarga(at){
  const casa = at.dataset.eatom === 'lewis'
    ? at.querySelector('.lw')                /* o símbolo, não a moldura */
    : at.querySelector('.gas-ball');
  if (!casa) return;
  const t = textoCarga(+at.dataset.delta || 0);
  let selo = casa.querySelector(':scope > .carga');
  if (!t){ if (selo) selo.remove(); return; }
  if (!selo){
    selo = document.createElement('s');
    selo.className = 'carga';
    casa.appendChild(selo);
  }
  /* só reanima quando o número muda de verdade */
  if (selo.textContent !== t){
    selo.textContent = t;
    selo.classList.toggle('neg', t.endsWith('−'));
    selo.classList.remove('bate');
    void selo.offsetWidth;
    selo.classList.add('bate');
  }
}

/* a onda que confirma o elétron entrando na bola */
function ondaNaBola(at){
  const b = bolaDo(at), slide = at.closest('.slide');
  if (!b || !slide) return;
  const r = b.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const o = document.createElement('i');
  o.className = 'onda-e';
  o.style.left = ((r.left + r.width / 2 - st.left) / k).toFixed(0) + 'px';
  o.style.top  = ((r.top  + r.height / 2 - st.top)  / k).toFixed(0) + 'px';
  slide.appendChild(o);
  setTimeout(() => o.remove(), 700);
}

/* Refaz o átomo com o novo saldo de elétrons e diz se ele chegou lá. */
function mudaEletrons(at, d){
  const slide = at.closest('.slide');
  const antes = noAlvo(at, +at.dataset.delta || 0);
  at.dataset.delta = d;
  if (at.dataset.eatom === 'lewis'){
    const alvoLw = at.querySelector('.lw-stage') || at;
    alvoLw.innerHTML = LEWIS(at.dataset.sim, (+at.dataset.val || 0) + d, d > 0);
    /* A ficha de baixo acompanha o gesto: arrancar ou devolver um elétron
       reescreve a distribuição na hora, e é ali que se VÊ a camada de
       valência esvaziando ou completando — o que no símbolo de Lewis é
       um ponto que some, na distribuição é o expoente mudando. */
    const cfg = slide && slide.querySelector('.reveal-item[data-id="cfg8"]');
    if (cfg && cfg.dataset.sim && !cfg.hidden){
      cfg.innerHTML = GAS(cfg.dataset.sim, { conta: true, sodist: true, delta: d });
      const uc = cfg.querySelectorAll('.gas-dist .cam');
      if (uc.length) uc[uc.length - 1].classList.add('mudou');
    }
  } else {
    at.innerHTML = GAS(at.dataset.sim, { dentro: true, conta: true, delta: d });
  }
  const bola = bolaDo(at);
  if (bola){ void bola.offsetWidth; bola.classList.add('recebe'); }
  const cams = at.querySelectorAll('.gas-dist .cam');
  const u = cams[cams.length - 1];
  if (u) u.classList.add('mudou');

  marcaEstado(at);
  const certo = noAlvo(at, d);
  if (slide) slide.classList.toggle('acertou', certo);
  /* a festa é só na chegada, não a cada elétron depois dela */
  if (certo && !antes && slide){
    const p = noPalco(at);
    confete(slide, p.x, p.y);
  }
}

deck.addEventListener('pointerdown', (e) => {
  const slide = e.target.closest('.slide');
  if (!slide || segurandoE) return;
  const at = slide.querySelector('.reveal-item[data-eatom]');
  if (!at || at.dataset.alvo === undefined || at.hidden) return;

  /* dedo na bola: puxar arranca um elétron de dentro dela */
  if (e.target.closest('.reveal-item[data-eatom] .gas-ball, .reveal-item[data-eatom] .lw')){
    segurandoE = { id: e.pointerId, slide, at, modo: 'tira', el: null,
                   x: e.clientX, y: e.clientY };
    e.preventDefault();
    return;
  }
  /* SEGURAR faz nascer um elétron. Antes isso só valia no vazio, e neste
     slide o vazio é uma faixa estreita entre o cubo, o átomo e o gás
     nobre — daí a sensação de que o gesto falhava. Agora vale em quase
     toda a tela: fora só o que tem função própria no toque. */
  /* o átomo é o destino, então não é lugar de fazer nascer elétron:
     se fosse, soltar sem sair do lugar já o entregaria sem querer */
  if (e.target.closest('.tp,'
                     + ' .reveal-item[data-eatom],'
                     + ' .reveal-item[data-id="vizinho"], .reveal-item.cube,'
                     + ' .q-board, button')) return;
  if ((+at.dataset.delta || 0) >= MAX_E) return;        /* no teto de entrada */
  const p = pontoPalco(e);
  segurandoE = { id: e.pointerId, slide, at, modo: 'traz', el: null,
                 x: e.clientX, y: e.clientY, px: p.x, py: p.y };
  segurandoE.t = setTimeout(() => {
    const g = segurandoE;
    /* nasce onde o dedo está agora, não onde ele encostou */
    if (g && g.modo === 'traz' && !g.el) g.el = criaEletron(g.slide, g.px, g.py);
  }, 260);
  /* com a captura, o arrasto chega até nós mesmo passando por cima de
     outros elementos */
  if (e.target.setPointerCapture){
    try { e.target.setPointerCapture(e.pointerId); } catch (_){}
  }
  e.preventDefault();
});

document.addEventListener('pointermove', (e) => {
  if (!segurandoE || e.pointerId !== segurandoE.id) return;
  const g = segurandoE, p = pontoPalco(e);
  if (g.modo === 'traz' && !g.el){
    /* o dedo treme; só um movimento claro desiste do elétron */
    g.px = p.x; g.py = p.y;
    if (Math.hypot(e.clientX - g.x, e.clientY - g.y) > 24){
      clearTimeout(g.t); segurandoE = null;
    }
    return;
  }
  if (g.modo === 'tira' && !g.el){
    /* o elétron só se destaca depois de um puxão; aí a conta já muda */
    if (Math.hypot(e.clientX - g.x, e.clientY - g.y) < 18) return;
    /* no fundo do poço: não sai mais nada, e o puxão deixa de ser gesto */
    const dd = +g.at.dataset.delta || 0;
    const vazio = g.at.dataset.eatom === 'lewis'
      && (+g.at.dataset.val || 0) + dd - 1 < 0;
    if (dd - 1 < -MAX_E || vazio){ g.modo = 'nada'; return; }
    const c = centroBola(g.at);
    g.el = criaEletron(g.slide, c.x, c.y);
    mudaEletrons(g.at, (+g.at.dataset.delta || 0) - 1);
    g.tirou = true;
  }
  if (!g.el) return;
  /* a faísca fica onde ele estava, não onde ele está: é isso que dá
     a sensação de esteira em vez de um borrão em volta */
  if (g.lx !== undefined){
    const v = Math.hypot(p.x - g.lx, p.y - g.ly);
    if (v > 6){ faisca(g.slide, g.lx, g.ly, v); g.lx = p.x; g.ly = p.y; }
  } else { g.lx = p.x; g.ly = p.y; }
  g.el.style.left = p.x.toFixed(0) + 'px';
  g.el.style.top  = p.y.toFixed(0) + 'px';
});

function soltaEletron(e){
  if (!segurandoE || (e && e.pointerId !== segurandoE.id)) return;
  const g = segurandoE;
  segurandoE = null;
  clearTimeout(g.t);
  if (!g.el){
    /* Clique seco na bola, sem puxar nada: mostra ou esconde a
       distribuição. Puxar é o outro gesto, e ele já teria criado o
       elétron a esta altura. */
    if (g.modo === 'tira'){
      g.at.classList.toggle('aberto');
      /* No slide da tabela, o toque seco no símbolo de Lewis é o que
         chama a configuração eletrônica do elemento — e o toque seguinte
         a recolhe. É o símbolo com os elétrons de valência que manda
         nela: ele é o elemento, ali na tela. */
      if (g.at.dataset.eatom === 'lewis' && g.at.dataset.sim){
        const cfg = g.slide.querySelector('.reveal-item[data-id="cfg8"]');
        if (cfg && cfg.hidden){
          /* abre já com o saldo que o átomo tem AGORA: se elétrons foram
             mexidos com a ficha fechada, ela não pode nascer desatualizada */
          cfg.innerHTML = GAS(cfg.dataset.sim || g.at.dataset.sim,
            { conta: true, sodist: true, delta: +g.at.dataset.delta || 0 });
          revealItem(g.slide, cfg);
        } else if (cfg) retractItem(cfg);
      }
    }
    return;
  }
  const d = +g.at.dataset.delta || 0;
  /* além do limite do sandbox, o desenho de Lewis só comporta 8 */
  const cabe = d + 1 <= MAX_E
    && (g.at.dataset.eatom !== 'lewis' || (+g.at.dataset.val || 0) + d + 1 <= 8);
  const naBola = e && sobreAtomo(g.at, e) && cabe;
  if (naBola && (g.modo === 'traz' || g.tirou)){
    ondaNaBola(g.at);                      /* o estouro da incorporação */
    mudaEletrons(g.at, d + 1);
  }
  if (naBola){
    /* mede o caminho que falta até o centro, para ele mergulhar lá */
    const c = centroBola(g.at);
    if (c){
      g.el.style.setProperty('--tx',
        (c.x - parseFloat(g.el.style.left)).toFixed(0) + 'px');
      g.el.style.setProperty('--ty',
        (c.y - parseFloat(g.el.style.top)).toFixed(0) + 'px');
    }
    g.el.classList.add('entra');
  } else {
    dissipa(g.slide, parseFloat(g.el.style.left), parseFloat(g.el.style.top));
    g.el.classList.add('some');
  }
  setTimeout(() => g.el.remove(), 460);
}
document.addEventListener('pointerup', soltaEletron);
document.addEventListener('pointercancel', soltaEletron);


/* ------------------------------------------------------------
   MUNDOS QUÂNTICOS CONFINADOS
   Cada caixa tem o seu, dentro do próprio retângulo e independente do
   outro. O da esquerda é a rede 3D; o da direita, as moléculas soltas.
   A cena 3D é desenhada no palco inteiro, como sempre, e recortada ao
   retângulo da caixa — assim toda a matemática de projeção, arrasto e
   célula continua valendo sem mudar uma linha.
   ------------------------------------------------------------ */
const SAIDA_PN = 44;              /* faixa de baixo, reservada ao botão */

function retanguloPainel(pn){
  const r = pn.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const x0 = (r.left - st.left) / k, y0 = (r.top - st.top) / k;
  return { x0, y0, x1: x0 + r.width / k, y1: y0 + r.height / k - SAIDA_PN };
}

/* O retículo que faz parte do slide: nasce junto com o elemento e fica.
   Aproveita tudo o que a cena 3D já sabe fazer — girar com um dedo,
   arrastar com dois, pinçar e arrancar a célula unitária. */
/* onde está o vidro da lupa, em coordenadas do palco */
function geoLupa(){
  const v = G3.lupa.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (v.left - st.left) / k + v.width / k / 2,
           y: (v.top  - st.top)  / k + v.height / k / 2,
           r: v.width / k / 2 - 9 };        /* por dentro do aro */
}
/* quanto dura a meia volta da lente — o mesmo da animação lupaGira */
const LUPA_GIRO = 720;

/* Prende o centro da cena e o recorte ao vidro, quadro a quadro.

   O RECORTE ACOMPANHA O GIRO. A lente vira 180°, e o que se vê dela
   estreita com o cosseno do ângulo até sumir de perfil. Fazendo o
   recorte da cena seguir essa mesma conta, o retículo vira JUNTO com o
   vidro, como se estivesse preso nele — e a troca de cristal, feita no
   instante do perfil, não tem como aparecer: naquele quadro não há
   nada desenhado.
   Antes o recorte ficava congelado no círculo cheio enquanto o vidro
   girava, e o retículo continuava à mostra; era preciso apagá-lo com um
   fade, e era o fade que se via — um sumindo, o outro nascendo. */
function segueLupa(){
  if (!G3.lupa || !G3.lupa.isConnected) return;
  /* Girando, a lente não é medida: de perfil o retângulo dela é um
     risco, e medir dali jogaria o centro da cena para o lado. Vale a
     última medida tirada de frente. */
  if (!G3.lupaPara) G3.lupaG = geoLupa();
  const g = G3.lupaG;
  if (!g) return;
  G3.px = g.x; G3.py = g.y;

  let rx = g.r;
  if (G3.giro){
    const u = (performance.now() - G3.giro) / LUPA_GIRO;
    if (u >= 1) G3.giro = 0;
    else rx = g.r * Math.abs(Math.cos(u * Math.PI));
  }
  if (rx < 2) rx = 0;                       /* de perfil, não se vê nada */

  const clip = `ellipse(${rx.toFixed(0)}px ${g.r.toFixed(0)}px at `
             + `${g.x.toFixed(0)}px ${g.y.toFixed(0)}px)`;
  if (G3.lupaCv && clip !== G3.lupaClip){
    G3.lupaCv.style.clipPath = clip;        /* só escreve quando muda */
    G3.lupaClip = clip;
  }
}

/* Aqui a cena NÃO é recortada: o retângulo do elemento só diz onde e de
   que tamanho o retículo nasce. Recortando, ele ficava preso dentro de
   uma caixa invisível e sumia nas bordas ao ser girado ou afastado. */
function abreReticulo(it){
  const slide = it.closest('.slide');
  const cv = slide && slide.querySelector('.q3d');
  if (!cv) return;
  const r = it.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const x0 = (r.left - st.left) / k, y0 = (r.top - st.top) / k;
  const x1 = x0 + r.width / k,       y1 = y0 + r.height / k;
  if (it.dataset.lupa){
    /* Dentro da lupa a cena é recortada no vidro — é o que faz parecer
       que olhamos através dela. A lupa vira a dona da cena: o laço
       recoloca o recorte e o centro nela a cada quadro, então o retículo
       a acompanha em vez de ficar parado onde ela estava. */
    const vidro = it.querySelector('.lupa-vidro');
    G3.lupa = vidro; G3.lupaCv = cv; G3.lupaClip = '';
    const g = geoLupa();
    slide.classList.add('quantum-on');
    abreRede(it, it.dataset.rede || 'nacl', g.x, g.y, g.r * 1.6, g.r * 1.6);
    segueLupa();
  } else {
    cv.style.clipPath = '';
    slide.classList.add('quantum-on', 'rede-livre');
    abreRede(it, it.dataset.rede || 'nacl', (x0 + x1) / 2, (y0 + y1) / 2,
             (x1 - x0) * 0.9, (y1 - y0) * 0.9);
  }
  /* Montar a cena zera o estado, mas a pedra do cubo pode já estar
     partida: quem sai do slide e volta tem de reencontrar o retículo no
     mesmo estado em que deixou a pedra. Aqui ele reassume, sem animar. */
  const pd = slide.querySelector('.pd');
  if (pd){ G3.clivaAlvo = +pd.dataset.e || 0; G3.cliva = G3.clivaAlvo; }

  /* ENQUADRAMENTO AFINADO NA TELA, trazido de volta pelo painel C.

     Na lupa, porém, só os ÂNGULOS são livres. O centro é da lente —
     segueLupa o reescreve a cada quadro para a rede acompanhar o vidro —
     e a distância é calculada por enquadraRede para a rede caber dentro
     dele. Aceitar as três coisas do painel fazia a câmera ir para uma
     distância medida noutro momento, e a rede sumia da lente.
     No retículo solto, que não tem lente para obedecer, vale tudo. */
  const cam = it.dataset.cam && it.dataset.cam.split(',').map(Number);
  if (cam && cam.length === 5 && cam.every(v => !isNaN(v))){
    G3.az = cam[3]; G3.el = cam[4];
    if (!it.dataset.lupa){
      G3.px = cam[0]; G3.py = cam[1]; G3.dist = cam[2];
      G3.px0 = G3.px; G3.py0 = G3.py; G3.dist0 = G3.dist;
      G3.voo = 0;                          /* já chega no lugar */
    }
  }
}

function abrePainel(pn){
  const slide = pn.closest('.slide');
  if (!slide || pn.classList.contains('q-on')) return;
  pn.classList.add('q-on');
  slide.classList.add('quantum-on');
  if (pn.dataset.rede){
    const cv = slide.querySelector('.q3d');
    const r  = retanguloPainel(pn);
    if (cv) cv.style.clipPath =
      `inset(${r.y0.toFixed(0)}px ${(1280 - r.x1).toFixed(0)}px `
      + `${(720 - r.y1).toFixed(0)}px ${r.x0.toFixed(0)}px)`;
    abreRede(pn, pn.dataset.rede, (r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2,
             (r.x1 - r.x0) * 0.86, (r.y1 - r.y0) * 0.86);
  }
}

function fechaPainel(pn){
  const slide = pn.closest('.slide');
  if (!slide) return;
  pn.classList.remove('q-on');
  if (pn.dataset.rede){
    const cv = slide.querySelector('.q3d');
    fechaRede(slide);
    if (cv) cv.style.clipPath = '';
  }
  /* o outro mundo pode continuar aberto: a classe do slide segue ele */
  if (slide.querySelector('.pn.q-on')) slide.classList.add('quantum-on');
  else slide.classList.remove('quantum-on');
}

/* centro de um elemento em coordenadas do palco */
function noPalco(el){
  const a = stage.getBoundingClientRect(), b = el.getBoundingClientRect();
  const k = fitScale || 1;
  return { x: (b.left + b.width / 2 - a.left) / k,
           y: (b.top  + b.height / 2 - a.top) / k };
}

/* Largou o subnível: longe o bastante, ele se vai e a camada de baixo
   assume como valência; perto, volta para o lugar. */
function largaSubnivel(cam){
  const d = Math.hypot(parseFloat(cam.style.left) || 0,
                       parseFloat(cam.style.top)  || 0);
  const item = cam.closest('.reveal-item');
  if (d < 60){
    cam.classList.add('voltando');
    cam.style.left = '0px'; cam.style.top = '0px';
    setTimeout(() => cam.classList.remove('voltando'), 400);
    return;
  }
  const p = noPalco(cam);
  cam.classList.add('indo');
  setTimeout(() => {
    cam.classList.remove('indo');
    cam.style.left = '0px'; cam.style.top = '0px';
    if (!item) return;
    item.classList.add('doado');
    /* a que passou a ser a última fica clicável, mas ainda sem destaque */
    const cams = [...item.querySelectorAll('.gas-dist .cam')];
    const nova = cams[cams.length - 2];
    if (nova) nova.classList.add('valencia');
    const slide = item.closest('.slide');
    if (slide){
      slide.classList.add('acertou');       /* as duas configurações se igualam */
      confete(slide, p.x, p.y);
    }
  }, 420);
}

/* estados que um item de ação liga no slide, e desliga ao voltar */
function aplicaAcao(slide, nome, ligar){
  if (!slide || !nome) return;
  if (nome === 'octeto'){
    slide.classList.toggle('octeto', ligar);
    return;
  }
  /* dist:He -> desenrola a distribuição daquele gás. O toque na esfera
     continua valendo; isto só põe o mesmo gesto na sequência de cliques. */
  if (nome.indexOf('dist:') === 0){
    const g = slide.querySelector(`.reveal-item.gas[data-sim="${nome.slice(5)}"]`);
    if (g) g.classList.toggle('aberto', ligar);
  }
}

/* DE ONDE O ELEMENTO VEM.
   Do lado da tela para onde ele vai: o que assenta à esquerda entra pela
   esquerda, o que assenta no alto desce de cima, o que fica na quina
   chega pela diagonal daquela quina. A direção é a do vetor que sai do
   centro do palco e passa pelo lugar final — assim o voo aponta para o
   destino em vez de cruzar a tela vindo de um canto fixo.
   Quem for parar bem no meio não tem direção: esse desce de cima. */
/* TEXTO É EXCEÇÃO: vem sempre da esquerda.
   Uma frase se lê da esquerda para a direita, e vê-la chegar nesse
   sentido é começar a ler antes de ela parar. Entrando pela direita, ela
   viajaria contra a própria leitura. Só os objetos — figuras, copos,
   cubos, recipientes — é que vêm do lado do destino. */
const ehTexto = (it) => !!it.querySelector(':scope > .txt');

function origemDeFora(x, y){
  let dx = x - 640, dy = y - 360;
  const n = Math.hypot(dx, dy);
  if (n < 1){ dx = 0; dy = -1; }
  const u = Math.hypot(dx, dy);
  const ux = dx / u, uy = dy / u;
  /* onde essa direção corta a borda do palco, e 300px além dela */
  const borda = Math.min(ux ? 640 / Math.abs(ux) : Infinity,
                         uy ? 360 / Math.abs(uy) : Infinity);
  const d = borda + 300;
  return { x: 640 + ux * d, y: 360 + uy * d };
}

/* solta um elemento: ele nasce de dentro do pai, ou vem de fora da tela */
function revealItem(slide, it){
  /* CARROSSEL: este item toma o lugar de outro. O que sai gira e se vai
     no mesmo instante em que este chega, e não um depois do outro — é a
     troca que se quer ver, não duas animações em fila. */
  if (it.dataset.sai) giraFora(slide, it.dataset.sai);
  const pai = parentOf(slide, it);
  let ox, oy, arco = null;

  /* "saiDe": o voo começa de dentro de outra coisa da tela, apontada por
     um seletor. A posição é medida na hora, e não escrita à mão, porque
     a coisa pode estar dentro de um cubo girado — onde nenhuma conta de
     papel acerta, mas o retângulo que o navegador desenha acerta sempre. */
  if (it.dataset.saide){
    const alvo = slide.querySelector(it.dataset.saide);
    if (alvo) arco = noPalco(alvo);
  }

  if (arco){
    ox = arco.x; oy = arco.y;
  }
  /* "entra": lado escolhido à mão, para quando o percurso importa mais
     que a direção do destino. Ganha de tudo. */
  else if (it.dataset.entra){
    const lado = it.dataset.entra;
    const fora = 420;                      /* bem além da borda: vem de fora mesmo */
    ox = lado === 'dir'   ? 1280 + fora
       : lado === 'esq'   ? -fora : parseFloat(it.style.left);
    oy = lado === 'baixo' ? 720 + fora
       : lado === 'cima'  ? -fora : parseFloat(it.style.top);
  }
  /* "esq": vem de fora mesmo nascendo de outro elemento — é o que faz
     uma lista inteira entrar item a item, e não um de dentro do outro */
  else if (pai && !pai.hidden && it.dataset.esq === undefined){
    ox = parseFloat(pai.style.left);
    oy = parseFloat(pai.style.top);
    /* o filho acompanha o pai: guarda o afastamento planejado entre os dois */
    it.style.left = (ox + (+it.dataset.x - +pai.dataset.x)) + 'px';
    it.style.top  = (oy + (+it.dataset.y - +pai.dataset.y)) + 'px';
    pai.classList.remove('emitting');
    void pai.offsetWidth;
    pai.classList.add('emitting');
  } else if (ehTexto(it)){
    /* frase: entra pela esquerda, na altura em que vai parar */
    ox = -300;
    oy = parseFloat(it.style.top);
  } else {
    /* objeto: de fora da tela, pelo lado do destino */
    const o = origemDeFora(parseFloat(it.style.left), parseFloat(it.style.top));
    ox = o.x; oy = o.y;
  }

  it.hidden = false;
  const fx = parseFloat(it.style.left), fy = parseFloat(it.style.top);
  it.style.setProperty('--dx', (ox - fx) + 'px');
  it.style.setProperty('--dy', (oy - fy) + 'px');

  /* O ALTO DO ARCO.
     Fica no meio do caminho, erguido acima da reta que ligaria saída e
     chegada. A altura acompanha a distância — voo curto, arco curto —,
     com um mínimo para que mesmo um pulo pequeno tenha curva visível. */
  const curva = arco && !it.dataset.reto;
  it.classList.toggle('arco', !!curva);
  it.classList.toggle('direto', !!(arco && it.dataset.reto));
  if (curva){
    const dist = Math.hypot(fx - ox, fy - oy);
    const alto = Math.max(120, dist * 0.34);
    it.style.setProperty('--mx', ((ox + fx) / 2 - fx).toFixed(1) + 'px');
    it.style.setProperty('--my', ((oy + fy) / 2 - fy - alto).toFixed(1) + 'px');
  }

  it.classList.remove('pop', 'retract');   /* cancela um recolhimento em curso */
  void it.offsetWidth;                     /* reinicia a animação de entrada */
  it.classList.add('pop');
  it.querySelectorAll('.cx-corpo[data-txt]').forEach(digita);
  /* o retículo do slide sobe assim que o elemento entra */
  /* espera a lupa terminar de voar: enquadrar no meio do caminho deixaria
     a cena parada no lugar por onde ela passou */
  /* A lupa só é medida depois de POUSAR. enquadraRede tira a distância
     do tamanho do vidro na tela, e medir com o voo ainda em curso daria
     uma lente menor do que a que ficará ali — daí o retículo se acertar
     num salto quando a animação acabasse. O arco dura 950ms. */
  if (it.classList.contains('reticulo'))
    setTimeout(() => abreReticulo(it),
      arco ? 990 : it.dataset.lupa ? 680 : 60);
  aplicaAcao(slide, it.dataset.acao, true);
  syncReveals(slide);

  /* o seguinte marcado como "follow" sai sozinho; com atraso 0, sai junto */
  const list = itemsOf(slide);
  const nxt = list[list.indexOf(it) + 1];
  if (nxt && nxt.dataset.follow !== undefined && nxt.hidden){
    const espera = +nxt.dataset.follow;
    if (espera > 0){
      setTimeout(() => {
        if (nxt.hidden && !it.hidden) revealItem(slide, nxt);
      }, espera);
    } else {
      revealItem(slide, nxt);              /* mesmo instante, mesma animação */
    }
  }
}
