<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ligações Químicas — Prof. Amauri Junior</title>
<!-- app instalável: ícone na tela inicial e funcionamento sem rede -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1F32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETA — 3 cores do tema
   azul-petróleo (fundo) · turquesa (estrutura) · âmbar (destaque)
   ============================================================ */
:root{
  --ink:        #0B1F32;
  --ink-deep:   #071626;
  --ink-soft:   #12314B;
  --aqua:       #45C7B0;
  --aqua-dim:   rgba(69,199,176,.28);
  --amber:      #F0B44A;
  --paper:      #E8F1F5;
  --paper-dim:  rgba(232,241,245,.62);

  /* tempos e curvas das transicoes */
  --t-cube:  .86s;
  --e-cube:  cubic-bezier(.62,.03,.31,1);
  --t-desl:  .62s;
  --e-desl:  cubic-bezier(.32,.72,.24,1);

  --display: 'Space Grotesk', system-ui, sans-serif;
  --body:    'IBM Plex Sans', system-ui, sans-serif;
  --mono:    'IBM Plex Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink-deep)}
body{
  font-family:var(--body);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:pan-y;
}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

/* ---------- palco 16:9 que escala pra qualquer tela ---------- */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{
  position:absolute;top:50%;left:50%;
  width:1280px;height:720px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(var(--fit,1));
  perspective:1500px;perspective-origin:50% 50%;
  background:var(--ink);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  overflow:hidden;
  /* Dentro do palco quem manda nos gestos é o app. Sem isto, o palco
     herda o pan-y do body e o navegador rouba qualquer arrasto com
     componente vertical que comece no fundo do slide — era o que
     cancelava o elétron no meio do caminho. Não há o que rolar aqui:
     o deslize que trocava de slide foi removido faz tempo. */
  touch-action:none;
}

/* papel milimetrado de laboratório */
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(69,199,176,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(69,199,176,.055) 1px,transparent 1px);
  background-size:40px 40px;
}
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 78% 12%,rgba(69,199,176,.10),transparent 55%),
             radial-gradient(90% 80% at 8% 100%,rgba(240,180,74,.07),transparent 60%);
}

/* barra de progresso da apresentação */
#progress{position:absolute;top:0;left:0;height:3px;background:var(--amber);z-index:6;
  width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- slides ---------- */
/* o deck e o volume 3D onde as faces do cubo giram */
#deck{position:absolute;inset:0;z-index:1;transform-style:preserve-3d}
.slide{
  position:absolute;inset:0;
  padding:58px 88px 60px;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  backface-visibility:hidden;
}
.slide.is-active {opacity:1;visibility:visible;z-index:3}
.slide.is-leaving{opacity:1;visibility:visible;z-index:2}
/* veu que escurece a face do cubo conforme ela vira de lado */
.slide::after{content:'';position:absolute;inset:0;z-index:9;pointer-events:none;
  background:#030C16;opacity:0}

/* ===== slide 1 <-> 2: cubo girando ===== */
.fx-cube-in-next {animation:cubeInNext  var(--t-cube) var(--e-cube) both}
.fx-cube-out-next{animation:cubeOutNext var(--t-cube) var(--e-cube) both}
.fx-cube-in-prev {animation:cubeInPrev  var(--t-cube) var(--e-cube) both}
.fx-cube-out-prev{animation:cubeOutPrev var(--t-cube) var(--e-cube) both}
.fx-cube-in-next::after,.fx-cube-in-prev::after {animation:faceLit  var(--t-cube) var(--e-cube) both}
.fx-cube-out-next::after,.fx-cube-out-prev::after{animation:faceDark var(--t-cube) var(--e-cube) both}

@keyframes cubeInNext{
  from{transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutNext{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
}
@keyframes cubeInPrev{
  from{transform:translateZ(-640px) rotateY(-90deg) translateZ(640px)}
  to  {transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
}
@keyframes cubeOutPrev{
  from{transform:translateZ(0)      rotateY(0deg)   translateZ(0)}
  to  {transform:translateZ(-640px) rotateY(90deg)  translateZ(640px)}
}
@keyframes faceLit {from{opacity:.66} to{opacity:0}}
@keyframes faceDark{from{opacity:0}   to{opacity:.66}}

/* ===== do slide 2 em diante: deslize com profundidade =====
   O que sai recua e escurece, como uma carta empurrada para trás;
   o que entra vem por cima, inteiro. É a diferença de percurso entre
   os dois — 102% contra 34% — que produz a sensação de camadas. */
.fx-desl-in-next {animation:deslEntraNext var(--t-desl) var(--e-desl) both}
.fx-desl-out-next{animation:deslSaiNext   var(--t-desl) var(--e-desl) both}
.fx-desl-in-prev {animation:deslEntraPrev var(--t-desl) var(--e-desl) both}
.fx-desl-out-prev{animation:deslSaiPrev   var(--t-desl) var(--e-desl) both}

/* Empurrão: os dois andam o mesmo tanto e ficam colados, sem vão.
   Avançando, o novo entra pela esquerda e empurra o antigo para fora
   pela direita. Voltando, o caminho é o mesmo ao contrário. */
@keyframes deslEntraNext{
  from{transform:translateX(-100%)}
  to  {transform:translateX(0)}
}
@keyframes deslSaiNext{
  from{transform:translateX(0)}
  to  {transform:translateX(100%)}
}
@keyframes deslEntraPrev{
  from{transform:translateX(100%)}
  to  {transform:translateX(0)}
}
@keyframes deslSaiPrev{
  from{transform:translateX(0)}
  to  {transform:translateX(-100%)}
}

/* ===== camada de efeitos (guardada; o deslize não a usa) ===== */
#fx{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#fx span{position:absolute;opacity:0}
#fx .flash{inset:0;mix-blend-mode:screen;
  background:radial-gradient(62% 62% at 50% 50%,rgba(232,241,245,.5),rgba(69,199,176,.2) 46%,transparent 74%)}
#fx .sweep{top:-22%;bottom:-22%;left:0;width:34%;mix-blend-mode:screen;filter:blur(2px);
  transform:translateX(-170%) skewX(-16deg);
  background:linear-gradient(90deg,transparent,rgba(69,199,176,.12),rgba(232,241,245,.6),rgba(240,180,74,.3),transparent)}
#fx .scan{inset:0;mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg,rgba(69,199,176,.16) 0 1px,transparent 1px 5px)}
#fx .ring{left:50%;top:50%;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;
  border:2px solid rgba(69,199,176,.7);
  box-shadow:0 0 34px rgba(69,199,176,.45),inset 0 0 34px rgba(69,199,176,.22)}

#fx.run .flash{animation:fxFlash .5s  ease-out both}
#fx.run .sweep{animation:fxSweep .82s cubic-bezier(.3,0,.2,1) both}
#fx.run .scan {animation:fxScan  .68s ease-out both}
#fx.run .ring {animation:fxRing  .88s cubic-bezier(.15,.72,.24,1) both}

@keyframes fxFlash{0%{opacity:0}16%{opacity:.8}100%{opacity:0}}
@keyframes fxSweep{
  0%  {opacity:0;transform:translateX(-170%) skewX(-16deg)}
  12% {opacity:1}
  100%{opacity:0;transform:translateX(430%) skewX(-16deg)}
}
@keyframes fxScan{0%{opacity:0;transform:translateY(-6%)}20%{opacity:.5}100%{opacity:0;transform:translateY(6%)}}
@keyframes fxRing{0%{opacity:0;transform:scale(.18)}22%{opacity:.9}100%{opacity:0;transform:scale(3.3)}}

/* ficha do elemento = número do slide (o slide 3 é o Li, e por aí vai) */
.elem{
  position:absolute;top:42px;right:64px;
  width:88px;height:88px;border:1px solid rgba(69,199,176,.4);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  font-family:var(--mono);background:rgba(11,31,50,.5);
}
.elem b{font-size:30px;font-weight:500;color:var(--aqua);line-height:1;letter-spacing:.5px}
.elem span{position:absolute;top:8px;left:10px;font-size:12px;color:var(--paper-dim)}
.elem i{font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--paper-dim);margin-top:7px;text-transform:uppercase}

/* cabeçalho: título + ligação covalente + subtítulo */
.title{
  font-family:var(--display);font-weight:700;font-size:46px;line-height:1.04;
  letter-spacing:-.02em;max-width:22ch;
}
/* título de uma linha: solta a largura e proíbe a quebra */
.title.uma{max-width:none;white-space:nowrap}
/* a assinatura do tema: o traço de ligação com o par de elétrons */
.bond{position:relative;width:168px;height:14px;margin:16px 0 12px;flex:none}
.bond .line{position:absolute;left:0;right:0;height:2px;background:var(--aqua)}
.bond .line.a{top:3px}
.bond .line.b{top:9px;background:var(--aqua-dim)}
.bond .e{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--amber);top:2.5px}
.bond .e.l{left:88px}
.bond .e.r{left:112px}
.slide.is-active .bond .e{animation:pair 3.6s ease-in-out infinite}
.slide.is-active .bond .e.r{animation-delay:-1.8s}
@keyframes pair{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

.subtitle{
  font-size:26px;font-weight:300;color:var(--amber);letter-spacing:.005em;
}

/* área de conteúdo — palco livre para o que formos montando */
.body-area{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:26px;min-height:0}
.body-area.solo{grid-template-columns:1fr}

/* carimbo de versão, discreto no canto inferior esquerdo da tela */
#ver{
  position:fixed;left:14px;bottom:11px;z-index:60;pointer-events:none;user-select:none;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:rgba(232,241,245,.2);
}

/* ---------- camada de revelação: os elementos que saltam ----------
   A caixa "?" foi embora. Ela era a origem do voo de tudo que se
   revelava; agora cada elemento vem de FORA DA TELA, pelo lado para
   onde ele vai — ver origemDeFora(). Quem passa os passos são as setas
   do teclado e as da barra. */

.reveal-item{
  position:absolute;z-index:6;
  /* --ax é a âncora horizontal: -50% centra no x, 0% prende pela esquerda.
     A animação de entrada usa a mesma variável, senão o elemento saltaria
     meia largura no fim do voo. */
  --ax:-50%;
  transform:translate(var(--ax),-50%);
  cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
/* qualquer tipo pode definir o seu próprio display (o gás nobre usa flex);
   escondido tem que vencer todos eles, sempre */
.reveal-item[hidden]{display:none !important}
.reveal-item.dragging{cursor:grabbing}
.reveal-item .txt{
  font-family:var(--display);font-weight:600;line-height:1.12;
  font-size:calc(var(--base) * 1px * var(--k));
  max-width:calc(var(--wch,18) * 1ch);white-space:pre-wrap;
  color:var(--paper);text-shadow:0 6px 26px rgba(3,12,22,.78);
}
.reveal-item.nowrap .txt{           /* respeita exatamente as quebras escritas */
  max-width:none;white-space:pre;
}
.reveal-item .txt sub{font-size:.6em;vertical-align:-.16em;font-weight:500}
/* <em> destaca um trecho dentro da frase, sem virar itálico */
.reveal-item .txt em{font-style:normal;color:var(--amber)}
/* marcador de lista: em em, para acompanhar o tamanho do texto,
   e com recuo, para a segunda linha alinhar com a primeira */
/* numa lista, o que alinha é a esquerda: x passa a ser a borda esquerda */
.reveal-item.bullet{--ax:0%}
.reveal-item.bullet .txt{position:relative;padding-left:1.5em}
.reveal-item.bullet .txt::before{
  content:'';position:absolute;left:.18em;top:.46em;
  width:.42em;height:.42em;border-radius:50%;
  background:var(--aqua);
}
.reveal-item.aqua  .txt{color:var(--aqua)}
.reveal-item.amber .txt{color:var(--amber)}
/* legenda: acompanha o tamanho do objeto na pinça */
/* Numa imagem recortada sobra uma faixa vazia embaixo — a sombra e o
   vazio em volta do recorte — e a legenda nasce longe do desenho.
   --capsobe, em fração da largura, puxa a legenda para junto dele. */
.reveal-item .cap{
  margin-top:calc(11px - var(--base) * var(--capsobe,0) * 1px * var(--k));
  text-align:center;
  font-family:var(--mono);
  font-size:clamp(14px,calc(var(--base) * 1px * var(--k) * .052),26px);
  letter-spacing:.1em;color:var(--paper-dim);
}
/* rótulo em cima do objeto */
.reveal-item .lbl{
  text-align:center;white-space:nowrap;
  font-family:var(--mono);letter-spacing:.16em;
  font-size:clamp(14px,calc(var(--base) * 1px * var(--k) * .085),26px);
  color:var(--aqua);text-shadow:0 4px 18px rgba(3,12,22,.85);
}
/* molécula e copo têm caixa maior que o desenho (por causa da escala),
   então o rótulo e a legenda são ancorados à altura real do objeto */
.reveal-item.molecule{text-align:center}
.reveal-item.molecule .lbl{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,calc(-50% - var(--base) * var(--k) * .423px - 20px));
}
.reveal-item.glass{text-align:center}
.reveal-item.glass .cap{
  position:absolute;left:50%;top:50%;margin-top:0;
  transform:translate(-50%,calc(-50% + var(--base) * var(--k) * .65px + 20px));
}
.reveal-item img{
  display:block;width:calc(var(--base) * 1px * var(--k));height:auto;
  border:1px solid rgba(69,199,176,.3);
  box-shadow:0 0 30px rgba(3,12,22,.55);   /* sem deslocamento: igual dos quatro lados */
}
/* Imagem recortada, que já vem com a própria borda e sombra. Emoldurar
   de novo desenharia um retângulo em volta de um recorte redondo. */
.reveal-item.nua img{border:none;box-shadow:none}
/* --dx/--dy sao calculados no clique: distancia da caixa ate a posicao final */
/* ponto que avisa: ainda há algo guardado dentro desta palavra */
.reveal-item.has-more .txt::after{
  content:'';display:inline-block;
  width:.18em;height:.18em;border-radius:50%;
  background:currentColor;margin-left:.42em;vertical-align:.34em;
  animation:dotPulse 2.4s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:.3}50%{opacity:1}}

/* clarão da palavra no instante em que ela solta a de dentro */
.reveal-item.emitting .txt{animation:txtEmit .55s ease-out}
@keyframes txtEmit{
  0%  {filter:brightness(2.4) drop-shadow(0 0 16px rgba(69,199,176,.85))}
  100%{filter:brightness(1)   drop-shadow(0 0 0 rgba(69,199,176,0))}
}
/* O mesmo clarão quando quem solta é um retrato — Dalton, Ramsey, Lewis.
   Sem ele, o objeto saía de dentro da foto e a foto não dava sinal
   nenhum; é o brilho que amarra uma coisa à outra. Mais contido que o do
   texto: uma foto estourada de brilho fica feia. */
.reveal-item.emitting img{animation:imgEmit .55s ease-out}
@keyframes imgEmit{
  0%  {filter:brightness(1.55) drop-shadow(0 0 22px rgba(69,199,176,.9))}
  100%{filter:brightness(1)    drop-shadow(0 0 0 rgba(69,199,176,0))}
}

/* ---------- a molécula de água ---------- */
.mol-stage{
  position:relative;width:260px;height:220px;
  transform:scale(calc(var(--base) / 260 * var(--k)));
  transform-origin:center center;
}
.mol-bonds{position:absolute;inset:0;width:100%;height:100%}
.mol-atom{
  position:absolute;border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--mono);font-weight:500;letter-spacing:.04em;
}
/* mesma geometria do modelo: 104,5° entre as ligações e os hidrogênios
   entrando 22% no oxigênio, em vez de tangenciá-lo */
.mol-atom.o {width:96px;height:96px;left: 82px;top: 48px;font-size:30px;color:#FFF1EE}
.mol-atom.h1{width:56px;height:56px;left: 55px;top:104px;font-size:19px;color:#16232E}
.mol-atom.h2{width:56px;height:56px;left:149px;top:104px;font-size:19px;color:#16232E}

/* ---------- recipientes com zoom (copo, frascos, bateria, extintor) ---------- */
.z-stage{
  position:relative;width:200px;height:260px;
  transform:scale(calc(var(--base) / 200 * var(--k)));
  transform-origin:center center;
}
/* a câmera entra no objeto: ele cresce onde está e some — passamos por dentro */
.z-body{
  position:absolute;inset:0;
  transform:scale(1);transform-origin:center center;
  transition:transform .85s cubic-bezier(.22,.84,.3,1),opacity .5s ease .12s;
}
.zoomable.zoomed .z-body{transform:scale(3.6);opacity:0}
/* ampliado, o objeto some e some também do caminho: quem fica clicável
   por cima do fundo escuro são as moléculas, não o corpo invisível dele */
.reveal-item.zoomable.zoomed{z-index:8;pointer-events:none}
.z-svg{position:absolute;inset:0;width:100%;height:100%}
.z-svg text{font-family:var(--mono);font-weight:500}
/* aviso de que dá para tocar e entrar */
.reveal-item.zoomable{cursor:zoom-in}
.reveal-item.zoomable.zoomed{cursor:zoom-out}

@keyframes miniFloat{
  from{transform:translate(0,0) rotate(var(--r0))}
  to  {transform:translate(var(--fx),var(--fy)) rotate(var(--r1))}
}

/* ---------- o mundo quântico ----------
   tudo nasce do ponto onde o copo está (--qox/--qoy), para
   dar a impressão de que a câmera mergulhou naquele canto.
   Nada anima enquanto o copo está fechado: fica tudo pausado. */
.quantum{
  position:absolute;inset:0;z-index:7;pointer-events:none;
  opacity:0;transition:opacity .45s ease;
}
.slide.quantum-on .quantum{opacity:1}
/* submersos, os elementos do slide não se tocam: eles estão atrás do
   fundo opaco, e um toque neles seria um arrasto às cegas */
.slide.quantum-on .reveal-item{pointer-events:none}
/* Nos mundos confinados não há fundo opaco cobrindo o slide: o escuro
   fica dentro da caixa. Então as outras caixas continuam ao alcance do
   dedo, e os dois mundos podem estar abertos ao mesmo tempo. */
.slide.q-confinado.quantum-on .reveal-item{pointer-events:auto}

.q-wash,.q-aurora{position:absolute;inset:0}
/* opaco de verdade: nada do slide atravessa */
.q-wash{
  background:radial-gradient(circle at var(--qox,50%) var(--qoy,50%),
    #071825 0%,#030A13 46%,#01040A 100%);
}
/* A aurora ficava GIRANDO. Como ela é um retângulo com transform-origin
   no ponto do mergulho, os cantos varriam a tela e o que se via era um
   quadrado rodando por trás das moléculas — o olho da turma ia atrás
   dele em vez de ir na matéria. Agora ela é fundo parado: a mesma cor,
   nenhum movimento. */
.q-aurora{
  background:conic-gradient(from 0deg at var(--qox,50%) var(--qoy,50%),
    rgba(69,199,176,.13),rgba(90,120,220,.10),rgba(240,180,74,.06),
    rgba(69,199,176,.13));
  mix-blend-mode:screen;
}

/* As frentes de onda que saíam do copo (.q-ring) foram embora pelo mesmo
   motivo: círculos crescendo sem parar puxam o olhar para a borda da
   tela justo quando ele deveria estar na molécula. O elemento continua
   no HTML, sem desenho, para não mexer na montagem do fundo. */
.q-ring{display:none}

/* o campo se abre a partir do copo: é isso que vira o movimento de câmera */
.q-zoom{
  position:absolute;inset:0;
  transform-origin:var(--qox,50%) var(--qoy,50%);
  transform:scale(.26);opacity:0;
  transition:transform .85s cubic-bezier(.2,.82,.28,1),opacity .5s ease;
}
.slide.quantum-on .q-zoom{transform:scale(1);opacity:1}

/* OS RÓTULOS DO MUNDO QUÂNTICO.
   Ficam num contentor próprio, refeito a cada abertura, porque quem
   escreve neles é o recipiente que se abriu — e cada um pode escrever
   quantos quiser. Cada rótulo é centrado no ponto que recebe, como um
   reveal comum. */
.q-tits{position:absolute;inset:0;pointer-events:none}
.q-tit{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--display);font-weight:500;font-size:23px;
  color:var(--amber);white-space:nowrap;pointer-events:none;
  text-shadow:0 2px 18px rgba(3,12,22,.9);
}
/* Modo de posicionamento: os rótulos passam a pedir o dedo e mostram a
   alça tracejada. Provisório — ver QTIT_MOVEL no script. */
.slide.quantum-on .q-tit.movel{
  pointer-events:auto;cursor:move;touch-action:none;
  outline:1px dashed rgba(69,199,176,.45);outline-offset:7px;
}
.q-tit.movel.pegando{outline:1px dashed var(--aqua);cursor:grabbing}

/* Legenda: diz o que se está vendo, não como a coisa se chama. Menor,
   em verde-água e em caixa alta espaçada — a mesma voz dos outros
   rótulos da cena ("retículo cristalino", "célula unitária"). */
.q-tit.legenda{
  font-family:var(--mono);font-weight:500;font-size:17px;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--aqua);
}
/* Nome do composto, no alto do mundo quântico dos slides do retículo.
   Fala a mesma língua dos outros rótulos daqui — mono, caixa alta,
   espaçado —, mas em âmbar: é o título da cena, e não a legenda de uma
   parte dela. Entra depois do chiado, com um atraso que o deixa chegar
   quando a cena já apareceu. */
.q-tit.composto{
  font-family:var(--mono);font-weight:500;font-size:21px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--amber);
  opacity:0;transition:opacity .5s ease .3s;
}
.slide.rede-on .q-tit.composto{opacity:1}

/* ---------- moléculas grandes, com ligações que quebram ---------- */
.qmol{
  position:absolute;width:320px;height:232px;
  transform:translate(-50%,-50%);
}
.slide.quantum-on .qmol{pointer-events:auto;touch-action:none}
.qat{
  position:absolute;border-radius:50%;
  width:calc(var(--r) * 2);height:calc(var(--r) * 2);
  margin:calc(var(--r) * -1) 0 0 calc(var(--r) * -1);
}
.slide.quantum-on .qat{pointer-events:auto;touch-action:none}
.qat.core{cursor:move}                    /* pelo centro, arrasta a molécula toda */
.qat.end {cursor:grab}                    /* pelas pontas, arranca o átomo */
.qat.end.torn{
  cursor:grabbing;z-index:3;
  box-shadow:0 0 0 5px rgba(255,132,96,.65),0 0 56px rgba(255,132,96,.6);
  animation:atomTear .42s cubic-bezier(.2,1.7,.4,1);
}
@keyframes atomTear{
  0%  {transform:scale(1)}
  32% {transform:scale(1.5)}
  100%{transform:scale(1)}
}
/* passado o coice, o átomo solto entra no mesmo tremor das
   moléculas incompletas: sozinho, ele também é instável */
.qat.end.torn.jitter{animation:molShake .26s linear infinite}
/* a volta para o lugar, com um leve exagero no fim */
.qat.flyback{transition:left .42s cubic-bezier(.28,1.5,.5,1),
                        top  .42s cubic-bezier(.28,1.5,.5,1)}
.qat.snapped{animation:atJoin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes atJoin{
  0%  {box-shadow:0 0 0 0 rgba(130,255,228,.95),0 0 64px rgba(130,255,228,.9);
       transform:scale(1.42);filter:brightness(2.4)}
  100%{box-shadow:0 0 0 52px rgba(130,255,228,0),0 0 0 rgba(130,255,228,0);
       transform:scale(1);filter:brightness(1)}
}

/* ===== a estrutura incompleta não fica parada: ela treme ===== */
.qmol.unstable .qat:not(.torn){animation:molShake .26s linear infinite}
.qmol.unstable .qbond:not(.broken){animation:bondShake .26s linear infinite}
.qmol.unstable .qat.core{
  animation:molShake .26s linear infinite, coreAlert 1.1s ease-in-out infinite;
}
@keyframes molShake{
  0%,100%{transform:translate(0,0)}
  25%    {transform:translate(3.4px,-2.8px)}
  50%    {transform:translate(-3px,3px)}
  75%    {transform:translate(2.6px,2.4px)}
}
@keyframes bondShake{
  0%,100%{transform:rotate(var(--rot)) translate(0,0)}
  25%    {transform:rotate(var(--rot)) translate(3.4px,-2.8px)}
  50%    {transform:rotate(var(--rot)) translate(-3px,3px)}
  75%    {transform:rotate(var(--rot)) translate(2.6px,2.4px)}
}
@keyframes coreAlert{
  0%,100%{box-shadow:0 0 0 0 rgba(255,110,80,.55),0 0 26px rgba(255,110,80,.3)}
  50%    {box-shadow:0 0 0 26px rgba(255,110,80,0),0 0 68px rgba(255,110,80,.85)}
}
/* o alívio quando a molécula se completa de novo */
.qmol.settled{animation:molSettle .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes molSettle{
  0%  {transform:translate(-50%,-50%) scale(1.14)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

.qbond{
  position:absolute;left:var(--x);top:var(--y);
  width:var(--len);height:12.6px;margin-top:-6.3px;border-radius:6.3px;
  transform-origin:0 50%;transform:rotate(var(--rot));
  background:linear-gradient(180deg,#C2CFD8,#7C8B96);
}
.qbond.snap{animation:bondSnap .38s cubic-bezier(.3,0,.2,1) forwards}
.qbond.form{animation:bondForm .4s cubic-bezier(.2,1.6,.4,1) both}
/* o coto que sobra: valência aberta, piscando */
.qbond.broken{
  background:linear-gradient(90deg,#FF8A5C,rgba(255,138,92,0));
  animation:bondStub .55s ease-in-out infinite alternate;
}
@keyframes bondSnap{
  0%  {opacity:1;filter:brightness(4);transform:rotate(var(--rot)) scaleY(3) scaleX(1.06)}
  55% {opacity:.9;filter:brightness(2.2);transform:rotate(var(--rot)) scaleY(.5) scaleX(.7)}
  100%{opacity:0;filter:brightness(1);transform:rotate(var(--rot)) scaleY(.2) scaleX(.35)}
}
@keyframes bondForm{
  0%  {opacity:0;filter:brightness(5);  transform:rotate(var(--rot)) scaleX(.1) scaleY(2.6)}
  45% {opacity:1;filter:brightness(2.6);transform:rotate(var(--rot)) scaleX(1.06) scaleY(1.5)}
  100%{opacity:1;filter:brightness(1);  transform:rotate(var(--rot)) scaleX(1) scaleY(1)}
}
@keyframes bondStub{
  from{opacity:.9;transform:rotate(var(--rot)) scaleX(.34)}
  to  {opacity:.32;transform:rotate(var(--rot)) scaleX(.2)}
}

/* estilhaços da ligação partida: saem do ponto da ruptura, girados
   no eixo da própria ligação, então o esguicho é para os lados dela */
.qsplash{
  position:absolute;left:var(--x);top:var(--y);
  width:0;height:0;pointer-events:none;
  transform:rotate(var(--rot));
}
.qsplash b{
  position:absolute;left:0;top:0;
  width:var(--w);height:var(--h);
  margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
  border-radius:var(--h);background:var(--c);
  opacity:0;
  transform:rotate(var(--a)) translateX(0) scale(.5);
}
.qsplash.go b{animation:splash var(--t) cubic-bezier(.12,.75,.3,1) forwards}
@keyframes splash{
  0%  {opacity:1;transform:rotate(var(--a)) translateX(0) scale(.5)}
  20% {opacity:1;transform:rotate(var(--a)) translateX(calc(var(--d) * .5)) scale(1.2)}
  100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.25)}
}

/* onda de choque no ponto da ruptura, e o anel que se fecha na volta */
.qspark{
  position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;
  border-radius:50%;border:3px solid rgba(255,190,120,.95);
  opacity:0;pointer-events:none;
}
.qspark.go  {animation:sparkOut .55s cubic-bezier(.15,.85,.3,1) forwards}
.qspark.join{animation:sparkIn  .55s cubic-bezier(.25,.9,.3,1) forwards}
@keyframes sparkOut{
  0%  {opacity:1;transform:scale(.25);border-width:7px}
  100%{opacity:0;transform:scale(6);  border-width:1px}
}
@keyframes sparkIn{
  0%  {opacity:0;transform:scale(5);  border-color:rgba(130,255,228,.95);border-width:1px}
  45% {opacity:1}
  100%{opacity:0;transform:scale(.25);border-color:rgba(130,255,228,.95);border-width:7px}
}

/* ---------- AJUDA PARA MONTAR MOLÉCULAS ----------
   A esfera fica na quina de baixo à direita, fora do palco onde as
   coisas se arrastam, e é a mesma pastilha luminosa que o app usa para
   tudo que se toca: tinta funda, aro verde-água e o brilho por fora.

   Ela NÃO é um passo da sequência de cliques. É consulta — abre quando a
   turma trava na hora de montar, e fecha quando não precisa mais. Por
   isso vive fora dos reveals, como o quadro. */
/* A esfera mora na MESMA quina do Refazer do mundo quântico, e do mesmo
   jeito: encostada em 18px do canto. Os dois nunca disputam o lugar —
   dentro do mergulho esta some, porque ali não se monta molécula no
   papel, monta-se com o dedo. */
.poli-btn{
  position:absolute;right:18px;bottom:18px;z-index:8;
  width:80px;height:80px;padding:0;
  border-radius:50%;border:1px solid rgba(69,199,176,.5);
  background:radial-gradient(circle at 34% 30%,#1E5359 0%,#0B2C33 66%,#061A20 100%);
  color:var(--paper);cursor:pointer;pointer-events:auto;
  display:grid;place-items:center;
  box-shadow:0 0 26px rgba(69,199,176,.22);
  transition:border-color .2s,box-shadow .2s,transform .2s,color .2s,opacity .3s;
}
.poli-btn span{
  font-family:var(--mono);font-size:8px;letter-spacing:.06em;line-height:1.5;
  text-transform:uppercase;white-space:pre-line;text-align:center;
}
.poli-btn:hover{
  border-color:var(--aqua);box-shadow:0 0 34px rgba(69,199,176,.45);
  transform:scale(1.05);
}
/* aberta, a esfera acende em âmbar: ela é o que está no comando agora */
.slide.poli-on .poli-btn{
  border-color:var(--amber);color:var(--amber);
  box-shadow:0 0 34px rgba(240,180,74,.4);
}
/* submerso, a ajuda de papel sai de cena — e a nota com ela */
.slide.quantum-on .poli-btn,
.slide.quantum-on .poli-nota{
  opacity:0;visibility:hidden;pointer-events:none;
}

/* A NOTA. Estreita e alta — é uma lista de passos, e passo se lê em
   coluna: linha curta, um de cada vez. Fica no PALCO, e não na janela,
   então cresce e encolhe junto com o slide, como tudo que a aula
   projeta; e se arrasta com o dedo, porque o lugar bom para ela depende
   de onde está a molécula que a turma está tentando montar. */
.poli-nota{
  position:absolute;z-index:9;
  transform:translate(-50%,-50%) scale(.93);
  width:420px;padding:24px 26px 26px;
  background:linear-gradient(180deg,rgba(18,49,75,.97),rgba(7,22,38,.985));
  border:1px solid rgba(69,199,176,.34);border-radius:4px;
  box-shadow:0 26px 70px rgba(3,12,22,.72),0 0 44px rgba(69,199,176,.1);
  opacity:0;pointer-events:none;
  cursor:move;touch-action:none;
  user-select:none;-webkit-user-select:none;
  transition:opacity .3s ease,transform .36s cubic-bezier(.2,.85,.3,1);
}
/* Aberta, ela veste o mesmo âmbar da esfera: as duas são a mesma coisa
   acesa, e é o âmbar que diz isso. */
.slide.poli-on .poli-nota{
  opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);
  border-color:rgba(240,180,74,.55);
  box-shadow:0 26px 70px rgba(3,12,22,.72),0 0 44px rgba(240,180,74,.18);
}
/* na mão ela acompanha o dedo, sem a mola da entrada */
.poli-nota.pegando{
  cursor:grabbing;transition:opacity .3s ease;
  border-color:var(--amber);
}
.poli-nota h3{
  margin:0 0 18px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--amber);font-weight:400;
}
.poli-nota ol{margin:0;padding:0;list-style:none;display:grid;gap:13px}
.poli-nota li{display:flex;align-items:flex-start;gap:13px}
/* o número num anel âmbar, como os passos numerados do resto da aula */
.poli-nota li b{
  flex:none;width:25px;height:25px;margin-top:1px;border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--mono);font-size:11.5px;font-weight:500;
  color:var(--amber);border:1px solid rgba(240,180,74,.45);
}
.poli-nota li span{
  font-size:16px;font-weight:300;line-height:1.42;color:var(--paper);
}

/* ---------- o quadro de escola ----------
   Antes cada slide que quisesse um quadro trazia a sua própria bola
   "Quadro" no canto da cena. Agora o pedido é um só e vale em toda a
   apresentação: o ícone do quadro na barra de controles. */
.q-board{
  position:absolute;
  width:calc(520px * var(--k,1));height:calc(340px * var(--k,1));
  transform:translate(-50%,-50%) scale(.85);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .35s cubic-bezier(.2,.85,.3,1);
}
.q-board.on{
  opacity:1;pointer-events:auto;cursor:grab;touch-action:none;
  transform:translate(-50%,-50%) scale(1);
  user-select:none;-webkit-user-select:none;
}
.q-board.on.dragging{cursor:grabbing}
/* Solto no slide, fora do mundo quântico: passa por cima da cena — os
   .reveal-item vivem no z-index 6. Some durante o mergulho, porque lá
   dentro quem vale é o quadro do .quantum, que nasce ATRÁS dos objetos:
   dois quadros na mesma tela só se atrapalhariam. */
.q-board.solto{z-index:8}
.slide.quantum-on > .q-board.solto{display:none}
.q-board svg{width:100%;height:100%;display:block}
/* o nome do composto, escrito no alto do quadro como um professor faria.
   Fica em cima do SVG e não pega o dedo: quem se arrasta é o quadro. */
.qb-tit{
  position:absolute;left:6%;right:6%;top:7%;
  pointer-events:none;text-align:center;
  font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive;
  font-size:calc(30px * var(--k,1));line-height:1.1;
  color:#22415F;
  text-decoration:underline;
  text-underline-offset:.2em;
  text-decoration-thickness:calc(2px * var(--k,1));
}

/* moléculas de água à deriva — e que se pegam com o dedo */
.qm{
  position:absolute;opacity:var(--o,.8);
  /* 88 x 70 é a proporção do desenho: a caixa segue ela */
  width:calc(52px * var(--k,1));height:calc(41px * var(--k,1));
  animation:miniFloat var(--fd) ease-in-out infinite alternate;
  animation-play-state:paused;
}
.slide.quantum-on .qm{
  pointer-events:auto;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
  transition:width .28s cubic-bezier(.2,.8,.3,1),
             height .28s cubic-bezier(.2,.8,.3,1);
}
/* enquanto o dedo a leva, a deriva para: ela segue o dedo e nada mais.
   E o tamanho deixa de ser animado, senão a pinça ficaria atrasada. */
.slide.quantum-on .qm.dragging{
  cursor:grabbing;animation-play-state:paused;transition:none;
}
/* micropartículas flutuantes */
.qp{
  position:absolute;width:var(--s);height:var(--s);border-radius:50%;
  background:rgba(185,238,228,.9);
  animation:qFloat var(--fd) ease-in-out infinite alternate;
  animation-delay:var(--dl);animation-play-state:paused;
}
.slide.quantum-on .qm,
.slide.quantum-on .qp{animation-play-state:running}
/* enquanto uma bola está sendo levada, a deriva de todas para:
   assim a conta de encosto usa a posição que está de fato na tela */
.slide.quantum-on .quantum.freeze .qm{animation-play-state:paused}
/* duas bolas encostadas: o mesmo tremor e o mesmo alerta das
   moléculas incompletas. O brilho é drop-shadow, não box-shadow,
   porque precisa seguir o contorno da esfera e não o da caixa. */
.slide.quantum-on .qm.unstable{
  animation:molShake .26s linear infinite, qmAlert 1.1s ease-in-out infinite;
}
@keyframes qmAlert{
  0%,100%{filter:drop-shadow(0 0 6px  rgba(255,110,80,.45))}
  50%    {filter:drop-shadow(0 0 24px rgba(255,110,80,.95))}
}
/* a tensão sobe em três degraus ao longo dos 3 segundos de convívio */
.slide.quantum-on .qm.unstable.u2{
  animation:shakeHard .16s linear infinite, qmAlert2 .6s ease-in-out infinite;
}
.slide.quantum-on .qm.unstable.u3{
  animation:shakeWild .09s linear infinite, qmAlert3 .3s ease-in-out infinite;
}
@keyframes shakeHard{
  0%,100%{transform:translate(0,0)}
  25%    {transform:translate(5px,-4px)}
  50%    {transform:translate(-4.5px,4.5px)}
  75%    {transform:translate(4px,3.6px)}
}
@keyframes shakeWild{
  0%,100%{transform:translate(0,0)      scale(1)}
  20%    {transform:translate(9px,-7px) scale(1.07)}
  40%    {transform:translate(-8px,8px) scale(.94)}
  60%    {transform:translate(7px,6px)  scale(1.06)}
  80%    {transform:translate(-6px,-8px) scale(.96)}
}
@keyframes qmAlert2{
  0%,100%{filter:drop-shadow(0 0 10px rgba(255,120,70,.6))}
  50%    {filter:drop-shadow(0 0 34px rgba(255,120,70,1))}
}
@keyframes qmAlert3{
  0%,100%{filter:drop-shadow(0 0 16px rgba(255,80,50,.8)) brightness(1.1)}
  50%    {filter:drop-shadow(0 0 52px rgba(255,80,50,1))  brightness(1.65)}
}
/* ---------- MOLÉCULAS EM TRÊS DIMENSÕES ----------
   A amônia é uma PIRÂMIDE, e pirâmide desenhada no plano vira triângulo:
   some justamente o que a molécula tem de particular. Estas são montadas
   em 3D de verdade, com os átomos em profundidade.

   Por isso a interação delas é outra. Não se arranca elétron de uma
   pirâmide que se está virando na mão — aqui o gesto é OLHAR, de todos
   os lados. Arrastar leva a molécula inteira; o toque amplia; e,
   ampliada, o dedo a gira.

   Feito em CSS, e não na GPU: são quatro esferas e três hastes por
   molécula, e o navegador ordena a profundidade sozinho quando o pai
   guarda o espaço (preserve-3d). Uma esfera não precisa girar para o
   olho — um círculo com brilho é esfera de qualquer ângulo —, então só
   as hastes têm de ser orientadas de verdade. */
.qm.tri{
  width:calc(48px * var(--k,1));height:calc(48px * var(--k,1));
  perspective:640px;
}
.m3{
  position:absolute;left:50%;top:50%;width:0;height:0;
  transform-style:preserve-3d;
  transform:scale3d(var(--k,1),var(--k,1),var(--k,1))
            rotateX(var(--rx,-16deg)) rotateY(var(--ry,22deg));
}
.qm.tri.girando .m3{transition:none}
/* A ESFERA TEM DE ENCARAR A CÂMERA.
   Sendo filha de um pai em preserve-3d, ela girava JUNTO com a molécula —
   e um círculo girado é uma elipse. Eram discos virando, não esferas.
   Aqui cada átomo desfaz a rotação do pai por dentro: a POSIÇÃO dele
   continua girando (é o que faz a molécula ser tridimensional), mas o
   desenho volta a encarar quem olha. É o que um visualizador molecular
   faz com sprites — e é correto, não atalho: de qualquer ângulo uma
   esfera é um círculo, e o brilho dela vem sempre da mesma luz. */
.m3-at{
  position:absolute;left:0;top:0;
  width:calc(var(--r) * 2);height:calc(var(--r) * 2);
  margin:calc(var(--r) * -1) 0 0 calc(var(--r) * -1);
  border-radius:50%;background:var(--bg);
  transform:translate3d(var(--x),var(--y),var(--z))
            rotateY(calc(-1 * var(--ry,22deg)))
            rotateX(calc(-1 * var(--rx,-16deg)));
}
/* A HASTE É UM CILINDRO, E CILINDRO NÃO SOME DE PERFIL.
   Uma lâmina só virava um fio quando a molécula girava de lado. São três,
   cruzadas de 60° em 60° em torno do eixo da ligação: de qualquer ângulo
   pelo menos uma está quase de frente, e as outras duas fazem a sombra
   das laterais. Juntas, elas se leem como um tubo.
   Cada uma nasce no átomo A apontando para o +X do seu referencial; quem
   a vira até o átomo B são o rotateZ e o rotateY, e o rotateX é a lâmina
   girando em torno de si mesma. */
.m3-lig{
  position:absolute;left:0;top:0;
  width:var(--len);height:var(--w);
  margin-top:calc(var(--w) / -2);
  border-radius:var(--w);
  transform-origin:0 50%;
  transform:translate3d(var(--x),var(--y),var(--z))
            rotateZ(var(--rz)) rotateY(var(--ry2)) rotateX(var(--rx3,0deg));
  background:linear-gradient(180deg,
    rgba(150,185,210,.20) 0%,rgba(226,243,253,.58) 34%,
    rgba(160,192,214,.34) 68%,rgba(110,145,175,.16) 100%);
  opacity:var(--o3,1);
}
/* ampliada, ela pede o dedo para girar — e avisa isso no cursor */
.slide.quantum-on .qm.tri.big{cursor:grab;touch-action:none}
.slide.quantum-on .qm.tri.big.girando{cursor:grabbing}

/* ---------- a molécula ampliada, que se deixa desmontar ----------
   Só a molécula que está em 500% aceita este gesto. É de propósito:
   ampliar é o pedido de "quero olhar isto de perto", e é só de perto
   que faz sentido puxar um átomo para fora do outro. As pequenas
   continuam sendo só matéria à deriva.

   Tudo aqui é medido em px da caixa da molécula ampliada (260 x 205,
   que é 52 x 41 vezes o QM_BIG de 5), então as contas são fixas. */
.qsp{position:absolute;inset:0}
.qsp-at{
  position:absolute;left:var(--x);top:var(--y);width:0;height:0;
  cursor:grab;touch-action:none;z-index:2;
}
.qsp.solto .qsp-at{cursor:grab}
.qsp-at.levando{cursor:grabbing;z-index:4}
/* a esfera, centrada no ponto do átomo */
.qsp-bola{
  position:absolute;left:0;top:0;
  width:calc(var(--r) * 2);height:calc(var(--r) * 2);
  margin:calc(var(--r) * -1) 0 0 calc(var(--r) * -1);
  border-radius:50%;background:var(--bg);
  pointer-events:auto;
}
/* Sozinho, o átomo treme e acende em vermelho — a mesma linguagem que o
   resto do app usa para "isto ainda não fechou o octeto". */
.qsp.solto .qsp-at{
  animation:molShake .26s linear infinite, qmAlert 1.1s ease-in-out infinite;
}
.qsp.solto .qsp-at.levando{animation:none}   /* na mão, ele para de tremer */

/* ---------- os elétrons de valência ----------
   Como ela chega do campo, a molécula é só bola-e-bastão: o bastão já
   diz que ali há uma ligação, e mostrar os elétrons junto seria dizer
   duas vezes. Eles entram quando a ligação se rompe — cada átomo volta a
   contar os seus — E FICAM depois de refeita, agora ao lado do bastão:
   é com eles na tela que se confere o serviço, contando os oito de cada
   cloro e vendo que o par do meio pertence aos dois.
   --a é o lado da esfera, --d a distância até o centro dela. */
.qsp-e{
  position:absolute;left:0;top:0;width:13px;height:13px;
  margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 14px rgba(240,180,74,.95);
  transform:rotate(var(--a)) translateX(var(--d)) rotate(calc(-1 * var(--a)))
            scale(var(--s,1));
  opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.2,1.5,.4,1),opacity .34s ease;
}
.qsp.solto .qsp-e,.qsp.feito .qsp-e{opacity:1}

/* ---------- o bastão ----------
   Existe enquanto a molécula é uma molécula: some no instante da ruptura
   e volta quando o par se fecha. Refeita, ele divide a cena com os
   elétrons — o bastão diz que há ligação, os elétrons dizem do que ela é
   feita. */
.qsp-lig{
  position:absolute;left:var(--x);top:var(--y);
  width:var(--len);height:var(--w);
  margin-top:calc(var(--w) / -2);
  transform-origin:0 50%;transform:rotate(var(--rot));
  border-radius:var(--w);
  /* Vidro, não metal: grosso o bastante para o par compartilhado caber
     DENTRO dele, e transparente para o par continuar sendo visto. A
     ligação deixa de ser uma vareta opaca e passa a ser o envelope dos
     dois elétrons — que é o que ela é. */
  background:linear-gradient(180deg,
    rgba(150,185,210,.10) 0%,
    rgba(226,243,253,.24) 30%,
    rgba(172,202,224,.15) 68%,
    rgba(120,155,182,.08) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(190,228,248,.30);
  pointer-events:none;z-index:1;
  opacity:0;transition:opacity .34s ease;
}
.qsp:not(.solto) .qsp-lig{opacity:1}
/* o estouro da ruptura: o bastão estica, clareia e se apaga */
.qsp-lig.parte{animation:ligParte .3s ease-in forwards}
@keyframes ligParte{
  0%  {opacity:1;transform:rotate(var(--rot)) scaleY(1)}
  45% {opacity:1;transform:rotate(var(--rot)) scaleY(2.1);filter:brightness(3)}
  100%{opacity:0;transform:rotate(var(--rot)) scaleY(.1); filter:brightness(3)}
}
/* Soltos, os elétrons se reorientam a cada movimento do dedo: a mola de
   .42s ficaria sempre atrasada em relação à mão. Aqui eles acompanham. */
.qsp.solto .qsp-e{transition:transform .13s linear,opacity .3s ease}
/* o desemparelhado é maior e pulsa: é ele que procura o outro */
.qsp-e.so{
  --s:1.34;background:#FFE9B4;
  box-shadow:0 0 20px rgba(255,220,140,1),0 0 46px rgba(240,180,74,.75);
}
.qsp.solto .qsp-e.so{animation:eSozinho 1.15s ease-in-out infinite}
@keyframes eSozinho{
  0%,100%{box-shadow:0 0 16px rgba(255,220,140,.9),0 0 34px rgba(240,180,74,.55)}
  50%    {box-shadow:0 0 30px rgba(255,240,190,1),0 0 66px rgba(240,180,74,.95)}
}
/* perto o bastante para encaixar: os dois avisam antes de fechar. A
   pulsação para aqui, senão ela apagaria este brilho a cada meio ciclo. */
.qsp-e.so.mira{
  --s:1.7;background:#EAFFF6;animation:none;
  box-shadow:0 0 26px rgba(130,255,228,1),0 0 60px rgba(130,255,228,.8);
}

/* ---------- o anel do octeto ----------
   Um toque no átomo da molécula pronta cerca os oito elétrons dele. É a
   conta que a Teoria do Octeto pede, feita com o dedo: seis são dele, e
   os outros dois são o par que ele divide com o vizinho — os mesmos dois
   que o vizinho também conta como seus. Tocar de novo, nele ou no
   vizinho, apaga o anel. */
/* O desenho é o mesmo nos dois estados; muda só a animação. Um anel que
   sai precisa continuar existindo enquanto se apaga — daí a classe
   'oct-sai', que segura o círculo em cena durante o fade. */
.qsp-at.octeto::after,
.qsp-at.oct-sai::after{
  content:'';position:absolute;left:0;top:0;
  width:calc(var(--oct) * 2);height:calc(var(--oct) * 2);
  margin:calc(var(--oct) * -1) 0 0 calc(var(--oct) * -1);
  border-radius:50%;pointer-events:none;
  border:2.5px dashed rgba(130,255,228,.92);
  box-shadow:0 0 26px rgba(130,255,228,.32),
             inset 0 0 44px rgba(130,255,228,.10);
}
.qsp-at.octeto::after{animation:octetoEntra .44s cubic-bezier(.2,1.5,.4,1)}
@keyframes octetoEntra{
  0%  {opacity:0;transform:scale(.7)}
  100%{opacity:1;transform:scale(1)}
}
/* Saída em fade puro: sem encolher. O anel não é recolhido de volta para
   o átomo — ele simplesmente deixa de ser a conta que está sendo feita,
   e some no lugar onde estava. */
.qsp-at.oct-sai::after{animation:octetoSai .34s ease forwards}
@keyframes octetoSai{
  from{opacity:1}
  to  {opacity:0}
}
/* A CONTA ESCRITA.
   O anel cerca; o rótulo diz quantos são. Sem ele o aluno conta os
   pontos um a um — e conta errado, porque o par do meio é dos dois e é
   fácil deixá-lo de fora. Com ele a circunferência passa a dizer a
   frase inteira: oito elétrons, que é o que a Teoria do Octeto pede
   que se veja. Fica logo acima do anel, fora do caminho dos elétrons,
   e acompanha o raio dele — cresça o anel, o rótulo sobe junto. */
.qsp-oito{
  position:absolute;left:0;top:0;
  transform:translate(-50%,calc(-50% - var(--oct) - 17px));
  white-space:nowrap;pointer-events:none;text-decoration:none;
  font-family:var(--mono);font-size:15px;letter-spacing:.1em;
  color:rgba(130,255,228,.96);
  text-shadow:0 2px 14px rgba(3,12,22,.92),0 0 22px rgba(130,255,228,.4);
  opacity:0;
}
/* NOS BRAÇOS A CONTA VAI PARA O LADO DE FORA.
   O anel de um braço é largo — ele alcança o par que mora no meio da
   ligação —, então o rótulo posto do lado do centro cairia justo em cima
   do átomo central e das contas dele. Por isso ele sai pelo lado oposto:
   abaixo do braço que está abaixo do centro, acima do que está acima.

   Na água e no SCl2 os dois braços ficam embaixo e as duas contas descem.
   No metano são quatro, dois em cima e dois embaixo, e cada par vai para
   o seu lado — que é o que tira as quatro contas de cima do carbono. */
.qsp-at.ramo .qsp-oito{
  transform:translate(-50%,calc(-50% + var(--oct) + 17px));
}
.qsp-at.ramo.acima .qsp-oito{
  transform:translate(-50%,calc(-50% - var(--oct) - 17px));
}
/* entra logo depois do anel, para a conta chegar quando já há o que
   contar; sai no mesmo fade dele */
.qsp-at.octeto  .qsp-oito{animation:oitoEntra .34s ease .12s both}
.qsp-at.oct-sai .qsp-oito{animation:octetoSai .34s ease forwards}
@keyframes oitoEntra{
  from{opacity:0}
  to  {opacity:1}
}

/* ---------- a molécula de braços ----------
   Num par de iguais quem fica sozinho é a molécula: rompida a ligação,
   não sobra molécula nenhuma, e o tremor é dos dois. Na água não — ela
   continua sendo água com um hidrogênio a menos, incompleta mas inteira.
   Então quem treme e acende em vermelho é o BRAÇO que se soltou; e o
   centro treme junto, porque está tão incompleto quanto ele. */
.qsp.ramos .qsp-at.solto,
.qsp.ramos.incompleta .qsp-at.centro{
  animation:molShake .26s linear infinite, qmAlert 1.1s ease-in-out infinite;
}
.qsp.ramos .qsp-at.solto.levando{animation:none}   /* na mão, ele para */
/* o centro não sai do lugar: são os braços que se arrancam dele. O dedo
   ainda o alcança, para acender o anel do octeto. */
.qsp.ramos .qsp-at.centro{cursor:pointer}
/* enquanto falta um braço, os elétrons acompanham a mão em vez de virem
   pela mola de .42s, que ficaria sempre atrasada */
.qsp.ramos.incompleta .qsp-e{transition:transform .13s linear,opacity .3s ease}

/* ---------- o encaixe ----------
   Os dois elétrons se acham e viram par. A ênfase é grande de propósito:
   é o momento da aula em que a ligação covalente acontece.
   (Não há regra apagando a animação no estado 'feito': o tremor só é
   ligado em '.qsp.solto', então sair de 'solto' já o desliga, e o
   clarão do fechamento fica livre para tocar.) */
.qsp-at.fechou{animation:atFechou .8s cubic-bezier(.2,1.5,.35,1)}
@keyframes atFechou{
  0%  {filter:drop-shadow(0 0 0   rgba(130,255,228,0))}
  30% {filter:drop-shadow(0 0 40px rgba(130,255,228,1)) brightness(1.5)}
  100%{filter:drop-shadow(0 0 0   rgba(130,255,228,0))}
}
/* enquanto voam para o lugar, os átomos deslizam em vez de saltar */
.qsp-at.indo{transition:left .5s cubic-bezier(.2,1.25,.35,1),
                        top  .5s cubic-bezier(.2,1.25,.35,1)}
.qsp-e.indo{transition:transform .5s cubic-bezier(.2,1.25,.35,1)}
/* Ampliada, a molécula para de derivar. Com ela vagando pela tela não
   dava para mirar um átomo no outro: o alvo fugia da mão. */
.slide.quantum-on .qm.big{animation:none}
/* a molécula inteira respira uma vez e assenta */
.slide.quantum-on .qm.big.assentou,
.qm.assentou{animation:qmAssenta .9s cubic-bezier(.2,.85,.3,1)}
@keyframes qmAssenta{
  0%  {filter:drop-shadow(0 0 0 rgba(130,255,228,0))}
  26% {filter:drop-shadow(0 0 46px rgba(130,255,228,.95)) brightness(1.35)}
  100%{filter:drop-shadow(0 0 0 rgba(130,255,228,0))}
}
/* o par recém-formado pisca uma vez, para dizer que agora é dos dois */
.qsp-e.par{animation:parNovo 1s ease-in-out 2}
@keyframes parNovo{
  0%,100%{box-shadow:0 0 16px rgba(130,255,228,.85)}
  50%    {box-shadow:0 0 34px rgba(130,255,228,1),0 0 70px rgba(130,255,228,.7)}
}

/* o arremesso: elas se afastam sozinhas ao fim dos 3 segundos */
.qm.repel{
  transition:left .6s cubic-bezier(.08,.92,.3,1),
             top  .6s cubic-bezier(.08,.92,.3,1);
}
/* onda do choque, no ponto exato onde elas se encostaram */
.qburst{
  position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;
  border-radius:50%;pointer-events:none;
  border:3px solid rgba(255,150,90,.95);
  box-shadow:0 0 44px rgba(255,150,90,.7),inset 0 0 30px rgba(255,200,120,.6);
  animation:qBurst .65s cubic-bezier(.1,.82,.25,1) forwards;
}
@keyframes qBurst{
  0%  {opacity:1;transform:scale(.2);border-width:11px}
  100%{opacity:0;transform:scale(7); border-width:1px}
}
.qflash{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  animation:qFlash .45s ease-out forwards;
}
@keyframes qFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes qFloat{
  from{transform:translate3d(0,0,0);opacity:.2}
  to  {transform:translate3d(var(--fx),var(--fy),0);opacity:.95}
}

/* ---------- gás nobre: identificação, esfera e distribuição ---------- */
.reveal-item.gas{display:flex;align-items:center;gap:14px}
.gas-id{
  text-align:right;line-height:1.05;white-space:nowrap;
  font-family:var(--mono);
}
.gas-id b{
  display:block;font-weight:500;color:var(--paper);
  font-size:clamp(16px,calc(var(--base) * 1px * var(--k) * .42),34px);
}
.gas-id i{
  display:block;font-style:normal;color:var(--paper-dim);letter-spacing:.1em;
  font-size:clamp(11px,calc(var(--base) * 1px * var(--k) * .24),20px);
}
.gas-ball{
  width:calc(var(--base) * 1px * var(--k));
  height:calc(var(--base) * 1px * var(--k));
  border-radius:50%;flex:none;
  display:grid;place-items:center;text-align:center;line-height:1.1;
}
/* símbolo e número atômico dentro da esfera */
.gas-ball b{
  display:block;font-family:var(--mono);font-weight:500;color:#FFFFFF;
  font-size:calc(var(--base) * 1px * var(--k) * .3);
  text-shadow:0 2px 6px rgba(4,12,20,.7);
}
.gas-ball i{
  display:block;font-style:normal;font-family:var(--mono);
  font-size:calc(var(--base) * 1px * var(--k) * .17);
  color:rgba(255,255,255,.82);text-shadow:0 2px 6px rgba(4,12,20,.7);
}

/* ---------- a carga do íon, escrita enquanto o elétron sai ----------
   Fica no canto de cima, à direita, como se escreve à mão: Na⁺, O²⁻.
   Âmbar quando é cátion, azul quando é ânion — a mesma dupla de cores
   que a rede cristalina usa para positivo e negativo. */
.carga{
  position:absolute;text-decoration:none;pointer-events:none;
  font-family:var(--mono);font-weight:600;line-height:1;white-space:nowrap;
  color:#FFCE72;text-shadow:0 2px 10px rgba(4,12,20,.9);
}
.carga.neg{color:#8FD8FF}
.gas-ball{position:relative}
/* encostada na quina de cima da esfera, por fora do círculo: assim ela
   nunca cobre o símbolo nem o número atômico */
.gas-ball .carga{
  top:-6%;right:-8%;
  font-size:calc(var(--base) * 1px * var(--k) * .24);
}
/* no Lewis, fora do anel de elétrons — que ocupa os quatro lados */
.lw .carga{top:-8px;right:-32px;font-size:32px}
.carga.bate{animation:cargaBate .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes cargaBate{
  0%  {transform:scale(.35);opacity:0}
  55% {transform:scale(1.22);opacity:1}
  100%{transform:scale(1);   opacity:1}
}

/* o último subnível se solta e leva junto o número de elétrons */
.gas-dist .cam.solta{position:relative;cursor:grab;touch-action:none}
.gas-dist .cam.solta.dragging{cursor:grabbing;z-index:4}
.gas-dist .cam.voltando{
  transition:left .38s cubic-bezier(.3,1.4,.5,1),
             top  .38s cubic-bezier(.3,1.4,.5,1);
}
.gas-dist .cam.indo{animation:subnivelSai .42s ease-in forwards}
@keyframes subnivelSai{
  0%  {opacity:1;transform:scale(1);  filter:brightness(1)}
  100%{opacity:0;transform:scale(.35);filter:brightness(2.6)}
}
/* doado o elétron, o subnível some — sem destaque automático nenhum */
.gas.doado .gas-dist .cam:last-child{display:none}

/* deu certo: as duas distribuições passam a falar a mesma língua */
.slide.acertou .gas-dist .cam:not(.octeto8),
.slide.acertou .gas-dist .cam:not(.octeto8) .lb{
  color:var(--aqua);
  transition:color .7s ease;
}

/* o destaque dos 8 só vem se o usuário clicar na camada de valência */
.gas-dist .cam.valencia{cursor:pointer}
.gas-dist .cam.octeto8,
.slide.acertou .gas-dist .cam.octeto8{
  color:var(--amber);
  background:rgba(240,180,74,.16);
  box-shadow:inset 0 0 0 1px rgba(240,180,74,.5);
  animation:enfaseValencia 1.1s cubic-bezier(.2,.9,.3,1);
}
.gas-dist .cam.octeto8 .lb{color:var(--amber);font-size:.95em}
.gas-dist .cam.octeto8::after{
  content:'8';position:absolute;left:50%;top:-1.4em;
  transform:translateX(-50%);
  font-family:var(--mono);font-weight:500;font-size:1.15em;
  line-height:1;color:var(--amber);
}

/* confete e clarão do acerto */
.confete{position:absolute;width:0;height:0;pointer-events:none;z-index:9}
.confete i{
  position:absolute;left:0;top:0;
  width:var(--w);height:var(--h);background:var(--c);border-radius:2px;
  animation:confeteVoa var(--t) cubic-bezier(.15,.72,.4,1) forwards;
}
@keyframes confeteVoa{
  0%  {opacity:1;transform:translate(0,0) rotate(0deg)}
  70% {opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}
}
.acerto-anel{
  position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;
  border-radius:50%;border:3px solid rgba(130,255,228,.95);
  box-shadow:0 0 46px rgba(130,255,228,.7);
  pointer-events:none;z-index:9;
  animation:acertoAnel .7s cubic-bezier(.1,.82,.25,1) forwards;
}
@keyframes acertoAnel{
  0%  {opacity:1;transform:scale(.2);border-width:10px}
  100%{opacity:0;transform:scale(8); border-width:1px}
}
@keyframes enfaseValencia{
  0%  {transform:scale(1);   box-shadow:inset 0 0 0 1px rgba(240,180,74,0),
                                        0 0 0 0 rgba(240,180,74,.75)}
  35% {transform:scale(1.14)}
  100%{transform:scale(1);   box-shadow:inset 0 0 0 1px rgba(240,180,74,.5),
                                        0 0 0 30px rgba(240,180,74,0)}
}
/* A distribuição é absoluta: fica fora da caixa do elemento, então
   abrir e fechar não empurra a esfera de lugar. O corte de máscara
   vai da esquerda para a direita, como se ela saísse de dentro da bola. */
/* mesma altura de letra em todas as distribuições, seja qual for o
   tamanho da esfera — a do xenônio é a referência */
.gas-dist{
  position:absolute;left:100%;top:50%;
  transform:translateY(-50%);margin-left:18px;
  width:max-content;max-width:700px;
  font-family:var(--display);font-weight:500;color:var(--paper);
  font-size:calc(20px * var(--k));
  line-height:1.7;
  /* o espaço do 8 fica dentro da própria caixa, então o recorte não
     precisa de valores negativos — que é onde os navegadores divergem */
  padding:36px 0 8px;margin-top:-14px;
  clip-path:inset(0 100% 0 0);opacity:0;
  transition:clip-path .55s cubic-bezier(.2,.85,.3,1),opacity .28s ease;
}
.gas.aberto .gas-dist{clip-path:inset(0);opacity:1}
/* Ficha nua: sem a esfera, a distribuição deixa de orbitar um objeto e
   passa a SER o objeto — entra no fluxo, e a caixa do reveal vira o
   tamanho dela. Sem isto ela continuaria pendurada à direita de uma
   bola que não existe mais. */
.reveal-item.gas.so-dist{display:block}
.reveal-item.gas.so-dist .gas-dist{
  position:static;transform:none;margin:0;padding:6px 0 4px;
}
/* Numa ficha sem bola o --base não tinha o que medir — não há esfera —,
   e o tamanho vinha só do --k. Isso quebrava a ida e volta pelo painel
   do C, que junta base e k num número só: a ficha voltava sempre ao
   tamanho de origem. Aqui o --base passa a ser o tamanho da letra, e o
   que se ajusta na tela é o que volta escrito. */
.reveal-item.gas.so-dist .gas-dist{
  font-size:calc(15px * var(--base,1) * var(--k));
}
/* slide da aplicação do octeto: 20px viram 30px, e tudo que é medido em
   em (a chave, o rótulo da camada, os expoentes, o 8) cresce junto */
.slide.dist-grande .gas-dist{font-size:calc(30px * var(--k));max-width:900px}
/* slide da tabela: duas distribuições, uma sob a outra, na faixa estreita
   à direita. Menores e mais juntas, para as duas caberem no vão. */
.slide.dist-mini .gas-dist{
  font-size:calc(15px * var(--k));max-width:410px;
  padding:26px 0 6px;margin-top:-10px;
}
.gas-dist .cam{
  display:inline-block;position:relative;
  margin-right:20px;white-space:nowrap;
  text-align:center;vertical-align:top;
}
/* a chave que agrupa os subníveis daquela camada */
.gas-dist .br{
  display:block;height:8px;margin-top:4px;
  border:1.5px solid currentColor;border-top:none;
  border-radius:0 0 4px 4px;opacity:.45;
}
.gas-dist .lb{
  display:block;margin-top:4px;transition:color .55s ease;
  font-family:var(--mono);font-weight:500;
  font-size:.7em;letter-spacing:.1em;color:var(--aqua);
}
.slide.octeto .gas-dist .cam:last-child .lb{color:var(--amber)}
.gas-dist sup{font-size:.62em;vertical-align:.42em;font-weight:400}

/* A caixa da valência existe desde sempre, transparente: assim o destaque
   entra em fade, sem empurrar o texto de lugar quando o octeto acende. */
.gas-dist .cam:last-child{
  position:relative;
  padding:2px 9px;margin-right:12px;border-radius:5px;
  background:rgba(240,180,74,0);
  box-shadow:inset 0 0 0 1px rgba(240,180,74,0);
  transition:background .55s ease,box-shadow .55s ease,color .55s ease;
}
.slide.octeto .gas-dist .cam:last-child{
  color:var(--amber);
  background:rgba(240,180,74,.14);
  box-shadow:inset 0 0 0 1px rgba(240,180,74,.45);
}
/* o 8 entra logo depois da caixa, subindo um pouco */
.gas:not([data-sim="He"]) .gas-dist .cam:last-child::after{
  content:'8';position:absolute;left:50%;top:-1.4em;
  transform:translateX(-50%) translateY(7px);
  font-family:var(--mono);font-weight:500;font-size:1.15em;
  line-height:1;color:var(--amber);opacity:0;
  transition:opacity .5s ease .18s,
             transform .5s cubic-bezier(.2,.9,.3,1) .18s;
}
.slide.octeto .gas:not([data-sim="He"]) .gas-dist .cam:last-child::after{
  opacity:1;transform:translateX(-50%) translateY(0);
}

/* imagem espelhada na horizontal */
.reveal-item.flip img{transform:scaleX(-1)}

/* caixa de texto */
.cx{
  width:calc(var(--base) * 1px * var(--k));
  padding:20px 24px 22px;border-radius:3px;
  background:linear-gradient(158deg,#143048 0%,#0A1F31 100%);
  border:1px solid rgba(69,199,176,.32);
  box-shadow:inset 0 0 60px rgba(69,199,176,.06);
}
/* Caixa de comparação: um rótulo em cima e o objeto embaixo. As duas são
   propositalmente diferentes — a iônica de canto vivo e moldura fria, de
   cristal; a molecular de canto redondo e traço interrompido, porque ali
   as unidades são separadas umas das outras. */
.pn{
  width:calc(var(--base) * 1px * var(--k));
  min-height:calc(var(--base) * 0.84px * var(--k));
  padding:16px 18px 20px;
  display:flex;flex-direction:column;align-items:center;
  gap:calc(14px * var(--k));
}
.pn-tit{
  font-family:var(--display);font-weight:600;
  font-size:calc(31px * var(--k));line-height:1;
}
.pn-tit sub{font-size:.62em;vertical-align:-.18em}
.pn-corpo{
  flex:1;width:100%;
  display:flex;align-items:center;justify-content:center;
}
/* dentro da caixa a imagem se ajusta à moldura, não ao --base do item */
.pn img{
  width:auto;height:auto;
  max-width:100%;
  max-height:calc(var(--base) * 0.56px * var(--k));
}
.pn.ionica{
  background:linear-gradient(158deg,#12303F 0%,#08202C 100%);
  border:1px solid rgba(69,199,176,.45);
  box-shadow:inset 0 0 60px rgba(69,199,176,.07);
}
.pn.ionica .pn-tit{color:var(--aqua)}
.pn.molecular{
  background:linear-gradient(158deg,#33260F 0%,#1E1406 100%);
  border:1px dashed rgba(240,180,74,.55);
  border-radius:20px;
  box-shadow:inset 0 0 60px rgba(240,180,74,.07);
}
.pn.molecular .pn-tit{color:var(--amber)}

/* ---- mundo quântico confinado à caixa ---- */
.pn{position:relative;overflow:hidden}
.pn-q{
  position:absolute;inset:0;z-index:1;
  background:radial-gradient(120% 100% at 30% 20%,#0A2233 0%,#020A12 70%);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.pn.q-on .pn-q{opacity:1;pointer-events:auto}
/* o conteúdo normal se apaga: a câmera entrou na matéria */
.pn-tit,.pn-corpo{transition:opacity .45s ease}
.pn.q-on .pn-tit,.pn.q-on .pn-corpo{opacity:0}
/* fora do painel aberto, as moléculas não existem */
.pn:not(.q-on) .qm{opacity:0!important;animation-play-state:paused!important;
                   pointer-events:none!important}
.pn-q.freeze .qm{animation-play-state:paused}
/* dentro da caixa elas são bem maiores que no campo de tela cheia */
.pn-q .qm{width:calc(125px * var(--k,1));height:calc(99px * var(--k,1))}
.qm-svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
/* a saída de cada caixa, numa faixa que a cena 3D não cobre */
.pn-sair{
  position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:3;
  padding:7px 16px;border-radius:999px;
  border:1px solid rgba(240,180,60,.55);
  background:linear-gradient(180deg,#4A3512 0%,#2A1D08 100%);
  color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;pointer-events:auto;
  opacity:0;visibility:hidden;transition:opacity .3s ease,transform .2s;
}
.pn.q-on .pn-sair{opacity:1;visibility:visible}
.pn-sair:hover{border-color:var(--amber);transform:translateX(-50%) scale(1.06)}

/* Num slide de mundos confinados, a camada quântica não escurece a tela
   inteira: ela serve só de suporte para a cena 3D. O escuro vem da caixa. */
.slide.q-confinado .quantum{background:none}
/* Retículo solto no slide: a tela cobre tudo, então ela não recebe o
   dedo. Quem lê o gesto é o próprio slide, e só quando o toque cai em
   cima de um íon — assim o cubo ao lado continua clicável. */
.slide.rede-livre .q3d{pointer-events:none !important}
.slide.rede-livre .reveal-item.reticulo{pointer-events:none}
.slide.q-confinado .q-wash,
.slide.q-confinado .q-aurora,
.slide.q-confinado .q-ring,
.slide.q-confinado .q-voltar,
.slide.q-confinado .q-reset,
.slide.q-confinado .cel-rot,
.slide.q-confinado .rede-rot{display:none}

.cx-tit{
  font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;
  font-size:calc(15px * var(--k));color:var(--aqua);
}
.cx-corpo{
  margin-top:14px;font-family:var(--display);font-weight:400;
  font-size:calc(19px * var(--k));line-height:1.45;color:var(--paper);
  min-height:calc(72px * var(--k));
}
.cx-corpo.digitando::after{
  content:'▌';color:var(--aqua);margin-left:1px;
  animation:cursor .75s steps(1) infinite;
}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}

/* item de ação: não desenha nada, só liga um estado no slide */
.reveal-item.acao{width:0;height:0}

/* ---------- imagem fixa da qual se arranca um pedaço ---------- */
.reveal-item.fixo{cursor:crosshair}
.reveal-item.fixo img{pointer-events:auto}
/* o pedaço levado: é a própria imagem, recortada e deslocada para que
   o ponto onde o dedo pegou fique no centro dele */
/* O grão é minúsculo. Para ele continuar pegável, quem recebe o dedo é
   uma área transparente bem maior em volta. */
.caco{
  position:absolute;z-index:7;
  width:26px;height:26px;transform:translate(-50%,-50%);
  display:grid;place-items:center;
  cursor:grab;touch-action:none;
}
.caco.dragging{cursor:grabbing}

/* ---------- a câmera entra no grão ----------
   Antes o grão crescia até engolir a tela — o zoom era dele. Agora quem
   se move é a CÂMERA: a cena inteira avança a partir do ponto onde o
   grão está, como quem aproxima o olho da amostra até ver o material por
   dentro. O grão não faz mais nada sozinho; ele é levado pela cena, como
   tudo o mais que está no slide.

   O mundo quântico NÃO entra nesta conta. Ele não é paisagem, é destino,
   e por isso só nasce depois que a câmera parou e voltou ao lugar —
   escondida a troca atrás do véu. Aninhar um dentro do outro custaria a
   nitidez do retículo, que seria desenhado em 1/46 e reampliado. */
/* A CURVA DO MERGULHO.
   scale interpola em linha reta, e por isso um zoom de 1 a 46 feito com
   transition gasta metade do tempo indo de 1 a 23 — 23 vezes de
   ampliação — e a outra metade indo de 23 a 46, que são só 2. O olho lê
   isso como um arranque seguido de arrasto.
   Aqui a escala cresce em PROGRESSÃO GEOMÉTRICA (a cada fatia de tempo,
   a mesma proporção de zoom), e sobre ela vai um ease-in-out: parte
   parada, ganha corpo no meio, chega parando. As etapas estão escritas
   à mão porque é a única forma de a curva ser a que se quer — o timing
   é linear justamente para não mexer no que já foi calculado.
   O grão continua a MESMA curva de onde a câmera parou: no ponto da
   troca a velocidade de zoom é a mesma dos dois lados, e por isso a
   passagem de uma para a outra não se percebe. */
.slide.camera{transform-origin:var(--camx,50%) var(--camy,50%)}
.slide.camera.dentro{animation:camEntra 653ms linear forwards}
.slide.camera.recua{animation:camEntra 653ms linear reverse forwards}
/* a câmera parada no fundo, enquanto o grão faz a parte dele */
.slide.camera.fundo{transform:scale(45.92)}

@keyframes camEntra{
  0%{transform:scale(1.00)}
  8.3%{transform:scale(1.04)}
  16.7%{transform:scale(1.17)}
  25.0%{transform:scale(1.40)}
  33.3%{transform:scale(1.78)}
  41.7%{transform:scale(2.39)}
  50.0%{transform:scale(3.36)}
  58.3%{transform:scale(4.91)}
  66.7%{transform:scale(7.42)}
  75.0%{transform:scale(11.48)}
  83.3%{transform:scale(18.07)}
  91.7%{transform:scale(28.76)}
  100%{transform:scale(45.92)}
}
@keyframes graoEngole{
  0%{transform:scale(45.92)}
  8.3%{transform:scale(70.21)}
  16.7%{transform:scale(106.46)}
  25.0%{transform:scale(159.17)}
  33.3%{transform:scale(233.44)}
  41.7%{transform:scale(334.00)}
  50.0%{transform:scale(463.66)}
  58.3%{transform:scale(621.16)}
  66.7%{transform:scale(798.71)}
  75.0%{transform:scale(980.42)}
  83.3%{transform:scale(1142.66)}
  91.7%{transform:scale(1257.60)}
  100%{transform:scale(1300.00)}
}
/* voando por dentro da foto o que se vê são os pixels dela — e é isso
   que se quer ver: a matéria deixando de ser imagem */
.slide.camera img,.slide.camera .caco b{image-rendering:pixelated}
/* O GRÃO QUE ENGOLE A TELA.
   Chegada a câmera ao fim do avanço, uma cópia do grão toma o lugar dele
   — do mesmo tamanho, no mesmo ponto, com o mesmo recorte: a troca não
   se vê. Essa cópia mora FORA do slide, e é isso que resolve o problema:
   ela continua crescendo depois que a câmera já voltou ao lugar, e é
   atrás dela que a cena inteira é substituída. Depois ela se apaga, e o
   que aparece por baixo é o retículo.
   Escala 1300: o recorte é um polígono de raio 33% a 50% da caixa, então
   o raio garantido é ~30% de 4,4px = 1,3px. Vezes 1300 dá 1716px, que
   passa dos 1468 da diagonal do palco — cobre de qualquer canto. */
.grao-cobre{
  position:absolute;z-index:37;pointer-events:none;
  width:var(--w);height:var(--w);
  margin:calc(var(--w) / -2) 0 0 calc(var(--w) / -2);
  background-image:var(--img);
  background-size:var(--bw) var(--bh);
  background-position:var(--bx) var(--by);
  image-rendering:pixelated;
  transform:scale(45.92);                  /* onde a câmera o deixou */
  transition:opacity .34s ease;
}
.grao-cobre.engole{animation:graoEngole 597ms linear forwards}
.grao-cobre.devolve{animation:graoEngole 597ms linear reverse forwards}

/* O grão de dentro do slide não tem mais animação própria: quem se move
   é a câmera, e ele é levado pela cena junto com todo o resto. */

/* unica saida do reticulo */
.q-voltar{
  position:absolute;left:38px;top:30px;
  padding:11px 22px 11px 16px;border-radius:999px;
  border:1px solid rgba(240,180,60,.55);
  background:linear-gradient(180deg,#4A3512 0%,#2A1D08 100%);
  color:var(--paper);font-family:var(--mono);font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;pointer-events:auto;
  box-shadow:0 0 22px rgba(240,180,60,.2);
  transition:border-color .2s,box-shadow .2s,transform .2s,opacity .3s;
  opacity:0;visibility:hidden;
}
.slide.rede-on .q-voltar{opacity:1;visibility:visible}
.q-voltar:hover{border-color:var(--amber);box-shadow:0 0 30px rgba(240,180,60,.45);transform:scale(1.05)}

/* REFAZER e RESETAR: a mesma pastilha.
   Os dois dizem "volte ao começo" — um devolve o campo de moléculas, o
   outro devolve o retículo — e moram na MESMA quina, porque nunca
   aparecem juntos: onde há campo não há rede, e vice-versa. Não havia
   por que falarem línguas diferentes, e o Resetar era a última pílula
   escrita que sobrava aqui dentro.

   Redondos e sem palavra: a seta em volta já é lida como "recomeçar" em
   qualquer aplicativo, e a pastilha ocupa menos canto do que a pílula
   escrita ocupava. Encostados na quina, longe do que se manuseia. */
.q-refazer,
.q-reset{
  position:absolute;right:18px;bottom:18px;
  width:52px;height:52px;padding:0;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid rgba(69,199,176,.5);
  background:linear-gradient(180deg,#12414A 0%,#0A2830 100%);
  color:var(--paper);cursor:pointer;pointer-events:auto;
  box-shadow:0 0 22px rgba(69,199,176,.2);
  transition:border-color .2s,box-shadow .2s,transform .2s,opacity .3s;
  opacity:0;visibility:hidden;
}
.q-refazer svg,
.q-reset   svg{display:block}
/* cada um acende no seu mundo: o campo de moléculas, a rede */
.slide.quantum-on .q-refazer{opacity:1;visibility:visible}
.slide.rede-on    .q-reset  {opacity:1;visibility:visible}
.q-refazer:hover,
.q-reset:hover{border-color:var(--aqua);box-shadow:0 0 30px rgba(69,199,176,.42);transform:scale(1.05)}

/* rótulo da célula unitária, no mundo quântico */
.cel-rot{
  position:absolute;z-index:9;pointer-events:none;
  transform:translate(-50%,0);opacity:0;
  font-family:var(--mono);font-size:19px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--aqua);
  text-shadow:0 4px 20px rgba(3,12,22,.9);
  transition:opacity .45s ease;
}
.cel-rot.on{opacity:1}
/* nome da estrutura inteira, embaixo dela */
.rede-rot{
  position:absolute;z-index:9;pointer-events:none;
  transform:translate(-50%,0);opacity:0;
  font-family:var(--mono);font-size:22px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--aqua);
  text-shadow:0 4px 20px rgba(3,12,22,.9);
  transition:opacity .5s ease;
}
.rede-rot.on{opacity:1}
.caco b{
  width:var(--w);height:var(--w);
  background-image:var(--img);
  background-size:var(--bw) var(--bh);
  background-position:var(--bx) var(--by);
  /* o recorte é irregular, então a sombra tem que seguir o contorno:
     drop-shadow segue o alfa, box-shadow seguiria o retângulo */
  filter:drop-shadow(0 1px 2px rgba(3,12,22,.95));
  animation:cacoSai .22s ease-out;
}
.caco.dragging b{filter:drop-shadow(0 3px 5px rgba(3,12,22,.95)) brightness(1.15)}
@keyframes cacoSai{
  from{transform:scale(3.2);filter:drop-shadow(0 1px 2px rgba(3,12,22,.95)) brightness(2.4)}
  to  {transform:scale(1);  filter:drop-shadow(0 1px 2px rgba(3,12,22,.95)) brightness(1)}
}
/* a falha que ficou na imagem, com o mesmo contorno do grão */
.buraco{
  position:absolute;pointer-events:none;
  width:var(--w);height:var(--w);
  margin:calc(var(--w) / -2) 0 0 calc(var(--w) / -2);
  background:rgba(2,8,14,.9);
  transition:opacity .3s ease;
}
.buraco.fecha{opacity:0}
/* o grão refazendo o caminho de volta até o buraco de onde saiu */
.caco.voltando-grao{
  pointer-events:none;
  transition:left .42s cubic-bezier(.3,.75,.35,1),
             top  .42s cubic-bezier(.3,.75,.35,1),
             opacity .2s ease .28s;
}
.caco.voltando-grao.sumindo{opacity:0}

/* Retículo montado no próprio slide, sem o escuro do mundo quântico: a
   caixa só marca a região, e a cena 3D é recortada nela. */
.rd-stage{
  width:calc(var(--base) * 1px * var(--k));
  height:calc(var(--base) * 0.78px * var(--k));
  pointer-events:none;
}
/* o item nunca recebe o dedo: quem lê o gesto do retículo é o slide */
.reveal-item.reticulo{pointer-events:none !important}

/* ---------- lupa: o retículo visto de perto, no escuro ---------- */
.rd-stage.lupa{position:relative;height:calc(var(--base) * 1px * var(--k))}
.lupa-vidro{
  position:absolute;left:3%;top:2%;width:78%;height:78%;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#123045 0%,#05131F 60%,#01070C 100%);
  box-shadow:inset 0 0 70px rgba(69,199,176,.14);
}
.lupa-aro{
  position:absolute;left:3%;top:2%;width:78%;height:78%;border-radius:50%;
  border:9px solid;
  border-color:#C2CCD4 #7C8892 #59636B #A6B2BA;
  box-shadow:0 8px 22px rgba(0,0,0,.65),inset 0 0 0 2px rgba(255,255,255,.14);
}

/* ---------- tabela periódica dos representativos ---------- */
.tp-stage{
  position:relative;width:507px;height:262px;
  transform:scale(calc(var(--base) / 507 * var(--k)));
  transform-origin:center center;
}
.tp{display:flex;align-items:stretch;gap:3px;position:absolute;bottom:0;left:0}
.tp-col{
  display:flex;flex-direction:column;gap:3px;position:relative;
  transition:transform .34s cubic-bezier(.2,.85,.3,1);
}
.tp-col.sobe{transform:translateY(-37px)}
/* o número de elétrons de valência, que aparece com a família levantada */
.tp-e{
  position:absolute;left:50%;top:-27px;transform:translateX(-50%);
  font-family:var(--mono);font-size:16.8px;color:var(--amber);
  opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap;
}
.tp-col.sobe .tp-e{opacity:1}
.tp-cab{
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  color:var(--aqua);text-align:center;cursor:pointer;text-decoration:none;
  padding-bottom:3px;border-bottom:1px solid rgba(69,199,176,.35);
  transition:color .2s,border-color .2s;
}
.tp-cab:hover{color:var(--paper);border-color:var(--aqua)}
.tp-col.sobe .tp-cab{color:var(--amber);border-color:var(--amber)}
.tp-col{cursor:pointer}
.tp-el,.tp-vazio{
  width:48px;height:34px;display:grid;place-items:center;
  font-family:var(--display);font-weight:600;font-size:15px;color:var(--paper);
  border:1px solid rgba(232,241,245,.18);border-radius:2px;
  background:rgba(20,48,72,.55);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
/* número atômico acima do símbolo, miúdo e discreto: ele informa, mas
   quem a turma procura na tabela é a letra */
.tp-el{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1;gap:1px;
}
.tp-el i{
  font-style:normal;font-family:var(--mono);font-weight:400;
  font-size:8.5px;letter-spacing:.03em;color:var(--paper-dim);
}
.tp-col.sobe .tp-el i{color:rgba(240,180,74,.8)}
.tp-el.escolhido i{color:#BFF5D0}

/* O GÁS NOBRE QUE A AJUDA APONTA.
   Pedir ajuda não devolve só uma ficha ao lado: acende também o lugar
   dele na tabela, em âmbar — a mesma cor do botão que foi tocado, para
   que uma coisa se leia como resposta da outra. Cresce 10% e sobe de
   camada, senão os vizinhos cortariam a borda acesa. */
.tp-el.nobre{
  position:relative;z-index:3;
  transform:scale(1.1);
  color:#FFE6B0;
  border-color:var(--amber);border-width:2px;
  background:linear-gradient(180deg,#6B4E14 0%,#3A2A08 100%);
  box-shadow:0 0 0 2px rgba(240,180,74,.3),0 0 26px rgba(240,180,74,.75);
  animation:nobreAceso 1.9s ease-in-out infinite;
}
.tp-el.nobre i{color:#FFD98A}
@keyframes nobreAceso{
  0%,100%{box-shadow:0 0 0 2px rgba(240,180,74,.28),0 0 20px rgba(240,180,74,.55)}
  50%    {box-shadow:0 0 0 4px rgba(240,180,74,.16),0 0 34px rgba(240,180,74,.95)}
}
.tp-vazio{border-color:transparent;background:none}
/* só a família levantada aceita escolha de elemento */
.tp-col.sobe .tp-el{cursor:pointer;border-color:rgba(240,180,74,.5);
                    background:rgba(58,42,18,.55)}
.tp-col.sobe .tp-el:hover{border-color:var(--amber)}
/* O elemento escolhido fica em VERDE: a família levantada é âmbar, então
   o verde separa "a família que estou vendo" de "o elemento que escolhi". */
.tp-el.escolhido{
  border-color:#4BE07A;border-width:2px;
  background:linear-gradient(180deg,#1F6B37 0%,#0E3A1D 100%);
  color:#DFFFE8;
  box-shadow:0 0 0 2px rgba(75,224,122,.28),0 0 26px rgba(75,224,122,.7);
  animation:elEscolhido 1.8s ease-in-out infinite;
}
@keyframes elEscolhido{
  0%,100%{box-shadow:0 0 0 2px rgba(75,224,122,.28),0 0 20px rgba(75,224,122,.55)}
  50%    {box-shadow:0 0 0 4px rgba(75,224,122,.16),0 0 34px rgba(75,224,122,.9)}
}
/* o bloco que não entra na conta */
.tp-trans{display:flex;align-items:flex-end;width:96px}
.tp-trans span{
  width:100%;height:110px;border:1px dashed rgba(232,241,245,.22);border-radius:3px;
  display:grid;place-items:center;text-align:center;padding:4px;
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;line-height:1.3;
  color:var(--paper-dim);
}

/* ---------- representação de Lewis ---------- */
.lw-stage{
  position:relative;width:150px;height:150px;
  transform:scale(calc(var(--base) / 150 * var(--k)));
  transform-origin:center center;
  display:grid;place-items:center;
}
.lw-vazio{
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  color:var(--paper-dim);text-align:center;line-height:1.5;
}
.lw{position:relative;width:112px;height:112px;display:grid;place-items:center;
    animation:lwEntra .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes lwEntra{from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1}}
.lw-sim{font-family:var(--display);font-weight:600;font-size:53px;color:var(--paper);
        text-shadow:0 6px 26px rgba(3,12,22,.8)}
/* Cada lado é centrado no símbolo. Um elétron sozinho fica na linha do
   meio; dois ou três se abrem simétricos em torno dela — nunca soltos
   para um lado só. */
.lw-e{
  position:absolute;width:9px;height:9px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 12px rgba(240,180,74,.85);
}
.lw-e.r-c,.lw-e.r-a,.lw-e.r-b{right:8px;top:50%}
.lw-e.l-c,.lw-e.l-a,.lw-e.l-b{left:8px;top:50%}
.lw-e.r-c,.lw-e.l-c{transform:translateY(-50%)}
.lw-e.r-a,.lw-e.l-a{transform:translateY(calc(-50% - 12px))}
.lw-e.r-b,.lw-e.l-b{transform:translateY(calc(-50% + 12px))}

.lw-e.t-c,.lw-e.t-a,.lw-e.t-b{top:8px;left:50%}
.lw-e.b-c,.lw-e.b-a,.lw-e.b-b{bottom:8px;left:50%}
.lw-e.t-c,.lw-e.b-c{transform:translateX(-50%)}
.lw-e.t-a,.lw-e.b-a{transform:translateX(calc(-50% - 12px))}
.lw-e.t-b,.lw-e.b-b{transform:translateX(calc(-50% + 12px))}

/* o símbolo de Lewis treme como o átomo do slide 7, nos mesmos graus */
.lw-stage.inst1 .lw{animation:molShake .40s linear infinite, qmAlert  1.6s ease-in-out infinite}
.lw-stage.inst2 .lw{animation:molShake .26s linear infinite, qmAlert  1.1s ease-in-out infinite}
.lw-stage.inst3 .lw{animation:shakeHard .16s linear infinite, qmAlert2 .6s ease-in-out infinite}
.lw-stage.inst4 .lw{animation:shakeWild .09s linear infinite, qmAlert3 .3s ease-in-out infinite}
.lw-stage.certo .lw{animation:lwCerto 1.5s ease-in-out 3 !important}
@keyframes lwCerto{
  0%,100%{filter:drop-shadow(0 0 10px rgba(75,224,122,.55))}
  50%    {filter:drop-shadow(0 0 30px rgba(75,224,122,1))}
}
.lw-stage.certo .lw-sim{color:#DFFFE8}

/* ---------- bico de Meker-Fisher com cápsula de porcelana ---------- */
