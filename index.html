    ay: parseFloat(at.style.getPropertyValue('--y')),
    k: fitScale || 1
  };
  try { at.setPointerCapture(e.pointerId); } catch (_){}
  at.classList.add('levando');
});

document.addEventListener('pointermove', (e) => {
  const g = levaAtomo;
  if (!g || e.pointerId !== g.id) return;
  /* andou o bastante para não ser mais um toque: marca antes de qualquer
     saída antecipada, senão o puxão que ainda não rompeu a ligação
     passaria por toque quando o dedo saísse */
  if (Math.hypot(e.clientX - g.x, e.clientY - g.y) > 5) g.mexeu = true;
  let dx = (e.clientX - g.x) / g.k, dy = (e.clientY - g.y) / g.k;

  /* MOLÉCULA DE BRAÇOS: o centro não sai do lugar — o dedo nele só serve
     para acender o anel —, e o braço se arranca da sua própria ligação,
     sem tocar na do vizinho. */
  if (g.sp.classList.contains('ramos')){
    if (!g.at.classList.contains('ramo')) return;
    if (!g.at.classList.contains('solto')){
      if (Math.hypot(dx, dy) < SEP_PUXAO) return;
      quebraRamo(g.sp, g.at, g.qm);
      g.x = e.clientX; g.y = e.clientY;
      g.ax = parseFloat(g.at.style.getPropertyValue('--x'));
      g.ay = parseFloat(g.at.style.getPropertyValue('--y'));
      dx = dy = 0;
    }
    let rx = Math.min(SEP_W + SEP_SOLTA, Math.max(-SEP_SOLTA, g.ax + dx));
    let ry = Math.min(SEP_H + SEP_SOLTA, Math.max(-SEP_SOLTA, g.ay + dy));
    /* matéria não atravessa matéria: o braço esbarra no centro e para,
       e o fundo do curso é justo a casa dele — daí voltar sozinho a
       quem o empurrar contra o oxigênio até não dar mais */
    const centro = g.sp.querySelector('.qsp-at.centro');
    if (centro){
      const ox = parseFloat(centro.style.getPropertyValue('--x'));
      const oy = parseFloat(centro.style.getPropertyValue('--y'));
      const min = +g.at.dataset.d || 0;
      let vx = rx - ox, vy = ry - oy;
      const L = Math.hypot(vx, vy);
      if (L < min){
        if (L < .01){ vx = 1; vy = 0; }
        const n = Math.hypot(vx, vy);
        rx = ox + vx / n * min;
        ry = oy + vy / n * min;
      }
    }
    g.at.style.setProperty('--x', rx.toFixed(1) + 'px');
    g.at.style.setProperty('--y', ry.toFixed(1) + 'px');
    orientaRamos(g.sp);
    poeRamos(g.sp);
    miraRamos(g.sp, g.qm);
    return;
  }

  /* Montada, ela só se abre depois de um puxão de verdade: um roçar no
     átomo não pode desmanchar a molécula sem querer. Vale para a que
     nasceu ligada e para a que o aluno acabou de fechar. */
  if (!g.sp.classList.contains('solto')){
    if (Math.hypot(dx, dy) < SEP_PUXAO) return;
    separaAtomos(g.sp, g.qm);
    /* rebaseia o arrasto no ponto em que a ligação cedeu: sem isto o
       átomo saltaria de uma vez o tamanho inteiro do puxão */
    g.x = e.clientX; g.y = e.clientY;
    g.ax = parseFloat(g.at.style.getPropertyValue('--x'));
    g.ay = parseFloat(g.at.style.getPropertyValue('--y'));
    dx = dy = 0;
  }
  let nx = Math.min(SEP_W + SEP_SOLTA, Math.max(-SEP_SOLTA, g.ax + dx));
  let ny = Math.min(SEP_H + SEP_SOLTA, Math.max(-SEP_SOLTA, g.ay + dy));

  /* MATÉRIA NÃO ATRAVESSA MATÉRIA.
     O átomo esbarra no outro e para: por mais que o dedo insista, ele
     desliza pela borda em vez de entrar. E o raio dessa parede é a
     própria distância da molécula — o fundo do curso é exatamente o
     ponto em que os dois elétrons solteiros ficam lado a lado.
     Daí o encaixe ser automático venha o dedo de onde vier: basta
     empurrar um átomo contra o outro até não dar mais. */
  const outro = [...g.sp.querySelectorAll('.qsp-at')].find(x => x !== g.at);
  if (outro){
    const ox = parseFloat(outro.style.getPropertyValue('--x'));
    const oy = parseFloat(outro.style.getPropertyValue('--y'));
    const min = +g.sp.dataset.dist || 0;
    let vx = nx - ox, vy = ny - oy;
    const L = Math.hypot(vx, vy);
    if (L < min){
      /* centro sobre centro não tem direção: empurra para um lado
         qualquer em vez de dividir por zero */
      if (L < .01){ vx = 1; vy = 0; }
      const n = Math.hypot(vx, vy);
      nx = ox + vx / n * min;
      ny = oy + vy / n * min;
    }
  }

  g.at.style.setProperty('--x', nx.toFixed(1) + 'px');
  g.at.style.setProperty('--y', ny.toFixed(1) + 'px');
  orientaEletrons(g.sp);                   /* os dois solteiros se seguem */
  miraEncaixe(g.sp, g.qm);
});

/* Devolve a molécula ao tamanho dela. Vale para as duas espécies: a
   chapada volta a ser o desenho de sempre, e a de três dimensões só
   encolhe — ela não foi montada para ser ampliada, ela já era objeto. */
function encolheMol(m){
  if (!m || !m.classList.contains('big')) return;
  m.classList.remove('big', 'assentou', 'girando');
  m.style.setProperty('--k', +m.dataset.k0 || 1);
  if (!eh3D(m.dataset.mol)) m.innerHTML = MOL_SVG(m.dataset.mol || 'h2o');
}

/* ------------------------------------------------------------
   VIRAR A MOLÉCULA NA MÃO
   Ampliada, a molécula tridimensional deixa de andar e passa a
   girar: é o gesto de examinar um objeto, e é o único que faz
   sentido com uma pirâmide — de frente ela é um triângulo, e é
   virando que se vê que os três hidrogênios estão ABAIXO do
   nitrogênio, e não em volta dele.

   O ponto de controle é a MÉDIA dos dedos que estiverem nela.
   Assim o mesmo código serve aos dois casos: um dedo (ou o mouse
   do computador) gira, e dois dedos numa tela de toque giram
   igual, sem que a segunda mão mude o comportamento nem deixe o
   navegador levar o gesto para o seu próprio zoom.

   O giro vertical para nos 85°: passar do polo viraria a molécula
   de cabeça para baixo e o eixo horizontal se inverteria na mão,
   que é a hora em que quem gira perde a noção de onde está.
   ------------------------------------------------------------ */
let giraMol = null;
const mediaDedos = (pts) => {
  let x = 0, y = 0;
  pts.forEach(p => { x += p.x; y += p.y; });
  return { x: x / pts.size, y: y / pts.size };
};
function poeGiro(el){
  const m3 = el.querySelector('.m3');
  if (!m3) return;
  m3.style.setProperty('--rx', (+el.dataset.rx || 0).toFixed(1) + 'deg');
  m3.style.setProperty('--ry', (+el.dataset.ry || 0).toFixed(1) + 'deg');
}

deck.addEventListener('pointerdown', (e) => {
  const mol = e.target.closest('.qm.tri.big');
  if (!mol) return;
  e.preventDefault();
  if (!giraMol || giraMol.el !== mol)
    giraMol = { el: mol, pts: new Map() };
  giraMol.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  /* a cada dedo que entra ou sai, o gesto recomeça do estado atual:
     senão a molécula daria um salto ao mudar o ponto de controle */
  const c = mediaDedos(giraMol.pts);
  giraMol.x = c.x; giraMol.y = c.y;
  /* de onde o gesto partiu, para saber no fim se foi giro ou TOQUE: o
     arrasto gira a molécula, o toque a devolve ao tamanho dela */
  if (giraMol.x0 === undefined){ giraMol.x0 = c.x; giraMol.y0 = c.y; }
  giraMol.rx = +mol.dataset.rx || 0;
  giraMol.ry = +mol.dataset.ry || 0;
  try { mol.setPointerCapture(e.pointerId); } catch (_){}
  mol.classList.add('girando');
});

document.addEventListener('pointermove', (e) => {
  const g = giraMol;
  if (!g || !g.pts.has(e.pointerId)) return;
  g.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const c = mediaDedos(g.pts);
  if (Math.hypot(c.x - g.x0, c.y - g.y0) > 5) g.mexeu = true;
  const k = fitScale || 1;
  const rx = g.rx - (c.y - g.y) / k * 0.42;
  const ry = g.ry + (c.x - g.x) / k * 0.42;
  g.el.dataset.rx = Math.max(-85, Math.min(85, rx)).toFixed(1);
  g.el.dataset.ry = ry.toFixed(1);
  poeGiro(g.el);
});

function soltaGiro(e){
  const g = giraMol;
  if (!g || !e || !g.pts.has(e.pointerId)) return;
  g.pts.delete(e.pointerId);
  if (!g.pts.size){
    g.el.classList.remove('girando');
    /* dedo parado: foi toque, e o toque devolve a molécula ao tamanho
       dela — o mesmo que o toque faz em qualquer outra ampliada. Sem
       isto ela ficaria grande para sempre, porque o guarda do arrasto
       impede que o toque chegue ao caminho comum. */
    if (!g.mexeu) encolheMol(g.el);
    giraMol = null;
    return;
  }
  /* sobrou dedo na tela: o gesto continua, rebaseado no que ficou */
  const c = mediaDedos(g.pts);
  g.x = c.x; g.y = c.y;
  g.rx = +g.el.dataset.rx || 0;
  g.ry = +g.el.dataset.ry || 0;
}
document.addEventListener('pointerup', soltaGiro);
document.addEventListener('pointercancel', soltaGiro);

/* O anel sai em fade, e para isso precisa sobreviver ao fim da classe
   que o acendeu: 'oct-sai' o segura em cena o tempo do apagamento. O
   temporizador fica guardado no próprio elemento, para que acender de
   novo no meio do fade cancele a limpeza pendente. */
const OCT_SAI = 340;
function apagaOcteto(at){
  if (!at.classList.contains('octeto')) return;
  at.classList.remove('octeto');
  at.classList.add('oct-sai');
  clearTimeout(at._octT);
  at._octT = setTimeout(() => at.classList.remove('oct-sai'), OCT_SAI);
}
function acendeOcteto(at){
  clearTimeout(at._octT);
  at.classList.remove('oct-sai');
  at.classList.add('octeto');
}

/* Toque no átomo da molécula pronta: acende o anel dos oito elétrons
   dele. No MESMO átomo, o toque seguinte apaga. No VIZINHO, o anel
   muda de dono — o novo acende e o velho se apaga sozinho, porque a
   conta que se está fazendo passou a ser a do outro átomo, e as duas
   ao mesmo tempo não diriam nada.
   Fora do estado montado não há oito para cercar, e nada acontece. */
function tocaAtomo(at, sp){
  if (!sp.classList.contains('feito')) return;
  /* na molécula de braços, faltando um braço não há oito para cercar */
  if (sp.classList.contains('ramos') && sp.classList.contains('incompleta')) return;
  const jaEra = at.classList.contains('octeto');
  sp.querySelectorAll('.qsp-at.octeto').forEach(apagaOcteto);
  if (!jaEra) acendeOcteto(at);
}

function largaAtomo(e){
  const g = levaAtomo;
  if (!g || (e && e.pointerId !== g.id)) return;
  levaAtomo = null;
  g.at.classList.remove('levando');
  if (!g.mexeu) tocaAtomo(g.at, g.sp);   /* dedo parado: foi toque, não arrasto */
}
document.addEventListener('pointerup', largaAtomo);
document.addEventListener('pointercancel', largaAtomo);

/* Uma molécula fica instável por duas razões: falta um átomo dela,
   ou um átomo solto está encostando nela. */
const marcaInstavel = (mol) => mol && mol.classList.toggle('unstable',
  !!mol.querySelector('.qat.torn') || mol.dataset.near === '1');

/* ------------------------------------------------------------
   As moléculas se juntam em volta do objeto, e não pela tela toda:
   o mergulho é numa gota daquela substância, no lugar onde ela está.
   Se o objeto estiver muito na borda, o grupo escorrega o mínimo
   necessário para caber inteiro no palco.
   ------------------------------------------------------------ */
function agrupaEmVolta(bolas, cx, cy){
  if (!bolas.length) return;
  const grande = bolas[0].classList.contains('qmol');
  const cols = bolas.length > 8 ? 5 : 3;
  const lin  = Math.ceil(bolas.length / cols);
  const px = grande ? 330 : 150, py = grande ? 250 : 132;

  const meiaL = ((cols - 1) * px + (lin > 1 ? px / 2 : 0)) / 2 + px / 2;
  const meiaA = ((lin - 1) * py) / 2 + py / 2;
  const gx = Math.max(meiaL + 20, Math.min(1260 - meiaL, cx));
  const gy = Math.max(meiaA + 20, Math.min(700 - meiaA, cy));

  bolas.forEach((m, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const desloca = r % 2 ? px / 2 : 0;     /* fileiras alternadas, como tijolo */
    const cx2 = gx + (c - (cols - 1) / 2) * px + desloca;
    const cy2 = gy + (r - (lin - 1) / 2) * py;
    /* .qmol é centrada pelo transform; .qm é posicionada pelo canto */
    let lx = cx2, ly = cy2;
    if (!m.classList.contains('qmol')){
      const k = parseFloat(m.style.getPropertyValue('--k')) || 1;
      lx -= 26 * k; ly -= 19 * k;
    }
    m.style.left = lx.toFixed(0) + 'px';
    m.style.top  = ly.toFixed(0) + 'px';
    m.dataset.ox = 0; m.dataset.oy = 0;
    /* o átomo arrancado volta para a casa dele dentro da nova posição */
    m.querySelectorAll('.qat.end').forEach(a => {
      a.classList.remove('torn', 'jitter', 'flyback');
      a.style.left = a.dataset.hx + 'px';
      a.style.top  = a.dataset.hy + 'px';
    });
    m.querySelectorAll('.qbond').forEach(b => b.classList.remove('snap', 'broken'));
    m.classList.remove('unstable');
  });
}

/* raio que a receita ocupa dentro da caixa de 52 x 38 */
const raioBase = (rec) => Math.max(...rec.map(([el, x, y, r]) =>
  Math.hypot(x / 100 * 52 - 26, y / 100 * 38 - 19) + r));

/* congela a deriva e anota o deslocamento atual de cada bola */
function congelaBolas(campo){
  if (!campo) return;
  campo.classList.add('freeze');
  campo.querySelectorAll('.qm').forEach(m => {
    const t = getComputedStyle(m).transform;
    let ox = 0, oy = 0;
    if (t && t !== 'none'){
      const n = t.slice(t.indexOf('(') + 1, -1).split(',').map(Number);
      if (t.indexOf('matrix3d') === 0){ ox = n[12] || 0; oy = n[13] || 0; }
      else                            { ox = n[4]  || 0; oy = n[5]  || 0; }
    }
    m.dataset.ox = ox; m.dataset.oy = oy;
  });
}
const soltaBolas = (campo) => campo && campo.classList.remove('freeze');

const medeBola = (m) => {
  const k = parseFloat(m.style.getPropertyValue('--k')) || 1;
  return { el: m,
    x: parseFloat(m.style.left) + 26 * k + (+m.dataset.ox || 0),
    y: parseFloat(m.style.top)  + 19 * k + (+m.dataset.oy || 0),
    r: (parseFloat(m.dataset.rad) || 15) * k, bate: false };
};
/* devolve os pares que estão se encostando */
function paresEncostados(campo){
  const todas = [...campo.querySelectorAll('.qm')].map(medeBola);
  const pares = [];
  for (let i = 0; i < todas.length; i++)
    for (let j = i + 1; j < todas.length; j++){
      const a = todas[i], b = todas[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) <= a.r + b.r + 4){
        a.bate = b.bate = true; pares.push([a, b]);
      }
    }
  return { todas, pares };
}

let conflitoT = null, conflitoEtapas = [];

function paraConflito(){
  clearTimeout(conflitoT); conflitoT = null;
  conflitoEtapas.forEach(clearTimeout); conflitoEtapas = [];
}

/* Soltou o dedo com as bolas encostadas: sem a mão segurando, a
   tensão sobe de uma vez e elas se arremessam. */
function escalaESepara(campo){
  if (conflitoT || !campo) return;
  const sobe = (cls) => campo.querySelectorAll('.qm.unstable')
    .forEach(m => m.classList.add(cls));
  sobe('u2');                                /* já solta no nível agressivo */
  conflitoEtapas = [ setTimeout(() => sobe('u3'), 600) ];
  conflitoT = setTimeout(() => repeleBolas(campo), 1400);
}

const decora = (campo, cls, x, y, extra) => {
  const el = document.createElement('i');
  el.className = cls;
  if (x !== undefined){ el.style.left = x + 'px'; el.style.top = y + 'px'; }
  if (extra) el.style.background = extra;
  campo.appendChild(el);
  setTimeout(() => el.remove(), 700);
};

/* estouram e se arremessam para longe uma da outra */
function repeleBolas(campo){
  paraConflito();
  const { todas, pares } = paresEncostados(campo);
  if (!pares.length){ limpaConflito(campo); return; }

  const empurra = new Map();
  pares.forEach(([a, b]) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    [[a, -ux, -uy], [b, ux, uy]].forEach(([q, vx, vy]) => {
      const v = empurra.get(q.el) || { x: 0, y: 0 };
      empurra.set(q.el, { x: v.x + vx, y: v.y + vy });
    });
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    decora(campo, 'qburst', mx, my);
    decora(campo, 'qflash', undefined, undefined,
      `radial-gradient(circle at ${mx}px ${my}px,rgba(255,190,130,.55),rgba(255,140,80,0) 62%)`);
  });

  campo.classList.add('freeze');             /* o arremesso não disputa com a deriva */
  empurra.forEach((v, el) => {
    const n = Math.hypot(v.x, v.y) || 1;
    el.classList.add('repel');
    el.style.left = Math.max(-30, Math.min(1230,
      parseFloat(el.style.left) + v.x / n * 210)) + 'px';
    el.style.top  = Math.max(-20, Math.min(660,
      parseFloat(el.style.top)  + v.y / n * 210)) + 'px';
  });

  setTimeout(() => limpaConflito(campo), 640);
}

function limpaConflito(campo){
  if (!campo) return;
  campo.querySelectorAll('.qm').forEach(m =>
    m.classList.remove('repel', 'unstable', 'u2', 'u3'));
  campo.classList.remove('freeze');
}

/* bolas que se encostam ficam instáveis — inclusive as que já estavam
   paradas juntas, por isso a varredura é de todas contra todas */
function checaBolas(campo){
  if (!campo || campo.dataset.mono !== '1') return;   /* só gás nobre */
  const { todas, pares } = paresEncostados(campo);
  /* em tempo real, enquanto o dedo leva a bola: as duas que se encostam
     ficam instáveis na hora. A escalada só vem quando o dedo sai. */
  todas.forEach(a => {
    a.el.classList.toggle('unstable', a.bate);
    if (!a.bate) a.el.classList.remove('u2', 'u3');
  });
}

/* posição e raio de um átomo em coordenadas do palco */
function atomoNoPalco(at){
  const mol = at.closest('.qmol');
  if (!mol) return null;
  return {
    x: parseFloat(mol.style.left) - SPLIT_W / 2 + parseFloat(at.style.left),
    y: parseFloat(mol.style.top)  - SPLIT_H / 2 + parseFloat(at.style.top),
    r: parseFloat(at.style.getPropertyValue('--r')) || 0
  };
}

/* o átomo arrancado desestabiliza quem ele encostar pelo caminho */
function checaVizinhanca(at){
  const campo = at.closest('.quantum, .pn-q');
  const minha = at.closest('.qmol');
  const meu = atomoNoPalco(at);
  if (!campo || !meu) return;

  campo.querySelectorAll('.qmol').forEach(mol => {
    if (mol === minha) return;
    let encosta = false;
    mol.querySelectorAll('.qat').forEach(o => {
      if (encosta) return;
      const p = atomoNoPalco(o);
      if (p && Math.hypot(p.x - meu.x, p.y - meu.y) <= p.r + meu.r + 6) encosta = true;
    });
    if ((mol.dataset.near === '1') !== encosta){
      mol.dataset.near = encosta ? '1' : '';
      marcaInstavel(mol);
    }
  });
}

/* solto o átomo, ninguém mais está sendo perturbado */
function acalmaVizinhanca(campo){
  if (!campo) return;
  campo.querySelectorAll('.qmol[data-near="1"]').forEach(mol => {
    mol.dataset.near = '';
    marcaInstavel(mol);
  });
}

const pecaDe = (mol, sel, i) => mol && mol.querySelector(`${sel}[data-for="${i}"]`);
const repete = (el, cls) => { if (el){ el.classList.remove(cls); void el.offsetWidth;
                                      el.classList.add(cls); } };

/* rompe a ligação do átomo arrancado */
function breakBond(at){
  const mol    = at.closest('.qmol');
  const bond   = pecaDe(mol, '.qbond',   at.dataset.i);
  const spark  = pecaDe(mol, '.qspark',  at.dataset.i);
  const splash = pecaDe(mol, '.qsplash', at.dataset.i);

  at.classList.remove('flyback', 'snapped', 'jitter');
  void at.offsetWidth;
  at.classList.add('torn');
  if (mol) mol.classList.remove('settled');
  /* o coice vem primeiro; o tremor entra quando ele termina */
  setTimeout(() => { if (at.classList.contains('torn')) at.classList.add('jitter'); }, 420);

  if (bond){
    bond.classList.remove('form', 'broken');
    void bond.offsetWidth;
    bond.classList.add('snap');
    /* passado o estouro, sobra o coto piscando: a valência que ficou aberta */
    setTimeout(() => {
      if (!at.classList.contains('torn')) return;
      bond.classList.remove('snap');
      bond.classList.add('broken');
    }, 380);
  }
  repete(spark, 'go');
  repete(splash, 'go');                    /* o esguicho de estilhaços */
  marcaInstavel(mol);
}

/* solto, o átomo volta voando e a ligação se refaz */
function healBond(at){
  const mol   = at.closest('.qmol');
  const bond  = pecaDe(mol, '.qbond',  at.dataset.i);
  const spark = pecaDe(mol, '.qspark', at.dataset.i);

  acalmaVizinhanca(at.closest('.quantum, .pn-q'));
  at.classList.remove('jitter');           /* volta em linha reta, sem tremer */
  at.classList.add('flyback');
  at.style.left = at.dataset.hx + 'px';
  at.style.top  = at.dataset.hy + 'px';
  repete(spark, 'join');                   /* o anel se fecha enquanto ele volta */

  setTimeout(() => {
    at.classList.remove('flyback', 'torn', 'jitter');
    marcaInstavel(mol);                    /* completa de novo: para de tremer */
    repete(at, 'snapped');
    if (bond){
      bond.classList.remove('snap', 'broken');
      void bond.offsetWidth;
      bond.classList.add('form');
    }
    if (mol && !mol.classList.contains('unstable')) repete(mol, 'settled');
    setTimeout(() => {
      at.classList.remove('snapped');
      if (mol) mol.classList.remove('settled');
    }, 620);
  }, 420);
}
const ORBIT_RX = -17, ORBIT_RY = 27;       /* inclinação de partida da rede aberta */
let zoomAbertoEm = 0;                      /* instante da última abertura do zoom */
const FOLLOW_MS = 380;                     /* intervalo padrão da cascata automática
                                              (follow: 0 faz sair no mesmo instante) */

/* mergulho no mundo quântico: o copo vai ao centro do palco e cresce */
function openQuantum(it){
  const slide = it.closest('.slide');
  if (!slide) return;
  /* o copo não sai do lugar: é a câmera que vai até ele, e tudo
     no fundo se abre a partir deste ponto */
  const q = slide.querySelector('.quantum');
  povoaCampo(q, it);
  it.classList.add('zoomed');
  slide.classList.add('quantum-on');
  /* a partir daqui o objeto fica pointer-events:none, então o "click"
     desta mesma tocada será roteado para o fundo. Marcamos a hora para
     o ouvinte global não confundir a abertura com um pedido de saída. */
  zoomAbertoEm = Date.now();
}

/* Escreve os rótulos do mundo quântico. A lista vem de fora como
   [texto, x, y, classe?], e é refeita a cada abertura — assim o que está
   escrito é sempre o do recipiente que se abriu, e um mergulho não
   herda o rótulo do anterior. */
function poeTitulos(q, lista){
  const cx = q && q.querySelector('.q-tits');
  if (!cx) return;
  const mv = QTIT_MOVEL ? ' movel' : '';
  cx.innerHTML = (lista || []).filter(r => r && r[0]).map(([t, x, y, cls]) =>
    `<div class="q-tit${cls ? ' ' + cls : ''}${mv}"`
    + ` style="left:${+x || 0}px;top:${+y || 0}px">${t}</div>`).join('');
}

/* ROTULOS DO MERGULHO EM MODO DE POSICIONAMENTO — provisório.
   Com isto em true os textos escritos dentro do mundo quântico podem
   ser arrastados, e o painel do C devolve onde ficaram. Depois é só
   voltar para false: eles voltam a ser intocáveis, como todo rótulo, e
   não há como esbarrar num deles no meio da aula. */
const QTIT_MOVEL = false;

let levaTit = null;
deck.addEventListener('pointerdown', (e) => {
  const t = e.target.closest && e.target.closest('.q-tit.movel');
  if (!t) return;
  e.preventDefault(); e.stopPropagation();
  const p = pontoPalco(e);
  /* guarda a distância entre o dedo e o centro do rótulo: sem isso ele
     saltaria para debaixo do dedo no primeiro movimento */
  levaTit = { el: t, id: e.pointerId,
              dx: (parseFloat(t.style.left) || 0) - p.x,
              dy: (parseFloat(t.style.top)  || 0) - p.y };
  try { t.setPointerCapture(e.pointerId); } catch (_){}
  t.classList.add('pegando');
});
document.addEventListener('pointermove', (e) => {
  const g = levaTit;
  if (!g || e.pointerId !== g.id) return;
  const p = pontoPalco(e);
  g.el.style.left = (p.x + g.dx).toFixed(0) + 'px';
  g.el.style.top  = (p.y + g.dy).toFixed(0) + 'px';
  e.stopPropagation();
});
function largaTit(e){
  if (!levaTit || (e && e.pointerId !== levaTit.id)) return;
  levaTit.el.classList.remove('pegando');
  levaTit = null;
}
document.addEventListener('pointerup', largaTit);
document.addEventListener('pointercancel', largaTit);

/* Enche o campo com a substância do recipiente e agrupa tudo no ponto do
   mergulho: é o estado inicial do mundo quântico. Ficou numa função à
   parte porque o botão Refazer precisa exatamente disto — devolver tudo
   ao começo sem sair de lá e entrar de novo. */
function povoaCampo(q, it){
  if (q && it){
    q.style.setProperty('--qox', parseFloat(it.style.left) + 'px');
    q.style.setProperty('--qoy', parseFloat(it.style.top)  + 'px');
    /* cada substância mostra a sua própria molécula */
    const key = it.dataset.mol || 'h2o';
    const rec = RECIPES[key] || RECIPES.h2o;
    /* substância de molécula tridimensional: o que se põe no campo é o
       objeto montado, e não o desenho chapado */
    const tri = eh3D(key);
    const desenho = tri ? MOL_3D(key) : MOL_SVG(key);
    const raio = raioBase(rec);
    /* gás nobre é uma esfera só: sai maior, para ocupar o mesmo peso visual */
    const mono = rec.length === 1;
    /* molécula 20% maior; átomo isolado, o dobro. qk no recipiente ajusta
       isso só naquele mergulho — o Cl2 do slide da covalente pede 1.3
       porque ali a ligação é o assunto e ela precisa ser vista de longe. */
    const escala = (mono ? 2 : 1.2) * (+it.dataset.qk || 1);
    /* Só átomo isolado se incomoda com a vizinhança. Molécula encostando
       em molécula é o normal da matéria — ali não há instabilidade nenhuma. */
    q.dataset.mono = mono ? '1' : '';
    q.classList.remove('freeze');
    const bolas = [...q.querySelectorAll('.qm')];
    bolas.forEach(m => {
      m.style.background = '';               /* o desenho é SVG, não fundo */
      m.innerHTML = desenho;                 /* cada substância, a sua molécula */
      m.dataset.rad = raio;
      m.dataset.k0  = escala;
      m.dataset.mol = key;                   /* quem é ela, para o modo separável */
      m.style.setProperty('--k', escala);
      m.classList.toggle('tri', tri);
      m.classList.remove('unstable', 'big', 'assentou', 'girando');
      /* cada uma nasce virada de um jeito: um campo de pirâmides todas
         no mesmo ângulo pareceria um padrão estampado, e não matéria */
      if (tri){
        const j = bolas.indexOf(m);
        m.dataset.rx = (-24 + (j * 37) % 40).toFixed(0);
        m.dataset.ry = ((j * 63) % 360).toFixed(0);
        const m3 = m.querySelector('.m3');
        if (m3){
          m3.style.setProperty('--rx', m.dataset.rx + 'deg');
          m3.style.setProperty('--ry', m.dataset.ry + 'deg');
        }
      }
    });
    /* Os rótulos moram aqui dentro, e não no slide: eles falam do que se
       está vendo por dentro. Cada um traz o seu ponto e, se quiser, uma
       classe de estilo. */
    let tits = null;
    if (it.dataset.qtit){
      try { tits = JSON.parse(it.dataset.qtit); } catch (err){ tits = null; }
    }
    poeTitulos(q, tits);
    /* A câmera mergulha no recipiente, mas as moléculas podem se juntar
       noutro canto: qx/qy dizem onde. Sem eles, ficam em volta do
       próprio recipiente, como sempre foi. */
    const ax = it.dataset.qx !== undefined ? +it.dataset.qx : parseFloat(it.style.left);
    const ay = it.dataset.qy !== undefined ? +it.dataset.qy : parseFloat(it.style.top);

    /* Arrumação escrita à mão vence o agrupamento automático. qmols traz
       o CENTRO de cada molécula, na ordem em que elas nascem; o que
       sobrar da lista continua caindo na grade de sempre. */
    const fixas = leQmols(it);
    const postas = fixas ? poeQmols(bolas, fixas) : 0;
    const resto = [...q.querySelectorAll('.qmol')]
      .concat(bolas.slice(postas));
    if (resto.length) agrupaEmVolta(resto, ax, ay);
  }
}

/* lê o qmols do recipiente; lista torta não derruba o mergulho */
function leQmols(it){
  if (!it.dataset.qmols) return null;
  try {
    const v = JSON.parse(it.dataset.qmols);
    return Array.isArray(v) && v.length ? v : null;
  } catch (err){ return null; }
}

/* Põe cada molécula no centro que a lista manda. O style guarda o CANTO,
   e a caixa é 52 x 41 vezes --k: por isso o desconto de meia caixa. */
function poeQmols(bolas, lista){
  let n = 0;
  bolas.forEach((m, i) => {
    const p = lista[i];
    if (!p || p.length < 2) return;
    const k = parseFloat(m.style.getPropertyValue('--k')) || 1;
    m.style.left = (p[0] - 26 * k).toFixed(0) + 'px';
    m.style.top  = (p[1] - 19 * k).toFixed(0) + 'px';
    m.dataset.ox = 0; m.dataset.oy = 0;    /* a deriva recomeça do zero */
    n = i + 1;
  });
  return n;
}

/* Refazer: as moléculas voltam ao tamanho normal, as que foram abertas se
   fecham e todas se reagrupam onde estavam quando o mergulho começou.
   Quem diz "de qual recipiente" é o próprio item ampliado do slide — é
   ele que abriu este mundo. */
function refazCampo(slide){
  if (!slide) return;
  const it = slide.querySelector('.reveal-item.zoomed');
  const q  = slide.querySelector('.quantum');
  if (!it || !q) return;
  povoaCampo(q, it);
}

function closeQuantum(it){
  if (!it.classList.contains('zoomed')) return;
  it.classList.remove('zoomed');
  const slide = it.closest('.slide');
  if (!slide) return;
  slide.classList.remove('quantum-on', 'rede-on', 'rede-livre');
  paraConflito();
  limpaConflito(slide.querySelector('.quantum'));
  const q = slide.querySelector('.quantum .q-board');  /* o quadro não fica para o próximo */
  if (q) q.classList.remove('on');
  sincronizaQuadro();
}

/* devolve a pedra ao estado inteiro: sem órbita, sem zoom, sem rede */
function restoreRock(it){
  if (!it.classList.contains('broken')) return;
  it.classList.remove('broken');
  fechaRede(it);
}

/* devolve o barquinho ao estado montado */
function restoreLego(it){
  if (it.classList.contains('exploded')) rebuildLego(it);
}
const gestures = new Map();   /* elemento -> ponteiros ativos */
let gesturing = false;        /* trava o swipe de troca de slide */

const getK = (it) => parseFloat(getComputedStyle(it).getPropertyValue('--k')) || 1;
const setK = (it, k) =>
  it.style.setProperty('--k', Math.min(K_MAX, Math.max(K_MIN, k)).toFixed(3));

const itemsOf  = (slide) => [...slide.querySelectorAll('.reveal-item')];
const parentOf = (slide, it) => it.dataset.from
  ? slide.querySelector(`.reveal-item[data-id="${it.dataset.from}"]`)
  : null;

const cubeOf  = (slide) => slide.querySelector('.reveal-item.cube');
const faceNow = (slide) => { const c = cubeOf(slide);
  return c && !c.hidden ? +c.dataset.face : -1; };

/* um elemento só pode sair se não pertence a face nenhuma,
   ou se pertence à face que o cubo está mostrando agora */
/* item "manual" não entra na sequência de cliques: quem manda nele
   é o botão de ajuda */
const eligible = (it, face) =>
  it.dataset.manual === undefined &&
  (it.dataset.of === undefined || +it.dataset.of === face);

/* o que o próximo toque no "?" vai fazer */
function nextAction(slide){
  const face = faceNow(slide);
  /* quem saiu no carrossel está escondido, mas não é "por revelar": ele
     já teve a sua vez e não pode voltar à fila do próximo clique */
  const it = itemsOf(slide).find(o => o.hidden && !o.classList.contains('retract')
                                   && !o.classList.contains('saiu')
                                   && eligible(o, face));
  if (it) return { type: 'reveal', it };
  const c = cubeOf(slide);
  if (c && !c.hidden && +c.dataset.face < +c.dataset.faces - 1) return { type: 'turn' };
  return { type: 'reset' };
}

/* acende o ponto no que ainda guarda algo, e acerta o "?" */
function syncReveals(slide){
  const items = itemsOf(slide);
  const face = faceNow(slide);
  items.forEach(it => {
    const holds = !!it.dataset.id &&
      items.some(o => o.hidden && !o.classList.contains('saiu')
                   && o.dataset.from === it.dataset.id && eligible(o, face));
    it.classList.toggle('has-more', holds && !it.hidden);
  });
  atualizaBarra();
}

/* ------------------------------------------------------------
   O CARROSSEL
   Manda embora, girando, os elementos cujos ids estão listados —
   e guarda neles a marca 'saiu', que é o que impede o próximo
   clique de os trazer de volta como se fossem novidade. Um passo
   para trás desfaz a marca e os traz de volta inteiros.
   ------------------------------------------------------------ */
/* O QUE O EXEMPLO LEVA CONSIGO.
   Uma imagem de onde se arranca grão deixa três coisas abertas: o
   mergulho no retículo, a cópia do grão que voa por cima do palco, e o
   próprio grão fora do lugar com o buraco que ele deixou. Nada disso é
   do slide — é DAQUELE exemplo —, e trocando de exemplo tem de sair
   junto. Sem isto o retículo do composto anterior ficaria de pé por
   baixo do seguinte, e o grão preso na tela impediria arrancar outro:
   arrancaCaco só solta um por slide, e antes cada exemplo era um slide.

   A saída é seca, sem encenar a volta do grão ao buraco: quem está
   saindo é a imagem inteira, girando — devolver o grão a ela no meio
   do giro seria animar duas coisas contrárias ao mesmo tempo. */
function limpaExemplo(slide, o){
  clearTimeout(slide._camT);
  limpaCamera(slide);
  stage.querySelectorAll('.grao-cobre').forEach(c => c.remove());
  paraChiado();
  if (slide.classList.contains('quantum-on')) fechaRede(slide);
  slide.querySelectorAll('.caco').forEach(c => c.remove());
  o.querySelectorAll('.buraco').forEach(b => b.remove());
}

function giraFora(slide, ids){
  ids.split(',').forEach(nome => {
    const o = slide.querySelector(`.reveal-item[data-id="${nome.trim()}"]`);
    if (!o || o.hidden) return;
    closeQuantum(o);                       /* mergulhado, ele sobe antes de sair */
    if (o.classList.contains('fixo')) limpaExemplo(slide, o);
    o.classList.remove('pop', 'has-more', 'retract');
    void o.offsetWidth;
    o.classList.add('carrossel');
    setTimeout(() => {
      if (!o.classList.contains('carrossel')) return;   /* voltou no meio do giro */
      o.classList.remove('carrossel');
      o.classList.add('saiu');
      o.hidden = true;
      o.style.left = o.dataset.x + 'px';
      o.style.top  = o.dataset.y + 'px';
      syncReveals(slide);
    }, 700);
  });
}

/* O passo para trás desfaz a troca. Quem tinha saído girando pela
   direita volta por onde foi — e não pelo caminho por onde entrou na
   primeira vez, que era outro. É o mesmo movimento, ao contrário. */
function voltaCarrossel(slide, ids){
  ids.split(',').forEach(nome => {
    const o = slide && slide.querySelector(`.reveal-item[data-id="${nome.trim()}"]`);
    if (!o || !o.classList.contains('saiu')) return;
    /* o que volta, volta inteiro: sem grão fora do lugar nem buraco */
    if (o.classList.contains('fixo')) limpaExemplo(slide, o);
    o.classList.remove('saiu', 'carrossel', 'carrossel-volta', 'pop', 'retract');
    o.hidden = false;
    o.style.left = o.dataset.x + 'px';
    o.style.top  = o.dataset.y + 'px';
    void o.offsetWidth;                    /* reinicia a animação */
    o.classList.add('carrossel-entra');
    /* a classe sai quando o giro acaba: o estado final dela é a mesma
       posição de repouso do elemento, então não há salto nenhum */
    clearTimeout(o._giroT);
    o._giroT = setTimeout(() => o.classList.remove('carrossel-entra'), 700);
    if (slide) syncReveals(slide);
  });
}

/* O elemento volta para dentro de onde saiu e some — a não ser que ele
   tenha chegado por uma troca de carrossel: aí ele não se recolhe, ele
   desfaz o giro e sai pela esquerda, no mesmo instante em que o exemplo
   anterior volta pela direita. `comGiro` é o grupo inteiro dizendo que a
   volta é essa: o rótulo sai junto com o recipiente, como entrou. */
function retractItem(it, comGiro){
  const slide = it.closest('.slide');
  const carrossel = comGiro || !!it.dataset.sai;
  /* carrossel desfeito: quem tinha saído para dar lugar a este volta */
  if (it.dataset.sai && slide) voltaCarrossel(slide, it.dataset.sai);
  aplicaAcao(slide, it.dataset.acao, false);
  apagaDigitado(it);
  closeQuantum(it);                        /* se estava ampliado, volta antes de sumir */
  it.classList.remove('pop', 'has-more', 'carrossel-entra');
  const saida = carrossel ? 'carrossel-volta' : 'retract';
  it.classList.add(saida);
  setTimeout(() => {
    if (!it.classList.contains(saida)) return;   /* foi revelado de novo no meio */
    it.classList.remove('retract', 'carrossel-volta', 'gira');
    it.hidden = true;
    it.style.left = it.dataset.x + 'px';
    it.style.top  = it.dataset.y + 'px';
    if (slide) syncReveals(slide);
  }, carrossel ? 700 : 520);
}

/* ------------------------------------------------------------
   UM PASSO PARA TRÁS
   desfaz o último evento da sequência, na ordem inversa do "?":
   1. recolhe o último elemento do postulado que está à mostra
   2. gira o cubo de volta, devolvendo o postulado anterior inteiro
   3. recolhe os elementos soltos (o cubo, o título)
   devolve false quando não há mais nada a desfazer.
   ------------------------------------------------------------ */
const busy = (it) => it.hidden || it.dataset.auto || it.dataset.manual !== undefined
  || it.classList.contains('retract');

/* uma cascata saiu num clique só, então tem que voltar num passo só */
function retractGroup(items, i){
  const face = items[i].dataset.of;
  let a = i, b = i;
  while (a > 0 && items[a].dataset.follow && items[a - 1].dataset.of === face) a--;
  while (b + 1 < items.length && items[b + 1].dataset.follow
         && items[b + 1].dataset.of === face) b++;
  /* Basta um do grupo trazer a troca para o grupo inteiro voltar
     girando: o rótulo do exemplo não carrega o `sai` — quem carrega é o
     recipiente —, e os dois entraram juntos. */
  let giro = false;
  for (let k = a; k <= b; k++) if (items[k].dataset.sai) giro = true;
  for (let k = a; k <= b; k++) if (!busy(items[k])) retractItem(items[k], giro);
}

function stepBack(slide){
  const items = itemsOf(slide);
  const cube = cubeOf(slide);
  const face = faceNow(slide);

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (busy(it) || it.dataset.of === undefined || +it.dataset.of !== face) continue;
    retractGroup(items, i);
    return true;
  }

  /* As cargas são o último passo da face, então são as primeiras a
     desfazer — antes de o cubo voltar ao exemplo anterior. */
  if (cube && !cube.hidden && recolheCarga(cube)) return true;

  if (cube && !cube.hidden && +cube.dataset.face > 0){
    const back = +cube.dataset.face - 1;
    esfriaBico(slide);
    descansaBequer(slide);
    cube.dataset.face = back;
    cube.style.setProperty('--face', back);
    paintCube(cube, back);
    viraLupa(slide, back);
    items.forEach(it => {                    /* o postulado anterior volta como estava */
      if (it.dataset.of !== undefined && +it.dataset.of === back){
        it.classList.remove('pop', 'retract', 'gira');
        it.hidden = false;
        it.style.left = it.dataset.x + 'px';
        it.style.top  = it.dataset.y + 'px';
      }
    });
    /* cada face tem o seu exemplo: voltando, ele volta junto */
    if (cube.dataset.exemplos) trocaExemplo(slide, back, -1);
    syncReveals(slide);
    return true;
  }

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (busy(it) || it.dataset.of !== undefined) continue;
    retractGroup(items, i);
    return true;
  }
  return false;
}

/* Este slide tem passos a revelar? Era a caixa "?" quem respondia isso —
   ela só existia onde havia o que soltar. Sem ela, quem responde é a
   presença dos próprios elementos reveláveis. */
const temReveals = (slide) => !!(slide && slide.querySelector('.reveal-item'));

/* a seta só apaga quando não há mais nem passo nem slide adiante */
function atualizaBarra(){
  const slide = slides[current];
  const temPassos = temReveals(slide);
  /* Ainda falta algo AQUI? Além dos passos da sequência, contam as
     cargas por soltar: na última face do cubo a nextAction já responde
     'reset', e sem isto a seta apagaria com elas ainda por mostrar. */
  const faltaAqui = temPassos && (nextAction(slide).type !== 'reset'
                                  || !!cargaPendente(cubeOf(slide)));
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if (p) p.disabled = current === 0 && !temPassos;
  if (n) n.disabled = current === SLIDES.length - 1 && !faltaAqui;
  marcaNota();                               /* este slide tem anotação? */
}

/* as setas do teclado e as da barra percorrem a sequência;
   esgotada, trocam de slide.

   Os slides do retículo (9 a 13) trancavam o próximo até se ter entrado
   no mundo quântico ao menos uma vez, e não deixavam sair de lá pela
   seta. A trava foi removida: quem conduz a aula é o professor, e ele
   pode ter razões para pular a parte submicroscópica — turma adiantada,
   tempo curto, uma revisão. Passa a qualquer momento, de qualquer
   estado. Quem estiver mergulhado sobe junto (ver go). */

/* tira o slide do mundo quântico, seja qual for a porta pela qual ele
   entrou: o recipiente ampliado ou o retículo em 3D */
function sobeDoMergulho(slide){
  if (!slide || !slide.classList.contains('quantum-on')) return;
  const z = slide.querySelector('.reveal-item.zoomed');
  if (z){ closeQuantum(z); return; }
  /* Trocando de slide não há tempo de encenar a volta, e a cópia do grão
     mora fora do slide: encenada, ela apareceria por cima do slide
     seguinte. Aqui a saída é seca. */
  clearTimeout(slide._camT);
  limpaCamera(slide);
  stage.querySelectorAll('.grao-cobre').forEach(c => c.remove());
  paraChiado();                            /* nem o ruído sobrevive à troca */
  fechaRede(slide);
}

function stepForward(){
  const slide = slides[current];
  if (temReveals(slide)){
    const act = nextAction(slide);
    if (act.type === 'reveal'){ revealItem(slide, act.it); return; }
    /* As cargas do exemplo vêm antes de o cubo girar — e também na
       última face, onde não há giro nenhum adiante: lá elas seriam o
       passo perdido entre o fim dos exemplos e o slide seguinte. */
    if (soltaCarga(cubeOf(slide))) return;
    if (act.type === 'turn'){ turnCube(slide, cubeOf(slide)); return; }
  }
  go(current + 1);
}
function stepBackward(){
  const slide = slides[current];
  if (temReveals(slide) && stepBack(slide)) return;
  go(current - 1);
}

/* gira o cubo: recolhe o que era do postulado que sai */
/* Prepara o item para sair junto com a face que está indo embora: a
   distância é a meia largura do cubo mais um tanto, para ele deixar a
   cena de vez em vez de parar na borda dele. */
function acompanhaFace(it, cube){
  if (!cube) return;
  const larg = cube.getBoundingClientRect().width / (fitScale || 1);
  it.style.setProperty('--gx', (-(larg * 0.55 + 280)).toFixed(0) + 'px');
  it.classList.add('gira');
}

/* A face que está de frente. Com mais de quatro faces os painéis são
   reescritos a cada giro, então quem está na frente é o painel de índice
   (face mod 4) — e não o painel 0. */
function faceDaFrente(cube){
  if (!cube) return null;
  const panes = cube.querySelectorAll('.face');
  const F = +cube.dataset.face || 0;
  return panes[((F % 4) + 4) % 4] || null;
}

/* AS CARGAS VÊM ANTES DO GIRO.
   Cada face solta as suas duas, um clique cada: primeiro a do cátion,
   depois a do ânion. Só depois das duas é que o cubo gira para o exemplo
   seguinte. Elas não são reveal-items — moram DENTRO da face, e é por
   isso que giram junto com ela e não precisam ser recolhidas à parte.
   Devolve true quando havia uma para mostrar, e nesse caso quem chamou
   não gira. */
function cargaPendente(cube){
  const frente = faceDaFrente(cube);
  if (!frente) return null;
  /* o cátion primeiro, sempre — pela carga, e não pela ordem em que o
     par foi escrito */
  return frente.querySelector('.carga.mais:not(.on)')
      || frente.querySelector('.carga:not(.on)');
}

function soltaCarga(cube){
  const c = cargaPendente(cube);
  if (!c) return false;
  c.classList.add('on');
  return true;
}

/* e o passo para trás recolhe a última que apareceu */
function recolheCarga(cube){
  const frente = faceDaFrente(cube);
  if (!frente) return false;
  const vistas = [...frente.querySelectorAll('.carga.on')];
  const c = vistas[vistas.length - 1];
  if (!c) return false;
  c.classList.remove('on');
  return true;
}

function turnCube(slide, cube){
  const face = +cube.dataset.face;
  esfriaBico(slide);
  descansaBequer(slide);
  itemsOf(slide).forEach(it => {
    if (it.dataset.of !== undefined && +it.dataset.of === face && !it.hidden){
      acompanhaFace(it, cube);
      retractItem(it);
    }
  });
  cube.dataset.face = face + 1;
  cube.style.setProperty('--face', face + 1);
  paintCube(cube, face + 1);
  viraLupa(slide, face + 1);
  /* cubo de exemplos: o átomo e o gás nobre saem e entram com a face */
  if (cube.dataset.exemplos) trocaExemplo(slide, face + 1, 1);
  syncReveals(slide);
}

function resetReveals(slide){
  itemsOf(slide).forEach(it => {
    it.hidden = !it.dataset.auto;          /* o que é "auto" fica na tela desde o início */
    it.classList.remove('pop', 'has-more', 'emitting', 'pressing', 'retract',
                        'gira', 'arco', 'direto', 'aberto');
    /* o que nasce com a distribuição aberta volta a nascer assim: sem
       isto, depois do primeiro recomeço o gás da ajuda saía sem ela */
    if (it.dataset.aberto) it.classList.add('aberto');
    /* o exercício do octeto volta ao começo: o subnível doado retorna à
       distribuição, no lugar dele, e os destaques se apagam */
    it.classList.remove('doado');
    it.querySelectorAll('.gas-dist .cam').forEach(cam => {
      cam.classList.remove('valencia', 'octeto8', 'indo', 'voltando');
      if (cam.classList.contains('solta')){ cam.style.left = '0px'; cam.style.top = '0px'; }
    });
    restoreRock(it);
    restoreLego(it);
    closeQuantum(it);
    it.style.left = it.dataset.x + 'px';
    it.style.top  = it.dataset.y + 'px';
    it.style.setProperty('--k', 1);
    it.style.removeProperty('--dx');
    it.style.removeProperty('--dy');
  });
  /* sai do retículo antes de desfazer o resto */
  if (slide.classList.contains('quantum-on')) fechaRede(slide);
  /* o grão arrancado refaz o caminho até o buraco, e a imagem se fecha */
  slide.querySelectorAll('.caco').forEach(devolveCaco);
  /* O quadro volta ao estado em que o slide o entrega: de pé onde ele
     nasce de pé, recolhido nos demais. */
  const qb = slide.querySelector(':scope > .q-board');
  if (qb) qb.classList.toggle('on', qb.dataset.aberto === '1');
  sincronizaQuadro();
  /* as famílias voltam ao ponto de partida */
  slide.querySelectorAll('.ex-el .fam, .ex-el .sim, .ex-el .carga').forEach(x => {
    x.style.removeProperty('--fx');
    x.style.removeProperty('--fy');
  });
  /* as cargas voltam a estar por revelar: o exemplo recomeça do zero */
  slide.querySelectorAll('.ex-el .carga.on').forEach(c => c.classList.remove('on'));
  const c = cubeOf(slide);
  /* No cubo de exemplos o Refazer não volta ao primeiro: ele refaz o
     átomo da face que está à vista, que é o que se está resolvendo. */
  if (c && c.dataset.exemplos) poeExemplo(slide, +c.dataset.face);
  else if (c){ c.dataset.face = 0; c.style.setProperty('--face', 0); paintCube(c, 0); }
  const aj = slide.querySelector('.ajuda');
  if (aj) aj.classList.remove('on');
  slide.classList.remove('acertou');       /* some o brilho de acerto */
  slide.querySelectorAll('.eletron, .rastro-e, .onda-e').forEach(x => x.remove());
  slide.querySelectorAll('.pd').forEach(refazPedra);
  syncReveals(slide);
}

const DIGITA_MS = 28;                      /* velocidade média da digitação */

/* escreve o texto letra a letra, com o cursor piscando no fim */
function digita(el){
  const txt = el.dataset.txt || '';
  clearInterval(el._t);
  el.textContent = '';
  el.classList.add('digitando');
  let i = 0;
  el._t = setInterval(() => {
    el.textContent = txt.slice(0, ++i);
    if (i >= txt.length){
      clearInterval(el._t); el._t = null;
      el.classList.remove('digitando');
    }
  }, DIGITA_MS);
}
function apagaDigitado(it){
  it.querySelectorAll('.cx-corpo[data-txt]').forEach(el => {
    clearInterval(el._t); el._t = null;
    el.classList.remove('digitando');
    el.textContent = '';
  });
}

const CACO = 4.4;                          /* o grão, em px do palco */
let cacoN = 0;

/* contorno irregular: sete vértices com raio e ângulo sorteados,
   diferente a cada grão arrancado */
function contornoCaco(){
  const r = rng(9001 + (++cacoN) * 137);
  const n = 7, pts = [];
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 + (r() - .5) * .55;
    const d = 33 + r() * 17;
    pts.push(`${(50 + Math.cos(a) * d).toFixed(1)}% ${(50 + Math.sin(a) * d).toFixed(1)}%`);
  }
  return `polygon(${pts.join(',')})`;
}

/* Tira um pedaço da imagem no ponto em que o dedo encostou: deixa a
   falha no lugar e devolve o caco, já pronto para ser arrastado. */
function arrancaCaco(item, e){
  const img = item.querySelector('img');
  if (!img || e.target !== img) return null;
  const slide = item.closest('.slide');
  if (!slide) return null;
  /* um grão de cada vez: enquanto o primeiro estiver na tela, a imagem
     não solta outro */
  if (slide.querySelector('.caco')) return null;

  const r = img.getBoundingClientRect();
  const st = stage.getBoundingClientRect();
  const k = fitScale || 1;
  const larg = r.width / k, alt = r.height / k;   /* tamanho exibido, no palco */
  const fx = (e.clientX - r.left) / r.width;      /* onde pegou, em fração */
  const fy = (e.clientY - r.top)  / r.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return null;

  const forma = contornoCaco();            /* o mesmo contorno no grão e na falha */

  const buraco = document.createElement('i');
  buraco.className = 'buraco';
  buraco.style.setProperty('--w', CACO + 'px');
  buraco.style.clipPath = forma;
  buraco.style.left = (fx * larg).toFixed(1) + 'px';
  buraco.style.top  = (fy * alt).toFixed(1) + 'px';
  item.appendChild(buraco);

  const caco = document.createElement('i');
  caco.className = 'caco';
  caco.style.left = ((e.clientX - st.left) / k).toFixed(1) + 'px';
  caco.style.top  = ((e.clientY - st.top)  / k).toFixed(1) + 'px';
  const grao = document.createElement('b');
  grao.style.setProperty('--w',   CACO + 'px');
  grao.style.setProperty('--img', `url("${img.getAttribute('src')}")`);
  grao.style.setProperty('--bw',  larg.toFixed(1) + 'px');
  grao.style.setProperty('--bh',  alt.toFixed(1) + 'px');
  grao.style.setProperty('--bx',  (CACO / 2 - fx * larg).toFixed(1) + 'px');
  grao.style.setProperty('--by',  (CACO / 2 - fy * alt).toFixed(1) + 'px');
  grao.style.clipPath = forma;
  caco.appendChild(grao);
  caco._buraco = buraco;
  caco._novo = true;
  slide.appendChild(caco);
  return caco;
}

/* Devolve o grão ao buraco de onde ele saiu: ele refaz o caminho, a
   falha se fecha, e a imagem volta a ficar inteira. */
function devolveCaco(caco){
  const b = caco._buraco;
  caco.classList.remove('mergulha', 'volta-grao');
  caco.style.opacity = '';
  if (!b || !b.isConnected){ caco.remove(); return; }
  const p = noPalco(b);
  caco.classList.add('voltando-grao');
  void caco.offsetWidth;
  caco.style.left = p.x.toFixed(1) + 'px';
  caco.style.top  = p.y.toFixed(1) + 'px';
  setTimeout(() => { b.classList.add('fecha'); caco.classList.add('sumindo'); }, 280);
  setTimeout(() => { b.remove(); caco.remove(); }, 640);
}

/* Dois cliques no grão: duas ampliações e, na terceira, o mergulho
   no retículo cristalino, no lugar exato onde o grão estava. */
let ultimoToque = 0, ultimoAlvo = null;

function duploNoGrao(caco){
  const agora = Date.now();
  const duplo = (caco === ultimoAlvo) && (agora - ultimoToque < 420);
  ultimoToque = agora; ultimoAlvo = caco;
  if (!duplo) return;

  /* O retículo nasce onde o grão está, mas com o tamanho da imagem de
     onde ele foi arrancado. Mede-se o <img>, não o item inteiro: o item
     carrega a legenda embaixo, que aumentaria a medida. */
  const slide = caco.closest('.slide');
  /* DE QUAL IMAGEM ESTE GRÃO SAIU.
     O buraco que ele deixou mora dentro dela, e é por ele que se chega à
     imagem certa. Perguntar ao slide pela primeira imagem só valia
     quando cada exemplo era um slide: no slide dos cinco compostos
     iônicos a primeira do DOM é o NaCl, e todos os mergulhos abriam o
     retículo dele — o do MgO, o do Na2O e os outros nunca apareciam. */
  const fixo  = (caco._buraco && caco._buraco.closest('.reveal-item.fixo'))
             || (slide && [...slide.querySelectorAll('.reveal-item.fixo')]
                   .find(f => !f.hidden && !f.classList.contains('saiu')));
  const foto  = fixo && fixo.querySelector('img');
  const p     = noPalco(caco);                 /* posição: a do grão */
  const k     = fitScale || 1;
  const r     = foto ? foto.getBoundingClientRect() : null;
  const larg  = r ? r.width  / k : 280;        /* tamanho: o da imagem */
  const alt   = r ? r.height / k : 280;
  caco.classList.remove('volta-grao');
  cameraNoGrao(caco, (fixo && fixo.dataset.rede) || 'nacl', p, larg, alt);
  ultimoAlvo = null;
}

/* ------------------------------------------------------------
   O MERGULHO PELA CÂMERA
   O olho vai até o grão em vez de o grão vir até o olho. A cena
   avança a partir do ponto escolhido, o material vira pixel, e
   no instante em que já não há mais o que ver na foto o véu fecha
   e reabre no retículo. Três tempos: avançar, fechar, chegar.
   ------------------------------------------------------------ */
const CAM_MS   = 653;                      /* o avanço da câmera */
const DASH_MS  = 597;                      /* o grão engolindo a tela */
const FADE_MS  = 340;                      /* o grão aparecendo ou se apagando */
const CHIA_MS  = 430;                      /* quanto o chiado dura */
const CHIA_TAPA = 90;                      /* quando ele já é parede opaca */
const G3_RECUA = 260;                      /* o recuo da câmera dentro do retículo */

/* ------------------------------------------------------------
   O CHIADO DA TRAVESSIA
   Ruído de transmissão perdida, no instante em que se passa de um
   mundo para o outro. O canvas é pequeno (220x124) e esticado com
   image-rendering:pixelated: o grão grosso é o que faz parecer
   sinal, e desenhar 27 mil pixels por quadro não custa nada perto
   de desenhar dois milhões.
   ------------------------------------------------------------ */
const chiado = document.getElementById('chiado');
const cctx = chiado ? chiado.getContext('2d') : null;
let chiadoRaf = 0, chiadoT = 0, chiadoImg = null;

function pintaChiado(){
  if (!cctx) return;
  if (!chiadoImg) chiadoImg = cctx.createImageData(chiado.width, chiado.height);
  const d = chiadoImg.data;
  for (let i = 0; i < d.length; i += 4){
    /* um pouco frio, para o ruído pertencer à paleta da aula */
    const v = Math.random() * 255;
    d[i] = v * .78; d[i + 1] = v * .93; d[i + 2] = v; d[i + 3] = 255;
  }
  cctx.putImageData(chiadoImg, 0, 0);
  chiadoRaf = requestAnimationFrame(pintaChiado);
}

function ligaChiado(ms){
  if (!chiado) return;
  cancelAnimationFrame(chiadoRaf);
  clearTimeout(chiadoT);
  pintaChiado();
  chiado.classList.add('on');
  chiadoT = setTimeout(() => {
    chiado.classList.remove('on');
    /* só para de desenhar quando já não se vê: parar antes deixaria um
       último quadro congelado enquanto ele se apaga */
    chiadoT = setTimeout(() => cancelAnimationFrame(chiadoRaf), 300);
  }, ms || CHIA_MS);
}
function paraChiado(){
  if (!chiado) return;
  cancelAnimationFrame(chiadoRaf);
  clearTimeout(chiadoT);
  chiado.classList.remove('on');
}

/* A cópia do grão que assume a tela. Nasce no tamanho exato em que a
   câmera deixou o original (45.92, o fim de camEntra), no mesmo ponto e
   com o mesmo recorte — por isso a troca de um pelo outro não se vê. */
function coberturaDoGrao(caco, p){
  const b = caco.querySelector('b');
  if (!b) return null;
  const c = document.createElement('i');
  c.className = 'grao-cobre';
  ['--img', '--bw', '--bh', '--bx', '--by'].forEach(v =>
    c.style.setProperty(v, b.style.getPropertyValue(v)));
  c.style.setProperty('--w', CACO + 'px');
  c.style.clipPath = b.style.clipPath;
  c.style.left = p.x.toFixed(1) + 'px';
  c.style.top  = p.y.toFixed(1) + 'px';
  stage.appendChild(c);
  return c;
}

/* põe a câmera no ponto do grão, ainda sem andar */
function armaCamera(slide, p){
  slide.style.setProperty('--camx', p.x.toFixed(1) + 'px');
  slide.style.setProperty('--camy', p.y.toFixed(1) + 'px');
  slide.classList.add('camera');
}
function limpaCamera(slide){
  slide.classList.remove('camera', 'dentro', 'recua', 'fundo');
}

function cameraNoGrao(caco, rede, p, larg, alt){
  const slide = caco.closest('.slide');
  if (!slide) return;
  clearTimeout(slide._camT);
  /* um mergulho por vez: cópia de grão que tenha sobrado de outro sai */
  stage.querySelectorAll('.grao-cobre').forEach(c => c.remove());
  limpaCamera(slide);
  armaCamera(slide, p);
  void slide.offsetWidth;
  slide.classList.add('dentro');           /* e vai */

  /* A câmera parou no fundo. O grão está do tamanho que ela o deixou, e
     daqui em diante quem manda é ele: a cópia entra por cima, do mesmo
     tamanho, e segue a MESMA curva até cobrir a tela. */
  slide._camT = setTimeout(() => {
    slide.classList.remove('dentro');
    slide.classList.add('fundo');          /* segura a câmera onde ela parou */
    const cobre = coberturaDoGrao(caco, p);
    if (cobre){ void cobre.offsetWidth; cobre.classList.add('engole'); }

    /* Coberta a tela, o sinal se perde: o chiado entra e é atrás dele
       que a cena troca. Some o grão, some o slide, e quando o ruído
       baixa quem está do outro lado é o retículo. */
    slide._camT = setTimeout(() => {
      ligaChiado();
      slide._camT = setTimeout(() => {
        limpaCamera(slide);
        abreRede(caco, rede, p.x, p.y, larg, alt);
        if (cobre) cobre.remove();
      }, CHIA_TAPA);
    }, DASH_MS);
  }, CAM_MS);
}

/* A VOLTA É A IDA AO CONTRÁRIO, passo a passo — e pela mesma curva, que
   as animações tocam em reverse. O grão reaparece por cima do retículo e
   cobre a tela — entrando em fade, porque desta vez não há de onde ele
   saltar. Coberto tudo, a cena volta a ser o slide, posto no fundo do
   poço. O grão então encolhe até o tamanho em que a câmera o deixaria,
   some entregando o lugar ao grão de verdade, e a câmera recua. */
function cameraVolta(slide, caco, p){
  if (!slide || !caco) return;
  clearTimeout(slide._camT);
  stage.querySelectorAll('.grao-cobre').forEach(c => c.remove());

  /* Primeiro a câmera se afasta do retículo — o cristal recua e fica
     pequeno, que é o gesto de quem está saindo. Só então o sinal se
     perde: o chiado marca a saída do mundo quântico. */
  if (REDES[G3.modo]){ G3.distAlvo = G3.dist * 2.6; G3.voo = 1; }

  slide._camT = setTimeout(() => {
    ligaChiado();
    slide._camT = setTimeout(() => {
      /* atrás do chiado: o retículo sai e o slide volta, no fundo do
         poço, com o grão cobrindo a tela — de onde ele vai encolher */
      fechaRede(slide);
      limpaCamera(slide);
      armaCamera(slide, p);
      slide.classList.add('fundo');
      const cobre = coberturaDoGrao(caco, p);
      if (!cobre){ limpaCamera(slide); return; }
      cobre.style.transform = 'scale(1300)';
      void cobre.offsetWidth;
      cobre.style.transform = '';             /* a animação retoma o comando */
      cobre.classList.add('devolve');         /* a curva ao contrário */

      slide._camT = setTimeout(() => {
        cobre.remove();                       /* o grão de verdade assume */
        slide.classList.remove('fundo');
        slide.classList.add('recua');         /* e a câmera recua */
        slide._camT = setTimeout(() => limpaCamera(slide), CAM_MS + 80);
      }, DASH_MS);
    }, CHIA_TAPA);
  }, G3_RECUA);
}

/* jorro de confete a partir de um ponto do palco */
function confete(slide, x, y){
  const cores = ['#45C7B0', '#F0B44A', '#E8F1F5', '#7FD8E8', '#AB5CF2'];
  const rnd = rng(31337);
  const cx = document.createElement('div');
  cx.className = 'confete';
  cx.style.left = x + 'px'; cx.style.top = y + 'px';
  let bits = '';
  for (let i = 0; i < 30; i++){
    const a = rnd() * Math.PI * 2, d = 110 + rnd() * 230;
    const dx = Math.cos(a) * d;
    const dy = Math.sin(a) * d + 140 + rnd() * 170;   /* o peso puxa para baixo */
    bits += `<i style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;`
          + `--r:${(rnd() * 900 - 450).toFixed(0)}deg;`
          + `--t:${(1 + rnd() * .8).toFixed(2)}s;--c:${cores[i % cores.length]};`
          + `--w:${(6 + rnd() * 7).toFixed(0)}px;--h:${(9 + rnd() * 9).toFixed(0)}px"></i>`;
  }
  cx.innerHTML = bits;
  slide.appendChild(cx);

  const anel = document.createElement('i');
  anel.className = 'acerto-anel';
  anel.style.left = x + 'px'; anel.style.top = y + 'px';
  slide.appendChild(anel);

  setTimeout(() => { cx.remove(); anel.remove(); }, 2200);
}

/* ------------------------------------------------------------
   TABELA PERIÓDICA -> REPRESENTAÇÃO DE LEWIS
   Clicar numa família a levanta e mostra quantos elétrons de valência
   ela tem. Só a família levantada aceita a escolha de um elemento, e o
   escolhido aparece do outro lado em notação de Lewis.
   ------------------------------------------------------------ */
function limpaLewis(slide){
  const a = slide && slide.querySelector('.lw-stage');
  if (!a) return;
  a.innerHTML = LEWIS_VAZIO;
  a.classList.remove('inst1', 'inst2', 'inst3', 'inst4', 'certo');
  const item = a.closest('.reveal-item');
  if (item){                               /* sem elemento, não há o que mexer */
    delete item.dataset.alvo;
    delete item.dataset.alvo2;
    delete item.dataset.sim;
    delete item.dataset.val;
    delete item.dataset.delta;
  }
  /* sem elemento escolhido também não há ficha nenhuma a mostrar */
  ['cfg8', 'nobre8'].forEach(id => {
    const x = slide.querySelector(`.reveal-item[data-id="${id}"]`);
    if (x && !x.hidden) retractItem(x);
  });
  const aj = slide.querySelector('.reveal-item.ajuda');
  if (aj) aj.classList.remove('on');
  acendeNobre(slide, null);              /* e o gás nobre se apaga na tabela */
}

function levantaFamilia(col){
  const tp = col.closest('.tp'), slide = col.closest('.slide');
  const jaEstava = col.classList.contains('sobe');
  /* a anterior desce e o número dela some junto */
  tp.querySelectorAll('.tp-col.sobe').forEach(c => c.classList.remove('sobe'));
  tp.querySelectorAll('.tp-el.escolhido').forEach(x => x.classList.remove('escolhido'));
  if (!jaEstava) col.classList.add('sobe');
  limpaLewis(slide);
}

function mostraLewis(el){
  const col = el.closest('.tp-col'), slide = el.closest('.slide');
  const area = slide && slide.querySelector('.lw-stage');
  if (!area) return;
  col.closest('.tp').querySelectorAll('.tp-el.escolhido')
     .forEach(x => x.classList.remove('escolhido'));
  el.classList.add('escolhido');
  const sim = el.dataset.sim, val = +col.dataset.val;
  const item = area.closest('.reveal-item');
  area.innerHTML = LEWIS(sim, val);
  if (item){
    const alvos = alvoLewis(sim, val);
    item.dataset.sim   = sim;
    item.dataset.val   = val;
    item.dataset.delta = 0;
    item.dataset.alvo  = alvos[0];
    /* a 4A traz o segundo caminho; as outras famílias limpam o resto do
       elemento anterior, senão o alvo velho seguiria valendo */
    if (alvos.length > 1) item.dataset.alvo2 = alvos[1];
    else delete item.dataset.alvo2;
    marcaEstado(item);                     /* nasce instável, como no slide 7 */
  }
  poeFichas(slide, sim, col, el);
}

/* acende (ou apaga, com sim nulo) a célula do gás nobre na tabela */
function acendeNobre(slide, sim){
  const tp = slide && slide.querySelector('.tp');
  if (!tp) return;
  tp.querySelectorAll('.tp-el.nobre').forEach(x => x.classList.remove('nobre'));
  if (!sim) return;
  const cel = tp.querySelector(`.tp-el[data-sim="${sim}"]`);
  if (cel) cel.classList.add('nobre');
}

/* QUAL GÁS NOBRE ESTE ELEMENTO QUER IMITAR.
   Quem tem até 3 elétrons de valência larga todos e recua para o gás
   nobre do período ANTERIOR; de 4 em diante é mais curto completar, e o
   alvo é o do PRÓPRIO período. O hidrogênio é o caso à parte: não há
   período anterior, e ele se resolve virando hélio de um jeito ou de
   outro. O período é a linha em que o elemento está na coluna. */
function nobreDe(col, el, val){
  const linha = [...col.querySelectorAll('.tp-el, .tp-vazio')].indexOf(el);
  if (linha < 0) return 'Ne';
  const coluna8 = TP[7].el;
  if (linha === 0) return 'He';
  return val <= 3 ? coluna8[linha - 1] : coluna8[linha];
}

/* Escreve as duas fichas do slide da tabela — a do elemento escolhido e
   a do gás nobre que ele persegue — e as recolhe. Elas ficam prontas,
   escondidas: a de cima espera um toque no símbolo de Lewis, a de baixo
   espera o botão de ajuda. */
function poeFichas(slide, sim, col, el){
  const nobre = nobreDe(col, el, +col.dataset.val);
  const cfg = slide.querySelector('.reveal-item[data-id="cfg8"]');
  const nob = slide.querySelector('.reveal-item[data-id="nobre8"]');
  if (cfg){
    cfg.dataset.sim = sim;
    cfg.innerHTML = GAS(sim, { conta: true, sodist: true });
    if (!cfg.hidden) retractItem(cfg);     /* trocou de elemento: recolhe */
  }
  if (nob){
    nob.dataset.sim = nobre;
    nob.innerHTML = GAS(nobre, { conta: true, sodist: true });
    if (!nob.hidden) retractItem(nob);
  }
  const aj = slide.querySelector('.reveal-item.ajuda');
  if (aj) aj.classList.remove('on');
  acendeNobre(slide, null);              /* o gás nobre do elemento anterior apaga */
}

/* O alvo é a COLUNA inteira, não só a faixa do cabeçalho — que era um
   fio de 12px e quase não se acerta. E a leitura é por ponteiro, como no
   resto do app, para não depender do clique sintetizado do toque.
     coluna abaixada  -> levanta a família
     coluna levantada -> escolhe o elemento
     cabeçalho        -> levanta ou abaixa */
let tpToque = null;
deck.addEventListener('pointerdown', (e) => {
  if (!e.target.closest || !e.target.closest('.tp')) return;
  tpToque = { x: e.clientX, y: e.clientY, alvo: e.target };
});
deck.addEventListener('pointerup', (e) => {
  const d = tpToque;
  tpToque = null;
  if (!d || !d.alvo.closest) return;
  if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12) return;   /* arrastou */
  const col = d.alvo.closest('.tp-col');
  if (!col) return;
  const noCab = !!d.alvo.closest('.tp-cab');
  const cel   = d.alvo.closest('.tp-el');
  if (noCab || !col.classList.contains('sobe')) levantaFamilia(col);
  else if (cel) mostraLewis(cel);
});

/* O que a legenda diz a cada estágio: a batida é a pergunta, o texto é
   a resposta química. */
const PD_DICAS = [
  'bata na pedra',
  'os planos de íons deslizaram',
  'cargas iguais frente a frente se repelem',
  'o cristal clivou em faces planas',
  'e continua clivando, sempre em planos retos',
  'por menor que seja o pedaço, as faces são planas'
];

/* a onda do impacto e o pó que salta do ponto onde o dedo bateu */
function poDaBatida(svg, px, py){
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  const org = px.toFixed(1) + 'px ' + py.toFixed(1) + 'px';
  const onda = document.createElementNS(NS, 'circle');
  onda.setAttribute('class', 'pd-onda');
  onda.setAttribute('cx', px.toFixed(1));
  onda.setAttribute('cy', py.toFixed(1));
  onda.setAttribute('r', '14');
  onda.style.transformOrigin = org;
  svg.appendChild(onda);
  setTimeout(() => onda.remove(), 540);
  for (let i = 0; i < 11; i++){
    /* para cima e para os lados; o +16 do fim é a gravidade puxando */
    const ang = Math.PI * (1.08 + Math.random() * 0.84);
    const d = 16 + Math.random() * 26;
    const g = document.createElementNS(NS, 'circle');
    g.setAttribute('class', 'pd-po');
    g.setAttribute('cx', px.toFixed(1));
    g.setAttribute('cy', py.toFixed(1));
    g.setAttribute('r', (0.9 + Math.random() * 1.7).toFixed(2));
    g.style.setProperty('--px', (Math.cos(ang) * d).toFixed(1) + 'px');
    g.style.setProperty('--py', (Math.sin(ang) * d + 16).toFixed(1) + 'px');
    g.style.transformOrigin = org;
    g.style.animationDelay = (Math.random() * 0.06).toFixed(3) + 's';
    svg.appendChild(g);
    setTimeout(() => g.remove(), 960);
  }
}

/* Cada batida abre mais um plano de clivagem. Depois da terceira o
   cristal já está partido: quem volta ao começo é o botão refazer. */
function bateNaPedra(pd, ev){
  if (!pd) return;
  const e = +pd.dataset.e || 0;
  const svg = pd.querySelector('.pd-svg');
  let px = 100, py = 62;
  if (ev && svg && ev.clientX != null){
    const r = svg.getBoundingClientRect();
    if (r.width){
      px = (ev.clientX - r.left) / r.width * 200;
      py = (ev.clientY - r.top) / r.height * 152;
    }
  }
  poDaBatida(svg, px, py);
  pd.classList.remove('bate');
  void pd.offsetWidth;
  pd.classList.add('bate');
  if (e >= 5) return;                     /* já partiu: só o refazer volta */
  const novo = e + 1;
  pd.dataset.e = novo;
  const riscos = pd.querySelectorAll('.pd-rach.r' + novo);
  if (riscos.length){
    riscos.forEach(l => l.classList.remove('flash'));
    void pd.offsetWidth;
    riscos.forEach(l => l.classList.add('flash'));
  }
  /* o retículo dentro da lupa parte no mesmo instante */
  G3.clivaAlvo = novo;
  const d = pd.querySelector('.pd-dica');
  if (d) d.textContent = PD_DICAS[novo];
}

/* onde fica a água, no sistema de coordenadas do desenho do béquer */
const BQ_AGUA = { x0: 30, x1: 122, y0: 44, y1: 128 };
/* A BANCADA E O VIDRO, lidos do próprio desenho do béquer.
   A parede do copo vai de x 26 a x 126 e a base assenta em y 131; a
   borda de cima está em y 18. Meia pedra é 27 x 28, então ela descansa
   na bancada com o centro em 131-28 = 103, e o fundo do copo, por dentro
   do vidro, fica um fio abaixo. */
const BQ_MEIA_L = 27, BQ_MEIA_A = 28;
const BQ_CHAO   = 131 - BQ_MEIA_A;         /* a base do copo, menos meia pedra */
const BQ_FUNDO  = 104;
/* Teto do movimento. Vai ACIMA da caixa do desenho — o béquer foi
   assentado 80px mais para baixo na face, e o espaço que sobrou em cima
   é onde a mão precisa de folga para levantar a pedra por sobre a boca
   do copo e para tirá-la de dentro dele. */
const BQ_TETO = -55;
const BQ_PAREDE = 126;                     /* a face externa do vidro, à direita */
/* Altura em que a pedra ainda passa POR CIMA da boca do copo. Abaixo
   disto o vidro é parede: é o que impede o cubo de atravessar de lado. */
const BQ_BOCA   = 44;

/* Este lugar é permitido? Fora da caixa do desenho, não; e sobre o copo,
   só acima da boca — do contrário a pedra estaria dentro do vidro. */
function bqCabe(x, y){
  if (x < BQ_MEIA_L || x > 292 - BQ_MEIA_L) return false;
  if (y < BQ_TETO || y > BQ_CHAO) return false;
  return !(y > BQ_BOCA && x - BQ_MEIA_L < BQ_PAREDE);
}

/* COLISÃO POR EIXO.
   Recusado o ponto inteiro, tenta-se andar só na horizontal e só na
   vertical. É o que faz a pedra DESLIZAR pela parede em vez de travar:
   vindo da direita ela para encostada no vidro e continua podendo
   subir; vindo de cima, para na altura da boca e continua podendo
   correr para os lados. */
function bqPoe(sal, x, y){
  const px = parseFloat(sal.style.left), py = parseFloat(sal.style.top);
  const cx = Math.max(BQ_MEIA_L, Math.min(292 - BQ_MEIA_L, x));
  const cy = Math.max(BQ_TETO, Math.min(BQ_CHAO, y));
  let fx = px, fy = py;
  if (bqCabe(cx, cy)){ fx = cx; fy = cy; }
  else if (bqCabe(cx, py)){ fx = cx; }
  else if (bqCabe(px, cy)){ fy = cy; }
  sal.style.left = fx.toFixed(1) + 'px';
  sal.style.top  = fy.toFixed(1) + 'px';
}

/* A queda. O tempo cresce com a raiz da altura, que é como a gravidade
   funciona: dobrar a altura não dobra o tempo. */
function bqCai(sal, ate){
  const de = parseFloat(sal.style.top) || 0;
  const h = ate - de;
  if (h < 0.5){ sal.style.top = ate.toFixed(1) + 'px'; return; }
  sal.style.setProperty('--tq', (130 + Math.sqrt(h) * 46).toFixed(0) + 'ms');
  sal.classList.add('caindo');
  sal.style.top = ate.toFixed(1) + 'px';
  clearTimeout(sal._qT);
  sal._qT = setTimeout(() => sal.classList.remove('caindo'), 900);
}
/* POSICIONAMENTO DO BÉQUER — provisório.
   Com isto em true, arrastar o vidro MOVE o béquer dentro da face, em
   vez de agitar a água. Serve para achar o lugar dele e ler as
   coordenadas no painel do C. Depois é só voltar para false: a agitação
   da água volta a valer, e o béquer fica travado onde estiver. */
const BQ_MOVEL = false;


/* A dissolução anda sozinha, devagar; cada vaivém do dedo na água lhe
   dá um empurrão que decai em pouco menos de meio segundo. Sozinha ela
   leva uns 27s; agitada sem parar, uns 8s. O mesmo número vai para o
   retículo na lupa: é o que faz a água arrancar os íons lá dentro no
   compasso do que a mão faz aqui. */
function bqAnda(bq){
  if (bq._t) cancelAnimationFrame(bq._t);
  const passo = () => {
    /* slide fora de cena não gasta quadro */
    const sl = bq.closest('.slide');
    if (sl && !sl.classList.contains('is-active')){ bq._t = 0; return; }
    let sal = +bq.dataset.sal || 0, ag = +bq.dataset.agita || 0;
    const naAgua = bq.classList.contains('molhado');
    ag *= 0.972;
    if (ag < 0.004) ag = 0;
    if (naAgua && sal < 1)
      sal = Math.min(1, sal + 0.00062 + 0.0016 * ag);
    bq.dataset.sal = sal.toFixed(4);
    bq.dataset.agita = ag.toFixed(4);
    bq.style.setProperty('--sal', sal.toFixed(3));
    bq.classList.toggle('sumiu', sal >= 1);   /* dissolvida de todo */
    bq.style.setProperty('--agita', ag.toFixed(3));
    G3.dissolve = sal;
    /* Para quando não há mais o que animar: a agitação acabou E ou o sal
       já se dissolveu todo, ou nem chegou na água. Sem a segunda metade,
       mexer o dedo antes de pôr o sal deixava este laço rodando a 60
       quadros por segundo pelo resto da sessão, em todos os slides. */
    const nadaAFazer = ag === 0 && (sal >= 1 || !naAgua);
    bq._t = nadaAFazer ? 0 : requestAnimationFrame(passo);
  };
  passo();
}

/* Arrastar a pedra e mexer o dedo na água. A posição do dedo vira
   coordenada do desenho pela proporção do retângulo do quadro — assim
   não importa quanto o cubo esteja escalado nem a que distância a face
   esteja da câmera. */
function ligaBequer(){
  document.querySelectorAll('.bq').forEach(bq => {
    if (bq._ligado) return;
    bq._ligado = 1;
    const sal = bq.querySelector('.bq-sal'), copo = bq.querySelector('.bq-copo');
    if (!sal || !copo) return;
    const local = e => {
      const r = bq.getBoundingClientRect();
      if (!r.width || !r.height) return { x: 0, y: 0 };
      return { x: (e.clientX - r.left) / r.width * 292,
               y: (e.clientY - r.top) / r.height * 150 };
    };
    sal.addEventListener('pointerdown', e => {
      if (bq.classList.contains('sumiu')) return;   /* não sobrou pedra */
      /* Pegou: saiu da água. A dissolução para onde estava — o que já foi
         não volta, e é isso que se quer mostrar. */
      bq.classList.remove('molhado');
      sal._pega = 1; sal.setPointerCapture(e.pointerId);
      bq.classList.add('pegando');
      e.preventDefault(); e.stopPropagation();
    });
    sal.addEventListener('pointermove', e => {
      if (!sal._pega) return;
      const p = local(e);
      /* A pedra não sai do desenho: por mais que o dedo vá longe, ela
         para nas bordas. E não desce abaixo da bancada — chão é chão,
         mesmo com o dedo em cima. */
      sal.classList.remove('caindo');       /* na mão não há queda */
      bqPoe(sal, p.x, p.y);
      e.stopPropagation();
    });
    const larga = e => {
      if (!sal._pega) return;
      sal._pega = 0;
      bq.classList.remove('pegando');
      /* Largada, ela cai — sempre; o que não acontece mais é ela ficar
         parada no ar onde o dedo a deixou. Sobre o copo só se chega por
         cima da boca, porque abaixo dali o vidro é parede: de lá o que
         se solta cai DENTRO, na água. Fora, cai na bancada. */
      const cx = parseFloat(sal.style.left);
      if (cx - BQ_MEIA_L < BQ_PAREDE){
        sal.style.left = Math.max(BQ_AGUA.x0 + 18,
                          Math.min(BQ_AGUA.x1 - 18, cx)).toFixed(1) + 'px';
        bqCai(sal, BQ_FUNDO);
        bq.classList.add('molhado');
        bqAnda(bq);
      } else {
        bqCai(sal, BQ_CHAO);
      }
    };
    sal.addEventListener('pointerup', larga);
    sal.addEventListener('pointercancel', larga);

    bq.classList.toggle('movel', BQ_MOVEL);
    copo.addEventListener('pointerdown', e => {
      /* MODO DE POSICIONAMENTO: o arrasto no vidro leva o béquer inteiro
         em vez de agitar a água. É provisório — serve para achar o lugar
         dele na face e ler as coordenadas no painel do C. */
      if (BQ_MOVEL){
        copo._poe = 1;
        copo._x = e.clientX; copo._y = e.clientY;
        copo._bx = parseFloat(bq.style.getPropertyValue('--bqx')) || 0;
        copo._by = parseFloat(bq.style.getPropertyValue('--bqy')) || 0;
        copo._k  = escalaCubo(bq);
        copo.setPointerCapture(e.pointerId);
        e.preventDefault(); e.stopPropagation();
        return;
      }
      copo._mexe = 1; copo._x = e.clientX; copo._dir = 0;
      copo.setPointerCapture(e.pointerId);
      e.preventDefault(); e.stopPropagation();
    });
    copo.addEventListener('pointermove', e => {
      if (copo._poe){
        bq.style.setProperty('--bqx',
          (copo._bx + (e.clientX - copo._x) / copo._k).toFixed(1) + 'px');
        bq.style.setProperty('--bqy',
          (copo._by + (e.clientY - copo._y) / copo._k).toFixed(1) + 'px');
        e.stopPropagation();
        return;
      }
      if (!copo._mexe) return;
      const d = e.clientX - copo._x;
      if (Math.abs(d) < 5) return;
      const dir = d > 0 ? 1 : -1;
      copo._x = e.clientX;
      bq.style.setProperty('--slosh', dir);
      /* o que agita não é o movimento, é a INVERSÃO do movimento */
      if (dir !== copo._dir){
        copo._dir = dir;
        bq.dataset.agita = Math.min(1, (+bq.dataset.agita || 0) + 0.34);
        bqAnda(bq);
      }
      e.stopPropagation();
    });
    const solta = () => {
      copo._mexe = 0; copo._poe = 0;
      bq.style.setProperty('--slosh', 0);
    };
    copo.addEventListener('pointerup', solta);
    copo.addEventListener('pointercancel', solta);
  });
}

/* A face que sai leva a experiência consigo: a pedra volta para o lado
   do béquer e o retículo se refaz, inteiro, para a próxima. */
function descansaBequer(raiz){
  (raiz || document).querySelectorAll('.bq').forEach(bq => {
    if (bq._t){ cancelAnimationFrame(bq._t); bq._t = 0; }
    bq.dataset.sal = 0; bq.dataset.agita = 0;
    bq.style.setProperty('--sal', 0);
    bq.style.setProperty('--agita', 0);
    bq.style.setProperty('--slosh', 0);
    /* 'sumiu' sai junto: sem isto, uma pedra que se dissolveu de todo
       voltaria inteira mas surda ao dedo, e a experiência não recomeçaria */
    bq.classList.remove('molhado', 'pegando', 'sumiu');
    const sal = bq.querySelector('.bq-sal');
    if (sal){
      clearTimeout(sal._qT);
      sal.classList.remove('caindo');       /* volta ao lugar sem cair */
      sal.style.left = sal.dataset.x + 'px';
      sal.style.top  = sal.dataset.y + 'px';
    }
    G3.dissolve = 0;
  });
}

/* O cristal de cada propriedade. A face 4 volta ao NaCl: a pedra que
   entra no béquer é de sal, e seria estranho a lupa mostrar outro. */
const REDE_DA_FACE = ['na2o', 'nacl', 'mgo', 'nacl', 'nacl'];

/* Troca o retículo sem o voo de aproximação: ele já nasce montado e
   enquadrado no vidro, porque quem está entrando em cena é a face nova,
   não o cristal.

   O enquadramento vem medido de fora (g). Medir aqui dentro daria
   errado: a troca acontece no meio do giro, com a lente de perfil, e
   nesse instante ela projeta menos de um quinto da largura real — o
   retículo sairia enquadrado num quadro de 40px em vez de 235. */
function trocaRedeDaLupa(slide, tipo, g){
  const it = slide && slide.querySelector('.reveal-item.reticulo[data-lupa]');
  const cv = slide && slide.querySelector('.q3d');
  if (!it || !cv || !iniciaG3(cv)) return;
  const geo = (g && g.r > 40) ? g : geoLupa();
  if (!(geo.r > 40)) return;             /* lente de perfil: não enquadra */
  montaCena(tipo);
  it.dataset.rede = tipo;
  enquadraRede(geo.x, geo.y, geo.r * 1.6, geo.r * 1.6);
  G3.voo = 0; G3.distAlvo = G3.dist;
  G3.t = 1; G3.alvo = 1;
  poeRotuloRede(slide);
}

/* A lupa dá meia volta a cada virada do cubo. O retículo some no começo
