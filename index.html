/* ------------------------------------------------------------
   A PEDRA
   silhueta irregular + textura de rocha feita com ruído e luz
   (feTurbulence + feDiffuseLighting), sem nenhum arquivo externo.
   Segurar o dedo/mouse desmonta a pedra na rede de átomos.
   ------------------------------------------------------------ */
const ROCK_W = 260, ROCK_H = 200;          /* espaço interno da pedra */
const ROCK_PATH = 'M26 130 L14 94 L36 56 L74 30 L120 18 L170 24 L212 46 L240 82 '
                + 'L248 122 L230 158 L188 180 L128 188 L72 176 L38 156 Z';
const ROCK_CAMADAS = 15;                   /* fatias da extrusão */
const ROCK_FUNDO = 4.2;                    /* px de profundidade por fatia */

/* as fatias de trás: mesma silhueta, cada vez mais escura e mais funda */
function rockExtrusao(){
  const base = toRGB('#5E6C78');
  let out = '';
  for (let i = ROCK_CAMADAS; i >= 1; i--){
    const t = i / ROCK_CAMADAS;            /* 1 = a mais funda */
    const cor = asCSS(darken(base, 1 - t * 0.84));
    out += `<svg class="rock-layer" viewBox="0 0 ${ROCK_W} ${ROCK_H}"`
         + ` style="--z:${(-ROCK_FUNDO * i).toFixed(1)}px" aria-hidden="true">`
         + `<path fill="${cor}" d="${ROCK_PATH}"/></svg>`;
  }
  return out;
}
const COLS = 5, ROWS = 4, DEPS = 3;        /* rede 3D: colunas, fileiras, camadas */
const CELL_X = 48, CELL_Y = 44, CELL_Z = 84;
let rockSeq = 0;

/* sorteio determinístico: a pedra sai igual em toda máquina e toda recarga */
const rng = (seed) => () => {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
};

function ROCK(){
  const id = `rk${++rockSeq}`;
  const cx = ROCK_W / 2, cy = ROCK_H / 2;
  const rnd = rng(20260824 + rockSeq * 7919);

  return `
  <div class="rock-stage">
   <div class="rock-zoom">
    <div class="rock-3d">
    ${rockExtrusao()}
    <svg class="rock-svg" viewBox="0 0 ${ROCK_W} ${ROCK_H}" aria-hidden="true">
      <defs>
        <linearGradient id="${id}g" x1="0" y1="0" x2=".55" y2="1">
          <stop offset="0"   stop-color="#8B9AA5"/>
          <stop offset=".45" stop-color="#5F707C"/>
          <stop offset="1"   stop-color="#36454F"/>
        </linearGradient>
        <filter id="${id}f" x="-12%" y="-10%" width="124%" height="146%"
                color-interpolation-filters="sRGB">
          <!-- borda comida, irregular -->
          <feTurbulence type="fractalNoise" baseFrequency=".085" numOctaves="3" seed="4" result="en"/>
          <feDisplacementMap in="SourceGraphic" in2="en" scale="9"
                             xChannelSelector="R" yChannelSelector="G" result="src"/>
          <!-- relevo da superfície -->
          <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="9" result="n"/>
          <feDiffuseLighting in="n" surfaceScale="4.2" diffuseConstant="1.05"
                             lighting-color="#B4C3CC" result="dif">
            <feDistantLight azimuth="228" elevation="52"/>
          </feDiffuseLighting>
          <feBlend in="dif" in2="src" mode="multiply" result="mix"/>
          <!-- brilho seco de quartzo -->
          <feSpecularLighting in="n" surfaceScale="4.2" specularConstant=".5"
                              specularExponent="20" lighting-color="#DCEAF0" result="spe">
            <feDistantLight azimuth="228" elevation="60"/>
          </feSpecularLighting>
          <feComposite in="spe" in2="src" operator="in" result="spe2"/>
          <feComposite in="spe2" in2="mix" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
          <feComposite in="lit" in2="src" operator="in" result="rock"/>
          <!-- a sombra entra aqui dentro: assim não sobra filtro CSS por cima -->
          <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#030C16" flood-opacity=".7"/>
        </filter>
      </defs>
      <g filter="url(#${id}f)">
        <path fill="url(#${id}g)" d="${ROCK_PATH}"/>
        <path fill="#000" opacity=".22" d="M120 18 L170 24 L188 62 L128 74 L96 44 Z"/>
        <path fill="#fff" opacity=".07" d="M36 56 L74 30 L96 44 L64 96 L26 104 Z"/>
        <path fill="#000" opacity=".18" d="M188 180 L128 188 L118 148 L196 132 L230 158 Z"/>
      </g>
    </svg>
    </div>
    <div class="rock-glow"></div>
   </div>
  </div>`;
}

/* ------------------------------------------------------------
   ESFERAS COLORIDAS
   a partir de uma cor só, monta o degradê que dá volume:
   brilho especular, o corpo na cor pedida e a sombra da base.
   ------------------------------------------------------------ */
const toRGB   = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const asCSS   = (a) => `rgb(${a.map(Math.round).join(',')})`;
const lighten = (c, t) => c.map(v => v + (255 - v) * t);
const darken  = (c, t) => c.map(v => v * t);

function sphereBg(hex){
  const c = toRGB(hex);
  return `radial-gradient(circle at 33% 27%,`
       + `rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 5%,rgba(255,255,255,0) 22%),`
       + `radial-gradient(circle at 36% 30%,`
       + `${asCSS(lighten(c, .4))} 0%,${hex} 30%,`
       + `${asCSS(darken(c, .62))} 62%,${asCSS(darken(c, .28))} 100%)`;
}

/* ------------------------------------------------------------
   A MOLÉCULA DE ÁGUA E O COPO
   a molécula usa as mesmas esferas do postulado 2: oxigênio
   vermelho e dois hidrogênios cinza claro, a 103° um do outro.
   ------------------------------------------------------------ */
const MOL_W = 260, MOL_H = 220;
const GLASS_W = 200, GLASS_H = 260;

function MOLECULE(){
  return `<div class="mol-stage">
    <div class="mol-atom h1" style="background:${sphereBg(EL_COLOR.H)}">H</div>
    <div class="mol-atom h2" style="background:${sphereBg(EL_COLOR.H)}">H</div>
    <div class="mol-atom o"  style="background:${sphereBg(EL_COLOR.O)}">O</div>
  </div>`;
}

/* Uma bolinha dentro do degradê composto da mini-molécula.
   O raio é multiplicado por --k igual à caixa: sem isso, ao crescer,
   as posições (em %) se afastam e os átomos se descolam uns dos outros. */
const miniBall = (hex, cx, cy, r) => {
  const c = toRGB(hex);
  return `radial-gradient(circle calc(${r}px * var(--k,1)) at ${cx}% ${cy}%,`
       + `${asCSS(lighten(c, .5))} 0%,${hex} 44%,`
       + `${asCSS(darken(c, .5))} 96%,rgba(0,0,0,0) 97%)`;
};
/* ------------------------------------------------------------
   CORES DOS ELEMENTOS — padrão CPK (as do Jmol, que são as
   usadas nos livros didáticos e nos programas de modelagem).
   Esta é a única fonte: as esferas do postulado 2, a molécula
   de água e o campo quântico leem todas daqui.
   ------------------------------------------------------------ */
const EL_COLOR = {
  H:  '#FFFFFF',   /* branco   */
  C:  '#909090',   /* cinza    */
  N:  '#3050F8',   /* azul     */
  O:  '#FF0D0D',   /* vermelho */
  S:  '#FFFF30',   /* amarelo  */
  Au: '#FFD123',   /* ouro     */
  /* gases nobres: a mesma escala do CPK, do quase branco ao azul fechado */
  He: '#D9FFFF',
  Ne: '#B3E3F5',
  Ar: '#80D1E3',
  Kr: '#5CB8D1',
  Xe: '#429EB0',
  Rn: '#428296',
  Na: '#AB5CF2',   /* sódio, no mesmo padrão CPK */
  Mg: '#8AFF00',   /* magnésio, verde do CPK */
  Cl: '#26D926',   /* cloro */
  Ca: '#3DFF00'    /* cálcio, verde do CPK */
};

/* receitas: [elemento, x%, y%, raio]. O átomo central vem por último,
   porque a última camada de fundo é a que fica por baixo. */
const RECIPES = {
  h2o:   [['H',32.5,58.5,5.5],['H',67.5,58.5,5.5],['O',50,40,8]],
  nh3:   [['H',26,62,5],['H',74,62,5],['H',50,76,5],['N',50,42,8]],
  co2:   [['O',17,50,7],['O',83,50,7],['C',50,50,7.5]],
  h2so4: [['H',10,26,4],['H',90,26,4],['O',24,34,6],['O',76,34,6],
          ['O',30,72,6],['O',70,72,6],['S',50,50,8.5]],
  etoh:  [['H',12,32,4],['H',88,30,4],['C',30,50,7],['C',52,62,7],['O',74,42,6.5]],
  cl2:   [['Cl',34,50,8],['Cl',66,50,8]],
  o2:    [['O',34,50,8],['O',66,50,8]],
  n2:    [['N',34,50,8],['N',66,50,8]],
  agua:  [['H',24.5,62,5.5],['H',75.5,62,5.5],['O',50,42,8]],
  scl2:  [['Cl',22,60,7],['Cl',78,60,7],['S',50,42,9]],
  carbonico: [['O',18,50,7],['O',82,50,7],['C',50,50,7.5]],
  metano: [['H',26,34,5],['H',74,34,5],['H',26,66,5],['H',74,66,5],['C',50,50,8]],
  hcn:    [['H',14,50,5],['N',84,50,8],['C',50,50,7.5]],
  /* a amônia do slide da covalente é a de três dimensões (ver MOL3D);
     esta receita só serve para o campo saber o tamanho dela e espaçar
     as moléculas sem que se encostem */
  amonia: [['H',26,62,5],['H',74,62,5],['H',50,76,5],['N',50,42,8]],
  /* gases nobres são monoatômicos: uma esfera só, sem ligação nenhuma */
  he: [['He',50,50,13]], ne: [['Ne',50,50,13]], ar: [['Ar',50,50,13]],
  kr: [['Kr',50,50,13]], xe: [['Xe',50,50,13]], rn: [['Rn',50,50,13]]
};
/* cada mini-molécula é UM elemento só: as bolinhas são camadas de
   fundo, não filhos. Custa um desenho, não uma dúzia. */
const bgFor = (key) => (RECIPES[key] || RECIPES.h2o)
  .map(([el, x, y, r]) => miniBall(EL_COLOR[el], x, y, r)).join(',');
const MINI_BG = bgFor('h2o');

/* A água em bola-e-vareta, do jeito que ela é: o oxigênio grande na
   frente e os dois hidrogênios encaixados nele, no ângulo de 104,5°.
   Antes eram três manchas de fundo separadas numa caixa achatada — os
   H apareciam soltos, longe do O. Aqui a geometria é desenhada:
     O em (50,36) r 26 ;  H a 32 do centro, a 52,25° da vertical
     -> H em (24,7 , 55,6) e (75,3 , 55,6), r 15
   Com d = 32 e rO+rH = 41, cada H entra 9 unidades no oxigênio: eles se
   tocam de fato. O O é desenhado por último, então fica por cima. */
/* Geometria de cada molécula, na mesma escala: posição e raio de cada
   átomo, do fundo para a frente (o central é sempre o último, e por isso
   fica por cima). As distâncias são cerca de 78% da soma dos raios, então
   os átomos SE ENCOSTAM em vez de flutuarem soltos. */
const MOLGEO = {
  h2o:  [['H',24.7,55.6,15],['H',75.3,55.6,15],['O',50,36,26]],
  nh3:  [['H',50,68,15],['H',24,52,15],['H',76,52,15],['N',50,34,25]],
  co2:  [['O',14,50,24],['O',86,50,24],['C',50,50,20]],
  h2so4:[['H',0.9,0.9,14],['H',99.1,0.9,14],
         ['O',21.3,21.3,23],['O',78.7,21.3,23],
         ['O',21.3,78.7,23],['O',78.7,78.7,23],['S',50,50,29]],
  /* etanol inteiro, H3C-CH2-OH: três hidrogênios no primeiro carbono,
     dois no segundo, e o da hidroxila na ponta. A cadeia é horizontal. */
  etoh: [['H',28,33,14],['H',10,60,14],['H',28,87,14],    /* os três do C1 */
         ['H',79,30,14],['H',79,90,14],                   /* os dois do C2 */
         ['H',145,60,14],                                 /* o da hidroxila */
         ['C',40,60,25],['C',79,60,25],['O',116,60,23]],
  /* Cl2 em bola-e-bastão. As outras moléculas daqui são calotas coladas,
     que é como a matéria realmente ocupa espaço; o Cl2 é o exemplo da
     LIGAÇÃO, e o que se quer ver nele é o traço entre os dois núcleos.
     Por isso os dois cloros se afastam — centros a 60, raio 24, 12 de
     folga entre as superfícies — e o bastão aparece no meio.
     O par de índices que se liga está em MOLBOND. */
  cl2:  [['Cl',20,50,24],['Cl',80,50,24]],
  /* O2 é o mesmo desenho do Cl2 — duas esferas afastadas para o traço da
     ligação aparecer entre elas. O que muda é a ligação: dois bastões
     paralelos, porque o oxigênio compartilha DOIS pares. */
  o2:   [['O',22,50,23],['O',78,50,23]],
  /* N2: o mesmo par de esferas, um pouco menores, e TRÊS bastões entre
     elas. É a ligação mais forte da aula, e a mais curta. */
  n2:   [['N',22,50,22],['N',78,50,22]],
  /* A ÁGUA DO SLIDE DA COVALENTE.
     A h2o de cima é a água como MATÉRIA: calotas coladas, os hidrogênios
     enterrados no oxigênio, que é como ela de fato ocupa espaço. Esta
     aqui é a água como LIGAÇÃO — o assunto do slide 17 —, e ligação se
     vê no traço entre os núcleos. Por isso os hidrogênios se afastam o
     bastante para os dois bastões caberem, guardando o ângulo de 104,5°
     que a molécula tem de verdade: cada H sai a 52,25° da vertical.
     São duas águas porque são duas aulas; a mesma distinção que o Cl2
     já fazia em relação às outras moléculas daqui. */
  agua: [['H',12,69.4,14],['H',88,69.4,14],['O',50,40,24]],
  /* SCl2 — a mesma forma da água, e pela mesma razão: o enxofre é da
     família 6A como o oxigênio, tem dois pares isolados e por isso a
     molécula sai entortada, com 103° entre as duas ligações. O que muda
     é o tamanho — cloro é átomo grande, e dois deles abrem a molécula
     bem mais do que dois hidrogênios abriam. */
  scl2: [['Cl',7.7,69.6,21],['Cl',92.3,69.6,21],['S',50,36,24]],
  /* GÁS CARBÔNICO — a molécula RETA da série.
     O carbono é da família 4A: tem quatro elétrons de valência e gasta
     os quatro nas ligações, dois para cada oxigênio. Não lhe sobra par
     isolado nenhum — e é justamente por não sobrar que ela não entorta,
     ao contrário da água e do SCl2, que têm dois pares nas costas do
     átomo central empurrando os braços para baixo. O CO2 é a prova, na
     mesma aula, de que a forma da molécula vem dos pares que ficam, e
     não só dos que se compartilham. */
  carbonico: [['O',-2,50,23],['O',102,50,23],['C',50,50,20]],
  /* CIANETO DE HIDROGÊNIO — H–C≡N, e as três ordens de ligação da série
     numa molécula só: uma simples de um lado do carbono, uma tripla do
     outro. O carbono gasta os quatro elétrons de valência nos dois
     braços (um para o H, três para o N) e de novo não fica com par
     isolado — daí ela ser reta, como o gás carbônico. Quem tem par
     isolado aqui é o nitrogênio, um só, nas costas dele. */
  hcn:  [['H',9,50,14],['N',103,50,22],['C',52,50,20]],
  he:[['He',50,50,34]], ne:[['Ne',50,50,34]], ar:[['Ar',50,50,34]],
  kr:[['Kr',50,50,34]], xe:[['Xe',50,50,34]], rn:[['Rn',50,50,34]]
};

/* ------------------------------------------------------------
   AS MOLÉCULAS DE TRÊS DIMENSÕES
   Posições em px do referencial da molécula, com z para dentro da
   tela. O que entra aqui deixa de ser desenho e passa a ser objeto:
   não se desmonta, se vira.
   ------------------------------------------------------------ */
const MOL3D = {
  /* AMÔNIA — pirâmide trigonal. Os três hidrogênios abrem 107° um do
     outro, o que os põe a 68° do eixo que sobe do nitrogênio. Quem os
     empurra para baixo é o par isolado, que fica nesse eixo e não se
     desenha: é o exemplo em que o par que NÃO aparece é o que explica
     a forma. Chata, a molécula seria outra substância. */
  /* As esferas são de BOLA-E-BASTÃO, e não de calota: menores que o
     raio de verdade, para sobrar ligação à vista entre elas. Cortadas na
     casca (ver MOL_3D), esferas do tamanho real se encostariam e não
     restaria haste nenhuma para mostrar. */
  amonia: {
    at: [['N',    0, -5.9,    0, 9.5],
         ['H',    0,  2.0, 20.6, 5.5],
         ['H',-17.8,  2.0, -10.3, 5.5],
         ['H', 17.8,  2.0, -10.3, 5.5]],
    lig: [[0, 1, 4], [0, 2, 4], [0, 3, 4]]
  },
  /* METANO — tetraedro PERFEITO. Os quatro hidrogênios nos vértices
     alternados de um cubo, que é o que dá os 109,5° entre quaisquer duas
     ligações. Vem logo depois da amônia de propósito: o carbono gasta os
     quatro elétrons de valência e não guarda par nenhum, e por isso a
     figura fecha simétrica. O nitrogênio guarda um par, e é esse par que
     achata a pirâmide dela para 107°. Girando as duas uma atrás da
     outra, vê-se que a diferença entre um tetraedro e uma pirâmide é um
     par de elétrons que ninguém desenha. */
  metano: {
    at: [['C',    0,     0,     0, 9],
         ['H', 12.7,  12.7,  12.7, 5.5],
         ['H', 12.7, -12.7, -12.7, 5.5],
         ['H',-12.7,  12.7, -12.7, 5.5],
         ['H',-12.7, -12.7,  12.7, 5.5]],
    lig: [[0, 1, 4], [0, 2, 4], [0, 3, 4], [0, 4, 4]]
  }
};
const eh3D = (key) => !!MOL3D[key];

/* Monta a molécula em 3D. As esferas são círculos com brilho — de
   qualquer ângulo uma esfera é um círculo, então elas não precisam ser
   orientadas. As HASTES precisam: cada uma nasce no átomo de origem
   apontando para o +X e é virada até encostar no átomo de destino.
     rotateZ leva o +X ao ângulo do vetor no plano da tela;
     rotateY o inclina para dentro ou para fora dela.
   Nessa ordem o +X vai parar em (cosZ·cosY, senZ·cosY, -senY), que é
   exatamente a direção da ligação normalizada. */
function MOL_3D(key){
  const M = MOL3D[key];
  if (!M) return '';
  const bolas = M.at.map(([el, x, y, z, r]) =>
    `<i class="m3-at" style="--x:${x}px;--y:${y}px;--z:${z}px;--r:${r}px;`
    + `--bg:${sphereBg(EL_COLOR[el] || '#B0B0B0')}"></i>`).join('');
  const hastes = M.lig.map(([ia, ib, w]) => {
    const a = M.at[ia], b = M.at[ib];
    const dx = b[1] - a[1], dy = b[2] - a[2], dz = b[3] - a[3];
    const D = Math.hypot(dx, dy, dz) || 1;
    const ux = dx / D, uy = dy / D, uz = dz / D;
    /* A HASTE VAI DE CASCA A CASCA, e não de centro a centro.
       Numa cena 3D de verdade a esfera esconderia o pedaço de dentro
       dela. Aqui quem ordena a profundidade é o navegador, e ele ordena
       PLANOS inteiros: um bastão cuja lâmina caia à frente da esfera
       aparece inteiro por cima, atravessando-a. Cortando a haste na
       superfície das duas esferas não sobra pedaço nenhum para
       atravessar — e a esfera volta a ser opaca de verdade.

       O corte é o raio exato, e não sobra fresta: de frente ele cai
       na borda do círculo; de viés, o encurtamento da perspectiva o
       leva para DENTRO dele. */
    const ax = a[1] + ux * a[4], ay = a[2] + uy * a[4], az = a[3] + uz * a[4];
    const L = Math.max(1, D - a[4] - b[4]);
    const rz = Math.atan2(dy, dx) * 180 / Math.PI;
    const ry = -Math.asin(Math.max(-1, Math.min(1, dz / D))) * 180 / Math.PI;
    /* três lâminas em torno do eixo, com brilhos diferentes: a de frente
       clara, as de trás mais fechadas. É o que dá o arredondado do tubo */
    return [[0, 1], [60, .72], [120, .72]].map(([g, o]) =>
      `<i class="m3-lig" style="--x:${ax.toFixed(1)}px;--y:${ay.toFixed(1)}px;`
      + `--z:${az.toFixed(1)}px;`
      + `--len:${L.toFixed(1)}px;--w:${w}px;`
      + `--rz:${rz.toFixed(1)}deg;--ry2:${ry.toFixed(1)}deg;`
      + `--rx3:${g}deg;--o3:${o}"></i>`).join('');
  }).join('');
  return `<div class="m3">${hastes}${bolas}</div>`;
}

/* Desenha a molécula. O viewBox sai da própria tinta, então cada uma
   ocupa a caixa inteira sem sobra e sem corte. O gradiente é o mesmo das
   outras esferas do app: brilho a 34/26% e a borda escurecida. */
/* Quem se liga a quem, em bastão: [índice A, índice B, espessura], com
   os índices apontando para MOLGEO. Molécula que não está aqui continua
   em calota colada, como sempre foi — só entra de bastão quem a aula
   pede que entre. */
/* O quarto número afasta o traço do eixo, e é ele que desenha a ligação
   dupla: dois bastões iguais, um de cada lado da linha dos núcleos. Um
   traço por par compartilhado — é daqui que sai a ordem da ligação. */
const MOLBOND = {
  cl2: [[0, 1, 16]],
  o2:  [[0, 1, 11, -9], [0, 1, 11, 9]],
  /* três traços mais finos, para os três caberem entre os dois núcleos
     sem se encostarem */
  n2:  [[0, 1, 7, -11.5], [0, 1, 7, 0], [0, 1, 7, 11.5]],
  /* duas ligações que partem do mesmo átomo: o central é o índice 2, e é
     isso que faz a água e o SCl2 serem lidos aqui como moléculas de
     braços — centro parado, braços que se arrancam um a um */
  agua: [[2, 0, 13], [2, 1, 13]],
  scl2: [[2, 0, 12], [2, 1, 12]],
  /* duas DUPLAS partindo do mesmo carbono: dois traços por ligação, e é
     contando os traços de cada vizinho que a ordem sai */
  carbonico: [[2, 0, 11, -9], [2, 0, 11, 9],
              [2, 1, 11, -9], [2, 1, 11, 9]],
  /* do carbono (índice 2) saem uma simples para o H e uma TRIPLA para o
     N — três traços para o mesmo vizinho, e é contando-os que a ordem
     de cada braço sai */
  hcn: [[2, 0, 12],
        [2, 1, 9, -9], [2, 1, 9, 0], [2, 1, 9, 9]]
};

/* O átomo que TODAS as ligações têm em comum — o centro de uma molécula
   de braços. Devolve -1 quando não há um: num par de iguais como o Cl2
   os dois seriam "o centro", e ali a ideia não se aplica. */
function centroDe(key){
  const b = MOLBOND[key] || [];
  if (b.length < 2) return -1;
  const atomos = new Set();
  b.forEach(l => { atomos.add(l[0]); atomos.add(l[1]); });
  if (atomos.size < 3) return -1;           /* dois átomos não têm centro */
  const conta = {};
  b.forEach(l => { conta[l[0]] = (conta[l[0]] || 0) + 1;
                   conta[l[1]] = (conta[l[1]] || 0) + 1; });
  const c = Object.keys(conta).find(k => conta[k] === b.length);
  return c === undefined ? -1 : +c;
}
const ehRamos = (key) => centroDe(key) >= 0;

/* Quantos pares a ligação tem: um bastão é simples, dois é dupla. Sai da
   própria MOLBOND, que já traz um traço por par — sem segunda lista para
   manter em dia. */
function ordemLig(key){
  const b = MOLBOND[key] || [];
  if (!b.length) return 0;
  return b.filter(l => l[0] === b[0][0] && l[1] === b[0][1]).length;
}

function MOL_SVG(key){
  const g = MOLGEO[key] || MOLGEO.h2o;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  g.forEach(([, x, y, r]) => {
    if (x - r < x0) x0 = x - r;
    if (x + r > x1) x1 = x + r;
    if (y - r < y0) y0 = y - r;
    if (y + r > y1) y1 = y + r;
  });
  const els = [...new Set(g.map(a => a[0]))];
  const defs = els.map(el => {
    const c = toRGB(EL_COLOR[el] || '#B0B0B0');
    return `<radialGradient id="mg-${el}" cx="34%" cy="26%" r="74%">`
         + `<stop offset="0" stop-color="${asCSS(lighten(c, .55))}"/>`
         + `<stop offset=".42" stop-color="${EL_COLOR[el] || '#B0B0B0'}"/>`
         + `<stop offset="1" stop-color="${asCSS(darken(c, .58))}"/>`
         + `</radialGradient>`;
  }).join('');

  /* Os bastões. A luz corre ATRAVESSADA no bastão — de uma borda à
     outra, não de ponta a ponta —, e é isso que faz o traço parecer um
     cilindro em vez de uma fita chapada. Por isso o gradiente é montado
     na perpendicular da ligação, e serve para bastão em qualquer ângulo,
     não só para os horizontais. */
  const lig = (MOLBOND[key] || []).map(([ia, ib, w, off], i) => {
    const A = g[ia], B = g[ib];
    if (!A || !B) return { def: '', haste: '' };
    const [, ax0, ay0] = A, [, bx0, by0] = B;
    const L = Math.hypot(bx0 - ax0, by0 - ay0) || 1;
    const px = -(by0 - ay0) / L, py = (bx0 - ax0) / L;    /* perpendicular */
    /* O desvio tira o bastão de cima do eixo. As pontas continuam
       enterradas nas esferas — o desvio é bem menor que o raio delas —,
       então o corte não aparece nem no traço deslocado. */
    const d0 = off || 0;
    const ax = ax0 + px * d0, ay = ay0 + py * d0;
    const bx = bx0 + px * d0, by = by0 + py * d0;
    const mx = (ax + bx) / 2,  my = (ay + by) / 2;
    const id = `mb-${key}-${i}`;
    return {
      def: `<linearGradient id="${id}" gradientUnits="userSpaceOnUse"`
         + ` x1="${(mx - px * w / 2).toFixed(2)}" y1="${(my - py * w / 2).toFixed(2)}"`
         + ` x2="${(mx + px * w / 2).toFixed(2)}" y2="${(my + py * w / 2).toFixed(2)}">`
         + `<stop offset="0" stop-color="#5C6874"/>`
         + `<stop offset=".32" stop-color="#E6EDF3"/>`
         + `<stop offset=".64" stop-color="#A6B3BE"/>`
         + `<stop offset="1" stop-color="#4B5661"/>`
         + `</linearGradient>`,
      /* vai de centro a centro: as pontas ficam enterradas nas esferas,
         que são desenhadas depois e cobrem o corte */
      haste: `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"`
           + ` stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round"/>`
    };
  });

  const bolas = g.map(([el, x, y, r]) =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#mg-${el})"/>`).join('');
  return `<svg class="qm-svg" viewBox="${(x0 - 1).toFixed(1)} ${(y0 - 1).toFixed(1)} `
       + `${(x1 - x0 + 2).toFixed(1)} ${(y1 - y0 + 2).toFixed(1)}" aria-hidden="true">`
       + `<defs>${defs}${lig.map(b => b.def).join('')}</defs>`
       + `${lig.map(b => b.haste).join('')}${bolas}</svg>`;
}
const AGUA_SVG = MOL_SVG('h2o');
/* A ÁGUA EM BOLA-E-BASTÃO.
   A de cima é a água como MATÉRIA: calotas coladas, os hidrogênios
   enterrados no oxigênio, que é como ela de fato ocupa espaço. Onde o
   assunto é a LIGAÇÃO, é esta que serve — os átomos afastados e o traço
   à vista entre eles.
   Nos dois lugares em que ela entra o bastão JÁ EXISTIA no desenho: o
   que faltava era a molécula abrir espaço para ele aparecer, porque com
   os átomos colados ele ficava inteiro dentro das esferas. */
const AGUA_BAST = MOL_SVG('agua');

      ${!tag ? '' : (() => {

           A fórmula pede o índice embaixo — é o formulaSVG que o desce.
           O nome pede que CAIBA, e aí quem serve é o rotulo comum, que
           aperta o traço até entrar na plaqueta. Um nome de duas linhas
           pede plaqueta mais alta, senão ele transborda. */
        const linhas = String(tag).split('\n').length;

/* ------------------------------------------------------------
   RECIPIENTES DE SUBSTÂNCIA
   frasco, bateria e extintor, no mesmo palco 200 x 260 do copo.
   O texto do rótulo é ajustado com textLength, então cabe sempre.
   ------------------------------------------------------------ */
/* Fórmula química desenhada em SVG: os algarismos que vêm depois de uma
   letra descem e diminuem — o 2 do H2O. Os rótulos de gás são palavras
   ("GÁS CLORO") e saem pelo rotulo() comum; o do copo é uma FÓRMULA, e
   fórmula sem índice embaixo não é fórmula. */
function formulaSVG(txt, cx, y, size, fill){
  let desceu = 0;
  const partes = String(txt).split(/(\d+)/).filter(p => p !== '').map(p => {
    if (!/^\d+$/.test(p)){
      const volta = desceu ? ` dy="${-desceu}"` : '';
      desceu = 0;
      return `<tspan${volta}>${p}</tspan>`;
    }
    desceu = Math.round(size * 0.26);
    return `<tspan font-size="${Math.round(size * 0.68)}" dy="${desceu}">${p}</tspan>`;
  }).join('');
  return `<text x="${cx}" y="${y}" text-anchor="middle" fill="${fill}"
           font-size="${size}" font-weight="600">${partes}</text>`;
}

/* Fórmula ou nome? Um algarismo no texto decide: "CH4" é fórmula e pede
   o índice embaixo; "GÁS CLORO" e "Água" são nomes e pedem que caibam.
   A regra mora aqui para os recipientes não divergirem entre si. */
const ehFormula = (tag) => /\d/.test(String(tag));

const rotulo = (tag, cx, y, w, size, fill) =>
  String(tag).split('\n').map((l, i) =>
    `<text x="${cx}" y="${y + i * (size + 4)}" text-anchor="middle" fill="${fill}"
           font-size="${size}" textLength="${Math.min(w, l.length * size * .72)}"
           lengthAdjust="spacingAndGlyphs">${l}</text>`).join('');

/* cilindro de gás comprimido: o volante da válvula, o corpo na cor do
   gás e o sombreado cilíndrico, que é o mesmo para qualquer cor */
function CYLINDER(tag, c, formula){
  const corpo = `M46 92 C46 56 154 56 154 92 L154 232 Q154 248 138 248
                 L62 248 Q46 248 46 232 Z`;
  return `
    <defs>

    ${formula
        /* NOME EM CIMA, FÓRMULA EMBAIXO — é assim que se lê o rótulo de
           um cilindro de verdade, e das duas coisas é a fórmula que a
           aula vai usar, então ela sai maior. Nome de duas linhas sobe e
           aperta a fórmula: os dois têm de caber na mesma plaqueta. */
        ? (() => {
            const n2 = String(tag).split('\n').length > 1;
            return rotulo(tag, 100, n2 ? 145 : 152, 84, 16, '#16232E')
                 + formulaSVG(formula, 100, n2 ? 192 : 189, n2 ? 24 : 27, '#16232E');
          })()
      : ehFormula(tag)
        /* só fórmula: uma linha, centrada na plaqueta e grande, que ela
           é curta e tem de ser lida do fundo da sala */
        ? formulaSVG(tag, 100, 175, 30, '#16232E')
        : rotulo(tag, 100, 154, 88, 17, '#16232E')}

/* BÉQUER — o copo de laboratório: paredes retas, bico de vazar e as
   marcas de graduação. O copo liso é a água que se bebe, e é dela que
   os slides do começo falam; aqui o assunto é uma substância que se
   manipula, e um líquido corrosivo não está num copo de água.

   A cor vem de fora, porque é ela que diz de que líquido se trata. Como
   no cilindro, os degradês de identificador fixo são só de luz e sombra
   — nada que dependa da cor —, senão dois béqueres de cores diferentes
   na mesma tela disputariam o mesmo id e sairiam iguais. */
function BEAKER(tag, c, cLight){
  /* o miolo: paredes retas e o fundo levemente arredondado */
  const corpo = 'M50 56 L50 228 Q50 246 72 246 L128 246 Q150 246 150 228 L150 56 Z';
  const marcas = [96, 120, 144].map(y =>
    `<path d="M60 ${y} H84" stroke="#E8F1F5" stroke-opacity=".38" stroke-width="2"/>`).join('');
  return `

        <stop offset="0"   stop-color="#000000" stop-opacity=".30"/>

        <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="1"   stop-color="#000000" stop-opacity=".42"/>
      </linearGradient>
      <clipPath id="bkrIn"><path d="${corpo}"/></clipPath>
    </defs>
    <!-- o bico de vazar, na quina direita da boca -->
    <path d="M148 50 L170 40 L172 50 L152 62 Z" fill="#C9DAE4" opacity=".55"/>
    <!-- o líquido, do nível para baixo -->
    <g clip-path="url(#bkrIn)">
      <rect x="40" y="104" width="120" height="150" fill="${c}"/>
      <rect x="40" y="104" width="120" height="150" fill="url(#bkrSh)" opacity=".45"/>
      <!-- a superfície: a borda de trás mais viva, porque ali a luz
           atravessa o líquido e volta -->
      <ellipse cx="100" cy="104" rx="50" ry="7.5" fill="${cLight}" opacity=".8"/>
      <path d="M50 104 A50 7.5 0 0 1 150 104" fill="none"
            stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.6"/>
    </g>
    <!-- o vidro por cima: é esta camada que faz o copo conter o líquido
         em vez de ficar atrás dele -->
    <path d="${corpo}" fill="url(#bkrSh)" opacity=".5"/>
    <path d="${corpo}" fill="none" stroke="#B9CBD6" stroke-opacity=".72" stroke-width="2.4"/>
    <ellipse cx="100" cy="56" rx="50" ry="8" fill="none"
             stroke="#D6E8F0" stroke-opacity=".72" stroke-width="2.4"/>
    ${marcas}
    <rect x="54" y="158" width="92" height="58" rx="3" fill="#F2F6F8" opacity=".95"/>
    ${rotulo(tag, 100, 180, 80, 17, '#16232E')}`;
}

function VESSEL(r){
  const art = r.shape === 'battery'      ? BATTERY(r.tag)
            : r.shape === 'extinguisher' ? EXTINGUISHER(r.tag)
            : r.shape === 'cylinder'     ? CYLINDER(r.tag, r.color || '#9CCBDB',
                                                     r.formula)
            : r.shape === 'beaker'       ? BEAKER(r.tag, r.color || '#8FC4E0',
                                                  r.light || '#CDE9F4')
            : BOTTLE(r.tag, r.color || '#7FC8E8', r.light || '#CDE9F4', r.formula);
  return `<div class="z-stage"><div class="z-body">
    <svg class="z-svg" viewBox="0 0 ${GLASS_W} ${GLASS_H}" aria-hidden="true">${art}</svg>
  </div></div>`;
}

/* A esfera de ajuda e a nota que ela abre. A nota mora no palco, na
   posição que o slide pedir; a esfera mora na quina, sempre a mesma. */
function POLI(cfg){
  const itens = (cfg.itens || [])
    .map((t, i) => `<li><b>${i + 1}</b><span>${t}</span></li>`).join('');
  const rot = cfg.rot || 'Ajuda';
  return `<button class="poli-btn" type="button" tabindex="-1"
            title="${rot.replace(/\n/g, ' ')}"
            aria-label="${rot.replace(/\n/g, ' ')}"><span>${rot}</span></button>
    <div class="poli-nota" style="left:${cfg.x || 900}px;top:${cfg.y || 360}px">
      <h3>${cfg.tit || ''}</h3>
      <ol>${itens}</ol>
    </div>`;
}

/* ------------------------------------------------------------
   MOLÉCULA DESMONTÁVEL
   mesma receita das outras, só que aberta: cada átomo é um
   elemento, e cada ligação uma barra que pode ser rompida.
   ------------------------------------------------------------ */
/* estilhaços do splash: ângulo, distância, tamanho, duração e cor.
   Os ângulos fogem do eixo da ligação (0° e 180°), para o esguicho
   sair para os lados, como respingo de coisa que se parte. */
const SPLASH = [
  { a:-108, d: 92, w:16, h:5, t:.62, c:'#D7E3EB' },
  { a: -64, d:118, w:22, h:6, t:.70, c:'#FFB27A' },
  { a: -22, d: 76, w:13, h:4, t:.55, c:'#C2CFD8' },
  { a:  18, d:104, w:19, h:5, t:.66, c:'#FFD3A6' },
  { a:  58, d:126, w:24, h:6, t:.72, c:'#B9C7D1' },
  { a: 104, d: 88, w:15, h:5, t:.60, c:'#FF9A63' },
  { a: 150, d:110, w:20, h:5, t:.68, c:'#D7E3EB' },
  { a:-160, d: 70, w:12, h:4, t:.52, c:'#8FA3B0' }
];
const splashHTML = (i) => SPLASH.map(p => {
  const a = i % 2 ? -p.a : p.a;            /* as duas ligações não estilhaçam igual */
  return `<b style="--a:${a}deg;--d:${p.d}px;--w:${p.w}px;--h:${p.h}px;`
       + `--t:${p.t}s;--c:${p.c}"></b>`;
}).join('');

const SPLIT_W = 320, SPLIT_H = 232;
/* Uma escala só para as duas direções: a receita antiga esticava x e y
   por larguras diferentes e a molécula saía deformada. */
const SPLIT_K = 1.72;

/* A molécula que se desmonta usa a MESMA geometria do desenho do slide
   15: ângulo de verdade e átomos encostados. A vareta da ligação fica
   escondida dentro das esferas e só aparece quando se puxa um átomo. */
/* CADA MOLÉCULA DEITA DE UM JEITO.
   O giro entra na GEOMETRIA, e não numa rotação do contêiner. Aqui os
   átomos se arrancam com o dedo, e a conta que leva a posição deles para
   o palco (ver arrastaAtomo) supõe a molécula sem rotação: girar a caixa
   faria o átomo aparecer num lugar e ser agarrado noutro. Girando as
   posições na hora de montar, tudo o que vem depois — o bastão, o
   estilhaço, a casa para onde o átomo volta — já nasce certo.

   O ângulo vem do sorteio com semente do campo: muda de molécula para
   molécula, mas é sempre o mesmo em toda abertura do slide. */
function splitMol(key, x, y, giro){
  const g = MOLGEO[key] || MOLGEO.h2o;
  const c = g[g.length - 1];               /* o central é sempre o último */
  const cx = SPLIT_W / 2, cy = SPLIT_H / 2;
  const cs = Math.cos(giro || 0), sn = Math.sin(giro || 0);

  let bonds = '', atoms = '';
  g.slice(0, -1).forEach(([el, px, py, r], i) => {
    const dx = (px - c[1]) * SPLIT_K;
    const dy = (py - c[2]) * SPLIT_K;
    const ox = dx * cs - dy * sn;
    const oy = dx * sn + dy * cs;
    const len = Math.hypot(ox, oy), rot = Math.atan2(oy, ox) * 180 / Math.PI;
    bonds += `<i class="qbond" data-for="${i}" style="`
           + `--x:${cx.toFixed(1)}px;--y:${cy.toFixed(1)}px;`
           + `--len:${len.toFixed(1)}px;--rot:${rot.toFixed(1)}deg"></i>`
           + `<i class="qspark" data-for="${i}" style="`
           + `left:${(cx + ox / 2).toFixed(1)}px;top:${(cy + oy / 2).toFixed(1)}px"></i>`
           + `<i class="qsplash" data-for="${i}" style="`
           + `--x:${(cx + ox / 2).toFixed(1)}px;--y:${(cy + oy / 2).toFixed(1)}px;`
           + `--rot:${rot.toFixed(1)}deg">${splashHTML(i)}</i>`;
    atoms += `<b class="qat end" data-i="${i}"`
           + ` data-hx="${(cx + ox).toFixed(1)}" data-hy="${(cy + oy).toFixed(1)}"`
           + ` style="left:${(cx + ox).toFixed(1)}px;top:${(cy + oy).toFixed(1)}px;`
           + `--r:${(r * SPLIT_K).toFixed(1)}px;background:${sphereBg(EL_COLOR[el])}"></b>`;
  });
  const nucleo = `<b class="qat core" style="left:${cx}px;top:${cy}px;`
    + `--r:${(c[3] * SPLIT_K).toFixed(1)}px;background:${sphereBg(EL_COLOR[c[0]])}"></b>`;

  return `<div class="qmol" style="left:${x}px;top:${y}px">${bonds}${nucleo}${atoms}</div>`;
}

/* ------------------------------------------------------------
   O CAMPO QUÂNTICO
   moléculas e micropartículas espalhadas pelo palco inteiro.
   ------------------------------------------------------------ */
/* moléculas de água espalhadas dentro de uma caixa, e não na tela toda */
function MOLS_PN(w, h, n){
  const rnd = rng(51771);
  let out = '';
  for (let i = 0; i < n; i++){
    const a = rnd() * 360;
    out += `<i class="qm" style="`
      + `left:${(12 + rnd() * (w - 149)).toFixed(0)}px;`
      + `top:${(12 + rnd() * (h - 135)).toFixed(0)}px;`
      + `--fx:${(rnd() * 26 - 13).toFixed(0)}px;--fy:${(rnd() * 22 - 11).toFixed(0)}px;`
      + `--r0:${(a - 11).toFixed(0)}deg;--r1:${(a + 11).toFixed(0)}deg;`
      + `--fd:${(6 + rnd() * 4).toFixed(1)}s;--o:${(.55 + rnd() * .4).toFixed(2)}">`
      + AGUA_BAST + `</i>`;
  }
  return out;
}

function QUANTUM(cfg, extra){
  const rnd = rng(20260827);
  let mols = '';
  if (cfg && cfg.field === 'bare'){
    mols = '';                             /* o conteúdo vem da rede 3D */
  } else if (cfg && cfg.field === 'split'){
    /* poucas, grandes e bem espaçadas */
    const xs = [300, 640, 980], ys = [250, 500];
    /* cada uma deitada num ângulo seu: seis moléculas idênticas e
       alinhadas leem-se como um padrão desenhado, e não como matéria */
    ys.forEach(y => xs.forEach(x => {
      mols += splitMol(cfg.mol || 'h2o', x, y, rnd() * Math.PI * 2);
    }));
  } else
  for (let r = 0; r < 3; r++){
    for (let c = 0; c < 6; c++){
      mols += `<i class="qm" style="`
        + `left:${(110 + c * 210 + (rnd() - .5) * 120).toFixed(0)}px;`
        + `top:${(120 + r * 235 + (rnd() - .5) * 120).toFixed(0)}px;`
        + `--fx:${(rnd() * 44 - 22).toFixed(0)}px;--fy:${(rnd() * 38 - 19).toFixed(0)}px;`
        /* ângulo próprio, sorteado na volta inteira, com uma oscilação leve em torno dele */
        + (() => { const a = rnd() * 360;
             return `--r0:${(a - 11).toFixed(0)}deg;--r1:${(a + 11).toFixed(0)}deg;`; })()
        + `--fd:${(6 + rnd() * 4).toFixed(1)}s;--o:${(.5 + rnd() * .45).toFixed(2)}">`
        + AGUA_SVG + `</i>`;
    }
  }
  let parts = '';
  for (let i = 0; i < 26; i++){
    parts += `<i class="qp" style="`
      + `left:${(rnd() * 1260).toFixed(0)}px;top:${(rnd() * 700).toFixed(0)}px;`
      + `--s:${(1.5 + rnd() * 2.6).toFixed(1)}px;`
      + `--fx:${(rnd() * 90 - 45).toFixed(0)}px;--fy:${(-20 - rnd() * 70).toFixed(0)}px;`
      + `--fd:${(7 + rnd() * 7).toFixed(1)}s;--dl:${(-rnd() * 10).toFixed(1)}s"></i>`;
  }
  return `<div class="quantum" aria-hidden="true">
    <span class="q-wash"></span>
    <span class="q-aurora"></span>
    <span class="q-ring r1"></span><span class="q-ring r2"></span><span class="q-ring r3"></span>
    <!-- O quadro vem antes de tudo que é conteúdo: no mundo quântico ele
         fica ATRÁS dos objetos, seja o retículo desenhado na GPU, sejam
         as moléculas. Ele é o fundo onde se escreve, não uma folha por
         cima da cena. Continua pegável: as moléculas não capturam o
         dedo fora delas, e sobre o retículo quem devolve o toque ao
         quadro é sobreQuadro(). -->
    ${BOARD()}
    <div class="q-zoom">${mols}${parts}</div>
    <!-- o nome da substância, escrito só aqui dentro: quem o preenche é
         povoaCampo, a partir do qtit do recipiente que abriu o mergulho -->
    <div class="q-tits"></div>
    ${extra || ''}
    <!-- Refazer só existe onde há campo de moléculas: no mundo do
         retículo quem devolve tudo ao lugar é o Resetar, que mora nesta
         mesma quina e não pode disputá-la. -->
    ${mols.includes('class="qm"')
      ? `<button class="q-refazer" type="button" tabindex="-1"
                 aria-label="Voltar as moléculas ao começo"
                 title="Voltar as moléculas ao começo"
         ><svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
           ><polyline points="23 4 23 10 17 10"/><path
              d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>` : ''}
  </div>`;
}

/* ------------------------------------------------------------
   OS GASES NOBRES
   Distribuição por CAMADA (K, L, M, N, O, P), com os subníveis
   dentro de cada uma — e não na ordem crescente de energia.
   ------------------------------------------------------------ */
const GASES = {
  He: { z:  2, cam: [['K','1s<sup>2</sup>']] },
  Ne: { z: 10, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>']] },
  Ar: { z: 18, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup>']] },
  Kr: { z: 36, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>10</sup>'],
                     ['N','4s<sup>2</sup> 4p<sup>6</sup>']] },
  Xe: { z: 54, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>10</sup>'],
                     ['N','4s<sup>2</sup> 4p<sup>6</sup> 4d<sup>10</sup>'],
                     ['O','5s<sup>2</sup> 5p<sup>6</sup>']] },
  Na: { z: 11, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>1</sup>']] },
  /* os outros átomos dos exemplos do octeto */
  O:  { z:  8, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>4</sup>']] },
  Cl: { z: 17, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>5</sup>']] },
  Ca: { z: 20, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup>'],
                     ['N','4s<sup>2</sup>']] },
  Rn: { z: 86, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>10</sup>'],
                     ['N','4s<sup>2</sup> 4p<sup>6</sup> 4d<sup>10</sup> 4f<sup>14</sup>'],
                     ['O','5s<sup>2</sup> 5p<sup>6</sup> 5d<sup>10</sup>'],
                     ['P','6s<sup>2</sup> 6p<sup>6</sup>']] }
};

/* op.dentro -> símbolo e Z dentro da bola
   op.conta  -> embaixo da chave vai o número de elétrons, não a letra
   op.solta  -> o último subnível pode ser arrastado para fora        */
/* ---- aritmética da distribuição: pôr e tirar elétrons de verdade ----
   Um subnível é '3s<sup>2</sup> 3p<sup>5</sup>'. Lemos, mexemos e
   reescrevemos, respeitando o que cabe em cada tipo de subnível. */
const CAP = { s: 2, p: 6, d: 10, f: 14 };
const LETRAS = ['K','L','M','N','O','P','Q'];
/* limite do sandbox: no máximo quatro elétrons a mais e quatro a menos */
const MAX_E = 4;
function leSub(sub){
  return sub.trim().split(/\s+/).map(t => {
    const m = t.match(/^(\d+)([spdf])<sup>(\d+)<\/sup>$/);
    return m ? { n: m[1], l: m[2], e: +m[3] } : null;
  }).filter(Boolean);
}
const escreveSub = (ps) =>
  ps.map(p => `${p.n}${p.l}<sup>${p.e}</sup>`).join(' ');

/* enche os subníveis de trás para a frente; devolve o que não coube */
function poeSub(sub, n){
  const ps = leSub(sub);
  let k = n;
  for (let i = ps.length - 1; i >= 0 && k > 0; i--){
    const cabe = CAP[ps[i].l] - ps[i].e;
    const usa = Math.min(cabe, k);
    ps[i].e += usa; k -= usa;
  }
  return { sub: escreveSub(ps), resto: k };
}
/* esvazia de trás para a frente; subnível que zera desaparece */
function tiraSub(sub, n){
  const ps = leSub(sub);
  let k = n;
  for (let i = ps.length - 1; i >= 0 && k > 0; i--){
    const usa = Math.min(ps[i].e, k);
    ps[i].e -= usa; k -= usa;
  }
  return { sub: escreveSub(ps.filter(p => p.e > 0)), resto: k };
}

/* A distribuição do átomo com d elétrons a mais (d>0) ou a menos (d<0).
   Tirando, a camada que fica vazia some — é assim que o sódio 2-8-1
   vira 2-8, a do neônio. */
function distComDelta(sim, d){
  /* fichaDe, e não GASES direto: na tabela do slide 8 há 36 elementos, e
     quase nenhum deles está escrito à mão — a distribuição de partida
     vem calculada do Z. Sem isto, tirar um elétron do enxofre mexeria
     na distribuição do hélio. */
  const g = fichaDe(sim);
  const cam = g.cam.map(c => [c[0], c[1]]);
  if (!d) return cam;
  if (d > 0){
    const i = cam.length - 1;
    const r = poeSub(cam[i][1], d);
    cam[i][1] = r.sub;
    /* o que não coube na camada de valência começa a próxima */
    let k = r.resto;
    while (k > 0 && cam.length < LETRAS.length){
      const n = cam.length + 1;
      const s2 = Math.min(2, k); k -= s2;
      let sub = `${n}s<sup>${s2}</sup>`;
      if (k > 0){ const p2 = Math.min(6, k); k -= p2; sub += ` ${n}p<sup>${p2}</sup>`; }
      cam.push([LETRAS[cam.length], sub]);
    }
    return cam;
  }
  let k = -d;
  /* nunca some com a última camada: o átomo não se dissolve */
  while (k > 0 && cam.length > 1){
    const i = cam.length - 1;
    const r = tiraSub(cam[i][1], k);
    cam[i][1] = r.sub; k = r.resto;
    if (!cam[i][1]) cam.pop(); else break;
  }
  return cam;
}

/* ------------------------------------------------------------
   A DISTRIBUIÇÃO DE QUALQUER ELEMENTO
   GASES traz escritas à mão só as que o app precisava até aqui: os
   seis gases nobres e os quatro exemplos do slide 7. A tabela do
   slide 8 tem quarenta e poucos, e escrever todas seria copiar um
   livro. Estas são calculadas do Z, preenchendo na ordem de energia
   (diagonal de Pauling) e reagrupando por camada — que é como a
   aula lê: K, L, M, cada uma com os seus subníveis.
   ------------------------------------------------------------ */
const Z_EL = {
  H:1,  He:2, Li:3, Be:4, B:5,  C:6,  N:7,  O:8,  F:9,  Ne:10,
  Na:11, Mg:12, Al:13, Si:14, P:15, S:16, Cl:17, Ar:18,
  K:19, Ca:20, Ga:31, Ge:32, As:33, Se:34, Br:35, Kr:36,
  Rb:37, Sr:38, In:49, Sn:50, Sb:51, Te:52, I:53, Xe:54,
  Cs:55, Ba:56, Tl:81, Pb:82, Bi:83, Po:84, At:85, Rn:86
};
const AUFBAU = ['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s',
                '4f','5d','6p','7s','5f','6d','7p'];
const CABE   = { s: 2, p: 6, d: 10, f: 14 };
const CAMADAS = ['K','L','M','N','O','P','Q'];

function distDe(z){
  const por = {};                          /* número da camada -> subníveis */
  let resto = z;
  for (const sub of AUFBAU){
    if (resto <= 0) break;
    const n = +sub[0], q = Math.min(CABE[sub[1]], resto);
    resto -= q;
    (por[n] = por[n] || []).push(`${sub}<sup>${q}</sup>`);
  }
  return Object.keys(por).map(Number).sort((a, b) => a - b)
    .map(n => [CAMADAS[n - 1], por[n].join(' ')]);
}

/* a ficha do elemento: a escrita à mão, quando existe, senão a calculada */
function fichaDe(sim){
  if (GASES[sim]) return GASES[sim];
  const z = Z_EL[sim];
  return z ? { z, cam: distDe(z) } : GASES.He;
}

function GAS(sim, op){
  op = op || {};
  const g = fichaDe(sim);
  const eletrons = (sub) => [...sub.matchAll(/<sup>(\d+)<\/sup>/g)]
    .reduce((a, m) => a + +m[1], 0);
  const cam0 = op.delta ? distComDelta(sim, op.delta) : g.cam;
  const ultima = cam0.length - 1;

  const camadas = cam0.map(([c, sub], i) => {
    const rot = op.conta ? eletrons(sub) : c;
    const solta = op.solta && i === ultima;
    return `<span class="cam${solta ? ' solta' : ''}"`
         + (solta ? ` style="left:0px;top:0px"` : '')
         + `>${sub}<span class="br"></span><span class="lb">${rot}</span></span>`;
  }).join('');

  /* sodist: a ficha nua, só a conta por camada. A esfera é bonita mas
     come um terço da largura, e onde a coluna é estreita o que se
     precisa ler é a distribuição, não a bola. */
  if (op.sodist) return `<div class="gas-dist">${camadas}</div>`;

  const rotulo = `<b>${sim}</b><i>${g.z}</i>`;
  return (op.dentro ? '' : `<div class="gas-id">${rotulo}</div>`)
       + `<div class="gas-ball" style="background:${sphereBg(EL_COLOR[sim])}">`
       + `${op.dentro ? rotulo : ''}</div>`
       + `<div class="gas-dist">${camadas}</div>`;
}

/* ------------------------------------------------------------
   O CUBO DOS POSTULADOS
   quatro faces para o cubo ficar fechado; as três primeiras
   levam os postulados. Cada volta de 90° traz o próximo.
   ------------------------------------------------------------ */
/* o conteúdo de cada cubo fica guardado aqui, porque as quatro faces
   físicas são reaproveitadas quando há mais postulados do que faces */
const CUBE_DATA = {};

/* uma face pode ser só o texto (vira "Postulado N") ou {n, t} com rótulo próprio */
function faceHTML(f, i){
  if (f == null) return '';
  /* face com desenho proprio (o par de elementos dos exemplos) */
  if (typeof f === 'object' && f.html) return f.html;
  const n = typeof f === 'string' ? `Postulado ${i + 1}` : f.n;
  const t = typeof f === 'string' ? f : f.t;
  if (!t) return '';
  /* extra pode ser uma função: assim ela só é chamada na montagem do
     slide, e não enquanto a lista de slides ainda está sendo criada —
     onde ainda faltava metade do arquivo para ser lida. */
  const ex = f && f.extra;
  return (n ? `<div class="n">${n}</div>` : '') + `<div class="t">${t}</div>`
       + (typeof ex === 'function' ? ex() : (ex || ''));
}

/* face com top:true encosta o texto no alto em vez de centralizar */
const faceClass = (f) => (f && f.top ? ' at-top' : '') + (f && f.cls ? ' ' + f.cls : '');

function CUBE(faces, id){
  if (id) CUBE_DATA[id] = faces;
  let panes = '';
  for (let i = 0; i < 4; i++)
    panes += `<div class="face${faceClass(faces[i])}" style="--i:${i}">`
           + `${faceHTML(faces[i], i)}</div>`;
  return `<div class="cube-stage"><div class="cube-box">${panes}</div></div>`;
}

/* Reescreve as faces físicas em torno da posição atual. A face da frente
   recebe o mesmo conteúdo que já tinha, então a troca é invisível: só as
   laterais e o fundo mudam, e a que vai entrar já chega com o texto certo. */
function paintCube(cube, F){
  const faces = CUBE_DATA[cube.dataset.id] || [];
  if (faces.length <= 4) return;           /* cabe tudo: nada a reaproveitar */
  const panes = cube.querySelectorAll('.face');
  [-1, 0, 1, 2].forEach(d => {
    const L = F + d;
    const p = ((L % 4) + 4) % 4;
    if (!panes[p]) return;
    const dentro = L >= 0 && L < faces.length;
    panes[p].className = 'face' + (dentro ? faceClass(faces[L]) : '');
    panes[p].innerHTML = dentro ? faceHTML(faces[L], L) : '';
  });
  /* Com mais de quatro propriedades as faces físicas são reescritas a
     cada giro, e o béquer que sai dali é um elemento novo, sem ouvintes.
     Religar é barato: quem já está ligado se reconhece e passa. */
  ligaBequer();
}

/* monta o botão "?" e os elementos que ele revela, um por clique */
const REVEALS = (list, cfg) => {
  if (!list || !list.length) return '';
  const items = list.map(r => {
    const body = r.kind === 'rock'     ? ROCK()
      : r.kind === 'lego'     ? LEGO()
      : r.kind === 'cube'     ? CUBE(r.faces || [], r.id)
      : r.kind === 'molecule' ? MOLECULE()
      : r.kind === 'glass'    ? GLASS(r.tag)
      : r.kind === 'vessel'   ? VESSEL(r)
      : r.kind === 'gas'      ? GAS(r.sim, r)
      : r.kind === 'caixa'    ? `<div class="cx"><div class="cx-tit">${r.tit || ''}</div>`
                              + `<div class="cx-corpo"${r.digita
                                  ? ` data-txt="${r.digita}"` : ''}>${
                                  r.digita ? '' : (r.corpo || '')}</div></div>`
      : r.kind === 'painel'   ? `<div class="pn ${r.estilo || 'ionica'}"${
                                  r.rede ? ` data-rede="${r.rede}"` : ''}${
                                  r.campo ? ` data-campo="${r.campo}"` : ''}>`
                              + `<div class="pn-tit">${r.tit || ''}</div>`
                              + `<div class="pn-corpo">${
                                  r.img ? `<img src="${r.img}" alt="${r.alt || ''}" draggable="false">`
                                : r.corpo === 'glass'
                                  ? `<div style="--base:${r.objBase
                                        || Math.round((r.base || 430) * 0.5)}">${GLASS()}</div>`
                                : (r.corpo || '')}</div>`
                              + `<div class="pn-q">${
                                  r.campo ? MOLS_PN(r.base || 430,
                                                    (r.base || 430) * 0.84, 11) : ''}</div>`
                              + (r.rede || r.campo
                                  ? `<button class="pn-sair" type="button" tabindex="-1"
                                             title="Sair">&#8592; Voltar</button>` : '')
                              + `</div>`
      : r.kind === 'reticulo' ? (r.lupa
          ? `<div class="rd-stage lupa"><i class="lupa-vidro"></i>`
            + `<i class="lupa-aro"></i></div>`
          : `<div class="rd-stage"></div>`)
      : r.kind === 'tabela'   ? TABELA()
      : r.kind === 'lewis'    ? `<div class="lw-stage">${LEWIS_VAZIO}</div>`
      : r.kind === 'acao'     ? ''
      : r.kind === 'ajuda'    ? `<div class="aj"><b>?</b><span>${r.rot || 'gás nobre'}</span></div>`
      : r.kind === 'sphere'
        ? (() => {                         /* sem cor explícita, vale a do elemento */
            const c = r.color || EL_COLOR[r.label];
            return `<div class="ball"${c ? ` style="background:${sphereBg(c)}"` : ''}></div>`;
          })()
      : r.img
        ? `<img src="${r.img}" alt="${r.alt || r.caption || ''}" draggable="false">`
      : `<div class="txt">${r.text || ''}</div>`;
    /* símbolo de elemento é mono curto; rótulo de objeto é palavra */
    const inner = (r.label ? `<div class="${r.kind === 'sphere' ? 'sym' : 'lbl'}">${r.label}</div>` : '')
      + body
      + (r.caption ? `<div class="cap">${r.caption}</div>` : '');
    const zoomable = (r.kind === 'glass' || r.kind === 'vessel') ? ' zoomable' : '';
    /* Os rótulos do mergulho viajam como JSON num atributo. Aceita-se a
       forma antiga — qtit como uma frase só, com qtx/qty ao lado — e a
       nova, uma lista de [texto, x, y, classe]. O atributo vai entre
       apóstrofos porque o JSON traz aspas duplas dentro. */
    const qtits = !r.qtit ? '' : JSON.stringify(
      typeof r.qtit === 'string'
        ? [[r.qtit, r.qtx !== undefined ? r.qtx : 164,
                    r.qty !== undefined ? r.qty : 150]]
        : r.qtit).replace(/'/g, '&#39;');
    return `<div class="reveal-item ${r.kind || ''} ${r.tone || ''}${r.nowrap ? ' nowrap' : ''}${r.bullet ? ' bullet' : ''}${r.flip ? ' flip' : ''}${
  r.aberto ? ' aberto' : ''}${r.fixo ? ' fixo' : ''}${r.nu ? ' nua' : ''}${
  r.entra ? ' desliza' : ''}${r.sodist ? ' so-dist' : ''}${zoomable}" hidden
                 data-x="${r.x}" data-y="${r.y}"
                 ${r.entra ? `data-entra="${r.entra}"` : ''}
                 ${r.saiDe ? `data-saide='${r.saiDe}'` : ''}
                 ${r.sai ? `data-sai="${r.sai}"` : ''}
                 ${r.reto ? `data-reto="1"` : ''}
                 ${r.id   ? `data-id="${r.id}"`     : ''}
                 ${r.from ? `data-from="${r.from}"` : ''}
                 ${r.rede ? `data-rede="${r.rede}"` : ''}
                 ${r.cam  ? `data-cam="${r.cam.join(',')}"` : ''}
                 ${r.lupa ? `data-lupa="1"` : ''}
                 ${r.esq  ? `data-esq="1"`          : ''}
                 ${r.qx !== undefined ? `data-qx="${r.qx}"` : ''}
                 ${r.qy !== undefined ? `data-qy="${r.qy}"` : ''}
                 ${r.qk !== undefined ? `data-qk="${r.qk}"` : ''}
                 ${r.qmols ? `data-qmols="${JSON.stringify(r.qmols)}"` : ''}
                 ${qtits ? `data-qtit='${qtits}'` : ''}
                 ${r.duplo ? `data-duplo="1"`       : ''}
                 ${r.aberto ? `data-aberto="1"`     : ''}
                 ${r.eatom  ? `data-eatom="${r.eatom}"` : ''}
                 ${r.tit    ? `data-tit="${r.tit}"`       : ''}
                 ${r.estilo ? `data-estilo="${r.estilo}"` : ''}
                 ${r.corpo  ? `data-corpo="${r.corpo}"`   : ''}
                 ${r.auto ? `data-auto="1"`         : ''}
                 ${r.face !== undefined ? `data-of="${r.face}"` : ''}
                 ${r.follow !== undefined
                   ? `data-follow="${r.follow === true ? FOLLOW_MS : +r.follow}"` : ''}
                 ${r.label ? `data-label="${r.label}"` : ''}
                 ${r.color ? `data-color="${r.color}"` : ''}
                 ${r.mol   ? `data-mol="${r.mol}"`     : ''}
                 ${r.shape ? `data-shape="${r.shape}"` : ''}
                 ${r.tag   ? `data-tag="${r.tag}"`     : ''}
                 ${r.field ? `data-field="${r.field}"` : ''}
                 ${r.sim   ? `data-sim="${r.sim}"`     : ''}
                 ${r.acao  ? `data-acao="${r.acao}"`   : ''}
                 ${r.alvo  ? `data-alvo="${r.alvo}"`   : ''}
                 ${r.manual ? `data-manual="1"`        : ''}
                 ${r.kind === 'cube' ? `data-face="0" data-faces="${(r.faces || []).length}"` : ''}
                 ${r.exemplos ? `data-exemplos="1"` : ''}
                 style="left:${r.x}px;top:${r.y}px;--base:${r.base || 40};--k:1${
                   r.wch ? `;--wch:${r.wch}` : ''}${
                   r.capsobe ? `;--capsobe:${r.capsobe}` : ''}${
                   r.kind === 'cube' ? `;--face:0` : ''}${
                   /* tface: tamanho que a letra deve TER NA TELA; a face
                      é escalada por base/360, então desconta-se isso */
                   r.tface ? `;--tf:${(r.tface * 360 / (r.base || 360)).toFixed(2)}` : ''
                 }">${inner}</div>`;
  }).join('');
  const comZoom = list.filter(r => r.kind === 'glass' || r.kind === 'vessel');
  const temPedra = list.some(r => r.kind === 'rock');
  const temGrao  = list.some(r => r.fixo);      /* imagem que solta grãos */
  const temPnRede = list.some(r => (r.kind === 'painel' && r.rede)
                                || r.kind === 'reticulo');
  /* a pedra usa o mesmo fundo, mas sem o campo de moléculas: o conteúdo
     ali é a rede 3D desenhada na GPU */
  const cfgQ = comZoom.find(r => r.field) || (comZoom.length ? null : { field: 'bare' });
  void temGrao;
  const tem3d = temPedra || temGrao || temPnRede;
  const quantum = (comZoom.length || tem3d)
    ? QUANTUM(cfgQ, tem3d
        ? `<canvas class="q3d" aria-hidden="true"></canvas>`
          + `<button class="q-voltar" type="button" tabindex="-1"
                     title="Sair do mundo quântico">&#8592; Voltar</button>`
          + `<button class="q-reset" type="button" tabindex="-1"
                     aria-label="Voltar tudo ao lugar"
                     title="Voltar tudo ao lugar"
             ><svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.1"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
               ><polyline points="23 4 23 10 17 10"/><path
                  d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>` : '')
      + (tem3d ? `<div class="cel-rot">célula unitária</div>`
               + `<div class="rede-rot">Retículo Cristalino</div>` : '')
    : '';
  /* Quadro solto no slide (fora do mundo quântico), na posição que aquele
     slide pediu. Quem o abre é o ícone da barra, como em todo slide — a
     config só diz onde ele nasce, já que o padrão é o meio do palco.
     Com "aberto", ele já está de pé quando o slide abre: há aula em que o
     quadro não é um recurso a chamar, é parte da cena desde o começo. */
  const quadro = cfg && cfg.quadro
    ? BOARD(cfg.quadro.x, cfg.quadro.y, cfg.quadro.k,
            cfg.quadro.aberto ? 'solto on' : 'solto')
    : '';
  /* a esfera de ajuda, quando o slide pedir uma */
  const ajuda = cfg && cfg.poli ? POLI(cfg.poli) : '';
  return `${quantum}${quadro}${ajuda}${items}`;
};

/* ------------------------------------------------------------
   MOTOR DE TRANSIÇÃO
   slide 1 <-> 2 ....: cubo girando
   do slide 2 em diante: empurrão, invertido ao voltar
   ------------------------------------------------------------ */
const FX_CLASSES = [
  'is-leaving',
  'fx-cube-in-next','fx-cube-out-next','fx-cube-in-prev','fx-cube-out-prev',
  'fx-desl-in-next','fx-desl-out-next','fx-desl-in-prev','fx-desl-out-prev'
];
let fxTimer;

function clearFx(){
  /* a nota de ajuda não atravessa a troca de slide: ela é consulta do
     momento, e voltar ao slide com ela aberta seria herdar uma dúvida */
  slides.forEach(el => el.classList.remove('poli-on'));
  slides.forEach(el => el.classList.remove(...FX_CLASSES));
  fxLayer.classList.remove('run');
  /* a pedra não fica desmontada se o slide mudar com o dedo apoiado */
  deck.querySelectorAll('.reveal-item.broken, .reveal-item.pressing, .reveal-item.zoomed')
      .forEach(r => { r.classList.remove('pressing'); restoreRock(r); closeQuantum(r); });
}

/* ------------------------------------------------------------
   PASSAGENS QUE PEDEM OUTRO TEMPO
   O deslize padrão é o --t-desl, 0,62s. Algumas passagens pedem mais
   fôlego: ou porque muda muita coisa de um slide para o outro, ou
   porque a fala do professor precisa acompanhar a cena chegando.

   A chave é o PAR de índices, sempre do menor para o maior, e por isso
   o tempo vale nos dois sentidos — voltar demora o mesmo que ir.
   Índices contam do zero: '1-2' é a passagem do slide 2 para o 3.
   ------------------------------------------------------------ */
const DESLIZE = {
  '1-2': 0.81,    /* slide 2 -> 3: 30% mais lento que o padrão */
  '2-3': 1.03     /* slide 3 -> 4: a 60% da velocidade das outras */
};
const deslizeDe = (a, b) =>
  DESLIZE[Math.min(a, b) + '-' + Math.max(a, b)] || 0;

function go(n, instant){
  const to = Math.max(0, Math.min(SLIDES.length - 1, n));
  const from = current;
  const animate = !instant && slides.length && to !== from;

  clearTimeout(fxTimer);
  clearFx();
  descansaBequer();                          /* a experiência recomeça */
  /* Quem sai de um slide submerso sobe junto. Antes a seta não deixava
     sair de dentro do mundo quântico, e por isso a questão não existia;
     agora que se passa a qualquer momento, o slide não pode ficar para
     trás mergulhado — voltando a ele, estaria no fundo, sem o gesto que
     levou até lá. */
  sobeDoMergulho(slides[from]);
  current = to;
  slides.forEach((el, i) => el.classList.toggle('is-active', i === to));

  if (animate){
    const dir  = to > from ? 'next' : 'prev';
    /* A transição em caixa é a de abertura, e serve para marcar começo
       de assunto: vale para o slide 1 e para todo slide que peça
       virada 'cube', entrando ou saindo dele. */
    const emCaixa = i => i === 0 || (SLIDES[i] && SLIDES[i].virada === 'cube');
    const cube = emCaixa(from) || emCaixa(to);
    const kind = cube ? 'cube' : 'desl';       /* os dois seguem o sentido */
    /* Passagens que pedem outro tempo — ver DESLIZE. Vale nos dois
       sentidos, e o relógio que limpa a animação segue o mesmo número:
       um deslize mais longo do que o temporizador terminaria cortado. */
    const t = deslizeDe(from, to);
    stage.style.setProperty('--t-desl', t ? t + 's' : '');
    void stage.offsetWidth;                    /* reinicia animação interrompida */
    slides[from].classList.add('is-leaving', `fx-${kind}-out-${dir}`);
    slides[to].classList.add(`fx-${kind}-in-${dir}`);
    fxTimer = setTimeout(clearFx,
      cube ? 950 : (t ? Math.round(t * 1000) + 220 : 750));
  }

  /* retículo que mora no slide: o laço 3D retoma ao entrar nele */
  const sl2 = slides[to];
  const cv2 = sl2 && sl2.querySelector('.q3d');
  if (cv2 && sl2.classList.contains('quantum-on') && iniciaG3(cv2)) lacoG3(cv2);

  counter.innerHTML = `<b>${current+1}</b> / ${SLIDES.length}`;
  progress.style.width = ((current+1) / SLIDES.length * 100) + '%';
  atualizaBarra();
  sincronizaQuadro();                         /* o ícone é o do quadro deste slide */
  repintaTinta();                             /* o que foi escrito neste slide */
  [...grid.children].forEach((c,i) => c.classList.toggle("current", i === current));
}

let fitScale = 1;
function fit(){
  const vv = window.visualViewport;
  const w = vv ? vv.width  : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  fitScale = Math.min(w / 1280, h / 720);
  stage.style.setProperty("--fit", fitScale);
  ajustaTinta();
}



/* ------------------------------------------------------------
   MOTOR 3D  (WebGL)
   Esferas e hastes de geometria real, com profundidade, luz por
   pixel e câmera em órbita livre. Serve a duas cenas: a rede da
   pedra (slide 2) e o retículo do NaCl (slide 9).
   ------------------------------------------------------------ */
const G3 = {
  gl: null, prog: null, esfera: null, bastao: null,
  atomos: [], hastes: [], laco: 0, t: 0, alvo: 0,
  az: -0.42, el: 0.28, dist: 470, px: 640, py: 360,
  canvas: null, lupa: null, lupaCv: null, lupaClip: '', lupaPara: 0,
  /* lupaG: a última medida da lente tirada de frente, que vale enquanto
     ela gira. giro: instante em que a meia volta começou, 0 se parada. */
  lupaG: null, giro: 0,
  modo: 'pedra', celOff: [0, 0, 0], celC: [0, 0, 0], cantos: [], slide: null,
  volta: 0, pulso: 0, drama: 0, voo: 0, distAlvo: 0, celQ: null,
  agita: 0, funde: 0, fundeAlvo: 0, t9: 0, cliva: 0, clivaAlvo: 0, dissolve: 0
};

/* --- álgebra --- */
function m4perspectiva(fov, aspecto, perto, longe){
  const f = 1 / Math.tan(fov / 2), d = perto - longe;
  return [f / aspecto,0,0,0, 0,f,0,0, 0,0,(longe + perto) / d,-1, 0,0,2 * longe * perto / d,0];
}
function m4olhar(olho, alvo, cima){
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const cruz = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm = (v) => { const n = Math.hypot(...v) || 1; return [v[0]/n, v[1]/n, v[2]/n]; };
  const pto = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const z = norm(sub(olho, alvo)), x = norm(cruz(cima, z)), y = cruz(z, x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
          -pto(x,olho), -pto(y,olho), -pto(z,olho), 1];
}
/* matriz de um objeto que só transladou e escalou uniformemente */
function m4esfera(c, r){
  return [r,0,0,0, 0,r,0,0, 0,0,r,0, c[0],c[1],c[2],1];
}
/* matriz de uma haste do ponto a ao ponto b, com raio dado.
   A malha do bastão vai de y=0 a y=1 com raio 1, então basta
   girar o eixo Y até a direção da haste. */
function m4haste(a, b, r){
  const d = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
  const L = Math.hypot(...d) || 1;
  const u = [d[0]/L, d[1]/L, d[2]/L];
  /* Rodrigues: gira o eixo Y da malha até a direção u.
     eixo = Y x u = (uz, 0, -ux) ;  cos = u.y ;  sen = |Y x u| */
  const s = Math.hypot(u[2], u[0]);
  let X, Y, Z;
  if (s < 1e-6){                            /* já paralelo a Y */
    const sg = u[1] >= 0 ? 1 : -1;
    X = [1,0,0]; Y = [0,sg,0]; Z = [0,0,sg];
  } else {
    const kx = u[2]/s, kz = -u[0]/s;        /* eixo normalizado (ky = 0) */
    const c = u[1], t = 1 - c;
    X = [c + kx*kx*t,  kz*s,      kz*kx*t];        /* coluna 0 */
    Y = [-kz*s,        c,         kx*s];           /* coluna 1 -> vira u */
    Z = [kx*kz*t,      -kx*s,     c + kz*kz*t];    /* coluna 2 */
  }
  return [X[0]*r, X[1]*r, X[2]*r, 0,
          Y[0]*L, Y[1]*L, Y[2]*L, 0,
          Z[0]*r, Z[1]*r, Z[2]*r, 0,
          a[0], a[1], a[2], 1];
}

/* --- malhas --- */
function malhaEsfera(fatias, aneis){
  const pos = [], idx = [];
  for (let i = 0; i <= aneis; i++){
    const fi = i * Math.PI / aneis, sf = Math.sin(fi), cf = Math.cos(fi);
    for (let j = 0; j <= fatias; j++){
      const te = j * 2 * Math.PI / fatias;
      pos.push(sf * Math.cos(te), cf, sf * Math.sin(te));
    }
  }
  for (let i = 0; i < aneis; i++)
    for (let j = 0; j < fatias; j++){
      const a = i * (fatias + 1) + j, b = a + fatias + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  /* na esfera unitária a normal é a própria posição */
  return { pos: new Float32Array(pos), nor: new Float32Array(pos),
           idx: new Uint16Array(idx), n: idx.length };
}
function malhaBastao(lados){
  const pos = [], nor = [], idx = [];
  for (let j = 0; j <= lados; j++){
    const a = j * 2 * Math.PI / lados, c = Math.cos(a), s = Math.sin(a);
    pos.push(c, 0, s); nor.push(c, 0, s);
    pos.push(c, 1, s); nor.push(c, 0, s);
  }
  for (let j = 0; j < lados; j++){
    const a = j * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  return { pos: new Float32Array(pos), nor: new Float32Array(nor),
           idx: new Uint16Array(idx), n: idx.length };
}

const VS = `
attribute vec3 aPos, aNor;
uniform mat4 uProj, uView, uModel;
varying vec3 vN, vP;
void main(){
  vec4 p = uModel * vec4(aPos, 1.0);
  vP = p.xyz;
  vN = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz) * aNor;
  gl_Position = uProj * uView * p;
}`;

/* O sinal da carga é desenhado DENTRO da esfera, pelo próprio sombreador:
   nada de 343 objetos novos na cena. Para cada ponto da superfície,
   projetamos a normal nos eixos da câmera — dá uma coordenada no disco
   que está de frente para nós — e ali pintamos a barra do menos ou a
   cruz do mais. Como os eixos são os da câmera, o sinal sempre encara
   quem olha, gire a cena para onde girar. */
const FS = `
precision mediump float;
varying vec3 vN, vP;
uniform vec3 uCor, uCam, uDir, uCim;
uniform float uOpaco, uEsp, uCarga;
void main(){
  vec3 N = normalize(vN);
  vec3 L = normalize(vec3(-0.45, 0.8, 0.62));
  vec3 V = normalize(uCam - vP);
  vec3 H = normalize(L + V);
  float dif = max(dot(N, L), 0.0);
  float esp = pow(max(dot(N, H), 0.0), 46.0) * uEsp;
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  vec3 c = uCor * (0.17 + 0.9 * dif) + vec3(1.0) * esp + vec3(0.5, 0.9, 1.0) * rim * 0.18;

  if (uCarga != 0.0){
    float frente = dot(N, normalize(uCam - vP));
    float a = dot(N, uDir), b = dot(N, uCim);
    float braco = 0.085, comp = 0.30;
    float barra = step(abs(b), braco) * step(abs(a), comp);
    float pe    = step(abs(a), braco) * step(abs(b), comp);
    float marca = (uCarga > 0.0) ? max(barra, pe) : barra;
    /* só na parte que está de frente, e sumindo perto da silhueta */
    marca *= smoothstep(0.55, 0.75, frente);
    c = mix(c, vec3(1.0), marca * 0.92);
  }
  gl_FragColor = vec4(c, uOpaco);
}`;

function compila(gl, tipo, src){
  const s = gl.createShader(tipo);
  gl.shaderSource(s, src); gl.compileShader(s);
  return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
}
function programa(gl, vs, fs){
  const p = gl.createProgram();
  const a = compila(gl, gl.VERTEX_SHADER, vs), b = compila(gl, gl.FRAGMENT_SHADER, fs);
  if (!a || !b) return null;
  gl.attachShader(p, a); gl.attachShader(p, b); gl.linkProgram(p);
  return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null;
}

/* --- cena 1: a rede da pedra --- */
function cenaPedra(){
  const rnd = rng(20260828);
  const cols = 5, fil = 4, cam = 3, ex = 46, ey = 44, ez = 60;
  const at = [], lig = [];
  for (let l = 0; l < cam; l++){
    const ox = l % 2 ? ex / 2 : 0, oy = l % 2 ? ey / 2 : 0;
    for (let r = 0; r < fil; r++)
      for (let c = 0; c < cols; c++){
        const ang = rnd() * Math.PI * 2, u = rnd(), v = rnd() * 2 - 1;
        const raio = Math.cbrt(u), sf = Math.sqrt(1 - v * v);
        at.push({
          rede:  [ (c - (cols-1)/2) * ex + ox, -((r - (fil-1)/2) * ey + oy),
                   (l - (cam-1)/2) * ez ],
          pedra: [ Math.cos(ang) * sf * raio * 96, v * raio * 62,
                   Math.sin(ang) * sf * raio * 62 ],
          atraso: rnd() * 0.3, raio: 15, cor: [0.27, 0.79, 0.70], cel: false
        });
      }
  }
  for (let i = 0; i < at.length; i++)
    if ((i % cols) !== cols - 1) lig.push([i, i + 1, 2.2]);
  return { at, lig };
}

/* Lamelas Cl–Mg–Cl empilhadas. Dentro de cada lamela, três camadas
   compactas nas posições A, B e C do empacotamento: os cloretos em A e C,
   os magnésios em B, no meio. Entre uma lamela e a seguinte há uma folga,
   que é o que faz este cristal esfoliar em placas. */
/* Corindo. Camadas compactas de oxigênio se alternando entre as posições
   A e B; entre cada duas delas há uma camada de buracos octaédricos, na
   posição C, e o alumínio ocupa dois de cada três. O terço vago gira de
   posição a cada camada, o que dá a proporção exata de 2 Al para 3 O. */
function redeCorindo(R){
  const a = 54;                          /* passo dentro da camada */
  const h = a * Math.sqrt(2 / 3);        /* altura de uma camada de O à seguinte */
  const nx = 6, nz = 6, k = 5;           /* 5 pares (camada de O + camada de Al) */
  const s3 = Math.sqrt(3);
  const A = [0, 0], B = [a / 2, a * s3 / 6], C = [a, a * s3 / 3];
  const at = [];

  for (let L = 0; L < 2 * k; L++){
    const ehO = L % 2 === 0;
    const p   = L / 2 | 0;                       /* qual par */
    const off = ehO ? (p % 2 ? B : A) : C;       /* O alterna A/B; Al sempre em C */
    const y   = ehO ? p * h : (p + 0.5) * h;
    const vaga = p % 3;                          /* o terço que fica vazio */
    const q = ehO ? R.anion : R.cation;
    for (let i = 0; i < nx; i++)
      for (let j = 0; j < nz; j++){
        /* dois de cada três buracos octaédricos recebem alumínio */
        if (!ehO && ((i - j) % 3 + 3) % 3 === vaga) continue;
        at.push({ rede: [ i * a + j * a / 2 + off[0], y, j * a * s3 / 2 + off[1] ],
                  pedra: null, atraso: 0, ijk: [i, L, j],
                  raio: q.raio, cor: q.cor, anion: ehO,
                  carga: ehO ? -1 : 1, cel: false });
      }
  }
  const c = [0,1,2].map(e => at.reduce((sm, x) => sm + x.rede[e], 0) / at.length);
  at.forEach(x => { x.rede = x.rede.map((v, e) => v - c[e]); x.pedra = x.rede; });

  /* cada alumínio se prende aos oxigênios do seu octaedro */
  const lig = [], lim = a * 0.78;
  at.forEach((al, ia) => {
    if (al.anion) return;
    at.forEach((o, io) => {
      if (!o.anion) return;
      const d = Math.hypot(o.rede[0] - al.rede[0],
                           o.rede[1] - al.rede[1],
                           o.rede[2] - al.rede[2]);
      if (d < lim) lig.push([ia, io, 3.0]);
    });
  });

  const span = e => Math.max(...at.map(x => x.rede[e])) - Math.min(...at.map(x => x.rede[e]));
  const ext = Math.max(span(0), span(1), span(2)) + 2 * R.anion.raio;
  /* o pedaço que sai é um trecho 3x3 de uma camada de O com a de Al
     acima dela: 9 oxigênios e 6 alumínios, os mesmos 2:3 do cristal */
  return { at, lig, ext, n: [nx, 2 * k, nz],
           celula: { tam: [3, 2, 3], alinha: [0, 2, 0] } };
}

function redeCamadas(R){
  const a = 54;                          /* passo dentro da camada */
  const h = a * Math.sqrt(2 / 3);        /* altura de uma camada à seguinte */
  const vao = h * 1.35;                  /* folga entre lamelas */
  const H = 2 * h + vao;
  const nx = 6, nz = 6, ns = 3;          /* 3 lamelas de 6x6 */
  const s3 = Math.sqrt(3);
  const off = [ [0, 0], [a / 2, a * s3 / 6], [a, a * s3 / 3] ];   /* A, B, C */
  const at = [], lig = [];

  for (let s = 0; s < ns; s++)
    [[0, 0, true], [h, 1, false], [2 * h, 2, true]].forEach(([dy, o, ehCl], L) => {
      const q = ehCl ? R.anion : R.cation;
      for (let i = 0; i < nx; i++)
        for (let j = 0; j < nz; j++){
          const p = [ i * a + j * a / 2 + off[o][0],
                      s * H + dy,
                      j * a * s3 / 2 + off[o][1] ];
          at.push({ rede: p, pedra: p, atraso: 0, ijk: [i, s * 3 + L, j],
                    raio: q.raio, cor: q.cor, anion: ehCl,
                    carga: ehCl ? -1 : 1, cel: false });
        }
    });

  /* centra o bloco na origem, senão a câmera olharia para o canto dele */
  const c = [0,1,2].map(e => at.reduce((sm, x) => sm + x.rede[e], 0) / at.length);
  at.forEach(x => { x.rede = x.rede.map((v, e) => v - c[e]); x.pedra = x.rede; });

  /* cada magnésio se liga aos seis cloretos do seu octaedro */
  const lim = a * 1.08;
  at.forEach((m, im) => {
    if (m.anion) return;
    at.forEach((cl, ic) => {
      if (!cl.anion) return;
      const d = Math.hypot(cl.rede[0] - m.rede[0],
                           cl.rede[1] - m.rede[1],
                           cl.rede[2] - m.rede[2]);
      if (d < lim) lig.push([im, ic, 3.4]);
    });
  });

  const span = e => Math.max(...at.map(x => x.rede[e])) - Math.min(...at.map(x => x.rede[e]));
  const ext = Math.max(span(0), span(1), span(2)) + 2 * R.anion.raio;
  /* o pedaço que se arranca é uma lamela inteira num trecho 2x2:
     4 Cl em cima, 4 Mg no meio, 4 Cl embaixo — os mesmos 1:2 do cristal */
  return { at, lig, ext, n: [nx, ns * 3, nz],
           celula: { tam: [2, 3, 2], alinha: [0, 3, 0] } };
}

/* --- cena 2: retículos do tipo cloreto de sódio ---
   NaCl e MgO têm a MESMA estrutura (sal-gema): sítios alternados, cada
   íon cercado por seis do outro. Só mudam as cores e os raios.
   Os raios saem dos raios iônicos reais, na mesma escala:
     Cl- 181pm -> 21    Na+ 102pm -> 12
     O2- 140pm -> 16    Mg2+ 72pm ->  8
   Por isso as bolas do MgO são visivelmente menores que as do NaCl. */
const CPK = {
  Cl: [0.15, 0.85, 0.15],   /* verde    */
  Na: [0.67, 0.36, 0.95],   /* roxo     */
  O:  [1.00, 0.05, 0.05],   /* vermelho */
  Mg: [0.54, 1.00, 0.00],   /* verde do magnésio */
  Al: [0.75, 0.65, 0.65]    /* cinza rosado do alumínio */
};
/* Raios na mesma escala para todos, tirados dos raios iônicos reais:
     Cl- 181pm -> 21   O2- 140pm -> 16   Na+ 102pm -> 12   Mg2+ 72pm -> 8  */
const REDES = {
  /* sal-gema: 1:1, cada íon cercado por seis do outro */
  nacl: { forma: 'salgema',
          anion:  { cor: CPK.Cl, raio: 21 },
          cation: { cor: CPK.Na, raio: 12 } },
  mgo:  { forma: 'salgema',
          anion:  { cor: CPK.O,  raio: 16 },
          cation: { cor: CPK.Mg, raio:  8 } },
  /* antifluorita: 2:1. O óxido de sódio NÃO é sal-gema — os oxigênios
     formam um cubo de faces centradas e os sódios ocupam TODOS os oito
     buracos tetraédricos, então há dois cátions para cada ânion. */
  na2o: { forma: 'antifluorita',
          anion:  { cor: CPK.O,  raio: 16 },
          cation: { cor: CPK.Na, raio: 12 } },
  /* camadas (tipo CdCl2): 1:2. O cloreto de magnésio não é sal-gema nem
     antifluorita — ele se arruma em lamelas Cl–Mg–Cl empilhadas, com uma
     folga entre elas. Cada Mg fica no centro de um octaedro de seis Cl,
     e cada Cl toca três Mg, o que dá dois cloretos por magnésio. */
  mgcl2:{ forma: 'camadas',
          anion:  { cor: CPK.Cl, raio: 21 },
          cation: { cor: CPK.Mg, raio:  8 } },
  /* corindo: 2:3. Os oxigênios se empilham em hexagonal compacta e os
     alumínios ocupam DOIS TERÇOS dos buracos octaédricos — o terço vazio
     muda de lugar a cada camada. É essa lacuna ordenada que dá a
     proporção Al2O3, e é o que faz o corindo (rubi, safira) tão duro. */
  al2o3:{ forma: 'corindo',
          anion:  { cor: CPK.O,  raio: 16 },
          cation: { cor: CPK.Al, raio:  6 } }
};

/* Onde cada íon vai parar quando o retículo desaba, e a fase própria do
   tremor térmico. O chão fica abaixo de tudo, e cada um cai num ponto
   sorteado por perto — o monte fica irregular, como monte de verdade. */
/* A VEZ DE CADA ÍON NA DISSOLUÇÃO
   A água só alcança quem está na superfície, então o cristal se desfaz
   de fora para dentro. Mas ordenar pela profundidade crua não serve: num
   bloco 7x7x7 a casca de fora sozinha tem 218 dos 343 íons, e o cristal
   sumiria de uma vez e depois ficaria um resto se arrastando. Aqui a
   ordem é pela profundidade e a vez é pela POSIÇÃO nessa ordem, o que dá
   uma dissolução de ritmo constante, ainda de fora para dentro. O ruído
   somado à profundidade mistura um pouco as cascas vizinhas, senão elas
   descascariam em blocos certinhos demais.

   O teto de 0,82 deixa espaço para os 0,16 que o íon leva para sair:
   assim o último também termina de sair antes de a pedra acabar. */
function poeVezNaAgua(c, rnd){
  const fundo = a => Math.max(Math.abs(a.rede[0]), Math.abs(a.rede[1]), Math.abs(a.rede[2]));
  const ordem = c.at.map(a => ({ a, k: fundo(a) - rnd() * 26 }))
                    .sort((p, q) => q.k - p.k);
  const N = Math.max(1, ordem.length - 1);
  ordem.forEach((o, i) => { o.a.limiar = i / N * 0.82; });
}

function poeChao(c){
  const rnd = rng(4242);
  const minY = Math.min(...c.at.map(a => a.rede[1]));
  const piso = minY - 76;                  /* o monte inteiro abaixo da rede */
  /* Onde passam os planos de clivagem: no vão entre as duas camadas
     centrais de cada eixo. O corte nunca atravessa uma camada de íons —
     o cristal parte entre planos, não pelo meio deles. */
  const vao = eixo => {
