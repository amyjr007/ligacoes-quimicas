.bk{position:relative;flex:1;display:flex;align-items:flex-end;gap:12px;padding-top:2px}
.bk-cena{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center}
.bk-svg{width:172px;height:auto;display:block;overflow:visible}

/* A chama tem duas camadas: a de fora cuida de crescer e apagar, a de
   dentro só treme. Assim apagar é o inverso exato de acender — antes o
   tremor segurava o transform e a chama sumia de supetão. */
.bk-chama{
  transform-box:fill-box;transform-origin:50% 100%;
  transform:scaleY(0);opacity:0;
  transition:transform .45s cubic-bezier(.3,.7,.4,1),opacity .45s ease;
}
.bk.aceso .bk-chama{transform:scaleY(var(--ch,1));opacity:1}
.bk-chama-i{
  transform-box:fill-box;transform-origin:50% 100%;
}
.bk.aceso .bk-chama-i{animation:bkTremula .34s ease-in-out infinite alternate}
@keyframes bkTremula{
  from{transform:scale(1,1)}
  to  {transform:scale(.93,1.12)}
}
/* o sal: um montinho branco que vira poça ao passar do ponto de fusão.
   A fusão é lenta de propósito — dá tempo de olhar. */
.bk-sal{
  transform-box:fill-box;transform-origin:50% 100%;
  transition:transform 3.3s ease,fill 3.3s ease,filter 3.3s ease;
  fill:#EDF3F6;
}
.bk.derreteu .bk-sal{
  transform:scale(1.55,.28);
  fill:#F6D488;filter:drop-shadow(0 0 7px rgba(255,190,80,.95));
}
/* o termômetro */
.bk-term{display:flex;flex-direction:column;align-items:center;gap:5px;width:52px}
.bk-tubo{
  position:relative;display:block;width:13px;height:112px;border-radius:7px;
  background:rgba(232,241,245,.12);border:1px solid rgba(232,241,245,.32);
  overflow:hidden;
}
.bk-merc{
  position:absolute;left:0;right:0;bottom:0;height:0;display:block;
  background:linear-gradient(180deg,#FF9A66,#DC3617);
}
.bk-num{font-family:var(--mono);font-size:13px;color:var(--amber);white-space:nowrap}
.bk.derreteu .bk-num{color:#FFD9A0}

/* o botão de acender, na base do aparelho: apagado é escuro, aceso
   acende em verde */
.bk-liga{
  position:absolute;left:63%;bottom:8px;
  width:23px;height:23px;border-radius:50%;padding:0;
  border:2px solid #29333A;
  background:radial-gradient(circle at 38% 30%,#5A666F 0%,#232C33 70%);
  box-shadow:0 2px 0 rgba(0,0,0,.6),inset 0 -2px 4px rgba(0,0,0,.55);
  cursor:pointer;
  transition:background .3s ease,box-shadow .3s ease,border-color .3s ease;
}
.bk-liga:active{transform:translateY(1px)}
.bk.aceso .bk-liga{
  border-color:#1E8E3A;
  background:radial-gradient(circle at 38% 30%,#C6FFD4 0%,#2ACB52 55%,#0D7A2B 100%);
  box-shadow:0 0 13px rgba(60,230,110,.95),0 0 30px rgba(60,230,110,.45),
             inset 0 -2px 4px rgba(0,60,20,.5);
}
/* o registro do gás: barra vertical sobre o tubo de onde sai a chama */
.bk-val{
  position:absolute;left:50%;bottom:26px;
  width:16px;height:50px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;
}
.bk-rng{
  -webkit-appearance:none;appearance:none;
  width:50px;height:5px;border-radius:3px;transform:rotate(-90deg);
  background:linear-gradient(90deg,#3A2A10,#F0B44A);cursor:pointer;
}
.bk-rng::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:2px solid var(--amber);cursor:grab;
  box-shadow:0 0 8px rgba(240,180,74,.7);
}
.bk-rng::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:2px solid var(--amber);cursor:grab;
}

/* ---------- as amostras coladas na face 1 ----------
   Coladas mesmo: viram com o cubo em vez de flutuar por cima dele. As
   medidas são as da face sem escala — o cubo é escalado depois por
   base/360, e as fotos vão junto. */
.am{position:absolute;inset:0;pointer-events:none}
.am-f{position:absolute;margin:0;transform:translate(-50%,-50%)}
.am-f img{
  display:block;width:100%;height:auto;
  border:1px solid rgba(69,199,176,.3);
  box-shadow:0 0 20px rgba(3,12,22,.55);
}
.am-f figcaption{
  margin-top:7.4px;text-align:center;
  font-family:var(--mono);font-size:9.4px;letter-spacing:.1em;
  color:var(--paper-dim);
}

/* ---------- a lupa dá meia volta e volta com outro cristal ----------
   Cada propriedade tem o seu composto. A troca acontece de costas, no
   meio do giro, para o retículo nunca aparecer trocando. */
/* A LENTE GIRA EM TORNO DE SI, NÃO DA CAIXA.
   O vidro não fica no meio da .rd-stage: está em left 3% / top 2% com
   78% de lado, ou seja, centrado em 42% / 41%. Girando pelo centro da
   caixa, a lente descrevia um arco e saía do lugar. Aqui o eixo do giro
   E o ponto de fuga da perspectiva são levados para o centro do vidro —
   assim ela vira sobre o próprio eixo e não anda um pixel.
   Os dois têm de andar juntos: só o transform-origin ainda deixaria a
   perspectiva empurrar a lente para o lado, porque ela estaria fora do
   eixo de quem olha. */
.reveal-item.reticulo{perspective:1100px;perspective-origin:42% 41%}
.reveal-item.reticulo.virando .rd-stage.lupa{
  transform-origin:42% 41%;
  animation:lupaGira .72s cubic-bezier(.5,0,.5,1);
}
@keyframes lupaGira{
  0%  {transform:rotateY(0deg)}
  100%{transform:rotateY(180deg)}
}
.q3d{transition:opacity .2s ease}
/* Sem fade na troca: quem esconde o cristal velho é a própria lente de
   perfil, porque o recorte da cena estreita junto com ela (segueLupa).
   O fade daqui era o que se via como "um some, o outro aparece". */

/* ---------- o béquer, a pedra de sal e o dedo na água ----------
   Medidas da face sem escala: o cubo é escalado depois por base/360.
   O quadro tem 292x150 e o SVG usa exatamente esse sistema, então a
   posição do dedo vira coordenada do desenho por regra de três. */
.bq{position:relative;width:292px;height:150px;flex:none;align-self:center;
     transform:translate(var(--bqx,0px),var(--bqy,0px))}
/* modo de posicionamento: o vidro vira alça de arrasto */
.bq.movel .bq-copo{cursor:move}
.bq-svg{position:absolute;inset:0;width:292px;height:150px;overflow:visible}
/* O vidro da frente, desenhado DEPOIS da pedra. É a camada que faz o
   copo conter alguma coisa: sem ela a pedra ficava por cima do vidro e
   parecia apoiada no béquer, não dentro. Não pega o dedo — quem recebe
   o toque são as camadas de baixo. */
.bq-vidro{
  position:absolute;inset:0;width:292px;height:150px;
  overflow:visible;pointer-events:none;
}
/* o líquido inteiro inclina quando o dedo mexe */
.bq-liquido{transform-box:fill-box;transform-origin:50% 100%;
            transform:rotate(calc(var(--slosh,0) * 4.5deg));
            transition:transform .18s ease-out}
/* a pedra: arrastável, e some à medida que dissolve */
.bq-sal{
  position:absolute;width:54px;height:55.8px;margin:0;overflow:visible;
  transform:translate(-50%,-50%) scale(calc(1 - var(--sal,0) * .9));
  opacity:calc(1 - var(--sal,0) * .88);
  cursor:grab;touch-action:none;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.55));
  transition:opacity .2s linear;
}
/* A QUEDA.
   Solta, a pedra não fica parada no ar: cai até encostar. A curva
   acelera, como coisa que cai, e para seca ao chegar — nada de balanço
   no fim, que sal não quica. A duração vem de fora, em --tq, porque ela
   depende da altura de onde se largou. */
.bq-sal.caindo{transition:opacity .2s linear,
                          top var(--tq,300ms) cubic-bezier(.42,0,.9,.42)}
.bq.pegando .bq-sal{cursor:grabbing;filter:drop-shadow(0 9px 16px rgba(0,0,0,.6))}
/* Molhada, a pedra continua pegável: dá para tirá-la da água no meio da
   dissolução e vê-la parar de encolher — o que mostra que quem dissolve
   é a ÁGUA, e não o tempo. Só quando não sobra nada é que ela deixa de
   responder ao dedo. */
.bq.sumiu .bq-sal{cursor:default;pointer-events:none}
/* a área do copo recebe o dedo que mexe */
.bq-copo{position:absolute;left:26px;top:16px;width:100px;height:118px;
         cursor:ew-resize;touch-action:none}
/* o brilho que corre na água quando ela é agitada */
.bq-brilho{opacity:calc(var(--agita,0) * .5)}

/* ---------- o pedaço de sal que se quebra ---------- */
.pd{position:relative;flex:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;-webkit-user-select:none}
.pd-svg{width:214px;height:auto;display:block;overflow:visible}
/* O bloco não esfarela: ele parte ao longo de planos retos. Cada peça
   sai inteira, de faces planas, e o estágio da quebra escolhe para onde
   ela desliza. Três batidas, três estágios. */
.pd .pc{
  transition:transform 1s cubic-bezier(.2,.85,.25,1);
  stroke:#8FA0AC;stroke-width:.4;stroke-linejoin:round;
}
.pd[data-e="1"] .pc{transform:translate(var(--x1),var(--y1)) rotate(var(--r1))}
.pd[data-e="2"] .pc{transform:translate(var(--x2),var(--y2)) rotate(var(--r2))}
.pd[data-e="3"] .pc{transform:translate(var(--x3),var(--y3)) rotate(var(--r3))}
.pd[data-e="4"] .pc{transform:translate(var(--x4),var(--y4)) rotate(var(--r4))}
.pd[data-e="5"] .pc{transform:translate(var(--x5),var(--y5)) rotate(var(--r5))}

/* a batida do dedo sacode o bloco todo */
.pd-bloco{transform-box:fill-box;transform-origin:50% 100%}
.pd.bate .pd-bloco{animation:pdBate .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pdBate{
  0%  {transform:translate(0,0) scaleY(1)}
  22% {transform:translate(1.5px,2.5px) scaleY(.955)}
  55% {transform:translate(0,-1px) scaleY(1.015)}
  100%{transform:translate(0,0) scaleY(1)}
}
/* o risco branco do instante em que o plano se rompe */
.pd-rach{
  fill:none;stroke:#FFFFFF;stroke-width:2.4;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;pointer-events:none;
}
.pd-rach.flash{animation:pdRach .6s ease-out}
@keyframes pdRach{
  0%  {opacity:0}
  18% {opacity:1}
  100%{opacity:0}
}
/* a onda do impacto e o pó que salta */
.pd-onda{
  fill:none;stroke:#BFE7FF;stroke-width:2;pointer-events:none;
  animation:pdOnda .5s ease-out forwards;
}
@keyframes pdOnda{
  0%  {transform:scale(.14);opacity:.95}
  100%{transform:scale(1.5);opacity:0}
}
.pd-po{fill:#DCE7EE;pointer-events:none;animation:pdPo .85s ease-out forwards}
@keyframes pdPo{
  0%  {transform:translate(0,0) scale(1);opacity:.95}
  100%{transform:translate(var(--px),var(--py)) scale(.2);opacity:0}
}
/* o rodapé: a legenda que ensina e o botão de refazer */
.pd-pe{
  position:absolute;left:0;right:0;bottom:-6px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  pointer-events:none;
}
.pd-dica{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--paper-dim);text-align:center;
}
.pd-redo{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--paper-dim);
  background:rgba(255,255,255,.06);border:1px solid rgba(232,241,245,.28);
  border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap;
  opacity:0;transform:translateY(4px);pointer-events:none;
  transition:opacity .35s ease,transform .35s ease,
             background .2s ease,color .2s ease;
}
/* só aparece depois da primeira rachadura: antes não há o que refazer */
.pd:not([data-e="0"]) .pd-redo{opacity:1;transform:none;pointer-events:auto}
.pd-redo:hover{background:rgba(255,255,255,.15);color:#E8F1F5}
.pd-redo:active{transform:translateY(1px)}

/* ---------- o elétron que se entrega ao átomo ---------- */
.eletron{
  position:absolute;z-index:9;width:26px;height:26px;
  margin:-13px 0 0 -13px;pointer-events:none;
  animation:eNasce .3s cubic-bezier(.2,1.5,.4,1);
}
.eletron b{
  position:absolute;inset:7px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#9CEBFF 45%,#2AA8E0 100%);
  box-shadow:0 0 14px #6FD8FF,0 0 34px rgba(80,200,255,.75);
}
/* o halo que pulsa, para ele parecer carga e não bolinha */
.eletron s{
  position:absolute;inset:0;border-radius:50%;text-decoration:none;
  border:1px solid rgba(140,225,255,.6);
  animation:ePulsa 1.1s ease-in-out infinite;
}
@keyframes eNasce{from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1}}
@keyframes ePulsa{0%,100%{transform:scale(1);opacity:.75} 50%{transform:scale(1.6);opacity:0}}
/* Entrando: ele não encolhe onde está — ele CORRE até o centro da bola
   e mergulha. --tx/--ty é o caminho que falta, medido na hora. */
.eletron.entra{animation:eEntra .38s cubic-bezier(.45,0,.8,.45) forwards}
@keyframes eEntra{
  0%  {transform:translate(0,0) scale(1);opacity:1;filter:brightness(1)}
  60% {transform:translate(calc(var(--tx,0px) * .72),calc(var(--ty,0px) * .72))
                scale(.8);opacity:1;filter:brightness(1.9)}
  100%{transform:translate(var(--tx,0px),var(--ty,0px)) scale(.06);
       opacity:0;filter:brightness(3.4)}
}
/* Largado fora: a carga se desfaz — incha, embaça e apaga */
.eletron.some{animation:eSome .44s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes eSome{
  0%  {transform:scale(1);   opacity:1;  filter:blur(0)}
  35% {transform:scale(1.55);opacity:.7}
  100%{transform:scale(2.3); opacity:0;  filter:blur(5px)}
}
/* rastro de energia: faíscas que ficam para trás e se apagam.
   O tamanho vem da velocidade — quanto mais rápido, mais larga a esteira. */
.rastro-e{
  position:absolute;z-index:8;pointer-events:none;
  width:var(--s,12px);height:var(--s,12px);
  margin:calc(var(--s,12px) / -2) 0 0 calc(var(--s,12px) / -2);
  border-radius:50%;
  background:radial-gradient(circle,#DFF7FF 0%,rgba(110,215,255,.7) 42%,
                                    rgba(40,150,220,0) 72%);
  animation:rastroE .46s ease-out forwards;
}
@keyframes rastroE{
  0%  {transform:scale(1);   opacity:.9}
  55% {opacity:.35}
  100%{transform:scale(.22); opacity:0}
}

/* a bola pisca ao receber */
.gas-ball.recebe{animation:bolaRecebe .6s ease-out}
@keyframes bolaRecebe{
  0%  {filter:brightness(1)}
  22% {filter:brightness(2.5) drop-shadow(0 0 26px #7FE0FF)}
  100%{filter:brightness(1)}
}
/* Fora do octeto o átomo é instável: o mesmo tremor e o mesmo alerta
   alaranjado da molécula rompida do slide 4. Quanto mais perto do alvo,
   mais calmo ele fica. */
/* Quatro graus de instabilidade, pela distância até o octeto. Cada
   elétron a mais ou a menos afasta o átomo do alvo e agita mais a bola —
   são os mesmos tremores e alertas das moléculas rompidas do slide 4. */
.gas.inst1 .gas-ball{
  animation:molShake .40s linear infinite, qmAlert  1.6s ease-in-out infinite;
}
.gas.inst2 .gas-ball{
  animation:molShake .26s linear infinite, qmAlert  1.1s ease-in-out infinite;
}
.gas.inst3 .gas-ball{
  animation:shakeHard .16s linear infinite, qmAlert2 .6s ease-in-out infinite;
}
.gas.inst4 .gas-ball{
  animation:shakeWild .09s linear infinite, qmAlert3 .3s ease-in-out infinite;
}
/* a onda que sai da bola quando o elétron se incorpora */
.onda-e{
  position:absolute;z-index:8;pointer-events:none;
  width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  border:3px solid rgba(150,230,255,.95);
  animation:ondaE .62s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes ondaE{
  0%  {transform:scale(.25);opacity:1;border-width:3px}
  100%{transform:scale(7);  opacity:0;border-width:1px}
}
/* chegou à configuração do gás nobre: a bola comemora */
.gas.certo .gas-ball{animation:certoPulsa 1.5s ease-in-out 3 !important}
@keyframes certoPulsa{
  0%,100%{box-shadow:0 0 0 3px rgba(69,199,176,.7),0 0 30px rgba(69,199,176,.45)}
  50%    {box-shadow:0 0 0 8px rgba(69,199,176,.22),0 0 62px rgba(69,199,176,.9)}
}
/* e a camada que mudou se acende por um instante */
.gas-dist .cam.mudou{animation:camMudou .8s ease-out}
@keyframes camMudou{
  0%  {filter:brightness(2.6) drop-shadow(0 0 16px #7FE0FF)}
  100%{filter:none}
}

/* ---------- botão do gás nobre ----------
   Redondo, como a bola do Quadro: uma pastilha que se toca, e não uma
   barra de comando. O rótulo mora dentro dela, em duas linhas — cabe
   porque "gás nobre" já se parte sozinho no espaço. */
.aj{
  display:grid;place-items:center;align-content:center;gap:calc(3px * var(--k));
  width:calc(92px * var(--k));height:calc(92px * var(--k));
  border-radius:50%;cursor:pointer;padding:0;
  border:1px solid rgba(240,180,74,.5);background:rgba(7,22,38,.9);
  color:var(--amber);font-family:var(--mono);
  font-size:calc(10.5px * var(--k));letter-spacing:.1em;text-transform:uppercase;
  line-height:1.25;text-align:center;
  box-shadow:0 0 22px rgba(240,180,74,.14);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.aj b{
  display:block;font-weight:500;
  font-size:calc(21px * var(--k));line-height:1;
}
.aj span{display:block;max-width:calc(70px * var(--k))}
.reveal-item.ajuda:hover .aj{
  border-color:var(--amber);background:rgba(240,180,74,.14);
  box-shadow:0 0 22px rgba(240,180,74,.22);
}
.reveal-item.ajuda.on .aj{
  background:rgba(240,180,74,.2);border-color:var(--amber);
}

/* ---------- o cubo dos postulados ---------- */
.cube-stage{
  position:relative;width:360px;height:260px;
  transform:scale(calc(var(--base) / 360 * var(--k)));
  transform-origin:center center;
  perspective:1100px;
}
.cube-box{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateY(calc(var(--face,0) * -90deg));
  transition:transform 1.05s cubic-bezier(.6,.02,.3,1);
}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  padding:30px 34px;
  backface-visibility:hidden;
  background:linear-gradient(158deg,#143048 0%,#0A1F31 100%);
  border:1px solid rgba(69,199,176,.32);
  box-shadow:inset 0 0 70px rgba(69,199,176,.06);
  transform:rotateY(calc(var(--i) * 90deg)) translateZ(180px);
}
.face.at-top{justify-content:flex-start;padding-top:16px}
/* face de exemplo: o titulo no alto e o par de elementos no meio,
   um de frente para o outro */
.face.exemplo{justify-content:flex-start;padding:26px 30px}
.ex-tit{
  font-family:var(--display);font-weight:600;font-size:27px;
  color:var(--aqua);text-align:center;
}
/* os dois lados começam na mesma altura, então símbolo e família de um
   lado ficam sempre no mesmo nível dos do outro */
.ex-par{
  flex:1;display:flex;align-items:flex-start;justify-content:center;gap:78px;
  padding-top:34px;
}
.ex-el{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
/* A CARGA DO ÍON.
   Sai da família e aparece acima do símbolo, uma por clique: primeiro a
   do cátion, depois a do ânion. Arrasta-se com o dedo desde que apareça,
   porque mover as duas é o gesto DESTA aula — é trocando-as de lado que
   se chega à fórmula do composto.

   Fica FORA do fluxo da coluna (position:absolute), e por isso não
   empurra o símbolo nem a família para baixo: as posições já acertadas
   das duas continuam valendo como estavam. */
.ex-el .carga{
  position:absolute;left:50%;bottom:100%;margin-bottom:8px;
  font-family:var(--display);font-weight:600;font-size:34px;line-height:1;
  color:var(--amber);text-shadow:0 4px 20px rgba(3,12,22,.85);
  white-space:nowrap;
  transform:translate(calc(-50% + var(--fx,0px)),var(--fy,0px)) scale(.55);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .34s ease,transform .46s cubic-bezier(.2,1.5,.4,1);
}
.ex-el .carga.on{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translate(calc(-50% + var(--fx,0px)),var(--fy,0px)) scale(1);
  cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
/* na mão ela acompanha o dedo sem mola: a curva de entrada ficaria
   sempre um passo atrás do arrasto */
.ex-el .carga.pegando{
  cursor:grabbing;color:var(--aqua);
  text-shadow:0 0 24px rgba(69,199,176,.6);
  transition:none;
}
.ex-el .fam{
  font-family:var(--mono);font-size:15px;letter-spacing:.22em;color:var(--amber);
  transform:translate(var(--fx,0px),var(--fy,0px));
  cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
.ex-el .fam.pegando{cursor:grabbing;color:var(--aqua);text-shadow:0 0 18px rgba(69,199,176,.6)}
/* ONDE AS PEÇAS FICAM DENTRO DA FACE.
   Medido na tela, arrumando o Exemplo 01 com o dedo — e vale para os
   quatro: a regra é do LADO da face (first-child, last-child), não do
   exemplo, então o que se acerta num se acerta em todos. Os valores não
   são simétricos porque cada peça é centrada sob o seu próprio símbolo,
   e os símbolos têm larguras diferentes.
   Para reposicionar: ligue EX_SIM_MOVEL, arraste, aperte C e cole. */
.ex-par .ex-el:first-child .carga{--fx:44.3px;--fy:40.4px}   /* 1+ */
.ex-par .ex-el:first-child .sim  {--fx:8.8px;--fy:44.8px}    /* Na */
.ex-par .ex-el:first-child .fam  {--fx:-77.5px;--fy:71.3px}  /* 1A */
.ex-par .ex-el:last-child  .carga{--fx:29.7px;--fy:41px}     /* 2− */
.ex-par .ex-el:last-child  .sim  {--fx:-18.4px;--fy:47.4px}  /* O  */
.ex-par .ex-el:last-child  .fam  {--fx:68.6px;--fy:69.4px}   /* 6A */
.ex-el .sim{
  font-family:var(--display);font-weight:600;font-size:64px;line-height:1;
  color:var(--paper);text-shadow:0 6px 26px rgba(3,12,22,.8);
  /* o mesmo deslocamento da família, para o símbolo poder ser posto no
     lugar dentro da face. Vale sempre; o que o interruptor liga e
     desliga é o ARRASTO, não a posição já escolhida. */
  transform:translate(var(--fx,0px),var(--fy,0px));
}
/* Modo de posicionamento dos símbolos — ver EX_SIM_MOVEL no script.
   Só com ele ligado o símbolo pega o dedo: ele tem 64px e, pegável,
   toma boa parte da face — e é tocando a face que se gira o cubo. */
body.sim-movel .ex-el .sim{
  cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;
  outline:1px dashed rgba(69,199,176,.4);outline-offset:6px;
}
body.sim-movel .ex-el .sim.pegando{
  cursor:grabbing;color:var(--aqua);
  text-shadow:0 0 22px rgba(69,199,176,.55);
  outline-color:var(--aqua);
}
.face .n{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--aqua);margin-bottom:15px;
}
.face .t{
  font-family:var(--display);font-weight:600;
  font-size:calc(var(--tf,29) * 1px);line-height:1.32;
  color:var(--paper);white-space:pre-line;
}
/* aviso de "tem mais" para o cubo */
.reveal-item.cube.has-more::after,
.reveal-item.molecule.has-more::after,
.reveal-item.glass.has-more::after,
.reveal-item.vessel.has-more::after{
  content:'';position:absolute;right:-4px;top:-4px;
  width:10px;height:10px;border-radius:50%;background:var(--aqua);
  animation:dotPulse 2.4s ease-in-out infinite;
}

/* recolhimento: o elemento volta para dentro de onde saiu */
/* ITEM QUE ACOMPANHA A FACE.
   O que está preso a uma face do cubo não some no lugar quando ele vira:
   vai junto. Sai pela esquerda, que é para onde rotateY negativo leva a
   frente, e ao mesmo tempo se achata até ficar de perfil — o que uma
   face faz ao girar para longe. Fica parecendo que estava colado nela. */
.reveal-item.retract.gira{
  animation:revealGira .5s cubic-bezier(.4,0,.7,.6) forwards;
}
@keyframes revealGira{
  0%  {opacity:1;filter:blur(0);
       transform:translate(var(--ax,-50%),-50%) scale(1)}
  60% {opacity:.85}
  100%{opacity:0;filter:blur(2px);
       transform:translate(calc(var(--ax,-50%) + var(--gx,-420px)),-50%)
                 scale(.9) scaleX(.1)}
}

.reveal-item.retract{animation:revealRetract .5s ease-in forwards}
@keyframes revealRetract{
  0%  {opacity:1;filter:blur(0);
       transform:translate(var(--ax,-50%),-50%) scale(1)}
  100%{opacity:0;filter:blur(9px);
       transform:translate(calc(var(--ax,-50%) + var(--dx,0px)),
                           calc(-50% + var(--dy,0px))) scale(.1)}
}

/* ---------- a esfera (o átomo de Dalton, bola de bilhar) ---------- */
.reveal-item.sphere{text-align:center}
.reveal-item.sphere .sym{
  font-family:var(--mono);font-weight:500;line-height:1;letter-spacing:.06em;
  font-size:clamp(15px,calc(var(--base) * 1px * var(--k) * .28),34px);
  margin-bottom:calc(var(--base) * 1px * var(--k) * .08);
  color:var(--paper);text-shadow:0 4px 18px rgba(3,12,22,.85);
}
.ball{
  width:calc(var(--base) * 1px * var(--k));
  height:calc(var(--base) * 1px * var(--k));
  margin-left:auto;margin-right:auto;
  border-radius:50%;
  background:
    radial-gradient(circle at 33% 27%,
      rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 5%,rgba(255,255,255,0) 22%),
    radial-gradient(circle at 36% 30%,
      #8FE4D6 0%,#45C7B0 30%,#1F7F73 62%,#0A3A38 100%);
  box-shadow:
    inset -12px -16px 34px rgba(3,12,22,.5),
    inset 6px 8px 22px rgba(255,255,255,.12),
    0 0 36px rgba(69,199,176,.2);
}
/* aviso de "tem mais" para o que não é texto */
.reveal-item.sphere.has-more::after{
  content:'';position:absolute;right:-2px;top:4px;
  width:9px;height:9px;border-radius:50%;background:var(--aqua);
  animation:dotPulse 2.4s ease-in-out infinite;
}

/* ---------- o barquinho de lego ---------- */
.lego-stage{
  position:relative;width:240px;height:200px;
  transform:scale(calc(var(--base) / 240 * var(--k)));
  transform-origin:center center;
}
.brick{
  position:absolute;left:0;top:0;
  width:calc(var(--w) * 24px);height:26px;border-radius:3px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 44%,rgba(0,0,0,.22)),
    var(--c);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -3px 0 rgba(0,0,0,.2),
    0 2px 5px rgba(3,12,22,.45);
  transform:translate3d(var(--hx),var(--hy),0) rotate(0deg);
  transition:transform .82s cubic-bezier(.2,.82,.28,1);
  transition-delay:var(--d,0ms);
}
/* os pinos de encaixe, um a cada 24px */
.brick::before{
  content:'';position:absolute;left:0;top:-7px;width:100%;height:9px;
  background-image:radial-gradient(ellipse 9px 7px at 12px 8px,var(--c) 0 70%,rgba(0,0,0,0) 72%);
  background-size:24px 9px;background-repeat:repeat-x;
}
.brick::after{
  content:'';position:absolute;left:0;top:-7px;width:100%;height:9px;
  background-image:radial-gradient(ellipse 7px 3px at 12px 4px,rgba(255,255,255,.5) 0 70%,rgba(0,0,0,0) 72%);
  background-size:24px 9px;background-repeat:repeat-x;
}
.lego.exploded .brick{
  transform:translate3d(var(--sx,0px),var(--sy,0px),0) rotate(var(--sr,0deg));
}

/* ---------- remontar o barquinho peça por peça ----------
   Desmontado, cada tijolo se pega pelo dedo e vai onde se quiser. O
   lugar dele no barquinho continua guardado em --hx/--hy: é a distância
   até esse ponto que decide o encaixe. */
.lego.exploded .brick{cursor:grab}
.brick.pegando{
  transition:none;transition-delay:0ms;z-index:6;cursor:grabbing;
  filter:brightness(1.15);
}
/* perto do lugar: a peça avisa que vai encaixar se for solta ali */
.brick.perto{box-shadow:0 0 0 2px rgba(130,255,228,.75),0 0 20px rgba(130,255,228,.5)}
/* Peça encaixada: volta para a casa dela mesmo com o barquinho ainda
   desmontado. Vem depois da regra do .exploded para ganhar dela. */
.lego.exploded .brick.posta{
  transform:translate3d(var(--hx),var(--hy),0) rotate(0deg);
  transition:transform .24s cubic-bezier(.2,.92,.3,1);
  transition-delay:0ms;z-index:2;cursor:default;
}
/* o estalo do encaixe: um clarão curto, e só. A posição não entra na
   animação, senão ela brigaria com a transição que trouxe a peça. */
.brick.encaixou{animation:brickEncaixa .42s ease-out}
@keyframes brickEncaixa{
  0%  {filter:brightness(2.6);
       box-shadow:0 0 0 3px rgba(130,255,228,.95),0 0 28px rgba(130,255,228,.9)}
  100%{filter:brightness(1);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.3),
                  inset 0 -3px 0 rgba(0,0,0,.2),
                  0 2px 5px rgba(3,12,22,.45)}
}
/* A última peça fecha o barquinho: ele cresce, acende e volta ao
   tamanho — a ênfase grande, antes de assentar e virar objeto parado
   de novo. A escala repete a conta do .lego-stage porque a animação
   substitui o transform dele enquanto roda. */
.lego.completo .lego-stage{
  animation:legoPronto 1s cubic-bezier(.22,.85,.3,1);
}
@keyframes legoPronto{
  0%  {transform:scale(calc(var(--base) / 240 * var(--k)));
       filter:drop-shadow(0 0 0 rgba(130,255,228,0))}
  34% {transform:scale(calc(var(--base) / 240 * var(--k) * 1.17));
       filter:drop-shadow(0 0 30px rgba(130,255,228,.95)) brightness(1.3)}
  62% {transform:scale(calc(var(--base) / 240 * var(--k) * .985))}
  100%{transform:scale(calc(var(--base) / 240 * var(--k)));
       filter:drop-shadow(0 0 0 rgba(130,255,228,0))}
}

/* botão de refazer: fora da escala do barquinho, para o texto não encolher */
.lego-redo{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,calc(var(--base) * var(--k) * .417px + 18px)) scale(.92);
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  padding:9px 17px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(240,180,74,.5);background:rgba(7,22,38,.92);
  color:var(--amber);font-family:var(--mono);font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s cubic-bezier(.2,.85,.3,1),
             border-color .2s,background .2s;
}
.lego.exploded .lego-redo{
  opacity:1;pointer-events:auto;
  transform:translate(-50%,calc(var(--base) * var(--k) * .417px + 18px)) scale(1);
}
.lego-redo:hover{border-color:var(--amber);background:rgba(240,180,74,.15)}

/* ---------- a pedra e seus átomos ---------- */
.reveal-item.rock{-webkit-touch-callout:none}
/* escala do elemento (pinça e --base): sem transição, tem que colar no dedo */
.rock-stage{
  position:relative;width:260px;height:200px;
  transform:scale(calc(var(--base) / 260 * var(--k)));
  transform-origin:center center;
}
/* mergulho: ao quebrar, a câmera entra na matéria */
.rock-zoom{
  position:absolute;inset:0;
  transform:scale(var(--zoom,1));
  transform-origin:center center;
  transition:transform .62s cubic-bezier(.24,.86,.3,1);
  perspective:900px;                       /* dá volume ao corpo da pedra */
}
/* A pedra é um sólido: a silhueta é repetida em camadas cada vez mais
   ao fundo e mais escuras, e o conjunto é visto de três quartos.
   É a lateral dessa pilha que o olho lê como espessura. */
.rock-3d{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(-11deg) rotateY(-19deg);
}
.rock-layer{
  position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  transform:translateZ(var(--z));
  transition:opacity .22s ease;
}
.rock.broken .rock-zoom{--zoom:2.05}
.reveal-item.rock.broken{z-index:8}       /* a rede aberta passa por cima do resto */
/* a textura da pedra custa caro para calcular, então ela é desenhada uma vez
   e daí em diante só a opacidade muda — isso o compositor faz de graça */
.rock-svg{
  position:absolute;inset:0;width:100%;height:100%;
  overflow:visible;                        /* a sombra do filtro passa da borda */
  will-change:opacity;
  transition:opacity .22s ease;
}
.rock.broken .rock-svg,
.rock.broken .rock-layer{opacity:0}

/* brilho instantâneo ao encostar: resposta antes mesmo de desmontar */
.rock-glow{
  position:absolute;inset:-18%;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(69,199,176,.34),rgba(69,199,176,0) 62%);
  transition:opacity .14s ease;
}
.rock.pressing .rock-glow{opacity:1}

/* a tela onde a GPU desenha as esferas de verdade */
/* acima do fundo opaco (z 7): senão as esferas ficam escondidas por trás dele */
/* Fica dentro do .quantum e antes do quadro: assim cobre o fundo, mas o
   quadro continua por cima e recebe o toque. */
.q3d{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;opacity:0;transition:opacity .45s ease;
}
.slide.quantum-on .q3d{opacity:1;pointer-events:auto;touch-action:none}
/* o grao fica escondido atras do reticulo: nao pode roubar o toque */
.slide.quantum-on .caco{pointer-events:none}

.rock-atoms{position:absolute;inset:0;pointer-events:none;perspective:720px}
/* a rede inclina para a vista de três quartos ao desmontar, e volta ao soltar */
.lattice{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .54s cubic-bezier(.22,.9,.28,1);
}
.rock.broken .lattice{--rx:-22deg;--ry:34deg}
/* enquanto o dedo gira a rede, ela precisa colar no movimento */
.lattice.orbiting{transition:transform .09s linear}
/* deriva lenta, só para a rede não ficar morta na tela */
.drift{
  position:absolute;inset:0;transform-style:preserve-3d;
  animation:latticeDrift 11s ease-in-out infinite alternate;
}
@keyframes latticeDrift{
  from{transform:rotateY(-12deg)}
  to  {transform:rotateY(12deg)}
}

/* ===== esfera de verdade =====
   Uma esfera projeta um círculo em qualquer ângulo. Como os átomos vivem
   dentro de um volume que inclina e gira, cada um recebe a rotação inversa
   da rede: assim ele nunca vira elipse, que é o que denunciava um disco.
   O sombreado é de bola iluminada: brilho especular, meia-luz até o
   terminador e um retorno de luz na borda de baixo. */
.atom{
  position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 24%,
      rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 4%,rgba(255,255,255,0) 13%),
    radial-gradient(circle at 73% 79%,
      rgba(130,255,228,.5) 0%,rgba(130,255,228,0) 44%),
    radial-gradient(circle at 34% 30%,
      #CFF3EA 0%,#6FD9C4 26%,#35A18D 54%,#12564C 78%,#06231F 92%,rgba(6,35,31,0) 93%);
  opacity:0;
  transform:translate3d(var(--hx),var(--hy),0)
            rotateY(calc(-1 * var(--ry,0deg))) rotateX(calc(-1 * var(--rx,0deg)))
            scale(.4);
  transition:transform .5s cubic-bezier(.22,.9,.28,1),opacity .26s ease;
  transition-delay:var(--d);
}
/* a ligação com o vizinho da mesma fileira */
.atom::after{
  content:'';position:absolute;left:50%;top:50%;width:48px;height:1px;
  background:linear-gradient(90deg,rgba(69,199,176,.55),rgba(69,199,176,.08));
  transform:translateY(-.5px) scaleX(0);transform-origin:0 50%;
  transition:transform .42s ease;transition-delay:var(--d);
}
.rock.broken .atom{
  opacity:var(--o);
  transform:translate3d(var(--lx),var(--ly),var(--lz))
            rotateY(calc(-1 * var(--ry,0deg))) rotateX(calc(-1 * var(--rx,0deg)))
            scale(1);
}
.rock.broken .atom:not(.edge)::after{transform:translateY(-.5px) scaleX(1)}

.reveal-item.pop{animation:revealPop .72s cubic-bezier(.2,.78,.26,1) both}
@keyframes revealPop{
  0%  {opacity:0;filter:blur(9px) brightness(2.4);
       transform:translate(calc(var(--ax,-50%) + var(--dx,0px)),
                           calc(-50% + var(--dy,0px))) scale(.08)}
  14% {opacity:1}
  72% {filter:blur(0) brightness(1.15)}
  84% {transform:translate(var(--ax,-50%),-50%) scale(1.06)}
  100%{opacity:1;filter:blur(0) brightness(1);
       transform:translate(var(--ax,-50%),-50%) scale(1)}
}

/* SAINDO DE DENTRO DE UMA COISA, EM ARCO.
   O elemento nasce microscópico onde a coisa está — um grão de sal na
   face do cubo — e cresce enquanto voa até o lugar dele. O caminho não é
   reto: sobe, passa por um alto no meio e desce até assentar. É a
   trajetória de algo que foi ERGUIDO dali, e não arrastado.
   --dx/--dy é a saída, --mx/--my o alto do arco; os dois vêm medidos em
   revealItem, que é quem sabe onde a coisa está na tela. */
.reveal-item.pop.arco{animation:revealArco .95s cubic-bezier(.34,.06,.2,1) both}
@keyframes revealArco{
  0%  {opacity:0;filter:blur(5px) brightness(2.1);
       transform:translate(calc(var(--ax,-50%) + var(--dx,0px)),
                           calc(-50% + var(--dy,0px))) scale(.05)}
  14% {opacity:1}
  55% {filter:blur(1.4px) brightness(1.3);
       transform:translate(calc(var(--ax,-50%) + var(--mx,0px)),
                           calc(-50% + var(--my,0px))) scale(.46)}
  100%{opacity:1;filter:blur(0) brightness(1);
       transform:translate(var(--ax,-50%),-50%) scale(1)}
}

/* A mesma saída, em linha reta. Serve para quando a distância é curta ou
   quando a curva atrapalharia a leitura: o elemento nasce microscópico
   dentro da coisa e cresce vindo direto, sem rodeio. */
.reveal-item.pop.direto{animation:revealSaida .8s cubic-bezier(.3,.05,.22,1) both}
@keyframes revealSaida{
  0%  {opacity:0;filter:blur(5px) brightness(2.1);
       transform:translate(calc(var(--ax,-50%) + var(--dx,0px)),
                           calc(-50% + var(--dy,0px))) scale(.05)}
  14% {opacity:1}
  100%{opacity:1;filter:blur(0) brightness(1);
       transform:translate(var(--ax,-50%),-50%) scale(1)}
}

/* ENTRADA LATERAL.
   O elemento não brota da caixa "?" crescendo do nada: ele vem de fora
   da tela e ATRAVESSA até o lugar. Sem escala e sem borrão — uma foto
   que desliza não pode chegar deformada nem crescendo do tamanho de um
   grão. De onde ela vem, quem diz é o `entra` do reveal. */
.reveal-item.pop.desliza{animation:revealDesliza .8s cubic-bezier(.22,.74,.22,1) both}
@keyframes revealDesliza{
  0%  {opacity:0;
       transform:translate(calc(var(--ax,-50%) + var(--dx,0px)),
                           calc(-50% + var(--dy,0px)))}
  18% {opacity:1}
  100%{opacity:1;transform:translate(var(--ax,-50%),-50%)}
}

/* CARROSSEL.
   Um exemplo dá lugar ao outro sem a cena piscar: o que sai gira para a
   frente, como se estivesse num prato giratório, e se vai pela direita —
   no mesmo instante em que o próximo entra pela esquerda (.desliza). O
   giro é o que diz que os dois são a mesma coisa vista em posições
   diferentes, e não dois objetos soltos. */
.reveal-item.carrossel{
  animation:carrosselSai .68s cubic-bezier(.42,.02,.72,.44) both;
  pointer-events:none;
}
@keyframes carrosselSai{
  0%  {opacity:1;
       transform:translate(var(--ax,-50%),-50%)
                 perspective(1100px) rotateY(0deg) scale(1)}
  26% {opacity:1}
  100%{opacity:0;
       transform:translate(calc(var(--ax,-50%) + 330px),-50%)
                 perspective(1100px) rotateY(-82deg) scale(.62)}
}

/* O CARROSSEL AO CONTRÁRIO.
   Um passo atrás não recolhe o exemplo para dentro de onde ele nasceu:
   desfaz o giro. O prato roda para o outro lado — quem tinha entrado
   pela esquerda sai por ela, e quem tinha saído pela direita volta por
   onde foi. Assim a seta para trás desfaz o que a seta para frente fez,
   e não outra coisa qualquer. */
/* Quem entrou deslizando plano pela esquerda sai por ela do mesmo
   jeito: sem giro. O giro é do outro — foi ele quem girou para dar o
   lugar, e é ele quem gira de volta para retomá-lo. Por isso esta é a
   revealDesliza tocada de trás para a frente, com o mesmo --dx que
   trouxe o elemento e a curva dela invertida. */
.reveal-item.carrossel-volta{
  animation:carrosselVolta .68s cubic-bezier(.78,0,.78,.26) both;
  pointer-events:none;
}
@keyframes carrosselVolta{
  0%  {opacity:1;transform:translate(var(--ax,-50%),-50%)}
  82% {opacity:1}
  100%{opacity:0;
       transform:translate(calc(var(--ax,-50%) + var(--dx,-330px)),
                           calc(-50% + var(--dy,0px)))}
}
/* e o anterior refaz o giro ao contrário: volta da direita, de onde
   tinha ido, desgirando até parar de frente na casa dele */
.reveal-item.carrossel-entra{
  animation:carrosselChega .68s cubic-bezier(.28,.56,.58,.98) both;
}
@keyframes carrosselChega{
  0%  {opacity:0;
       transform:translate(calc(var(--ax,-50%) + 330px),-50%)
                 perspective(1100px) rotateY(-82deg) scale(.62)}
  74% {opacity:1}
  100%{opacity:1;
       transform:translate(var(--ax,-50%),-50%)
                 perspective(1100px) rotateY(0deg) scale(1)}
}

.foot{
  position:absolute;left:88px;bottom:34px;font-family:var(--mono);
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,241,245,.32);
}

/* ---------- capa ---------- */
.slide.cover{padding:0;display:grid;grid-template-columns:1.08fr .92fr;align-items:center}
.cover .left{padding:0 0 0 92px}
.cover .kicker{
  font-family:var(--mono);font-size:13px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--aqua);margin-bottom:26px;
}
.cover h1{
  font-family:var(--display);font-weight:700;font-size:67px;line-height:.98;
  letter-spacing:-.028em;max-width:11ch;
}
.cover h1 em{font-style:normal;color:var(--amber)}
.cover .autor{display:flex;align-items:center;gap:22px;margin-top:6px}
.cover .prof{
  font-size:23px;font-weight:400;color:var(--paper);letter-spacing:.01em;
  margin:0;
}
.cover .prof span{color:var(--paper-dim);font-weight:300}
/* O AUTOR, NA CAPA.
   O retrato entra ao lado do nome, do tamanho de um crédito e não de um
   cartaz: a capa é da aula, não de quem a dá. E entra puxado para o tema
   — a foto de laboratório vem clara e saturada demais para este fundo.
   São três coisas de uma vez:
     o filtro tira o excesso de cor e de luz;
     um véu verde-água desce do alto à esquerda, como se a luz da cena
       viesse do mesmo lugar de onde vem a do resto do slide;
     e o azul do fundo sobe por baixo, de modo que a foto não termina
       num corte — ela se dissolve na página.
   O anel é o mesmo que cerca a ficha do elemento no canto dos slides.
   O recorte é redondo e mira o rosto (61% 21%), que num retrato em pé
   fica no terço de cima. */
.cover .autor-retrato{
  position:relative;flex:none;
  width:106px;height:106px;border-radius:50%;
  border:1px solid rgba(69,199,176,.5);
  box-shadow:0 0 0 6px rgba(69,199,176,.07),
             0 16px 42px rgba(3,12,22,.62),
             0 0 36px rgba(69,199,176,.16);
}
.cover .autor-retrato img{
  display:block;width:100%;height:100%;border-radius:50%;
  object-fit:cover;object-position:61% 21%;
  filter:saturate(.6) contrast(1.06) brightness(.88);
  -webkit-user-drag:none;user-select:none;
}
.cover .autor-retrato::after{
  content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    linear-gradient(165deg, rgba(69,199,176,.26) 0%, rgba(69,199,176,0) 46%),
    linear-gradient(0deg,   rgba(7,22,38,.60)  0%, rgba(7,22,38,0)      58%);
}
.cover .right{display:grid;place-items:center;height:100%}

/* átomos da capa */
#hero{width:430px;height:430px}
#hero .orbit{fill:none;stroke:rgba(69,199,176,.35);stroke-width:1.2}
#hero .nucleus{fill:var(--ink-soft);stroke:var(--aqua);stroke-width:1.6}
#hero .sym{font-family:var(--mono);font-size:15px;fill:var(--paper);letter-spacing:1px}
#hero .shared{fill:var(--amber)}
#hero .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
#hero .spin.rev{animation-duration:18s;animation-direction:reverse}
#hero .glow{animation:glow 3.2s ease-in-out infinite}
#hero .glow.d{animation-delay:-1.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.45;r:5}50%{opacity:1;r:7}}

/* ---------- a caneta ----------
   A folha onde se escreve, por cima do palco. Ela NUNCA pega o toque:
   quem separa o risco do arrasto não é esta camada, é o tipo do
   ponteiro — a caneta risca, o dedo continua mexendo nos elementos.
   Ver 'canetaRisca' no script.

   width/height 100% não é enredo: o <canvas> transforma os atributos
   width/height em tamanho CSS, e como o bitmap é redimensionado para a
   densidade da tela, sem isto ele ficava MAIOR que o palco e o traço
   saía longe de onde a mão tinha passado. Era a descalibração. */
#tinta{
  position:absolute;inset:0;width:100%;height:100%;z-index:40;
  pointer-events:none;touch-action:none;
}
/* O chiado fica acima do grão que cobre a tela e abaixo da folha da
   caneta: ele engole a troca de cena, mas não apaga o que a aula
   escreveu. Sobe depressa — em 70ms já é parede — e sai devagar,
   entregando o mundo do outro lado. */
#chiado{
  position:absolute;inset:0;width:100%;height:100%;z-index:39;
  pointer-events:none;image-rendering:pixelated;
  opacity:0;transition:opacity .26s ease;
}
#chiado.on{opacity:.97;transition:opacity .07s linear}
/* O PONTEIRO NO MODO CANETA.
   Antes o cursor era o que estivesse por baixo — e como quase tudo no
   palco se arrasta, o que aparecia era a mãozinha do "pegue e leve",
   justo no momento em que o gesto é outro. Agora o palco inteiro mostra
   uma bolinha da COR DA TINTA: ela avisa que a caneta está armada e de
   que cor ela está, que é o que a moldura âmbar sozinha não dizia.
   O desenho da bolinha é montado no script, porque a cor muda. */
#stage.escrevendo,
#stage.escrevendo *{cursor:var(--cur-tinta,crosshair) !important}

/* ---------- O LASER ----------
   O ponto vermelho que aponta, e nada mais: não risca, não pega, não
   deixa rastro. Só a ponta da caneta o acende — quem aponta numa aula é
   a mão do professor, e o mouse fazendo o ponto seria um laser que
   ninguém está segurando. Parado, ele se apaga sozinho.
   Fica acima de tudo, inclusive da folha da caneta e dos painéis: um
   laser que passa por trás de alguma coisa não é um laser. */
#laser{
  position:fixed;z-index:95;pointer-events:none;
  width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    #FFF1EE 0%,#FF4A3A 38%,#D01A0C 68%,rgba(208,26,12,0) 100%);
  box-shadow:0 0 16px rgba(255,74,58,.95),0 0 46px rgba(255,74,58,.5);
  opacity:0;transition:opacity .2s ease;
}
#laser.on{opacity:1}
/* o botão dele não acende em âmbar como os outros: acende na cor da luz */
#laser-btn.on{color:#FF5A4A}

/* a moldura acesa lembra que o palco está no modo caneta */
#stage.escrevendo::after{
  content:'';position:absolute;inset:0;z-index:41;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(240,180,74,.55),
             inset 0 0 40px rgba(240,180,74,.12);
}

/* ---------- barra de controle ---------- */
#bar{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:7px;
  background:rgba(7,22,38,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(69,199,176,.22);border-radius:999px;z-index:50;
  transition:opacity .35s ease,transform .35s ease;
}
/* Fora de cena, a barra fica ABAIXO da borda inferior. Subir é ela vir
   de lá; sair é o caminho de volta, o mesmo tempo e a mesma curva — e é
   por isso que ida e volta usam a mesma transição, só invertendo o
   estado. 120px cobre a altura dela (60) com folga para a sombra. */
#bar.hidden{
  opacity:0;transform:translateX(-50%) translateY(120px);pointer-events:none;
}
#bar{transition:opacity .34s ease,transform .42s cubic-bezier(.22,.9,.28,1)}

/* ---------- o puxador ----------
   Uma alça rente à base, no meio, com a mesma pele da barra: mesmo
   vidro, mesma borda, só que aberta em cima. É ela que chama a barra —
   fora isso a tela fica limpa, que é o que a aula pede. */
#puxador{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;
  padding:7px 26px 9px;
  background:rgba(7,22,38,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(69,199,176,.22);border-bottom:0;
  border-radius:14px 14px 0 0;
  color:var(--paper-dim);cursor:pointer;z-index:49;
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  transition:opacity .3s ease,transform .3s ease,color .2s,border-color .2s;
}
#puxador:hover{color:var(--aqua);border-color:rgba(69,199,176,.5)}
#puxador svg{display:block;transition:transform .3s ease}
#puxador:hover svg{transform:translateY(-2px)}
/* com a barra em cena, a alça sai de baixo dela pelo mesmo caminho */
#puxador.fora{opacity:0;transform:translateX(-50%) translateY(100%);pointer-events:none}

.btn{
  width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:var(--paper);
  display:grid;place-items:center;cursor:pointer;transition:background .18s,color .18s;
}
.btn:hover{background:rgba(69,199,176,.16);color:var(--aqua)}
.btn:disabled{opacity:.28;cursor:default;background:transparent}
.btn.on{color:var(--amber)}
#counter{
  font-family:var(--mono);font-size:14px;min-width:66px;text-align:center;
  color:var(--paper-dim);letter-spacing:.08em;user-select:none;
}
#counter b{color:var(--paper);font-weight:500}
.sep{width:1px;height:24px;background:rgba(69,199,176,.22);margin:0 4px}

/* ---------- visão geral ---------- */
/* ---------- painel de coordenadas (ferramenta de montagem) ----------
   Este toma a tela inteira, e pode: quem o abre parou de dar aula e
   está montando o slide. */
#coords{
  position:fixed;inset:0;z-index:90;background:rgba(7,22,38,.96);
  backdrop-filter:blur(8px);padding:48px;
  display:flex;flex-direction:column;gap:16px;
}
#coords[hidden],#notes[hidden]{display:none}
#coords h2{
  font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--aqua);font-weight:400;
}
#coords textarea{
  flex:1;min-height:0;resize:none;
  background:var(--ink);color:var(--paper);
  border:1px solid rgba(69,199,176,.28);border-radius:2px;padding:18px 20px;
  font-family:var(--mono);font-size:13px;line-height:1.7;tab-size:2;
}
#coords textarea:focus{outline:none;border-color:var(--aqua)}
#coords .row{display:flex;align-items:center;justify-content:space-between;gap:18px}
#coords .msg{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--amber)}
#coords .hint2{font-size:13px;font-weight:300;color:var(--paper-dim)}
#coords .close{
  border:1px solid rgba(69,199,176,.3);background:transparent;color:var(--paper);
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:10px 18px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s;
}
#coords .close:hover{border-color:var(--aqua);color:var(--aqua)}

/* ---------- NOTAS DE AULA ----------
   Não é uma página que substitui o slide: é uma folha que se põe SOBRE
   ele. O slide continua ali atrás, à vista — quem lê a nota está
   olhando para a cena de que ela fala, e é isso que faz a nota servir
   durante a aula em vez de antes dela.

   Daí o formato: um caderno EM PÉ, três por quatro. Uma folha deitada
   tomaria a largura da tela e esconderia justamente o desenho.

   E daí ela se arrastar pelo cabeçalho: em um slide o desenho está à
   esquerda, no outro à direita, e a nota não pode tapar o que comenta.
   O lugar escolhido fica valendo para as próximas aberturas.

   O material é o mesmo do resto: fundo de tinta escura, fio verde-água,
   monoespaçada em caixa alta no título e a fonte de leitura no corpo. */
#notes{
  position:fixed;z-index:90;
  left:var(--nx,50%);top:var(--ny,50%);
  transform:translate(-50%,-50%);
  width:min(440px,44vw);height:min(586px,84vh);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(18,49,75,.97),rgba(7,22,38,.985));
  border:1px solid rgba(69,199,176,.34);border-radius:4px;
  box-shadow:0 30px 80px rgba(3,12,22,.72),0 0 46px rgba(69,199,176,.09);
  backdrop-filter:blur(10px);
  overflow:hidden;
}
/* o cabeçalho é a alça: é por ele que a folha anda */
#notes .cab{
  flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:15px 14px 13px 19px;
  border-bottom:1px solid rgba(69,199,176,.2);
  background:rgba(69,199,176,.055);
  cursor:move;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
#notes.levando .cab{cursor:grabbing;background:rgba(69,199,176,.1)}
#notes h2{
  margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--aqua);font-weight:400;
}
/* de que slide é esta nota, em letra pequena sob o título */
#notes .de{
  margin-top:5px;font-size:13px;font-weight:300;line-height:1.25;
  color:var(--paper-dim);max-width:30ch;
}
#notes .x{
  flex:none;width:30px;height:30px;padding:0;display:grid;place-items:center;
  border:1px solid rgba(69,199,176,.28);border-radius:50%;
  background:transparent;color:var(--paper-dim);cursor:pointer;
  transition:border-color .2s,color .2s;
}
#notes .x:hover{border-color:var(--aqua);color:var(--aqua)}
#notes textarea{
  flex:1;min-height:0;resize:none;width:100%;
  background:transparent;color:var(--paper);border:none;
  padding:16px 19px;
  font-family:var(--body);font-size:16px;font-weight:300;line-height:1.72;
}
#notes textarea:focus{outline:none}
#notes textarea::placeholder{color:rgba(232,241,245,.34)}
#notes .rod{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 19px 12px;border-top:1px solid rgba(69,199,176,.16);
}
#notes .msg{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--amber)}
#notes .hint2{font-size:11.5px;font-weight:300;color:var(--paper-dim)}
/* o botão da barra acende quando o slide tem anotação guardada */
#notes-btn.tem::after{
  content:'';position:absolute;top:9px;right:9px;
  width:7px;height:7px;border-radius:50%;background:var(--amber);
}
#notes-btn{position:relative}

#overview{
  position:fixed;inset:0;z-index:80;background:rgba(7,22,38,.96);
  backdrop-filter:blur(8px);padding:48px;overflow:auto;
}
#overview[hidden]{display:none}
#overview h2{
  font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--aqua);margin-bottom:26px;font-weight:400;
}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{
  aspect-ratio:16/9;border:1px solid rgba(69,199,176,.24);background:var(--ink);
  padding:0;position:relative;overflow:hidden;display:block;
  cursor:pointer;text-align:left;color:inherit;font:inherit;transition:border-color .2s,transform .2s;
}
.card:hover{border-color:var(--aqua);transform:translateY(-3px)}
.card.current{border-color:var(--amber)}

/* miniatura: o próprio slide, em escala, com tudo o que ele guarda à mostra */
.mini{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.mini-palco{
  position:absolute;top:0;left:0;width:1280px;height:720px;
  transform-origin:0 0;background:var(--ink);
}
.mini-palco::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(69,199,176,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(69,199,176,.055) 1px,transparent 1px);
  background-size:40px 40px;
}
.mini-palco .slide{opacity:1;visibility:visible}
/* numa miniatura nada se mexe */
.mini-palco *{animation:none!important;transition:none!important}

.card .rot{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 13px 11px;
  background:linear-gradient(0deg,rgba(6,20,32,.97) 45%,rgba(6,20,32,0));
}
.card .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--paper-dim)}
.card .t{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2;margin-top:2px}
.card .s{font-size:11px;font-weight:300;color:var(--amber);margin-top:3px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .slide.is-leaving{opacity:0;visibility:hidden}
  #fx{display:none}
}
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="progress"></div>
    <div id="deck"></div>
    <div id="fx" aria-hidden="true">
      <span class="scan"></span>
      <span class="sweep"></span>
      <span class="ring"></span>
      <span class="flash"></span>
    </div>
    <!-- Chiado da travessia: o ruído que marca a passagem de um mundo
         para o outro. Pequeno de propósito — é esticado com pixels
         grossos, e é atrás dele que a cena inteira é trocada. -->
    <canvas id="chiado" width="220" height="124" aria-hidden="true"></canvas>
    <!-- a folha onde a caneta escreve, por cima de tudo do palco -->
    <canvas id="tinta" width="1280" height="720" aria-hidden="true"></canvas>
  </div>
</div>

<div id="ver" aria-hidden="true"></div>

<!-- a luz do laser: fora do palco, porque ela segue o ponteiro da tela,
     e não uma posição da cena -->
<i id="laser" aria-hidden="true"></i>

<nav id="bar" aria-label="Controles da apresentação">
  <button class="btn" id="prev" title="Slide anterior (←)" aria-label="Slide anterior">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div id="counter"><b>1</b> / 4</div>
  <button class="btn" id="next" title="Próximo slide (→)" aria-label="Próximo slide">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div class="sep"></div>
  <button class="btn" id="over" title="Ver todos os slides (O)" aria-label="Ver todos os slides">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  </button>
  <!-- O ícone de copiar as posições saiu da barra: ele é ferramenta de
       montagem, não de aula, e a tecla C continua fazendo o serviço. No

/* Um pedaço grande de sal num prato. Ele é uma grade de doze cacos que
   juntos formam o bloco; a cada batida do dedo eles se afastam mais e a
   pedra se desfaz. Quatro batidas: três quebrando e a última refazendo. */
/* O que o aluno vê aqui não é uma pedra esfarelando. É um cristal
   clivando: sob a pancada, um plano de íons desliza sobre o vizinho,
   cargas de mesmo sinal ficam frente a frente e o cristal se parte ao
   longo de um plano reto. Por isso o bloco sai em pedaços de faces
   planas, e não em migalhas — e é isso que significa "quebradiço".

   O bloco é um cubo 4x4x2 desenhado em perspectiva isométrica. Cada
   batida abre mais um plano de clivagem: primeiro os três que partem o
   bloco ao meio, depois os dois que repartem cada metade. Cinco
   batidas, trinta e dois pedaços — e todos de faces planas, que é o que
   a aula quer mostrar. */
function PEDRA(){
  const nx = 4, a = 12, b = 6, h = 22;   /* largura, profundidade, altura */
  const cx = 100, cy = 70;
  /* x cresce para a direita-frente, z para a esquerda-frente, y para cima */
  const P = (x, z, y) => [ cx + (x - z) * a,
                           cy + (x + z - nx) * b - (y - 1) * h ];
  const pts = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const rgb = (r, g, bl, t) => `rgb(${Math.round(r*t)},${Math.round(g*t)},${Math.round(bl*t)})`;

  /* as direções, já na tela, dos dois planos de clivagem verticais */
  const n = Math.hypot(a, b);
  const ux = [  a / n, b / n ];
  const uz = [ -a / n, b / n ];

  /* Quanto cada plano já abriu, estágio a estágio. Os três primeiros
     partem o bloco ao meio (A); os dois últimos repartem cada metade,
     empurrando só o quarto de fora (B). Os números são o limite: mais
     do que isso e os pedaços caem do prato. */
  const XA = [0,  7, 11, 13, 14, 14];
  const ZA = [0,  0, 11, 13, 14, 14];
  const XB = [0,  0,  0,  0,  6,  6];
  const ZB = [0,  0,  0,  0,  0,  6];
  const DY = [0,  0,  0,  1,  1,  1];   /* liga a queda da camada de cima */

  const pecas = [];
  for (let i = 0; i < nx; i++)
    for (let k = 0; k < nx; k++)
      for (let j = 0; j < 2; j++){
        const si = i >= nx / 2 ? 1 : -1, sk = k >= nx / 2 ? 1 : -1;
        /* o quarto de fora de cada metade: é ele que se destaca depois */
        const fi = (i === 0 || i === nx - 1) ? 1 : 0;
        const fk = (k === 0 || k === nx - 1) ? 1 : 0;
        /* as três faces visíveis do bloquinho */
        const topo = [P(i,k,j+1), P(i+1,k,j+1), P(i+1,k+1,j+1), P(i,k+1,j+1)];
        const dir  = [P(i+1,k,j+1), P(i+1,k+1,j+1), P(i+1,k+1,j), P(i+1,k,j)];
        const esq  = [P(i,k+1,j+1), P(i+1,k+1,j+1), P(i+1,k+1,j), P(i,k+1,j)];
        const t = 1 - (i + k) * 0.012 - (1 - j) * 0.03;

        const vars = [1,2,3,4,5].map(e => {
          const dx = si * XA[e] * ux[0] + sk * ZA[e] * uz[0]
                   + si * fi * XB[e] * ux[0] + sk * fk * ZB[e] * uz[0];
          const dy = si * XA[e] * ux[1] + sk * ZA[e] * uz[1]
                   + si * fi * XB[e] * ux[1] + sk * fk * ZB[e] * uz[1]
                   + DY[e] * (j ? 13 : 2);
          const rr = (si + sk) * 0.7 * e + (j && DY[e] ? si * 4 : 0)
                   + (fi * si + fk * sk) * (XB[e] || ZB[e] ? 1.6 : 0);
          return `--x${e}:${dx.toFixed(1)}px;--y${e}:${dy.toFixed(1)}px;`
               + `--r${e}:${rr.toFixed(1)}deg;`;
        }).join('');
        const c = P(i + 0.5, k + 0.5, j + 0.5);

        pecas.push({ z: i + k + j * (2 * b / h), html:
          `<g class="pc" style="transform-origin:${c[0].toFixed(1)}px ${c[1].toFixed(1)}px;`
        + vars + `">`
        + `<polygon points="${pts(esq)}" fill="${rgb(201,214,223,t)}"/>`
        + `<polygon points="${pts(dir)}" fill="${rgb(169,184,195,t)}"/>`
        + `<polygon points="${pts(topo)}" fill="${rgb(242,247,250,t)}"/>`
        + `</g>` });
      }
  /* De trás para a frente. A direção do olhar nesta projeção é
     (1, 2b/h, 1), então a profundidade de cada bloquinho é
     i + k + j*(2b/h): pintar em ordem crescente põe o de trás primeiro. */
  pecas.sort((p, q) => p.z - q.z);

  /* Onde cada plano corta a superfície do bloco. Os verticais descem do
     topo pela face lateral; o horizontal atravessa as duas faces. */
  const cortaX = x => pts([P(x,0,2), P(x,nx,2), P(x,nx,0)]);
  const cortaZ = z => pts([P(0,z,2), P(nx,z,2), P(nx,z,0)]);
  const rachas = [
    [cortaX(2)], [cortaZ(2)],
    [pts([P(0,nx,1), P(nx,nx,1), P(nx,0,1)])],
    [cortaX(1), cortaX(3)],
    [cortaZ(1), cortaZ(3)]
  ].map((g, e) => g.map(p => `<polyline class="pd-rach r${e+1}" points="${p}"/>`).join(''))
   .join('');

  return `<div class="pd" data-e="0">
    <svg class="pd-svg" viewBox="0 0 200 152" aria-hidden="true">
      <defs>
        <linearGradient id="pdPrato" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EDF2F5"/>
          <stop offset="1" stop-color="#9BA8B2"/>
        </linearGradient>
      </defs>
      <!-- o prato, em perspectiva -->
      <ellipse cx="100" cy="126" rx="90" ry="24" fill="#0A1622" opacity=".55"/>
      <path d="M12 120 Q100 150 188 120 L188 116 Q100 146 12 116 Z" fill="#8593A0"/>
      <ellipse cx="100" cy="117" rx="88" ry="23" fill="url(#pdPrato)"
               stroke="#7C8A96" stroke-width="1.2"/>
      <ellipse cx="100" cy="118" rx="70" ry="17" fill="#C9D4DC" opacity=".55"/>
      <g class="pd-bloco">${pecas.map(p => p.html).join('')}</g>
      ${rachas}
    </svg>
    <div class="pd-pe">
      <span class="pd-dica">bata na pedra</span>
      <button class="pd-redo" type="button">&#8635; refazer</button>
    </div>
  </div>`;
}

/* Um béquer com água e, ao lado, uma pedra de sal que se pode arrastar.
   Caindo na água ela começa a dissolver devagar; passar o dedo na água,
   de um lado para o outro, acelera. É o gesto que a lupa traduz em
   moléculas de água arrancando íons. */
function BEQUER(){
  /* A PEDRA DE SAL, EM CRISTAL.
     Mesma projeção isométrica de antes — a que o resto do app usa —, mas
     agora com as três faces sombreadas pela mesma luz: vinda de cima e da
     esquerda, o topo recebe o cheio dela, a face esquerda um pouco menos,
     a direita fica na sombra. É esse degrau entre as três que faz o olho
     ler volume em vez de três losangos.
     Os pontos saem de P(x,z,y) e não mudaram: o topo é o losango
     (30,0)-(60,15)-(30,30)-(0,15), e as laterais descem dele. */
  const a = 15, b = 7.5, h = 16, cx = 30, cy = 31;
  const P = (x, z, y) => [ cx + (x - z) * a, cy + (x + z - 2) * b - (y - 1) * h ];
  const pt = q => q.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

  const pedra = `<defs>
      <linearGradient id="slTopo" x1=".15" y1="0" x2=".85" y2="1">
        <stop offset="0"   stop-color="#FFFFFF"/>
        <stop offset=".45" stop-color="#F4F8FB"/>
        <stop offset="1"   stop-color="#DCE6EE"/>
      </linearGradient>
      <linearGradient id="slEsq" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#D3DFE8"/>
        <stop offset="1" stop-color="#A9B9C6"/>
      </linearGradient>
      <linearGradient id="slDir" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9DAEBC"/>
        <stop offset="1" stop-color="#78899A"/>
      </linearGradient>
    </defs>
    <!-- as três faces -->
    <polygon points="${pt([P(0,2,2),P(2,2,2),P(2,2,0),P(0,2,0)])}" fill="url(#slEsq)"/>
    <polygon points="${pt([P(2,0,2),P(2,2,2),P(2,2,0),P(2,0,0)])}" fill="url(#slDir)"/>
    <polygon points="${pt([P(0,0,2),P(2,0,2),P(2,2,2),P(0,2,2)])}" fill="url(#slTopo)"/>

/* Uma face de exemplo: o título no alto e, no meio, os dois elementos
   um de frente para o outro, cada um com a sua família. */
/* A CARGA DO ÍON, LIDA DA FAMÍLIA.
   1A, 2A e 3A perdem elétrons e ficam com carga igual ao número da
   família; 6A e 7A ganham o que falta para oito, e ficam negativas. É a
   conta que a aula acabou de ensinar — feita aqui para não ter de ser
   repetida à mão em cada exemplo do cubo, e para não haver risco de um
   deles sair com o número trocado.

   O número vem escrito por extenso (1+, 2−) mesmo quando é um só: este
   slide é o da INVERSÃO do nox, e é o número que vai ser trocado de
   lado. Um "+" solto não se inverte; um "1+" sim. */
function cargaDaFamilia(fam){
  const n = parseInt(fam, 10);
  if (!n || n === 4) return '';
  return n <= 3 ? n + '+' : (8 - n) + '\u2212';
}

function PAR(tit, a, fa, b, fb){
  /* a carga por cima do símbolo, a família logo abaixo dele. A carga
     nasce escondida: ela é solta por clique, o cátion primeiro. */
  const el = (sim, fam) => {
    const q = cargaDaFamilia(fam);
    const sinal = q.endsWith('+') ? ' mais' : ' menos';
    return `<div class="ex-el">`
      + (q ? `<span class="carga${sinal}">${q}</span>` : '')
      + `<span class="sim">${sim}</span>`
      + `<span class="fam">${fam}</span></div>`;
  };
  return { cls: 'exemplo',
           html: `<div class="ex-tit">${tit}</div>`
               + `<div class="ex-par">${el(a, fa)}${el(b, fb)}</div>` };
}

/* Os exemplos do octeto, um por face do cubo. "solta" diz se o átomo
   PERDE elétrons — só nesses o último subnível se arrasta para fora.
   O cloro e o oxigênio ganham elétrons, então neles não há o que doar. */
const EXEMPLOS = [
  { sim: 'Na', nobre: 'Ne' },   /* precisa perder 1 */
  { sim: 'Cl', nobre: 'Ar' },   /* precisa ganhar 1 */
  { sim: 'Ca', nobre: 'Ar' },   /* precisa perder 2 */
  { sim: 'O',  nobre: 'Ne' }    /* precisa ganhar 2 */
];

/* Troca o exemplo acompanhando o giro do cubo: o que está fora dele sai
   para um lado e o novo entra pelo outro, no mesmo sentido da face.
   dir = +1 avançando, -1 voltando. */
function trocaExemplo(slide, i, dir){
  const at = slide.querySelector('.reveal-item[data-id="atomo"]');
  const nb = slide.querySelector('.reveal-item[data-id="vizinho"]');
  if (nb && !nb.hidden) retractItem(nb);     /* o gás da ajuda recolhe */
  if (!at){ poeExemplo(slide, i); return; }

  const fora = (dir < 0 ? 240 : -240) + 'px';
  const vem  = (dir < 0 ? -240 : 240) + 'px';
  at.style.setProperty('--dx', fora);
  at.style.setProperty('--dy', '0px');
  at.classList.remove('pop');
  void at.offsetWidth;
  at.classList.add('retract');
  setTimeout(() => {
    at.classList.remove('retract');
    poeExemplo(slide, i);                    /* o exemplo daquela face */
    at.style.setProperty('--dx', vem);
    at.style.setProperty('--dy', '0px');
    void at.offsetWidth;
    at.classList.add('pop');
    setTimeout(() => {
      at.classList.remove('pop');
      at.style.removeProperty('--dx');
      at.style.removeProperty('--dy');
    }, 620);
  }, 400);
}

/* refaz o átomo e o gás nobre da face que o cubo está mostrando */
function poeExemplo(slide, i){
  const ex = EXEMPLOS[i];
  if (!slide || !ex) return;
  const at = slide.querySelector('.reveal-item[data-id="atomo"]');
  const nb = slide.querySelector('.reveal-item[data-id="vizinho"]');
  if (at){
    at.dataset.sim = ex.sim;
    /* alvo: quantos elétrons faltam (positivo) ou sobram (negativo)
       para o átomo ficar com a configuração do gás nobre */
    at.dataset.alvo  = (GASES[ex.nobre] || {}).z - (GASES[ex.sim] || {}).z;
    delete at.dataset.alvo2;               /* nenhum exemplo daqui é da 4A */
    at.dataset.delta = 0;
    at.innerHTML = GAS(ex.sim, { dentro: true, conta: true });
    at.classList.remove('doado', 'certo');
    marcaEstado(at);                       /* nasce instável, fora do octeto */
  }
  if (nb){
    nb.dataset.sim = ex.nobre;
    nb.innerHTML = GAS(ex.nobre, { dentro: true, conta: true });
  }
  slide.classList.remove('acertou');
  const aj = slide.querySelector('.ajuda');
  if (aj) aj.classList.remove('on');
}

/* Os oito grupos representativos, em colunas. O primeiro lugar de cada

/* Símbolo com os elétrons de valência em volta: um de cada lado antes de
   emparelhar, como se escreve à mão. O hélio é a exceção conhecida —
   dois elétrons, e o par fica junto. */
function LEWIS(sim, n, emPares){
  let pos;
  if (n <= 0) pos = [];
  else if (emPares){
    /* Elétrons recebidos entram emparelhados: enche um lado com dois
       antes de abrir o próximo. Um sobrando fica sozinho no último. */
    const ordem = ['r', 't', 'l', 'b'];
    pos = [];
    let k = n;
    for (let i = 0; i < 4 && k > 0; i++){
      if (k >= 2){ pos.push(ordem[i] + '-a', ordem[i] + '-b'); k -= 2; }
      else       { pos.push(ordem[i] + '-c'); k -= 1; }
    }
  }
  else if (sim === 'He') pos = ['r-a', 'r-b'];   /* o par junto, na frente */
  else if (n <= 3){
    /* 1A, 2A e 3A: tudo na frente do símbolo, centrado nele */
    pos = { 1: ['r-c'], 2: ['r-a', 'r-b'], 3: ['r-a', 'r-c', 'r-b'] }[n] || [];
  } else if (n > 8) pos = [];
  else {
    /* de 4A em diante: um em cada lado antes de emparelhar. O lado que
       recebe um só fica centrado; o que recebe dois se abre. */
    const ordem = ['t', 'r', 'b', 'l'];
    const lado = [], quantos = {};
    for (let i = 0; i < n; i++){
      const L = ordem[i % 4];
      lado.push(L);
      quantos[L] = (quantos[L] || 0) + 1;
    }
    const visto = {};
    pos = lado.map(L => {
      visto[L] = (visto[L] || 0) + 1;
      return quantos[L] === 1 ? L + '-c' : L + (visto[L] === 1 ? '-a' : '-b');
    });
  }
  return `<div class="lw"><span class="lw-sim">${sim}</span>`
       + pos.map(p => `<i class="lw-e ${p}"></i>`).join('') + `</div>`;
}
const LEWIS_VAZIO = `<span class="lw-vazio">escolha uma família<br>e um elemento</span>`;

/* Quantos elétrons faltam (positivo) ou sobram (negativo) para o octeto.
   Até a família 3A é mais curto doar tudo; da 5A em diante, receber.
   Os gases nobres já estão prontos.

   A 4A é o caso de dois caminhos: com quatro elétrons de valência, tanto
   faz ganhar quatro quanto perder os quatro — nos dois casos o átomo
   fica com camada completa (o carbono e o silício fazem covalente
   justamente por isso, mas o estanho e o chumbo perdem mesmo). Então ela
   devolve os dois alvos, e o exercício aceita qualquer um dos dois. */
function alvoLewis(sim, val){
  if (sim === 'He' || val === 8) return [0];
  if (val === 4) return [4, -4];
  return [val <= 3 ? -val : (8 - val)];
}

/* Os alvos de um átomo, lidos do elemento: alvo é o principal e alvo2,
   quando existe, o outro caminho igualmente válido. */
function alvosDe(at){
  const a = [+at.dataset.alvo];
  if (at.dataset.alvo2 !== undefined && at.dataset.alvo2 !== '') a.push(+at.dataset.alvo2);
  return a;
}
/* a distância até o alvo MAIS PERTO: é ela que gradua o tremor */
function faltaPara(at){
  const d = +at.dataset.delta || 0;
  return Math.min(...alvosDe(at).map(a => Math.abs(a - d)));
}
const noAlvo = (at, d) => alvosDe(at).some(a => a === d);

/* A carga do íon, a partir do saldo de elétrons: elétron é carga
   negativa, então ganhar elétron (delta > 0) deixa o átomo negativo.
   Um sozinho não leva número — escreve-se Na⁺, não Na¹⁺. */
function textoCarga(d){
  if (!d) return '';
  const n = Math.abs(d);
  return (n > 1 ? n : '') + (d > 0 ? '−' : '+');
}
