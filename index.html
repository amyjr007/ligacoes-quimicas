    const v = [...new Set(c.at.map(a => a.rede[eixo]))].sort((p, q) => p - q);
    const m = v.length >> 1;
    return (v[m] + v[m - 1]) / 2;
  };
  const corte = [vao(0), vao(1), vao(2)];
  /* E, dentro de cada metade, onde passa o plano que a reparte: são os
     dois últimos golpes, os que fazem os pedaços menores. */
  const subVao = (eixo, sinal) => {
    const v = [...new Set(c.at.filter(a => (a.rede[eixo] > corte[eixo] ? 1 : -1) === sinal)
                              .map(a => a.rede[eixo]))].sort((p, q) => p - q);
    if (v.length < 2) return sinal > 0 ? Infinity : -Infinity;
    const m = v.length >> 1;
    return (v[m] + v[m - 1]) / 2;
  };
  const sub = [0,1,2].map(e => [subVao(e, -1), subVao(e, 1)]);
  c.at.forEach(a => {
    a.fase = rnd() * 6.283;
    a.chao = [ a.rede[0] + (rnd() - .5) * 130,
               piso + rnd() * 46,
               a.rede[2] + (rnd() - .5) * 130 ];
    a.lado = [ a.rede[0] > corte[0] ? 1 : -1,
               a.rede[1] > corte[1] ? 1 : -1,
               a.rede[2] > corte[2] ? 1 : -1 ];
    /* +1 é o quarto de fora da metade, o que se destaca nos dois
       últimos golpes; -1 é o de dentro, que fica onde está */
    a.quarto = [0,1,2].map(e => {
      const s = a.lado[e], corteQ = s > 0 ? sub[e][1] : sub[e][0];
      return (s > 0 ? a.rede[e] > corteQ : a.rede[e] < corteQ) ? 1 : -1;
    });
    /* por onde o íon sai quando a água o arranca: o caminho mais curto
       para fora, que é o raio */
    const L = Math.hypot(a.rede[0], a.rede[1], a.rede[2]);
    a.saida = L > 1 ? [a.rede[0] / L, a.rede[1] / L, a.rede[2] / L] : [0, 1, 0];
    a.qSai = 0;
  });
  poeVezNaAgua(c, rnd);
  return c;
}

function cenaRede(tipo){
  const R = REDES[tipo] || REDES.nacl;
  if (R.forma === 'antifluorita') return poeChao(redeAntifluorita(R));
  if (R.forma === 'camadas')      return poeChao(redeCamadas(R));
  if (R.forma === 'corindo')      return poeChao(redeCorindo(R));
  return poeChao(redeSalgema(R));
}

function redeSalgema(R){
  const n = 7, e = 54;      /* 3x3x3 celulas unitarias */
  const at = [], lig = [], idx = {};
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++)
      for (let k = 0; k < n; k++){
        const par = (i + j + k) % 2 === 0;     /* soma par = ânion, o maior */
        const q = par ? R.anion : R.cation;
        const p = [ (i - (n-1)/2) * e, (j - (n-1)/2) * e, (k - (n-1)/2) * e ];
        idx[`${i},${j},${k}`] = at.length;
        at.push({
          rede: p, pedra: p, atraso: 0, ijk: [i, j, k],
          raio: q.raio, cor: q.cor,
          carga: par ? -1 : 1,                  /* ânion e cátion */
          cel: false                            /* escolhido na hora do arrasto */
        });
      }
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++)
      for (let k = 0; k < n; k++){
        const a = idx[`${i},${j},${k}`];
        [[1,0,0],[0,1,0],[0,0,1]].forEach(([di,dj,dk]) => {
          const b = idx[`${i+di},${j+dj},${k+dk}`];
          if (b !== undefined) lig.push([a, b, 3.4]);
        });
      }
  const ext = (n - 1) * e + 2 * R.anion.raio;
  /* a célula é o bloco 3x3x3 centrado no íon tocado */
  return { at, lig, ext, n, celula: { tam: 3, alinha: 0 } };
}

/* Antifluorita, em passos de um quarto de aresta. Com índices inteiros
   nessa malha:
     os três ímpares .................. cátion (buraco tetraédrico)
     os três pares e (i+j+k)/2 par .... ânion (posição do cubo de faces
                                        centradas)
   Parando um passo antes da borda, sai a proporção exata de 2:1. */
function redeAntifluorita(R){
  const cel = 4, m = 3, N = cel * m;    /* 3x3x3 células, passo = a/4 */
  const h = 31;                          /* aresta da célula = 124 */
  const at = [], lig = [], idx = {};
  const eAnion  = (i,j,k) => i%2===0 && j%2===0 && k%2===0 && ((i+j+k)/2)%2===0;
  const eCation = (i,j,k) => i%2===1 && j%2===1 && k%2===1;
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++)
      for (let k = 0; k < N; k++){
        const an = eAnion(i,j,k), ca = eCation(i,j,k);
        if (!an && !ca) continue;
        const q = an ? R.anion : R.cation;
        const p = [ (i - (N-1)/2) * h, (j - (N-1)/2) * h, (k - (N-1)/2) * h ];
        idx[`${i},${j},${k}`] = at.length;
        at.push({
          rede: p, pedra: p, atraso: 0, ijk: [i, j, k],
          raio: q.raio, cor: q.cor, anion: an,
          carga: an ? -1 : 1,
          cel: false
        });
      }
  /* cada cátion se liga aos quatro ânions do seu tetraedro */
  at.forEach((a, ia) => {
    if (a.anion) return;
    const [i,j,k] = a.ijk;
    [-1,1].forEach(di => [-1,1].forEach(dj => [-1,1].forEach(dk => {
      const b = idx[`${i+di},${j+dj},${k+dk}`];
      if (b !== undefined && at[b].anion) lig.push([ia, b, 3.4]);
    })));
  });
  const ext = (N - 1) * h + 2 * R.anion.raio;
  /* a célula convencional é um cubo de aresta inteira, encaixado na malha */
  return { at, lig, ext, n: N, celula: { tam: cel, alinha: cel } };
}

/* deslocamento da célula unitária ao ser puxada para fora */
const CEL_MAX = 260;
const CEL_ESC = 0.8;      /* fora do retículo ela fica 20% menor */

/* Cada slide tem o seu <canvas>, e um contexto WebGL pertence a UM
   canvas só. Guardamos o contexto e as malhas de cada um: assim trocar
   de slide troca de contexto em vez de continuar desenhando no canvas
   do slide anterior — que era o motivo de o retículo aparecer só no
   primeiro slide em que se entrava. */
const G3POR = new WeakMap();

function iniciaG3(canvas){
  if (!canvas) return false;
  if (G3.gl && G3.canvas === canvas) return true;

  const feito = G3POR.get(canvas);
  if (feito){                              /* já montado antes: só reassume */
    G3.gl = feito.gl; G3.prog = feito.prog;
    G3.esfera = feito.esfera; G3.bastao = feito.bastao;
    G3.esferaP = feito.esferaP; G3.bastaoP = feito.bastaoP;
    G3.canvas = canvas;
    return true;
  }

  const gl = canvas.getContext('webgl', { alpha: true, antialias: true,
                                          premultipliedAlpha: false });
  if (!gl) return false;
  G3.gl = gl;
  G3.canvas = canvas;
  G3.prog = programa(gl, VS, FS);
  if (!G3.prog){ G3.gl = null; G3.canvas = null; return false; }

  const sobe = (m) => {
    const bp = gl.createBuffer(), bn = gl.createBuffer(), bi = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bp);
    gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bn);
    gl.bufferData(gl.ARRAY_BUFFER, m.nor, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bi);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
    return { bp, bn, bi, n: m.n };
  };
  G3.esfera = sobe(malhaEsfera(18, 13));
  G3.bastao = sobe(malhaBastao(10));
  /* No reticulo cada ion mede pouco mais de 30px: malha miuda ali nao
     aparece, e sao mais de mil desenhos por quadro a economizar. */
  G3.esferaP = sobe(malhaEsfera(11, 8));
  G3.bastaoP = sobe(malhaBastao(6));

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  G3POR.set(canvas, { gl, prog: G3.prog,
                      esfera: G3.esfera,  bastao: G3.bastao,
                      esferaP: G3.esferaP, bastaoP: G3.bastaoP });
  return true;
}

function montaCena(modo){
  const c = REDES[modo] ? cenaRede(modo) : cenaPedra();
  G3.atomos = c.at; G3.hastes = c.lig; G3.modo = modo;
  G3.celOff = [0, 0, 0];
  G3.cantos = c.cantos || [];
  G3.celC = [0, 0, 0];
  G3.volta = 0; G3.pulso = 0; G3.drama = 0;
  G3.voo = 0; G3.celQ = null;
  G3.agita = 0; G3.funde = 0; G3.fundeAlvo = 0;
  G3.cliva = 0; G3.clivaAlvo = 0; G3.dissolve = 0;
  G3.ext = c.ext || 0;
  G3.nRede = c.n || 0;
  G3.celula = c.celula || { tam: 3, alinha: 0 };
  G3.dist = REDES[modo] ? 620 : 470;
  G3.dist0 = G3.dist;
}
/* retangulo que a rede inteira ocupa no palco, ja com o raio dos ions */
function caixaRede(){
  if (!G3.atomos.length) return null;
  const c = camG3();
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  G3.atomos.forEach(a => {
    const p = a.rede;
    const prof = [0,1,2].reduce((sm, e) => sm + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
    const r = a.raio * 720 / (2 * Math.max(60, prof) * Math.tan(0.85 / 2));
    const t = paraTela(p);
    if (t.x - r < x0) x0 = t.x - r;
    if (t.x + r > x1) x1 = t.x + r;
    if (t.y - r < y0) y0 = t.y - r;
    if (t.y + r > y1) y1 = t.y + r;
  });
  return { x0, y0, x1, y1 };
}
/* Poe a rede na largura e no ponto pedidos. Estimar nao serve: vista de
   canto, a diagonal projeta mais larga que a aresta, e a perspectiva
   desloca o centro. Entao mede-se o que saiu e corrige-se. */
/* o nome da estrutura, centrado embaixo dela */
function poeRotuloRede(slide){
  const rot = slide && slide.querySelector('.rede-rot');
  if (!rot) return;
  if (!REDES[G3.modo]){ rot.classList.remove('on'); return; }
  const b = caixaRede();
  if (!b) return;
  rot.style.left = ((b.x0 + b.x1) / 2).toFixed(0) + 'px';
  rot.style.top  = (b.y1 + 24).toFixed(0) + 'px';
  rot.classList.add('on');
}

function enquadraRede(cx, cy, larg, alt){
  if (!G3.ext || !G3.atomos.length) return;
  const A = Math.max(40, larg), B = Math.max(40, alt || larg);
  G3.dist = 720 * G3.ext / (2 * A * Math.tan(0.85 / 2));
  for (let i = 0; i < 6; i++){
    let b = caixaRede();
    if (!b) return;
    /* a rede tem que caber nas duas medidas do quadro, nao so na maior */
    const k = Math.max((b.x1 - b.x0) / A, (b.y1 - b.y0) / B);
    if (k > 0.01) G3.dist = Math.max(120, G3.dist * k);
    b = caixaRede();
    G3.px += cx - (b.x0 + b.x1) / 2;
    G3.py += cy - (b.y0 + b.y1) / 2;
  }
  G3.px0 = G3.px; G3.py0 = G3.py; G3.dist0 = G3.dist;
}

const suave = (x) => x * x * (3 - 2 * x);

function desenhaG3(canvas){
  /* laço de um slide que ficou para trás: o contexto já é de outro */
  if (!G3.gl || G3.canvas !== canvas) return;
  const gl = G3.gl;
  if (!gl) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(1280 * dpr), h = Math.round(720 * dpr);
  if (canvas.width !== w){ canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const ce = Math.cos(G3.el), se = Math.sin(G3.el);
  const olho = [ Math.sin(G3.az) * ce * G3.dist, se * G3.dist,
                 Math.cos(G3.az) * ce * G3.dist ];
  const proj = m4perspectiva(0.85, 1280 / 720, 10, 4000);
  /* o rompimento sacode a camera; o tremor nao se acumula porque nao
     encosta em G3.px/py, so no quadro que esta sendo desenhado */
  const tr = G3.drama * 9;
  const tx = G3.px + (Math.random() - .5) * tr;
  const ty = G3.py + (Math.random() - .5) * tr;
  proj[8] = -((tx / 1280) * 2 - 1);
  proj[9] = -(1 - (ty / 720) * 2);
  const view = m4olhar(olho, [0, 0, 0], [0, 1, 0]);

  /* a celula vai para onde o dedo levar; encolhe conforme se afasta,
     para nao ficar do tamanho do reticulo de onde saiu */
  const ag   = (G3.agita || 0) * 6.5;      /* amplitude do tremor, em unidades */
  const fu   = G3.funde || 0;
  /* fundido não cliva: um retículo derretido já não tem planos */
  const cl   = (G3.cliva || 0) * (1 - fu);
  /* Cada plano abre em dois tempos. Primeiro os dois lados DESLIZAM um
     sobre o outro meia distância entre íons — é nesse instante que
     cátion fica de frente para cátion e ânion para ânion. Aí a repulsão
     entre cargas iguais empurra, e só então os lados se AFASTAM. É a
     razão física de o cristal iônico ser quebradiço. */
  const desliza = c => Math.min(1, Math.max(0, c) / 0.45) * 27;
  const afasta  = c => Math.max(0, (c - 0.45) / 0.55) * 35;
  /* Nos dois últimos planos vale a mesma regra, em escala menor: os
     dois quartos deslizam meia distância cada um — 54 no total, de novo
     exatamente um íon — e depois se afastam. Simétrico, e não de um
     lado só: assim nenhum pedaço é atirado para fora da lupa. */
  const deslizaQ = c => Math.min(1, Math.max(0, c) / 0.45) * 27;
  const afastaQ  = c => Math.max(0, (c - 0.45) / 0.55) * 13;
  /* A dissolução não amortece nada: ela é o próprio desmanche. */
  const dis = G3.dissolve || 0;
  const c1 = Math.min(1, cl),     c2 = Math.min(1, cl - 1);
  const c3 = Math.min(1, cl - 2), c4 = Math.min(1, cl - 3);
  const c5 = Math.min(1, cl - 4);
  const off  = G3.celOff;
  const dist = Math.hypot(off[0], off[1], off[2]);
  const enc  = 1 - (1 - CEL_ESC) * Math.min(1, dist / CEL_MAX);
  const cC   = G3.celC;
  const pos = G3.atomos.map(a => {
    const u = Math.max(0, Math.min(1, (G3.t - a.atraso) / (1 - a.atraso)));
    const k = suave(u);
    const p = [ a.pedra[0] + (a.rede[0] - a.pedra[0]) * k,
                a.pedra[1] + (a.rede[1] - a.pedra[1]) * k,
                a.pedra[2] + (a.rede[2] - a.pedra[2]) * k ];
    let q = p;
    /* Desabamento: os alicerces se rompem e cada íon cai para o seu
       ponto no chão. O quadrado do progresso dá a aceleração da queda. */
    if (fu > 0.001 && a.chao){
      const g = fu * fu;
      p[0] += (a.chao[0] - a.rede[0]) * g;
      p[1] += (a.chao[1] - a.rede[1]) * g;
      p[2] += (a.chao[2] - a.rede[2]) * g;
    }
    /* Agitação térmica: cresce com a temperatura, some no frio. */
    if (ag > 0.001){
      const w = G3.t9, ph = a.fase || 0;
      p[0] += Math.sin(w * 9.1 + ph) * ag;
      p[1] += Math.sin(w * 11.3 + ph * 1.7) * ag;
      p[2] += Math.sin(w * 8.4 + ph * 2.3) * ag;
    }
    /* Clivagem: o mesmo golpe que parte a pedra parte o retículo.
       Primeiro plano perpendicular a x, depois a z, depois a y — os
       mesmos três da pedra, na mesma ordem. */
    if (cl > 0.001 && a.lado){
      const L = a.lado, Q = a.quarto || [-1, -1, -1];
      p[0] += L[0] * afasta(c1);   p[1] += L[0] * desliza(c1);
      p[2] += L[2] * afasta(c2);   p[1] += L[2] * desliza(c2);
      p[1] += L[1] * afasta(c3);   p[0] += L[1] * desliza(c3);
      /* os dois planos que repartem cada metade */
      p[0] += L[0] * Q[0] * afastaQ(c4);  p[2] += L[0] * Q[0] * deslizaQ(c4);
      p[2] += L[2] * Q[2] * afastaQ(c5);  p[0] += L[2] * Q[2] * deslizaQ(c5);
    }
    /* Dissolução: quando chega a vez do íon, a água o arranca e ele se
       afasta para dentro do líquido, subindo um pouco enquanto se
       hidrata. O quadrado do progresso dá a partida lenta de quem
       ainda está preso e a saída rápida de quem já se soltou. */
    if (dis > 0.001 && a.limiar !== undefined){
      const q = Math.max(0, Math.min(1, (dis - a.limiar) / 0.16));
      a.qSai = q;
      if (q > 0){
        const e = q * q * 300;
        p[0] += a.saida[0] * e;
        p[1] += a.saida[1] * e + q * 42;
        p[2] += a.saida[2] * e;
      }
    } else if (a.qSai) a.qSai = 0;
    /* o estufado do reencaixe tambem vale com a celula ja no lugar */
    if (a.cel && (dist > 0.5 || G3.pulso > 0.002 || G3.drama > 0.002 || celGirada())){
      const z = enc * (1 + 0.24 * G3.pulso + 0.30 * G3.drama);
      const d = desloCel(p, z);
      q = [ cC[0] + d[0] + off[0],
            cC[1] + d[1] + off[1],
            cC[2] + d[2] + off[2] ];
    } else if (!a.cel && G3.drama > 0.002){
      /* os vizinhos recuam do estouro, mais perto mais forte */
      const v = [ p[0] - cC[0], p[1] - cC[1], p[2] - cC[2] ];
      const L = Math.hypot(v[0], v[1], v[2]) || 1;
      const w = G3.drama * 30 / (1 + L / 90);
      q = [ p[0] + v[0]/L * w, p[1] + v[1]/L * w, p[2] + v[2]/L * w ];
    }
    /* atomo arrancado da celula anda por conta propria */
    if (a.solto && a.off) q = [ q[0] + a.off[0], q[1] + a.off[1], q[2] + a.off[2] ];
    return q;
  });

  gl.useProgram(G3.prog);
  const L = (n) => gl.getUniformLocation(G3.prog, n);
  const uModel = L('uModel'), uCor = L('uCor'), uEsp = L('uEsp');
  const uCarga = L('uCarga');
  /* eixos da câmera: é neles que o sinal se apoia para encarar quem olha */
  const ce2 = Math.cos(G3.el), se2 = Math.sin(G3.el);
  const sa2 = Math.sin(G3.az), ca2 = Math.cos(G3.az);
  gl.uniform3f(L('uDir'), ca2, 0, -sa2);
  gl.uniform3f(L('uCim'), -sa2 * se2, ce2, -ca2 * se2);
  gl.uniformMatrix4fv(L('uProj'), false, proj);
  gl.uniformMatrix4fv(L('uView'), false, view);
  gl.uniform3f(L('uCam'), olho[0], olho[1], olho[2]);
  gl.uniform1f(L('uOpaco'), G3.t);

  const ap = gl.getAttribLocation(G3.prog, 'aPos');
  const an = gl.getAttribLocation(G3.prog, 'aNor');
  const usa = (m) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, m.bp);
    gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.bn);
    gl.enableVertexAttribArray(an); gl.vertexAttribPointer(an, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.bi);
  };

  /* cena com muitos corpos usa a malha leve */
  const ESF = G3.atomos.length > 200 && G3.esferaP ? G3.esferaP : G3.esfera;
  const BAS = G3.atomos.length > 200 && G3.bastaoP ? G3.bastaoP : G3.bastao;

  /* hastes primeiro: as esferas as cobrem nas pontas */
  if (G3.hastes.length){
    usa(BAS);
    gl.uniform3f(uCor, 0.62, 0.66, 0.70);
    gl.uniform1f(uEsp, 0.5);
    gl.uniform1f(uCarga, 0.0);
    G3.hastes.forEach(([i, j, r]) => {
      const a = G3.atomos[i], b = G3.atomos[j];
      if (fu > 0.02) return;                           /* o retículo desabou */
      if (a.solto || b.solto) return;                  /* atomo arrancado */
      /* nenhuma haste atravessa um plano que já se rompeu */
      if (cl > 0.02 && a.lado && b.lado &&
          ((a.lado[0] !== b.lado[0]) ||
           (cl > 1.02 && a.lado[2] !== b.lado[2]) ||
           (cl > 2.02 && a.lado[1] !== b.lado[1]) ||
           (cl > 3.02 && a.quarto[0] !== b.quarto[0]) ||
           (cl > 4.02 && a.quarto[2] !== b.quarto[2]))) return;
      /* íon que a água já levou não segura mais ninguém */
      if ((a.qSai || 0) > 0.02 || (b.qSai || 0) > 0.02) return;
      if (a.cel !== b.cel && (dist > 4 || G3.drama > 0.02)) return;
      gl.uniformMatrix4fv(uModel, false,
        m4haste(pos[i], pos[j], a.cel && b.cel ? r * enc : r));
      gl.drawElements(gl.TRIANGLES, BAS.n, gl.UNSIGNED_SHORT, 0);
    });
  }

  usa(ESF);
  gl.uniform1f(uEsp, 0.85);
  G3.atomos.forEach((a, i) => {
    /* clarao curto ao arrancar e ao reencaixar */
    const fx = a.fx || 0;
    const b = 1 + 2.0 * fx + (a.cel ? 1.2 * G3.pulso + 1.6 * G3.drama : 0);
    gl.uniform3f(uCor, a.cor[0] * b, a.cor[1] * b, a.cor[2] * b);
    gl.uniform1f(uCarga, a.carga || 0);
    const rc = a.cel ? enc * (1 + 0.24 * G3.pulso + 0.30 * G3.drama) : 1;
    gl.uniformMatrix4fv(uModel, false, m4esfera(pos[i], a.raio * rc * (1 + 0.55 * fx)));
    gl.drawElements(gl.TRIANGLES, ESF.n, gl.UNSIGNED_SHORT, 0);
  });

  /* AS MOLÉCULAS DE ÁGUA QUE ARRANCAM OS ÍONS
     Cada uma se encosta no íon pelo lado certo: o oxigênio, que é o polo
     negativo da molécula, vira-se para o cátion; os hidrogênios, que são
     o polo positivo, viram-se para o ânion. É essa atração que vence a
     ligação iônica e tira o íon do retículo — o motivo de o sal se
     dissolver na água.

     Só são desenhadas as que estão na frente do ataque: as que já
     levaram o seu íon saem de cena com ele. */
  if (dis > 0.001){
    const meio = 52.25 * Math.PI / 180;          /* metade dos 104,5° da água */
    const dOH = 19, rO = 12.5, rH = 7.5;
    const branco = [0.95, 0.97, 0.99];
    gl.uniform1f(uCarga, 0);
    let n = 0;
    for (let i = 0; i < G3.atomos.length && n < 120; i++){
      const a = G3.atomos[i];
      if (a.limiar === undefined) continue;
      const q = (dis - a.limiar) / 0.16;
      if (q < -0.6 || q > 0.85) continue;
      n++;
      /* ENTRAM E SAEM EM FADE.
         Antes elas apareciam de um quadro para o outro, já encostadas no
         íon — e o que se via era uma molécula surgindo do nada em cima
         dele. Agora vão ganhando corpo enquanto se aproximam e se
         apagam ao levar o seu íon embora. */
      const op = Math.min(1, (q + 0.6) / 0.4) * Math.min(1, (0.85 - q) / 0.3);
      gl.uniform1f(L('uOpaco'), G3.t * op);
      const p = pos[i], u = a.saida;
      /* um perpendicular estável a u, para abrir o ângulo da molécula */
      const t = Math.abs(u[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
      let v = [ u[1]*t[2] - u[2]*t[1], u[2]*t[0] - u[0]*t[2], u[0]*t[1] - u[1]*t[0] ];
      const Lv = Math.hypot(v[0], v[1], v[2]) || 1;
      v = [v[0]/Lv, v[1]/Lv, v[2]/Lv];
      const cat = (a.carga || 0) > 0;
      /* no cátion é o oxigênio que encosta; no ânion, os hidrogênios */
      const d = a.raio + (cat ? rO + 3 : rO + 17);
      const c = [ p[0] + u[0]*d, p[1] + u[1]*d, p[2] + u[2]*d ];
      const hb = cat ? 1 : -1;                   /* para onde vão os H */
      gl.uniform3f(uCor, CPK.O[0], CPK.O[1], CPK.O[2]);
      gl.uniformMatrix4fv(uModel, false, m4esfera(c, rO));
      gl.drawElements(gl.TRIANGLES, ESF.n, gl.UNSIGNED_SHORT, 0);
      gl.uniform3f(uCor, branco[0], branco[1], branco[2]);
      for (let k = 0; k < 2; k++){
        const co = Math.cos(meio), si = Math.sin(meio) * (k ? -1 : 1);
        gl.uniformMatrix4fv(uModel, false, m4esfera(
          [ c[0] + (u[0]*hb*co + v[0]*si) * dOH,
            c[1] + (u[1]*hb*co + v[1]*si) * dOH,
            c[2] + (u[2]*hb*co + v[2]*si) * dOH ], rH));
        gl.drawElements(gl.TRIANGLES, ESF.n, gl.UNSIGNED_SHORT, 0);
      }
    }
    gl.uniform1f(L('uOpaco'), G3.t);       /* devolve a opacidade da cena */
  }
}

function lacoG3(canvas){
  const passo = () => {
    /* Slide fora de cena não desenha. Sem isto, um retículo que fica
       aberto no slide (como o da lupa) continuava desenhando mais de mil
       chamadas por quadro para sempre, em qualquer slide — era o que
       deixava a apresentação pesada. */
    const sl = canvas.closest('.slide');
    if (sl && !sl.classList.contains('is-active')){ G3.laco = 0; return; }
    G3.t += (G3.alvo - G3.t) * 0.12;
    G3.t9 += 0.016;                          /* relógio do tremor */
    segueLupa();                             /* a cena mora na lupa */
    /* A fusão acompanha a poça na cápsula. Derreter e SOLIDIFICAR, porém,
       não andam no mesmo passo: a rede se desfaz no ritmo do calor, mas
       voltar a ser cristal é mais lento — cada íon tem de achar o lugar
       dele na rede, e é isso que a turma precisa ter tempo de ver. Daí a
       metade da velocidade na volta. */
    const fAlvo = G3.fundeAlvo || 0;
    G3.funde += (fAlvo - G3.funde) * (fAlvo < G3.funde ? 0.0075 : 0.015);
    if (Math.abs(fAlvo - G3.funde) < 0.002) G3.funde = fAlvo;
    /* A clivagem do retículo segue a da pedra no mesmo compasso: 0,10
       por quadro leva ~1s por plano, que é a duração da transição das
       peças de sal na face do cubo. O que se vê na mão e o que se vê na
       lupa acontecem juntos. */
    G3.cliva += ((G3.clivaAlvo || 0) - G3.cliva) * 0.10;
    if (Math.abs((G3.clivaAlvo || 0) - G3.cliva) < 0.002)
      G3.cliva = G3.clivaAlvo || 0;
    /* voo da camera: entra no grao e recua ate o enquadramento, ou o
       contrario na saida */
    if (G3.voo){
      G3.dist += (G3.distAlvo - G3.dist) * 0.14;
      if (Math.abs(G3.distAlvo - G3.dist) < 2){ G3.dist = G3.distAlvo; G3.voo = 0; }
      if (G3.slide) poeRotuloRede(G3.slide);
    }
    /* a celula volta sozinha ao encaixe, e o clarao decai depois */
    if (G3.volta){
      for (let e = 0; e < 3; e++) G3.celOff[e] *= 0.74;
      /* o giro próprio também se desfaz: ela tem que reencaixar alinhada */
      if (G3.celQ){
        G3.celQ = qNorm([ G3.celQ[0] + (1 - G3.celQ[0]) * 0.26,
                          G3.celQ[1] * 0.74, G3.celQ[2] * 0.74, G3.celQ[3] * 0.74 ]);
      }
      if (celFora() < 1.5){
        G3.celOff = [0, 0, 0]; G3.celQ = null; G3.volta = 0; G3.pulso = 1;
      }
    }
    /* atomos a caminho de volta para a celula */
    G3.atomos.forEach(a => {
      if (!a.voltando || !a.off) return;
      for (let e = 0; e < 3; e++) a.off[e] *= 0.72;
      if (Math.hypot(a.off[0], a.off[1], a.off[2]) < 1.5){
        a.off = null; a.solto = false; a.voltando = false; a.fx = 1;
      }
    });
    G3.atomos.forEach(a => { if (a.fx) a.fx = a.fx > 0.004 ? a.fx * 0.88 : 0; });
    G3.pulso = G3.pulso > 0.004 ? G3.pulso * 0.86 : 0;
    G3.drama = G3.drama > 0.004 ? G3.drama * 0.89 : 0;
    desenhaG3(canvas);
    const parado = Math.abs(G3.alvo - G3.t) < 0.002;
    if (parado && G3.alvo === 0){
      G3.t = 0; desenhaG3(canvas); G3.laco = 0; return;
    }
    G3.laco = requestAnimationFrame(passo);
  };
  if (!G3.laco) G3.laco = requestAnimationFrame(passo);
}

/* --- entradas e saídas --- */
function abreRede(it, modo, px, py, largura, altura){
  const slide = it.closest('.slide');
  const cv = slide && slide.querySelector('.q3d');
  if (!cv || !iniciaG3(cv)) return;
  montaCena(modo || 'pedra');
  G3.px = px !== undefined ? px : parseFloat(it.style.left);
  G3.py = py !== undefined ? py : parseFloat(it.style.top);
  G3.px0 = G3.px; G3.py0 = G3.py;
  G3.slide = slide;
  if (REDES[modo] && largura){
    enquadraRede(G3.px, G3.py, largura, altura);
    /* A câmera começa de dentro do cristal e recua até o enquadramento:
       é o fim do mergulho que o grão começou ao crescer na tela.

       Na LUPA não há mergulho nenhum — ela só chega e mostra. O recuo
       ali era um sobressalto: a lente pousava e, no quadro seguinte, o
       retículo dava um salto de dentro para fora sem que nada o tivesse
       levado para dentro. Ela já nasce enquadrada. */
    if (it.dataset.lupa){
      G3.distAlvo = G3.dist;
      G3.voo = 0;
    } else {
      G3.distAlvo = G3.dist;
      G3.dist = Math.max(60, G3.dist * 0.16);
      G3.voo = 1;
    }
  }
  const q = slide.querySelector('.quantum');
  if (q){
    q.style.setProperty('--qox', G3.px + 'px');
    q.style.setProperty('--qoy', G3.py + 'px');
  }
  slide.classList.add('quantum-on');
  poeRotuloRede(slide);
  slide.classList.toggle('rede-on', !!REDES[modo]);
  /* O nome do composto, da legenda da imagem, vai a dois lugares: ao
     quadro branco, para quem for escrever ali, e ao ALTO DO MUNDO
     QUÂNTICO, onde fica à vista o tempo todo. Submerso no retículo, é
     essa palavra que diz de que substância é o cristal em volta. */
  /* A legenda é a DAQUELE composto: quem manda é o retículo que está
     sendo aberto, e não a primeira imagem que o slide tiver. Sem isto,
     no slide dos cinco todos os mergulhos se anunciavam como Cloreto
     de Sódio, no alto do mundo quântico e no quadro branco. */
  const dono = [...slide.querySelectorAll('.reveal-item.fixo')]
                 .find(f => f.dataset.rede === modo)
             || slide.querySelector('.reveal-item.fixo');
  const cap = dono && dono.querySelector('.cap');
  const nome = (REDES[modo] && cap) ? cap.textContent.trim() : '';
  const tit = slide.querySelector('.qb-tit');
  if (tit) tit.textContent = nome;
  poeTitulos(q, [[nome, 640, 62, 'composto']]);
  G3.alvo = 1;
  lacoG3(cv);
}
/* Sair do retículo pelo botão Voltar: a câmera volta a mergulhar no
   cristal enquanto o mundo quântico se apaga, e o grão encolhe de volta
   ao tamanho que tinha. É o inverso exato da entrada. */
function saiDaRede(slide){
  if (!slide) return;
  const caco = slide.querySelector('.caco');
  /* Com grão, a saída encena o mergulho ao contrário, e quem conduz tudo
     — o recuo da câmera dentro do retículo, o chiado e o fechamento — é
     cameraVolta. Sem grão (não se entrou por ali), fecha direto. */
  if (caco){ cameraVolta(slide, caco, noPalco(caco)); return; }
  if (REDES[G3.modo]){
    G3.distAlvo = Math.max(60, G3.dist * 0.16);
    G3.voo = 1;
  }
  fechaRede(slide);
}

function fechaRede(it){
  const slide = it.closest ? it.closest('.slide') : it;
  if (!slide) return;
  slide.classList.remove('quantum-on', 'rede-on', 'rede-livre');
  /* a lente vai embora e leva com ela a medida e o giro em curso: sem
     isto, reabrir no meio de uma virada retomaria o recorte estreito */
  G3.lupa = null; G3.lupaCv = null; G3.lupaClip = '';
  G3.lupaG = null; G3.giro = 0; G3.lupaPara = 0;
  const rot = slide.querySelector('.cel-rot');
  if (rot) rot.classList.remove('on');
  const rr = slide.querySelector('.rede-rot');
  if (rr) rr.classList.remove('on');
  G3.slide = null;
  /* quem estiver mergulhando termina de voltar sozinho, pela animação */
  slide.querySelectorAll('.caco:not(.volta-grao)')
       .forEach(c => { c.classList.remove('mergulha'); c.style.opacity = ''; });
  G3.alvo = 0; G3.celOff = [0, 0, 0]; G3.volta = 0; G3.pulso = 0;
  G3.drama = 0; G3.celQ = null;
  const cv = slide.querySelector('.q3d');
  if (cv && iniciaG3(cv)) lacoG3(cv);
}
function orbitaG3(dx, dy){
  G3.az -= dx * 0.006;
  G3.el = Math.max(-1.45, Math.min(1.45, G3.el + dy * 0.006));
}
/* posicao da camera e seus eixos, do jeito que desenhaG3 os monta */
function camG3(){
  const ce = Math.cos(G3.el), se = Math.sin(G3.el);
  const sa = Math.sin(G3.az), ca = Math.cos(G3.az);
  return {
    olho: [ sa * ce * G3.dist, se * G3.dist, ca * ce * G3.dist ],
    dir:  [ ca, 0, -sa ],                     /* direita da camera */
    cim:  [ -sa * se, ce, -ca * se ]          /* cima da camera */
  };
}
/* onde um ponto do mundo cai no palco de 1280x720 */
function paraTela(p){
  const c = camG3();
  const proj = m4perspectiva(0.85, 1280 / 720, 10, 4000);
  proj[8] = -((G3.px / 1280) * 2 - 1);
  proj[9] = -(1 - (G3.py / 720) * 2);
  const view = m4olhar(c.olho, [0, 0, 0], [0, 1, 0]);
  const mul = (M, v) => [0,1,2,3].map(r =>
    M[r]*v[0] + M[4+r]*v[1] + M[8+r]*v[2] + M[12+r]*v[3]);
  const q = mul(proj, mul(view, [p[0], p[1], p[2], 1]));
  const w = q[3] || 1;
  return { x: (q[0]/w * 0.5 + 0.5) * 1280, y: (1 - (q[1]/w * 0.5 + 0.5)) * 720 };
}
/* A célula tem giro próprio, separado do da rede. Guardado como quatérnio
   para poder somar giros em qualquer ordem e voltar suavemente ao zero
   quando ela se reencaixa. */
function qEixo(u, a){
  const s = Math.sin(a / 2);
  return [Math.cos(a / 2), u[0] * s, u[1] * s, u[2] * s];
}
function qMul(a, b){
  return [ a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
           a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
           a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
           a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0] ];
}
function qNorm(q){
  const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  return [q[0]/n, q[1]/n, q[2]/n, q[3]/n];
}
function qMat(q){
  const w = q[0], x = q[1], y = q[2], z = q[3];
  return [ 1-2*(y*y+z*z), 2*(x*y-w*z),   2*(x*z+w*y),
           2*(x*y+w*z),   1-2*(x*x+z*z), 2*(y*z-w*x),
           2*(x*z-w*y),   2*(y*z+w*x),   1-2*(x*x+y*y) ];
}
function ap3(M, v){
  return [ M[0]*v[0] + M[1]*v[1] + M[2]*v[2],
           M[3]*v[0] + M[4]*v[1] + M[5]*v[2],
           M[6]*v[0] + M[7]*v[1] + M[8]*v[2] ];
}
const Q0 = [1, 0, 0, 0];
function celGirada(){ return G3.celQ && G3.celQ[0] < 0.99999; }
/* de onde o íon da célula sai depois de encolher e girar */
function desloCel(p, enc){
  const cC = G3.celC;
  let d = [0,1,2].map(e => (p[e] - cC[e]) * enc);
  if (celGirada()) d = ap3(qMat(G3.celQ), d);
  return d;
}
/* arrastar em cima da célula solta gira só ela */
function giraCelula(dx, dy){
  const c = camG3();
  const q = qMul(qEixo(c.dir, dy * 0.008),
                 qEixo(c.cim, dx * 0.008));
  G3.celQ = qNorm(qMul(q, G3.celQ || Q0));
}

/* quanto a celula esta encolhida agora */
function encAtual(){
  return 1 - (1 - CEL_ESC) * Math.min(1, celFora() / CEL_MAX);
}
/* onde um atomo esta no mundo neste instante */
function mundoDoAtomo(a){
  const enc = encAtual();
  let q = a.rede.slice();
  if (a.cel){
    const d = desloCel(a.rede, enc);
    q = [0,1,2].map(e => G3.celC[e] + d[e] + G3.celOff[e]);
  }
  if (a.solto && a.off) q = [0,1,2].map(e => q[e] + a.off[e]);
  return q;
}
/* qual atomo esta embaixo do dedo; entre os que servem, o da frente */
function atomoNoPonto(x, y, filtro, folga){
  const c = camG3();
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  const enc = encAtual();
  let melhor = null, dmin = Infinity;
  G3.atomos.forEach(a => {
    if (filtro && !filtro(a)) return;
    const p = mundoDoAtomo(a);
    const prof = [0,1,2].reduce((sm, e) => sm + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
    if (prof < 60) return;
    const t = paraTela(p);
    const r = a.raio * (a.cel ? enc : 1) * 720 / (2 * prof * Math.tan(0.85 / 2))
            * (folga || 1);
    if (Math.hypot(t.x - x, t.y - y) > r) return;
    if (prof < dmin){ dmin = prof; melhor = a; }
  });
  return melhor;
}
/* Marca como celula o bloco 3x3x3 centrado no atomo que o dedo tocou:
   assim qualquer celula do reticulo pode ser arrancada, nao so a da frente. */
function celulaNoPonto(x, y){
  const a = atomoNoPonto(x, y);
  if (!a || !a.ijk) return false;
  const C = G3.celula || { tam: 3, alinha: 0 };
  const tri = v => Array.isArray(v) ? v : [v, v, v];
  const T = tri(C.tam), A = tri(C.alinha);
  const N = tri(G3.nRede || Math.round(Math.cbrt(G3.atomos.length)));
  /* eixo com "alinha": a célula encaixa na malha (antifluorita, lamelas).
     eixo sem: o bloco fica centrado no íon que o dedo tocou (sal-gema). */
  const o = a.ijk.map((v, e) => A[e]
    ? Math.max(0, Math.min(N[e] - T[e], Math.floor(v / A[e]) * A[e]))
    : Math.max(0, Math.min(N[e] - T[e], v - Math.floor(T[e] / 2))));
  G3.atomos.forEach(b => {
    b.cel = !!(b.ijk && b.ijk.every((v, e) => v >= o[e] && v < o[e] + T[e]));
  });
  const dc = G3.atomos.filter(b => b.cel);
  G3.celC = [0,1,2].map(e => dc.reduce((sm, b) => sm + b.rede[e], 0) / dc.length);
  return true;
}
/* arranca a celula da rede: as hastes rompem e a cena sacode */
function quebraCelula(){
  G3.celOff = [0, 0, 0];
  G3.volta = 0; G3.pulso = 0;
  G3.drama = 1;
}
/* arranca um atomo da celula */
function arrancaAtomo(a){
  a.solto = true; a.voltando = false; a.off = [0, 0, 0]; a.fx = 1;
  if (G3.drama < 0.55) G3.drama = 0.55;
}
/* devolve o atomo ao lugar dele na celula */
function devolveAtomo(a){ a.voltando = true; a.fx = 1; }
/* leva um atomo solto para onde o dedo for */
function moveAtomo(a, dx, dy){
  if (!a) return;
  if (!a.off) a.off = [0, 0, 0];
  const k = fitScale || 1;
  const c = camG3();
  const p = mundoDoAtomo(a);
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  const prof = [0,1,2].reduce((sm, e) => sm + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
  const ppw = 2 * Math.max(60, prof) * Math.tan(0.85 / 2) / 720;
  const ex = (dx / k) * ppw, ey = -(dy / k) * ppw;
  for (let e = 0; e < 3; e++) a.off[e] += c.dir[e] * ex + c.cim[e] * ey;
}
/* tudo de volta ao lugar dentro do reticulo */
function reiniciaRede(slide){
  G3.celOff = [0, 0, 0];
  G3.volta = 0; G3.pulso = 0; G3.drama = 0; G3.celQ = null;
  G3.atomos.forEach(a => {
    a.cel = false; a.solto = false; a.voltando = false; a.off = null; a.fx = 0;
  });
  G3.az = -0.42; G3.el = 0.28;
  G3.dist = G3.dist0 !== undefined ? G3.dist0 : 470;
  if (G3.px0 !== undefined){ G3.px = G3.px0; G3.py = G3.py0; }
  const rot = slide && slide.querySelector('.cel-rot');
  if (rot) rot.classList.remove('on');
  poeRotuloRede(slide);
}
/* A celula segue o dedo, sem direcao nem curso fixos: o arrasto na tela
   vira deslocamento nos eixos da camera, entao ela anda onde se leva. */
function puxaCelula(dx, dy){
  const k = fitScale || 1;
  const c = camG3();
  /* Quanto de mundo cabe num px do palco. Tem que ser medido na
     profundidade da propria celula, nao na do centro do reticulo: ela
     esta na frente, projeta maior, e usaria escala errada. */
  const p = [0,1,2].map(e => G3.celC[e] + G3.celOff[e]);
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  const prof = [0,1,2].reduce((s, e) => s + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
  const ppw = 2 * Math.max(60, prof) * Math.tan(0.85 / 2) / 720;
  const ex = (dx / k) * ppw, ey = -(dy / k) * ppw;
  for (let e = 0; e < 3; e++) G3.celOff[e] += c.dir[e] * ex + c.cim[e] * ey;
}
function celFora(){ return Math.hypot(G3.celOff[0], G3.celOff[1], G3.celOff[2]); }
const ENCAIXE = 70;        /* perto assim, ela se encaixa de volta na rede */

/* arrasta o reticulo inteiro: desloca o ponto do palco em que a cena e vista */
function moveRede(dx, dy){ G3.px += dx; G3.py += dy; }

/* ------------------------------------------------------------
   REVELAÇÃO, ARRASTE E PINÇA
   clique no "?" .......: solta o próximo elemento
   clique depois do último: recolhe tudo e volta ao início
   arrastar ............: mouse, caneta ou dedo
   pinça (2 dedos) .....: aumenta ou diminui — no computador, Ctrl + roda
   ------------------------------------------------------------ */
const K_MIN = .35, K_MAX = 4;
const QM_BIG = 5;                          /* o toque na molécula leva a 500% */
/* o que se arrasta e se redimensiona: os elementos do slide e,
   dentro do mundo quântico, as próprias moléculas */
/* a ordem não importa: closest() devolve o mais próximo que casar.
   Num átomo de ponta casa o próprio átomo; no central, casa a molécula. */
const PEGAVEL = '.reveal-item, .qm, .q-board.on, .qat.end, .qmol,'
              + ' .cam.solta, .cam.valencia, .caco';

/* ============================================================
   SEPARAR OS ÁTOMOS DA MOLÉCULA AMPLIADA
   Ampliada a 500%, a molécula ganha um gesto que as pequenas não
   têm: dá para puxar um átomo para fora do outro. O bastão se
   parte, os dois ficam instáveis e cada um mostra os elétrons de
   valência que tem. O desemparelhado de um fica em cima, o do
   outro embaixo — é assim que eles se procuram: aproximando os
   dois átomos pela vertical, os dois elétrons se encontram, viram
   par, e a ligação se refaz.

   É a ligação covalente feita com a mão: o par compartilhado deixa
   de ser uma frase e passa a ser a coisa que fecha o octeto dos
   dois ao mesmo tempo.
   ============================================================ */
const SEP_W = 52 * QM_BIG, SEP_H = 41 * QM_BIG;   /* a caixa, em px, a 500% */
/* As esferas saem 20% menores do que a conta do desenho daria. Cheias,
   elas tomavam a caixa inteira e os elétrons ficavam espremidos contra a
   borda — e é dos elétrons que esta cena trata. */
const SEP_BOLA = .8;
const SEP_E_DIST = 17;      /* o elétron orbita a esta distância da esfera */
const SEP_PAR    = 15;      /* meia abertura de um par, em graus */
/* A LIGAÇÃO DUPLA.
   O oxigênio tem dois elétrons desemparelhados, não um, e por isso ele
   forma DOIS pares com o vizinho. Os dois solteiros saem mais abertos
   que os de um par (SEP_DUPLA), para não se lerem como um par já feito;
   já emparelhados, cada par fecha bem apertado (SEP_PAR2) e os dois se
   afastam SEP_VAO2 do eixo, um para cada lado — que é o desenho de uma
   ligação dupla: dois pares, e não um par gordo. */
const SEP_DUPLA  = 30;      /* meia abertura entre os dois solteiros */
const SEP_PAR2   = 9;       /* meia abertura DENTRO de cada par da dupla */
const SEP_VAO2   = 26;      /* o quanto cada par se afasta do eixo, em px */
/* A LIGAÇÃO TRIPLA.
   O nitrogênio tem TRÊS desemparelhados e um par isolado só — cinco de
   valência, família 5A. Os três solteiros abrem bem (SEP_TRIPLA), e ao
   fechar viram três pares: um em cima, um no eixo e um embaixo. Como
   agora são três a caber no mesmo vão, cada par fecha ainda mais
   apertado que os da dupla e o afastamento entre eles cresce. */
const SEP_TRIPLA = 38;      /* meia abertura entre os solteiros de fora */
const SEP_PAR3   = 5;       /* meia abertura DENTRO de cada par da tripla */
const SEP_VAO3   = 36;      /* o afastamento dos pares de fora, em px */

/* Simples, dupla e tripla passam pela mesma máquina: muda só o quanto os
   solteiros se abrem, o quanto cada par fecha, e o quanto os pares se
   afastam do eixo. Uma ligação de ordem maior é sempre MAIS CURTA, e sai
   curta por si: os solteiros dela saem mais abertos, então os núcleos
   têm de chegar mais perto para que eles se cruzem no meio. */
function medidasLig(ordem){
  if (ordem >= 3)  return { abre: SEP_TRIPLA, par: SEP_PAR3, vao: SEP_VAO3 };
  if (ordem === 2) return { abre: SEP_DUPLA,  par: SEP_PAR2, vao: SEP_VAO2 };
  return { abre: SEP_PAR, par: SEP_PAR, vao: 0 };
}

/* Onde cada par compartilhado mora, medido do eixo para fora: um só no
   eixo na simples, dois lados na dupla, e na tripla os dois lados mais o
   eixo. É desta lista que saem os bastões — um por par. */
function vaosLig(ordem){
  const m = medidasLig(ordem);
  if (ordem >= 3)  return [-m.vao, 0, m.vao];
  if (ordem === 2) return [-m.vao, m.vao];
  return [0];
}
const SEP_PUXAO  = 34;      /* puxão que rompe a ligação */
/* Perto assim, os dois elétrons se emparelham. Com o desvio lateral de
   SEP_PAR eles nunca chegam a se tocar — passam a se cruzar lado a lado,
   e o mais perto que ficam é a largura de um par (uns 32px). Por isso o
   limite é maior do que a distância que os separa quando emparelham. */
const SEP_ENCAIXE = 42;
const SEP_SOLTA  = 210;     /* o quanto o átomo pode andar fora da caixa */

/* quantos elétrons de valência tem cada elemento, lido da própria
   tabela de famílias que o slide 8 usa */
const VAL_SEP = {};
TP.forEach(c => c.el.forEach(s => { if (s) VAL_SEP[s] = c.val; }));

/* Onde cada átomo fica dentro da caixa ampliada. Repete a conta do
   MOL_SVG: o desenho encaixa pela largura e é centrado na vertical, e
   por isso as duas imagens — a do SVG e a desta camada — coincidem. */
function sepGeo(key){
  const g = MOLGEO[key] || MOLGEO.h2o;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  g.forEach(([, x, y, r]) => {
    x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r);
    y0 = Math.min(y0, y - r); y1 = Math.max(y1, y + r);
  });
  const vx = x0 - 1, vy = y0 - 1, W = x1 - x0 + 2, H = y1 - y0 + 2;
  const f = SEP_W / W;                     /* encaixa pela largura */
  const dy = (SEP_H - H * f) / 2;          /* a sobra vai metade para cada lado */
  /* f sai junto: a espessura do bastão tem de seguir a escala do
     desenho, e não a das esferas, que ainda levam o SEP_BOLA */
  return { f, ats: g.map(([el, x, y, r]) => ({
    el, r: r * f * SEP_BOLA, x: (x - vx) * f, y: dy + (y - vy) * f
  })) };
}

/* Os elétrons de um átomo, em quatro lados de 90 em 90. `base` é o lado
   do desemparelhado, e os pares ocupam os outros três na sequência.
   Como base é sempre a direção do átomo vizinho, o elétron solteiro de
   um fica de frente para o do outro em qualquer posição em que os dois
   estejam — e é isso que faz o encaixe ser possível por qualquer lado. */
/* ONDE OS SOLTEIROS DE UMA LIGAÇÃO FICAM, pela ordem dela.
   Simples: um só, desviado SEP_PAR do eixo — o desvio que faz os dois se
   cruzarem lado a lado em vez de se atropelarem de frente.
   Dupla: dois, mais abertos, um acima e outro abaixo.
   Tripla: três; os de fora bem abertos e o do meio com o desvio mínimo,
   porque em cima do eixo ele bateria de frente com o do vizinho.
   O campo "lado" diz de qual par o elétron é, e é por ele que a conta do
   meio acha o lugar de cada um.

   Vale para os pares de iguais e para os braços de um centro: a regra é
   da LIGAÇÃO, não do formato da molécula, e por isso mora num lugar só. */
function solteirosDe(base, ordem){
  if ((ordem || 1) >= 3) return [{ a: base - SEP_TRIPLA, lado: -1 },
                                 { a: base - SEP_PAR3,   lado:  0 },
                                 { a: base + SEP_TRIPLA, lado:  1 }];
  if (ordem === 2)       return [{ a: base - SEP_DUPLA, lado: -1 },
                                 { a: base + SEP_DUPLA, lado:  1 }];
  return [{ a: base - SEP_PAR, lado: 0 }];
}

function sepEletrons(n, base, ordem){
  /* O solteiro não fica em cima do eixo: sai SEP_PAR para o lado, o
     mesmo desvio com que um par isolado se abre. Como os dois átomos
     olham em direções opostas, o mesmo desvio para o mesmo lado põe um
     ACIMA da linha da ligação e o outro ABAIXO — e aí, aproximando-se,
     eles não se atropelam de frente: encaixam lado a lado, como um par
     de verdade.

     Na ligação dupla são DOIS solteiros, um acima e outro abaixo do
     eixo. O mesmo espelho vale para eles: o de cima de um átomo procura
     o de cima do outro, e o de baixo procura o de baixo. Saem dois
     pares, que é o que uma dupla é. O campo lado diz de qual deles o
     elétron é, e serve para orientaEletrons achar o meio certo. */
  const e = solteirosDe(base, ordem).map(x => ({ a: x.a, so: true, lado: x.lado }));
  const nso = e.length;
  /* Onde ficam os pares isolados. Com dois solteiros de frente para o
     vizinho eles vão em cima e embaixo — a estrutura de Lewis do O2. Com
     três, o único par que sobra vai ATRÁS, que é como se escreve o N2:
     :N≡N:. Com um só solteiro, a volta inteira, como no cloro. */
  const lados = nso === 3 ? [180, 90, 270]
              : nso === 2 ? [90, 270, 180]
              : [90, 180, 270];
  let resto = n - nso, i = 0;
  while (resto > 0 && i < lados.length){
    const lado = base + lados[i];
    if (resto >= 2){ e.push({ a: lado - SEP_PAR }, { a: lado + SEP_PAR }); resto -= 2; }
    else { e.push({ a: lado }); resto -= 1; }
    i++;
  }
  return e;
}

/* Vira os elétrons dos dois átomos um para o outro. Chamada a cada
   movimento: o solteiro de cada um aponta sempre para o vizinho, e os
   pares isolados o acompanham nos outros três lados.

   Com a molécula montada, o solteiro deixa de orbitar a uma distância
   fixa e vai para o MEIO EXATO entre os dois núcleos, ainda com o seu
   desvio para cima ou para baixo. Os dois caem lado a lado no centro,
   com o mesmo vão de um par isolado: é o par compartilhado desenhado
   como par — e é ele, e não uma vareta, que segura a molécula. */
function orientaEletrons(sp){
  if (sp.classList.contains('ramos')) return orientaRamos(sp);
  const [a, b] = [...sp.querySelectorAll('.qsp-at')];
  if (!a || !b) return;
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));
  const dx = le(b, '--x') - le(a, '--x'), dy = le(b, '--y') - le(a, '--y');
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  /* montada — seja a que veio pronta, seja a que o aluno acabou de
     fechar — o solteiro vai ao meio; solta, ele volta à órbita */
  const montada = !sp.classList.contains('solto');
  const meio = Math.hypot(dx, dy) / 2;
  const ordem = +sp.dataset.ordem || 1;
  /* A conta do meio é feita no eixo da ligação: u corre de um núcleo
     ao outro e v atravessa. Cada elétron compartilhado tem um ponto de
     chegada (meio de u, tanto de v), e daí saem o ângulo e a distância
     que o CSS pede. O sinal de v é o que espelha um átomo no outro: os
     dois de um par chegam lado a lado, sem se atropelar. */
  [[a, ang, -1, meio], [b, ang + 180, 1, -meio]].forEach(([at, base, sinal, uu]) => {
    const es = [...at.querySelectorAll('.qsp-e')];
    const orb = +at.dataset.de || 0;        /* a órbita normal deste átomo */
    sepEletrons(es.length, base, ordem).forEach((novo, i) => {
      const el = es[i];
      if (!el) return;
      if (novo.so && montada){
        /* meio vão de um par: quanto mais pares houver para caber no
           mesmo lugar, mais apertado cada um fecha */
        const M = medidasLig(ordem);
        const vao = orb * Math.sin(M.par * Math.PI / 180);
        /* Na dupla o par sobe ou desce SEP_VAO2 conforme o lado dele —
           e o lado se espelha de um átomo para o outro, como o vão do
           par: os dois se olham, e o que está em cima para um está
           embaixo para o outro. É assim que cada solteiro vai encontrar
           exatamente aquele que ele já vinha procurando. */
        const v = sinal * (vao - (novo.lado || 0) * M.vao);
        el.style.setProperty('--d', Math.hypot(uu, v).toFixed(1) + 'px');
        el.style.setProperty('--a',
          (ang + Math.atan2(v, uu) * 180 / Math.PI).toFixed(1) + 'deg');
      } else {
        if (novo.so && orb) el.style.setProperty('--d', orb.toFixed(1) + 'px');
        el.style.setProperty('--a', novo.a.toFixed(1) + 'deg');
      }
    });
  });
}

/* ============================================================
   MOLÉCULA DE BRAÇOS
   Cl2, O2 e N2 são pares de iguais: dois átomos, uma ligação, e
   afastar um do outro dá no mesmo que afastar o outro do um. A água
   não é assim. É um oxigênio no meio com dois hidrogênios pendurados,
   cada um preso por uma ligação SUA — arrancar um não desfaz o outro,
   e é justamente essa a diferença que ela vem mostrar.

   Por isso ela tem o seu próprio caminho aqui: o centro fica onde
   está e são os braços que se soltam, um a um. Todo o resto — os
   elétrons, os bastões de vidro, o anel do octeto, o estilhaço da
   ruptura — é o mesmo dos outros e sai das mesmas funções.
   ============================================================ */

/* Onde cada braço mora quando está ligado. Não é a distância do
   desenho: é aquela em que o solteiro do centro e o do braço caem lado
   a lado formando o par — a mesma conta dos pares de iguais. A DIREÇÃO
   vem do desenho, e é ela que guarda o ângulo de 104,5° da água. */
function ramosDe(key){
  const ic = centroDe(key);
  const g = sepGeo(key);
  const c = g.ats[ic];
  if (!c) return null;
  const orbC = c.r + SEP_E_DIST;
  /* Um braço por VIZINHO, e não por traço: a ligação dupla declara dois
     traços para o mesmo par de átomos, e eles são a mesma ligação — o que
     se conta neles é a ORDEM dela. */
  const porVizinho = new Map();
  (MOLBOND[key] || []).forEach(([i, j, w]) => {
    const ip = i === ic ? j : i;
    if (!g.ats[ip]) return;
    const r = porVizinho.get(ip);
    if (r){ r.ordem++; return; }
    porVizinho.set(ip, { i: ip, at: g.ats[ip], w, ordem: 1 });
  });
  const ramos = [...porVizinho.values()];
  if (!ramos.length) return null;
  ramos.forEach(r => {
    r.orb = r.at.r + SEP_E_DIST;
    const M = medidasLig(r.ordem);
    r.d   = (orbC + r.orb) * Math.cos(M.abre * Math.PI / 180);
    /* Na dupla e na tripla os pares se afastam do eixo. O afastamento é
       uma fração do COMPRIMENTO da ligação, e não um número fixo em px:
       assim a mesma conta serve à molécula pequena e à grande — e num
       centro com braços os tamanhos variam bem mais do que num par de
       iguais, onde o número fixo bastava. */
    r.vao = r.ordem > 1 ? r.d * 0.24 : 0;
    r.ang = Math.atan2(r.at.y - c.y, r.at.x - c.x);
    r.hx  = c.x + Math.cos(r.ang) * r.d;
    r.hy  = c.y + Math.sin(r.ang) * r.d;
  });
  return { ic, c, orbC, ramos, f: g.f };
}

/* Os elétrons do centro: um solteiro apontando para cada braço, e o que
   sobra em pares isolados do lado de lá. Na água dá os dois solteiros
   para baixo, um por hidrogênio, e dois pares isolados em cima — que é
   o desenho de Lewis dela, e a razão de ela ser entortada. */
function eletronsCentro(el, ramos){
  const n = VAL_SEP[el] || 0;
  /* um solteiro por PAR compartilhado: o carbono do gás carbônico entra
     com quatro, dois para cada oxigênio, e não lhe sobra par isolado
     nenhum — que é por isso que a molécula dele sai reta */
  const es = [];
  ramos.forEach((r, k) => solteirosDe(r.ang * 180 / Math.PI, r.ordem)
    .forEach(e => es.push({ a: e.a, so: true, ramo: k, lado: e.lado })));
  /* a direção média dos braços; as costas do átomo são o lado oposto */
  const mx = ramos.reduce((t, r) => t + Math.cos(r.ang), 0);
  const my = ramos.reduce((t, r) => t + Math.sin(r.ang), 0);
  const costas = Math.atan2(my, mx) * 180 / Math.PI + 180;
  const lados = [costas - 34, costas + 34, costas + 90, costas - 90];
  let resto = n - es.length, i = 0;
  while (resto > 0 && i < lados.length){
    if (resto >= 2){ es.push({ a: lados[i] - SEP_PAR }, { a: lados[i] + SEP_PAR }); resto -= 2; }
    else { es.push({ a: lados[i] }); resto -= 1; }
    i++;
  }
  return es;
}

/* Os elétrons de um braço: o solteiro de frente para o centro e, se
   sobrar algum, pares isolados nos outros lados. O hidrogênio tem um
   só — e o octeto dele são dois, que é a regra do dueto. */
function eletronsRamo(el, ang, ordem){
  const n = VAL_SEP[el] || 0;
  const base = ang * 180 / Math.PI + 180;
  const es = solteirosDe(base, ordem)
    .map(e => ({ a: e.a, so: true, ramo: 0, lado: e.lado }));
  /* Onde ficam os pares isolados do braço, pela ordem da ligação. Com
     TRÊS solteiros de frente para o centro, o único par que sobra vai
     ATRÁS — é como se escreve o nitrogênio do HCN: H–C≡N com o par nas
     costas dele. Com dois, eles vão em cima e embaixo, como no oxigênio
     do gás carbônico. Com um, a volta inteira, como no cloro.
     A mesma escolha que sepEletrons faz nos pares de iguais. */
  const lados = (ordem || 1) >= 3 ? [180, 90, 270]
              : (ordem || 1) === 2 ? [90, 270, 180]
              : [90, 180, 270];
  let resto = n - es.length, i = 0;
  while (resto > 0 && i < lados.length){
    const lado = base + lados[i];
    if (resto >= 2){ es.push({ a: lado - SEP_PAR }, { a: lado + SEP_PAR }); resto -= 2; }
    else { es.push({ a: lado }); resto -= 1; }
    i++;
  }
  return es;
}

const eHTML = (e, d) =>
  `<s class="qsp-e${e.so ? ' so' : ''}"${e.so ? ` data-so="1" data-ramo="${e.ramo}"` : ''}`
  + ` style="--a:${e.a.toFixed(1)}deg;--d:${d.toFixed(1)}px"></s>`;

function montaRamos(qm, key){
  const R = ramosDe(key);
  if (!R) return false;
  const g = sepGeo(key);
  const elC = R.c.el;

  /* O ANEL DO OCTETO, aqui.
     Alcança o elétron mais longe que aquele átomo conta como seu: os
     pares isolados, na órbita; e os compartilhados, que moram no meio de
     cada ligação — e na dupla ainda afastados do eixo. */
  const anelC = Math.max(R.orbC, ...R.ramos.map(r =>
    Math.hypot(r.d / 2, r.vao + Math.min(R.orbC, r.orb)
      * Math.sin(medidasLig(r.ordem).par * Math.PI / 180)))) + 6.5 + 7;
  /* Quantos elétrons o anel do centro cerca: os dele mais um por par
     compartilhado de cada braço. No carbono do CO2 dá 4 + 2 + 2 = 8. */
  const dentroC = (VAL_SEP[elC] || 0) + R.ramos.reduce((t, r) => t + r.ordem, 0);

  const centro = `<i class="qsp-at centro" data-i="${R.ic}"`
    + ` data-de="${R.orbC.toFixed(1)}" data-oito="${dentroC}"`
    + ` style="--x:${R.c.x.toFixed(1)}px;--y:${R.c.y.toFixed(1)}px;`
    + `--oct:${anelC.toFixed(1)}px;--r:${R.c.r.toFixed(1)}px">`
    + `<b class="qsp-bola" style="--bg:${sphereBg(EL_COLOR[elC])}"></b>`
    + eletronsCentro(elC, R.ramos).map(e => eHTML(e, R.orbC)).join('')
    + `<u class="qsp-oito">${dentroC} elétron${dentroC === 1 ? '' : 's'}</u>`
    + `</i>`;

  const bracos = R.ramos.map((r, k) => {
    const el = r.at.el;
    const gap = Math.min(R.orbC, r.orb)
      * Math.sin(medidasLig(r.ordem).par * Math.PI / 180);
    const anel = Math.max(r.orb, Math.hypot(r.d / 2, r.vao + gap)) + 6.5 + 7;
    /* os do átomo mais um por par que ele divide com o centro */
    const tot = (VAL_SEP[el] || 0) + r.ordem;
    /* de que lado do centro este braço está: é para o lado de fora que
       a conta dele vai */
    const acima = r.hy < R.c.y - 1 ? ' acima' : '';
    return `<i class="qsp-at ramo${acima}" data-i="${r.i}" data-ramo="${k}"`
      + ` data-de="${r.orb.toFixed(1)}" data-d="${r.d.toFixed(1)}"`
      + ` data-ordem="${r.ordem}" data-vao="${r.vao.toFixed(1)}"`
      + ` data-hx="${r.hx.toFixed(1)}" data-hy="${r.hy.toFixed(1)}"`
      + ` data-oito="${tot}"`
      + ` style="--x:${r.hx.toFixed(1)}px;--y:${r.hy.toFixed(1)}px;`
      + `--oct:${anel.toFixed(1)}px;--r:${r.at.r.toFixed(1)}px">`
      + `<b class="qsp-bola" style="--bg:${sphereBg(EL_COLOR[el])}"></b>`
      + eletronsRamo(el, r.ang, r.ordem).map(e => eHTML(e, r.orb)).join('')
      + `<u class="qsp-oito">${tot} elétron${tot === 1 ? '' : 's'}</u>`
      + `</i>`;
  }).join('');

  /* um bastão por par compartilhado, afastado do eixo conforme a ordem:
     um traço na simples, dois na dupla, três na tripla */
  const barras = R.ramos.map((r, k) => {
    const offs = r.ordem >= 3 ? [-r.vao, 0, r.vao]
               : r.ordem === 2 ? [-r.vao, r.vao] : [0];
    return offs.map(o => `<i class="qsp-lig" data-ramo="${k}"`
      + ` data-off="${o.toFixed(1)}"></i>`).join('');
  }).join('');

  qm.innerHTML = `<div class="qsp ramos ligado" data-key="${key}"`
    + ` style="--lw:${(R.ramos[0].w * g.f * 1.5).toFixed(1)}px">`
    + `${barras}${centro}${bracos}</div>`;
  const sp = qm.querySelector('.qsp');
  orientaRamos(sp);
  poeRamos(sp);
  return true;
}

/* o centro e os braços, como o DOM os tem agora */
function pecasRamos(sp){
  return { centro: sp.querySelector('.qsp-at.centro'),
           ramos: [...sp.querySelectorAll('.qsp-at.ramo')] };
}

/* Vira os elétrons de todos. Cada braço olha para o centro e o centro
   olha para cada braço; o par de uma ligação ligada mora no meio dela,
   e o de uma rompida volta para a órbita de cada um. */
function orientaRamos(sp){
  const { centro, ramos } = pecasRamos(sp);
  if (!centro || !ramos.length) return;
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));
  const cx = le(centro, '--x'), cy = le(centro, '--y');
  const orbC = +centro.dataset.de || 0;

  ramos.forEach((br, k) => {
    const bx = le(br, '--x'), by = le(br, '--y');
    const ang = Math.atan2(by - cy, bx - cx) * 180 / Math.PI;
    const meio = Math.hypot(bx - cx, by - cy) / 2;
    const orb = +br.dataset.de || 0;
    const ordem = +br.dataset.ordem || 1;
    const VAO = +br.dataset.vao || 0;
    /* O VÃO DE UM PAR É O MESMO DOS DOIS.
       Num par de iguais as duas órbitas medem igual e o par sai simétrico
       sozinho. Aqui não: a órbita do oxigênio é bem maior que a do
       hidrogênio, e cada um desviando o SEU tanto o par nascia torto,
       fora do meio da ligação. O desvio passa a ser o da órbita mais
       curta — apertado o bastante para caber nos dois anéis, e centrado
       no meio do bastão, que é onde o par mora. */
    const gap = Math.min(orbC, orb)
      * Math.sin(medidasLig(ordem).par * Math.PI / 180);
    const ligada = !br.classList.contains('solto');

    /* Cada solteiro tem o seu lugar no meio da ligação: o "lado" dele diz
       de qual par ele é, e o sinal espelha um átomo no outro — os dois
       átomos se olham, então o que está em cima para um está embaixo para
       o outro, e é assim que cada um encontra o seu. */
    const poe = (el, lado, sinal, uu, solto, orbita) => {
      if (!el) return;
      if (ligada){
        const v = sinal * (gap - lado * VAO);
        el.style.setProperty('--d', Math.hypot(uu, v).toFixed(1) + 'px');
        el.style.setProperty('--a',
          (ang + Math.atan2(v, uu) * 180 / Math.PI).toFixed(1) + 'deg');
      } else {
        el.style.setProperty('--d', orbita.toFixed(1) + 'px');
        el.style.setProperty('--a', solto.toFixed(1) + 'deg');
      }
    };
    /* os solteiros do centro que são deste braço */
    const eCs = [...centro.querySelectorAll(`.qsp-e[data-ramo="${k}"]`)];
    solteirosDe(ang, ordem).forEach((novo, i) =>
      poe(eCs[i], novo.lado, -1, meio, novo.a, orbC));
    /* e os do braço, que procuram aqueles */
    const eBs = [...br.querySelectorAll('.qsp-e[data-so]')];
    solteirosDe(ang + 180, ordem).forEach((novo, i) =>
      poe(eBs[i], novo.lado, 1, -meio, novo.a, orb));
  });
}

/* um bastão por braço, do centro até onde o braço estiver */
function poeRamos(sp){
  const { centro, ramos } = pecasRamos(sp);
  if (!centro) return;
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));
  const cx = le(centro, '--x'), cy = le(centro, '--y');
  ramos.forEach((br, k) => {
    const dx = le(br, '--x') - cx, dy = le(br, '--y') - cy;
    const len = Math.hypot(dx, dy) || 1;
    /* a perpendicular ao eixo: é por ela que os bastões de uma dupla ou
       tripla se afastam um do outro, em qualquer ângulo do braço */
    const px = -dy / len, py = dx / len;
    const rot = (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(2) + 'deg';
    const solto = br.classList.contains('solto');
    sp.querySelectorAll(`.qsp-lig[data-ramo="${k}"]`).forEach(bar => {
      const off = +bar.dataset.off || 0;
      bar.style.setProperty('--x', (cx + px * off).toFixed(1) + 'px');
      bar.style.setProperty('--y', (cy + py * off).toFixed(1) + 'px');
      bar.style.setProperty('--len', len.toFixed(1) + 'px');
      bar.style.setProperty('--w', sp.style.getPropertyValue('--lw') || '38px');
      bar.style.setProperty('--rot', rot);
      /* rompido, os bastões daquele braço ficam fora de cena */
      bar.style.opacity = solto ? '0' : '';
    });
  });
}

/* marca a molécula como incompleta enquanto lhe faltar um braço */
function conferaRamos(sp){
  const falta = !!sp.querySelector('.qsp-at.ramo.solto');
  sp.classList.toggle('incompleta', falta);
  /* sem todos os braços não há octeto para cercar: os anéis se apagam */
  if (falta) sp.querySelectorAll('.qsp-at.octeto').forEach(apagaOcteto);
}

/* ARRANCAR UM BRAÇO. Só aquela ligação se parte; a outra continua. */
function quebraRamo(sp, br, qm){
  if (br.classList.contains('solto')) return;
  const { centro } = pecasRamos(sp);
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));
  const cx = le(centro, '--x'), cy = le(centro, '--y');
  const bx = le(br, '--x'),     by = le(br, '--y');
  const mx = (cx + bx) / 2,     my = (cy + by) / 2;
  const rot = Math.atan2(by - cy, bx - cx) * 180 / Math.PI;

  const jato = document.createElement('i');
  jato.className = 'qsplash';
  jato.style.setProperty('--x', mx + 'px');
  jato.style.setProperty('--y', my + 'px');
  jato.style.setProperty('--rot', rot + 'deg');
  jato.innerHTML = splashHTML(0);
  sp.appendChild(jato);
  void jato.offsetWidth;
  jato.classList.add('go');

  const faisca = document.createElement('i');
  faisca.className = 'qspark';
  faisca.style.left = mx + 'px';
  faisca.style.top  = my + 'px';
  sp.appendChild(faisca);
  void faisca.offsetWidth;
  faisca.classList.add('go');
  setTimeout(() => { jato.remove(); faisca.remove(); }, 900);

  sp.querySelectorAll(`.qsp-lig[data-ramo="${br.dataset.ramo}"]`)
    .forEach(bar => repete(bar, 'parte'));

  /* o estado muda ANTES de recolocar os elétrons: orientaRamos lê a
     classe para saber se o par fica no meio ou volta para a órbita */
  br.classList.add('solto');
  /* 'feito' põe os elétrons à vista e libera o anel do octeto: daqui em
     diante esta molécula é uma que já passou pelas mãos da turma */
  sp.classList.remove('ligado');
  sp.classList.add('feito');
  sp.dataset['armado' + br.dataset.ramo] = '';
  conferaRamos(sp);
  br.querySelectorAll('.qsp-e').forEach(e => e.classList.remove('par', 'mira', 'indo'));
  orientaRamos(sp);
  poeRamos(sp);
  if (qm) qm.classList.remove('assentou');
}

/* O BRAÇO VOLTA. Ele mesmo se recoloca na casa dele, o bastão reaparece
   e o par se fecha de novo — sem mexer no outro braço, que nunca saiu. */
function juntaRamo(sp, br, qm){
  if (!br.classList.contains('solto')) return;
  br.classList.remove('solto');
  if (levaAtomo && levaAtomo.at === br){
    br.classList.remove('levando');
    levaAtomo = null;
  }
  br.classList.add('indo');
  br.style.setProperty('--x', br.dataset.hx + 'px');
  br.style.setProperty('--y', br.dataset.hy + 'px');
  br.querySelectorAll('.qsp-e').forEach(e => {
    e.classList.add('indo'); e.classList.remove('mira');
  });
  br.querySelectorAll('.qsp-e[data-so]').forEach(e => e.classList.add('par'));
  const { centro } = pecasRamos(sp);
  const eC = centro && centro.querySelector(`.qsp-e[data-ramo="${br.dataset.ramo}"]`);
  if (eC) eC.classList.add('par');
  repete(br, 'fechou');
  conferaRamos(sp);
  orientaRamos(sp);
  poeRamos(sp);

  const slide = qm && qm.closest('.slide');
  if (slide && !sp.querySelector('.qsp-at.ramo.solto')){
    const r = qm.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const k = fitScale || 1;
    confete(slide, (r.left + r.width / 2 - st.left) / k,
                   (r.top  + r.height / 2 - st.top)  / k);
    repete(qm, 'assentou');
  }
  setTimeout(() => {
    br.classList.remove('indo');
    br.querySelectorAll('.qsp-e').forEach(e => e.classList.remove('indo'));
    sp.querySelectorAll(`.qsp-lig[data-ramo="${br.dataset.ramo}"]`)
      .forEach(bar => bar.classList.remove('parte'));
    poeRamos(sp);
  }, 620);
}

/* O braço solto avisa quando está a ponto de voltar, e chegando lá ele
   volta sozinho. O 'armado' é por braço: cada ligação tem a sua conta. */
function miraRamos(sp, qm){
  const { centro, ramos } = pecasRamos(sp);
  if (!centro) return;
  ramos.forEach(br => {
    if (!br.classList.contains('solto')) return;
    const k = br.dataset.ramo;
    const eCs = [...centro.querySelectorAll(`.qsp-e[data-ramo="${k}"]`)];
    const eBs = [...br.querySelectorAll('.qsp-e[data-so]')];
    if (!eCs.length || !eBs.length) return;
    const onde = (at, e) => {
      const a = parseFloat(e.style.getPropertyValue('--a')) * Math.PI / 180;
      const d = parseFloat(e.style.getPropertyValue('--d'));
      return { x: parseFloat(at.style.getPropertyValue('--x')) + Math.cos(a) * d,
               y: parseFloat(at.style.getPropertyValue('--y')) + Math.sin(a) * d };
    };
    /* Na dupla e na tripla são vários pares por braço, e todos chegam
       juntos — o átomo é um só. Basta o mais perto de fechar. */
    let dd = Infinity;
    eCs.forEach(a => eBs.forEach(b => {
      const p = onde(centro, a), q = onde(br, b);
      dd = Math.min(dd, Math.hypot(p.x - q.x, p.y - q.y));
    }));
    if (dd > SEP_ENCAIXE * 2.4) sp.dataset['armado' + k] = '1';
    const armado = sp.dataset['armado' + k] === '1';
    const perto = armado && dd < SEP_ENCAIXE * 1.7;
    eCs.forEach(e => e.classList.toggle('mira', perto));
    eBs.forEach(e => e.classList.toggle('mira', perto));
    if (armado && dd < SEP_ENCAIXE) juntaRamo(sp, br, qm);
  });
}

/* Monta a camada que se deixa desmontar por cima da molécula ampliada.
   Só molécula com bastão declarado em MOLBOND entra aqui. */
function montaSeparavel(qm){
  const key = qm.dataset.mol;
  /* molécula de braços tem o seu próprio caminho: centro parado, braços
     que se arrancam um a um */
  if (ehRamos(key)) return montaRamos(qm, key);
  const lig = (MOLBOND[key] || [])[0];
  if (!lig) return false;
  const g = sepGeo(key);
  const a = g.ats[lig[0]], b = g.ats[lig[1]];
  if (!a || !b) return false;

  /* A DISTÂNCIA DA MOLÉCULA MONTADA.
     Não é mais a do desenho de bola-e-bastão: é aquela em que os dois
     elétrons solteiros caem exatamente lado a lado, formando o par.
     Cada um sai da sua esfera a `orb` do centro, desviado SEP_PAR do
     eixo; para os dois pararem no mesmo ponto ao longo do eixo, os
     centros têm de estar a (orb0 + orb1) * cos(SEP_PAR) um do outro.
     É essa distância que passa a ser a molécula — o par no meio é a
     ligação, e não há vareta nenhuma a desenhar. */
  const ordem = ordemLig(key) || 1;
  const orb = [a, b].map(at => at.r + SEP_E_DIST);
  /* A dupla é MAIS CURTA que a simples, e sai curta por si: os solteiros
     dela saem mais abertos do eixo, então os dois núcleos têm de chegar
     mais perto para que eles se cruzem no meio. */
  const M = medidasLig(ordem);
  const dist = (orb[0] + orb[1]) * Math.cos(M.abre * Math.PI / 180);
  const meioX = (a.x + b.x) / 2;
  const casa = [meioX - dist / 2, meioX + dist / 2];

  /* Montados, os dois já se olham: o solteiro de cada um aponta para o
     vizinho. orientaEletrons refaz esta conta a cada movimento. */
  const atomos = [a, b].map((at, i) => {
    const n = VAL_SEP[at.el] || 0;
    const es = sepEletrons(n, i ? 180 : 0, ordem).map(e =>
      `<s class="qsp-e${e.so ? ' so' : ''}"${e.so ? ` data-so="1"` : ''}`
      + ` style="--a:${e.a}deg;--d:${orb[i].toFixed(1)}px"></s>`).join('');
    /* O ANEL DO OCTETO.
       Os oito elétrons deste átomo — os seis dele mais os dois do par
       compartilhado — ficam TODOS à mesma distância do centro dele, e
       por isso o que os cerca é um círculo, não uma forma qualquer.
       O raio cai na folga entre a borda do elétron mais distante e o
       começo da esfera vizinha: assim o anel abraça os oito sem tocar
       no átomo do lado nem recolher elétron alheio. */
    const fora  = orb[i] + 6.5;                  /* borda do elétron */
    const perto = dist - (i ? a : b).r;          /* onde começa a esfera vizinha */
    let   anel  = (fora + perto) / 2 * 1.05;     /* 5% mais folgado que o meio */
    /* Na dupla os pares compartilhados ficam longe do eixo, e por isso
       mais longe do núcleo que na simples: o anel tem de alcançá-los,
       ainda que para isso ele passe por cima da esfera vizinha — que é
       como as circunferências do octeto se cruzam no quadro, mesmo. */
    if (ordem > 1){
      const vao = orb[i] * Math.sin(M.par * Math.PI / 180);
      anel = Math.max(anel, Math.hypot(dist / 2, M.vao + vao) + 9);
    }
    /* Quantos elétrons o anel cerca: os do próprio átomo mais os que o
       vizinho põe no par — um por par compartilhado, dois na dupla. Dá
       oito nos dois casos da aula, mas a conta é feita e não escrita à
       mão: uma molécula que não fechasse o octeto diria a verdade. */
    const dentro = n + ordem;
    return `<i class="qsp-at" data-i="${i}"`
         + ` data-de="${orb[i].toFixed(1)}"`
         + ` data-oito="${dentro}"`
         + ` style="--x:${casa[i].toFixed(1)}px;--y:${at.y.toFixed(1)}px;`
         + `--oct:${anel.toFixed(1)}px;`
         + `--r:${at.r.toFixed(1)}px">`
         + `<b class="qsp-bola" style="--bg:${sphereBg(EL_COLOR[at.el])}"></b>${es}`
         + `<u class="qsp-oito">${dentro} elétron${dentro === 1 ? '' : 's'}</u>`
         + `</i>`;
  }).join('');

  /* data-dist é a distância de repouso E o limite de aproximação: nenhum
     átomo entra no outro, e o fundo do curso é justo o ponto em que os
     dois solteiros emparelham. Empurrar até o fim é o que combina. */
  /* O bastão ampliado sai 50% mais grosso que o do desenho pequeno, e
     de vidro. A conta da espessura é a do conteúdo: o par compartilhado
     fica a `lado` do eixo e o elétron tem 6.5px de raio, então a meia
     altura precisa passar dos dois — com folga, para o par não encostar
     na parede. Assim o par mora dentro da ligação, à vista. */
  /* Um bastão por par: a dupla sai com dois, afastados do eixo para os
     lados, cada um envelopando o seu par. */
  const barras = vaosLig(ordem)
    .map(o => `<i class="qsp-lig" data-off="${o}"></i>`).join('');
  qm.innerHTML = `<div class="qsp ligado" data-dist="${dist.toFixed(1)}"`
    + ` data-ordem="${ordem}"`
    + ` style="--lw:${(lig[2] * g.f * 1.5).toFixed(1)}px">`
    + `${barras}${atomos}</div>`;
  const sp = qm.querySelector('.qsp');
  orientaEletrons(sp);
  poeLigacao(sp);
  return true;
}

/* põe o bastão entre os dois átomos, onde quer que eles estejam */
function poeLigacao(sp){
  if (!sp) return;
  if (sp.classList.contains('ramos')) return poeRamos(sp);
  const [a, b] = [...sp.querySelectorAll('.qsp-at')];
  const bars = [...sp.querySelectorAll('.qsp-lig')];
  if (!a || !b || !bars.length) return;
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));
  const ax = le(a, '--x'), ay = le(a, '--y');
  const dx = le(b, '--x') - ax, dy = le(b, '--y') - ay;
  const len = Math.hypot(dx, dy) || 1;
  /* a perpendicular ao eixo: é por ela que os dois bastões da dupla se
     afastam um do outro, em qualquer ângulo que a molécula esteja */
  const px = -dy / len, py = dx / len;
  const rot = (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(2) + 'deg';
  bars.forEach(bar => {
    const off = +bar.dataset.off || 0;
    bar.style.setProperty('--x', (ax + px * off).toFixed(1) + 'px');
    bar.style.setProperty('--y', (ay + py * off).toFixed(1) + 'px');
    bar.style.setProperty('--len', len.toFixed(1) + 'px');
    bar.style.setProperty('--w', sp.style.getPropertyValue('--lw') || '38px');
    bar.style.setProperty('--rot', rot);
  });
}

/* onde estão os elétrons desemparelhados deste átomo, em px da caixa.
   São dois na ligação dupla, um na simples. */
function pontosSo(at){
  const x = parseFloat(at.style.getPropertyValue('--x'));
  const y = parseFloat(at.style.getPropertyValue('--y'));
  return [...at.querySelectorAll('.qsp-e[data-so]')].map(e => {
    const ang = parseFloat(e.style.getPropertyValue('--a')) * Math.PI / 180;
    const d   = parseFloat(e.style.getPropertyValue('--d'));
    return { x: x + Math.cos(ang) * d, y: y + Math.sin(ang) * d };
  });
}

/* A ruptura: o bastão se parte com estilhaços, os dois átomos ficam
   sozinhos e cada um mostra o que tem de valência.
   Vale tanto na molécula que veio pronta quanto na que o aluno acabou de
   montar: a aula se repete, e cada turma faz o gesto de novo. */
function separaAtomos(sp, qm){
  if (sp.classList.contains('solto')) return;    /* já está desmontada */
  const [a, b] = [...sp.querySelectorAll('.qsp-at')];
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));
  const mx = (le(a, '--x') + le(b, '--x')) / 2;
  const my = (le(a, '--y') + le(b, '--y')) / 2;
  /* o eixo da ligação, para o esguicho sair para os lados dele */
  const rot = Math.atan2(le(b, '--y') - le(a, '--y'),
                         le(b, '--x') - le(a, '--x')) * 180 / Math.PI;

  /* o esguicho sai do ponto da ruptura, no eixo da ligação — o mesmo
     desenho que a molécula do slide da definição já usava */
  const sp2 = document.createElement('i');
  sp2.className = 'qsplash';
  sp2.style.setProperty('--x', mx + 'px');
  sp2.style.setProperty('--y', my + 'px');
  sp2.style.setProperty('--rot', rot + 'deg');
  sp2.innerHTML = splashHTML(0);
  sp.appendChild(sp2);
  void sp2.offsetWidth;
  sp2.classList.add('go');

  const faisca = document.createElement('i');
  faisca.className = 'qspark';
  faisca.style.left = mx + 'px';
  faisca.style.top  = my + 'px';
  sp.appendChild(faisca);
  void faisca.offsetWidth;
  faisca.classList.add('go');

  sp.querySelectorAll('.qsp-lig').forEach(bar => repete(bar, 'parte'));
  setTimeout(() => { sp2.remove(); faisca.remove(); }, 900);

  /* O estado muda ANTES de recolocar os elétrons: orientaEletrons lê a
     classe para saber se o solteiro fica no meio (molécula) ou de volta
     na órbita (átomo sozinho). Na ordem inversa, ele os deixava no meio
     e só o movimento seguinte corrigia. */
  sp.classList.remove('ligado', 'feito');
  sp.classList.add('solto');
  sp.dataset.armado = '';                  /* só arma depois de afastar */
  /* rompida a ligação, não há mais octeto: o anel se apaga junto, no
     mesmo fade com que sairia por um toque */
  sp.querySelectorAll('.qsp-at.octeto').forEach(apagaOcteto);

  /* O par que era dos dois se desfaz: cada átomo volta a contar os seus,
     e o desemparelhado de um segue de frente para o do outro — de onde
     quer que eles estejam. É o que os deixa se procurar de novo. */
  [a, b].forEach(at => at.querySelectorAll('.qsp-e')
    .forEach(e => e.classList.remove('par', 'mira', 'indo')));
  orientaEletrons(sp);
  if (qm) qm.classList.remove('assentou');
}

/* O encaixe: os dois elétrons desemparelhados se acham, viram par e a
   ligação se refaz. Os átomos voltam para a posição de molécula, o
   bastão reaparece e os dois param de tremer. */
function juntaAtomos(sp, qm){
  if (!sp.classList.contains('solto')) return;
  sp.classList.remove('solto');
  sp.classList.add('feito');

  /* O ENCAIXE TIRA O ÁTOMO DA MÃO.
     Sem isto o mesmo arrasto que fechou a molécula continuava valendo, e
     como o puxão é medido desde o pointerdown ele já passava dos 34px:
     no quadro seguinte a molécula se rompia sozinha, recém-formada. Era
     este o defeito do encaixe automático. */
  if (levaAtomo && levaAtomo.sp === sp){
    levaAtomo.at.classList.remove('levando');
    levaAtomo = null;
  }

  const ats = [...sp.querySelectorAll('.qsp-at')];
  const le = (el, v) => parseFloat(el.style.getPropertyValue(v));

  /* A MOLÉCULA ENDIREITA NO LUGAR.
     Fechada a ligação, seja qual for o ângulo em que os dois se
     encontraram, ela gira até deitar na horizontal — é a forma em que a
     turma vai lê-la. O CENTRO continua sendo o que a mão deixou: ela
     endireita onde foi feita, não volta para o começo.
     Entre deitar para um lado ou para o outro, vale o giro mais curto:
     assim cada átomo fica do lado em que já estava e nenhum atravessa o
     outro para chegar ao seu lugar. */
  const mx = (le(ats[0], '--x') + le(ats[1], '--x')) / 2;
  const my = (le(ats[0], '--y') + le(ats[1], '--y')) / 2;
  const ang = Math.atan2(le(ats[1], '--y') - le(ats[0], '--y'),
                         le(ats[1], '--x') - le(ats[0], '--x')) * 180 / Math.PI;
  const norte = ((ang + 180) % 360 + 360) % 360 - 180;   /* para (-180, 180] */
  const dir = Math.abs(norte) <= 90 ? 1 : -1;            /* 0° ou 180° */
  const meio = (+sp.dataset.dist || 0) / 2;

  ats.forEach((at, i) => {
    const s = (i ? 1 : -1) * dir;
    at.classList.add('indo');
    at.classList.remove('levando');
    at.style.setProperty('--x', (mx + s * meio).toFixed(1) + 'px');
    at.style.setProperty('--y', my.toFixed(1) + 'px');

    /* os elétrons deslizam junto com o átomo até o arranjo de molécula */
    at.querySelectorAll('.qsp-e').forEach(e => {
      e.classList.add('indo');
      e.classList.remove('mira');
    });
    at.querySelectorAll('.qsp-e[data-so]').forEach(so => so.classList.add('par'));
    repete(at, 'fechou');
  });
  /* Já nas posições finais, os solteiros se viram um para o outro e se
     encontram no meio do caminho: é ali que o par deixa de ser de um ou
     de outro e passa a ser DOS DOIS. Os pares isolados ficam nos três
     lados de fora, e cada cloro fecha os seus oito. */
  orientaEletrons(sp);
  poeLigacao(sp);                          /* o bastão já nasce no eixo certo */

  const slide = qm && qm.closest('.slide');
  if (slide){
    const r = qm.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const k = fitScale || 1;
    confete(slide, (r.left + r.width / 2 - st.left) / k,
                   (r.top  + r.height / 2 - st.top)  / k);
  }
  if (qm) repete(qm, 'assentou');

  setTimeout(() => {
    ats.forEach(at => {
      at.classList.remove('indo');
      at.querySelectorAll('.qsp-e').forEach(e => e.classList.remove('indo'));
    });
    /* o bastão volta: 'parte' preenche para a frente, então sem tirá-lo
       daqui ele ficaria invisível para sempre. Os elétrons FICAM — é com
       eles ao lado do bastão que se confere o octeto dos dois. */
    sp.querySelectorAll('.qsp-lig').forEach(bar => bar.classList.remove('parte'));
    poeLigacao(sp);
  }, 620);
}

/* Enquanto o átomo anda, os dois elétrons avisam quando estão a ponto de
   se encaixar — e, chegando lá, o encaixe acontece sozinho.

   O 'armado' existe porque na posição de molécula os dois elétrons já
   estão perto: rompida a ligação com um puxão de lado, eles ainda
   estariam dentro da distância de encaixe e a molécula se refaria na
   hora, como se nada tivesse acontecido. Então o encaixe só passa a
   valer depois que os dois se afastaram de verdade uma vez. É também o
   que a aula quer dizer: para ligar de novo, primeiro é preciso separar. */
function miraEncaixe(sp, qm){
  if (sp.classList.contains('ramos')) return miraRamos(sp, qm);
  const ats = [...sp.querySelectorAll('.qsp-at')];
  const p = ats.map(pontosSo);
  if (!p[0] || !p[1] || !p[0].length || !p[1].length) return;
  /* Quem manda é o par mais perto de fechar. Na dupla são dois pares, e
     os dois chegam juntos — o átomo é um só, e todos os elétrons dele
     andam com ele —, então basta o primeiro para saber que é hora. */
  let d = Infinity;
  p[0].forEach(e0 => p[1].forEach(e1 =>
    { d = Math.min(d, Math.hypot(e0.x - e1.x, e0.y - e1.y)); }));
  if (d > SEP_ENCAIXE * 2.4) sp.dataset.armado = '1';
  const armado = sp.dataset.armado === '1';
  const perto = armado && d < SEP_ENCAIXE * 1.7;
  ats.forEach(at => at.querySelectorAll('.qsp-e[data-so]')
    .forEach(e => e.classList.toggle('mira', perto)));
  if (armado && d < SEP_ENCAIXE) juntaAtomos(sp, qm);
}

let levaAtomo = null;
deck.addEventListener('pointerdown', (e) => {
  const at = e.target.closest && e.target.closest('.qsp-at');
  if (!at) return;
  const sp = at.closest('.qsp'), qm = at.closest('.qm');
  if (!sp || !qm) return;
  e.preventDefault();
  levaAtomo = {
    at, sp, qm, id: e.pointerId, x: e.clientX, y: e.clientY,
    ax: parseFloat(at.style.getPropertyValue('--x')),
