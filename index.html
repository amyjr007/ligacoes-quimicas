  background:rgba(7,22,38,.82);backdrop-filter:blur(14px);
  border:1px solid rgba(69,199,176,.22);border-radius:999px;z-index:50;
  transition:opacity .35s ease,transform .35s ease;
}
#bar.hidden{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
.btn{
  width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:var(--paper);
  display:grid;place-items:center;cursor:pointer;transition:background .18s,color .18s;
}
.btn:hover{background:rgba(69,199,176,.16);color:var(--aqua)}
.btn:disabled{opacity:.28;cursor:default;background:transparent}
.btn.on{color:var(--amber)}
#counter{
  font-family:var(--mono);font-size:14px;min-width:66px;text-align:center;
  color:var(--paper-dim);letter-spacing:.08em;user-select:none;
}
#counter b{color:var(--paper);font-weight:500}
.sep{width:1px;height:24px;background:rgba(69,199,176,.22);margin:0 4px}

/* ---------- visão geral ---------- */
/* ---------- painel de coordenadas (ferramenta de montagem) ---------- */
#coords{
  position:fixed;inset:0;z-index:90;background:rgba(7,22,38,.96);
  backdrop-filter:blur(8px);padding:48px;
  display:flex;flex-direction:column;gap:16px;
}
#coords[hidden]{display:none}
#coords h2{
  font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--aqua);font-weight:400;
}
#coords textarea{
  flex:1;min-height:0;resize:none;
  background:var(--ink);color:var(--paper);
  border:1px solid rgba(69,199,176,.28);border-radius:2px;padding:18px 20px;
  font-family:var(--mono);font-size:13px;line-height:1.7;tab-size:2;
}
#coords textarea:focus{outline:none;border-color:var(--aqua)}
#coords .row{display:flex;align-items:center;justify-content:space-between;gap:18px}
#coords .msg{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--amber)}
#coords .hint2{font-size:13px;font-weight:300;color:var(--paper-dim)}
#coords .close{
  border:1px solid rgba(69,199,176,.3);background:transparent;color:var(--paper);
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:10px 18px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s;
}
#coords .close:hover{border-color:var(--aqua);color:var(--aqua)}

#overview{
  position:fixed;inset:0;z-index:80;background:rgba(7,22,38,.96);
  backdrop-filter:blur(8px);padding:48px;overflow:auto;
}
#overview[hidden]{display:none}
#overview h2{
  font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--aqua);margin-bottom:26px;font-weight:400;
}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{
  aspect-ratio:16/9;border:1px solid rgba(69,199,176,.24);background:var(--ink);
  padding:0;position:relative;overflow:hidden;display:block;
  cursor:pointer;text-align:left;color:inherit;font:inherit;transition:border-color .2s,transform .2s;
}
.card:hover{border-color:var(--aqua);transform:translateY(-3px)}
.card.current{border-color:var(--amber)}

/* miniatura: o próprio slide, em escala, com tudo o que ele guarda à mostra */
.mini{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.mini-palco{
  position:absolute;top:0;left:0;width:1280px;height:720px;
  transform-origin:0 0;background:var(--ink);
}
.mini-palco::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(69,199,176,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(69,199,176,.055) 1px,transparent 1px);
  background-size:40px 40px;
}
.mini-palco .slide{opacity:1;visibility:visible}
/* numa miniatura nada se mexe */
.mini-palco *{animation:none!important;transition:none!important}

.card .rot{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 13px 11px;
  background:linear-gradient(0deg,rgba(6,20,32,.97) 45%,rgba(6,20,32,0));
}
.card .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--paper-dim)}
.card .t{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2;margin-top:2px}
.card .s{font-size:11px;font-weight:300;color:var(--amber);margin-top:3px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .slide.is-leaving{opacity:0;visibility:hidden}
  #fx{display:none}
}
</style>
</head>

</div>

/* Um pedaço grande de sal num prato. Ele é uma grade de doze cacos que
   juntos formam o bloco; a cada batida do dedo eles se afastam mais e a
   pedra se desfaz. Quatro batidas: três quebrando e a última refazendo. */
/* O que o aluno vê aqui não é uma pedra esfarelando. É um cristal
   clivando: sob a pancada, um plano de íons desliza sobre o vizinho,
   cargas de mesmo sinal ficam frente a frente e o cristal se parte ao
   longo de um plano reto. Por isso o bloco sai em pedaços de faces
   planas, e não em migalhas — e é isso que significa "quebradiço".

   O bloco é um cubo 2x2x2 desenhado em perspectiva isométrica. Cada
   batida abre mais um plano de clivagem. */
function PEDRA(){
  const a = 24, b = 12, h = 22;          /* largura, profundidade, altura */
  const cx = 100, cy = 70;
  /* x cresce para a direita-frente, z para a esquerda-frente, y para cima */
  const P = (x, z, y) => [ cx + (x - z) * a,
                           cy + (x + z - 2) * b - (y - 1) * h ];
  const pts = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const rgb = (r, g, bl, t) => `rgb(${Math.round(r*t)},${Math.round(g*t)},${Math.round(bl*t)})`;

  /* as direções, já na tela, dos dois planos de clivagem verticais */
  const n = Math.hypot(a, b);
  const ux = [  a / n, b / n ];
  const uz = [ -a / n, b / n ];

  const pecas = [];
  for (let i = 0; i < 2; i++)
    for (let k = 0; k < 2; k++)
      for (let j = 0; j < 2; j++){
        const si = i ? 1 : -1, sk = k ? 1 : -1;
        /* as três faces visíveis do bloquinho */
        const topo = [P(i,k,j+1), P(i+1,k,j+1), P(i+1,k+1,j+1), P(i,k+1,j+1)];
        const dir  = [P(i+1,k,j+1), P(i+1,k+1,j+1), P(i+1,k+1,j), P(i+1,k,j)];
        const esq  = [P(i,k+1,j+1), P(i+1,k+1,j+1), P(i+1,k+1,j), P(i,k+1,j)];
        const t = 1 - (i + k) * 0.02 - (1 - j) * 0.03;

        /* estágio 1: abre só o plano perpendicular a x
           estágio 2: abre também o plano perpendicular a z
           estágio 3: tudo separado e a camada de cima desce para o prato */
        const o1 = [ si * 8 * ux[0], si * 8 * ux[1] ];
        const o2 = [ si * 13 * ux[0] + sk * 13 * uz[0],
                     si * 13 * ux[1] + sk * 13 * uz[1] ];
        /* no estágio 3 as peças ainda têm de caber no prato: 18 é o
           quanto elas podem abrir sem passar da borda */
        const o3 = [ si * 18 * ux[0] + sk * 18 * uz[0],
                     si * 18 * ux[1] + sk * 18 * uz[1] + (j ? 13 : 2) ];
        const c = P(i + 0.5, k + 0.5, j + 0.5);

        pecas.push({ z: i + k + j * (2 * b / h), html:
          `<g class="pc" style="transform-origin:${c[0].toFixed(1)}px ${c[1].toFixed(1)}px;`
        + `--x1:${o1[0].toFixed(1)}px;--y1:${o1[1].toFixed(1)}px;--r1:0deg;`
        + `--x2:${o2[0].toFixed(1)}px;--y2:${o2[1].toFixed(1)}px;--r2:${(si*1.5).toFixed(1)}deg;`
        + `--x3:${o3[0].toFixed(1)}px;--y3:${o3[1].toFixed(1)}px;`
        + `--r3:${((si + sk) * 3 + (j ? si * 5 : 0)).toFixed(1)}deg">`
        + `<polygon points="${pts(esq)}" fill="${rgb(201,214,223,t)}"/>`
        + `<polygon points="${pts(dir)}" fill="${rgb(169,184,195,t)}"/>`
        + `<polygon points="${pts(topo)}" fill="${rgb(242,247,250,t)}"/>`
        + `</g>` });
      }
  /* De trás para a frente. A direção do olhar nesta projeção é
     (1, 2b/h, 1), então a profundidade de cada bloquinho é
     i + k + j*(2b/h): pintar em ordem crescente põe o de trás primeiro. */
  pecas.sort((p, q) => p.z - q.z);

  /* os dois riscos que marcam onde o cristal partiu */
  const rachaA = pts([P(1,0,2), P(1,2,2), P(1,2,0)]);
  const rachaB = pts([P(0,1,2), P(2,1,2), P(2,1,0)]);

  return `<div class="pd" data-e="0">
    <svg class="pd-svg" viewBox="0 0 200 152" aria-hidden="true">
      <defs>
        <linearGradient id="pdPrato" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EDF2F5"/>
          <stop offset="1" stop-color="#9BA8B2"/>
        </linearGradient>
      </defs>
      <!-- o prato, em perspectiva -->
      <ellipse cx="100" cy="126" rx="90" ry="24" fill="#0A1622" opacity=".55"/>
      <path d="M12 120 Q100 150 188 120 L188 116 Q100 146 12 116 Z" fill="#8593A0"/>

/* Os exemplos do octeto, um por face do cubo. "solta" diz se o átomo
   PERDE elétrons — só nesses o último subnível se arrasta para fora.
   O cloro e o oxigênio ganham elétrons, então neles não há o que doar. */
const EXEMPLOS = [
  { sim: 'Na', nobre: 'Ne' },   /* precisa perder 1 */
  { sim: 'Cl', nobre: 'Ar' },   /* precisa ganhar 1 */
  { sim: 'Ca', nobre: 'Ar' },   /* precisa perder 2 */
  { sim: 'O',  nobre: 'Ne' }    /* precisa ganhar 2 */
];

/* Troca o exemplo acompanhando o giro do cubo: o que está fora dele sai
   para um lado e o novo entra pelo outro, no mesmo sentido da face.
   dir = +1 avançando, -1 voltando. */
function trocaExemplo(slide, i, dir){
  const at = slide.querySelector('.reveal-item[data-id="atomo"]');
  const nb = slide.querySelector('.reveal-item[data-id="vizinho"]');
  if (nb && !nb.hidden) retractItem(nb);     /* o gás da ajuda recolhe */
  if (!at){ poeExemplo(slide, i); return; }

  const fora = (dir < 0 ? 240 : -240) + 'px';
  const vem  = (dir < 0 ? -240 : 240) + 'px';
  at.style.setProperty('--dx', fora);
  at.style.setProperty('--dy', '0px');
  at.classList.remove('pop');
  void at.offsetWidth;
  at.classList.add('retract');
  setTimeout(() => {
    at.classList.remove('retract');
    poeExemplo(slide, i);                    /* o exemplo daquela face */
    at.style.setProperty('--dx', vem);
    at.style.setProperty('--dy', '0px');
    void at.offsetWidth;
    at.classList.add('pop');
    setTimeout(() => {
      at.classList.remove('pop');
      at.style.removeProperty('--dx');
      at.style.removeProperty('--dy');
    }, 620);
  }, 400);
}

/* refaz o átomo e o gás nobre da face que o cubo está mostrando */
function poeExemplo(slide, i){
  const ex = EXEMPLOS[i];
  if (!slide || !ex) return;
  const at = slide.querySelector('.reveal-item[data-id="atomo"]');
  const nb = slide.querySelector('.reveal-item[data-id="vizinho"]');
  if (at){
    at.dataset.sim = ex.sim;
    /* alvo: quantos elétrons faltam (positivo) ou sobram (negativo)
       para o átomo ficar com a configuração do gás nobre */
    at.dataset.alvo  = (GASES[ex.nobre] || {}).z - (GASES[ex.sim] || {}).z;
    at.dataset.delta = 0;
    at.innerHTML = GAS(ex.sim, { dentro: true, conta: true });
    at.classList.remove('doado', 'certo');
    marcaEstado(at);                       /* nasce instável, fora do octeto */
  }
  if (nb){
    nb.dataset.sim = ex.nobre;
    nb.innerHTML = GAS(ex.nobre, { dentro: true, conta: true });
  }
  slide.classList.remove('acertou');
  const aj = slide.querySelector('.ajuda');
  if (aj) aj.classList.remove('on');
}

/* Símbolo com os elétrons de valência em volta: um de cada lado antes de
   emparelhar, como se escreve à mão. O hélio é a exceção conhecida —
   dois elétrons, e o par fica junto. */
function LEWIS(sim, n, emPares){
  let pos;
  if (n <= 0) pos = [];
  else if (emPares){
    /* Elétrons recebidos entram emparelhados: enche um lado com dois
       antes de abrir o próximo. Um sobrando fica sozinho no último. */
    const ordem = ['r', 't', 'l', 'b'];
    pos = [];
    let k = n;
    for (let i = 0; i < 4 && k > 0; i++){
      if (k >= 2){ pos.push(ordem[i] + '-a', ordem[i] + '-b'); k -= 2; }
      else       { pos.push(ordem[i] + '-c'); k -= 1; }
    }
  }
  else if (sim === 'He') pos = ['r-a', 'r-b'];   /* o par junto, na frente */
  else if (n <= 3){
    /* 1A, 2A e 3A: tudo na frente do símbolo, centrado nele */
    pos = { 1: ['r-c'], 2: ['r-a', 'r-b'], 3: ['r-a', 'r-c', 'r-b'] }[n] || [];
  } else if (n > 8) pos = [];
  else {
    /* de 4A em diante: um em cada lado antes de emparelhar. O lado que
       recebe um só fica centrado; o que recebe dois se abre. */
    const ordem = ['t', 'r', 'b', 'l'];
    const lado = [], quantos = {};
    for (let i = 0; i < n; i++){
      const L = ordem[i % 4];
      lado.push(L);
      quantos[L] = (quantos[L] || 0) + 1;
    }
    const visto = {};
    pos = lado.map(L => {
      visto[L] = (visto[L] || 0) + 1;
      return quantos[L] === 1 ? L + '-c' : L + (visto[L] === 1 ? '-a' : '-b');
    });
  }
  return `<div class="lw"><span class="lw-sim">${sim}</span>`
       + pos.map(p => `<i class="lw-e ${p}"></i>`).join('') + `</div>`;
}
const LEWIS_VAZIO = `<span class="lw-vazio">escolha uma família<br>e um elemento</span>`;

/* Quantos elétrons faltam (positivo) ou sobram (negativo) para o octeto.
   Até a família 3A é mais curto doar tudo; da 4A em diante, receber.
   Os gases nobres já estão prontos. */
function alvoLewis(sim, val){
  if (sim === 'He' || val === 8) return 0;
  return val <= 3 ? -val : (8 - val);
}

  for (let i = ROCK_CAMADAS; i >= 1; i--){

         + ` style="--z:${(-ROCK_FUNDO * i).toFixed(1)}px" aria-hidden="true">`
         + `<path fill="${cor}" d="${ROCK_PATH}"/></svg>`;

}

/* ------------------------------------------------------------
   ESFERAS COLORIDAS
   a partir de uma cor só, monta o degradê que dá volume:
   brilho especular, o corpo na cor pedida e a sombra da base.
   ------------------------------------------------------------ */
const toRGB   = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const asCSS   = (a) => `rgb(${a.map(Math.round).join(',')})`;
const lighten = (c, t) => c.map(v => v + (255 - v) * t);
const darken  = (c, t) => c.map(v => v * t);

function sphereBg(hex){
  const c = toRGB(hex);
  return `radial-gradient(circle at 33% 27%,`
       + `rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 5%,rgba(255,255,255,0) 22%),`
       + `radial-gradient(circle at 36% 30%,`
       + `${asCSS(lighten(c, .4))} 0%,${hex} 30%,`
       + `${asCSS(darken(c, .62))} 62%,${asCSS(darken(c, .28))} 100%)`;
}

/* ------------------------------------------------------------
   A MOLÉCULA DE ÁGUA E O COPO
   a molécula usa as mesmas esferas do postulado 2: oxigênio
   vermelho e dois hidrogênios cinza claro, a 103° um do outro.

const MOL_W = 260, MOL_H = 220;

function MOLECULE(){

/* Uma bolinha dentro do degradê composto da mini-molécula.
   O raio é multiplicado por --k igual à caixa: sem isso, ao crescer,
   as posições (em %) se afastam e os átomos se descolam uns dos outros. */
const miniBall = (hex, cx, cy, r) => {
  const c = toRGB(hex);
  return `radial-gradient(circle calc(${r}px * var(--k,1)) at ${cx}% ${cy}%,`
       + `${asCSS(lighten(c, .5))} 0%,${hex} 44%,`
       + `${asCSS(darken(c, .5))} 96%,rgba(0,0,0,0) 97%)`;
};
/* ------------------------------------------------------------
   CORES DOS ELEMENTOS — padrão CPK (as do Jmol, que são as
   usadas nos livros didáticos e nos programas de modelagem).
   Esta é a única fonte: as esferas do postulado 2, a molécula
   de água e o campo quântico leem todas daqui.
   ------------------------------------------------------------ */
const EL_COLOR = {
  H:  '#FFFFFF',   /* branco   */
  C:  '#909090',   /* cinza    */
  N:  '#3050F8',   /* azul     */
  O:  '#FF0D0D',   /* vermelho */
  S:  '#FFFF30',   /* amarelo  */
  Au: '#FFD123',   /* ouro     */
  /* gases nobres: a mesma escala do CPK, do quase branco ao azul fechado */
  He: '#D9FFFF',
  Ne: '#B3E3F5',
  Ar: '#80D1E3',
  Kr: '#5CB8D1',
  Xe: '#429EB0',
  Rn: '#428296',
  Na: '#AB5CF2',   /* sódio, no mesmo padrão CPK */
  Mg: '#8AFF00',   /* magnésio, verde do CPK */
  Cl: '#26D926',   /* cloro */
  Ca: '#3DFF00'    /* cálcio, verde do CPK */
};

/* receitas: [elemento, x%, y%, raio]. O átomo central vem por último,
   porque a última camada de fundo é a que fica por baixo. */
const RECIPES = {
  h2o:   [['H',32.5,58.5,5.5],['H',67.5,58.5,5.5],['O',50,40,8]],
  nh3:   [['H',26,62,5],['H',74,62,5],['H',50,76,5],['N',50,42,8]],
  co2:   [['O',17,50,7],['O',83,50,7],['C',50,50,7.5]],
  h2so4: [['H',10,26,4],['H',90,26,4],['O',24,34,6],['O',76,34,6],
          ['O',30,72,6],['O',70,72,6],['S',50,50,8.5]],
  etoh:  [['H',12,32,4],['H',88,30,4],['C',30,50,7],['C',52,62,7],['O',74,42,6.5]],
  /* gases nobres são monoatômicos: uma esfera só, sem ligação nenhuma */
  he: [['He',50,50,13]], ne: [['Ne',50,50,13]], ar: [['Ar',50,50,13]],
  kr: [['Kr',50,50,13]], xe: [['Xe',50,50,13]], rn: [['Rn',50,50,13]]
};
/* cada mini-molécula é UM elemento só: as bolinhas são camadas de
   fundo, não filhos. Custa um desenho, não uma dúzia. */
const bgFor = (key) => (RECIPES[key] || RECIPES.h2o)
  .map(([el, x, y, r]) => miniBall(EL_COLOR[el], x, y, r)).join(',');
const MINI_BG = bgFor('h2o');

/* A água em bola-e-vareta, do jeito que ela é: o oxigênio grande na
   frente e os dois hidrogênios encaixados nele, no ângulo de 104,5°.
   Antes eram três manchas de fundo separadas numa caixa achatada — os
   H apareciam soltos, longe do O. Aqui a geometria é desenhada:
     O em (50,36) r 26 ;  H a 32 do centro, a 52,25° da vertical
     -> H em (24,7 , 55,6) e (75,3 , 55,6), r 15
   Com d = 32 e rO+rH = 41, cada H entra 9 unidades no oxigênio: eles se
   tocam de fato. O O é desenhado por último, então fica por cima. */
/* Geometria de cada molécula, na mesma escala: posição e raio de cada
   átomo, do fundo para a frente (o central é sempre o último, e por isso
   fica por cima). As distâncias são cerca de 78% da soma dos raios, então
   os átomos SE ENCOSTAM em vez de flutuarem soltos. */
const MOLGEO = {
  h2o:  [['H',24.7,55.6,15],['H',75.3,55.6,15],['O',50,36,26]],
  nh3:  [['H',50,68,15],['H',24,52,15],['H',76,52,15],['N',50,34,25]],
  co2:  [['O',14,50,24],['O',86,50,24],['C',50,50,20]],
  h2so4:[['H',0.9,0.9,14],['H',99.1,0.9,14],
         ['O',21.3,21.3,23],['O',78.7,21.3,23],
         ['O',21.3,78.7,23],['O',78.7,78.7,23],['S',50,50,29]],
  /* etanol inteiro, H3C-CH2-OH: três hidrogênios no primeiro carbono,
     dois no segundo, e o da hidroxila na ponta. A cadeia é horizontal. */
  etoh: [['H',28,33,14],['H',10,60,14],['H',28,87,14],    /* os três do C1 */
         ['H',79,30,14],['H',79,90,14],                   /* os dois do C2 */
         ['H',145,60,14],                                 /* o da hidroxila */
         ['C',40,60,25],['C',79,60,25],['O',116,60,23]],
  he:[['He',50,50,34]], ne:[['Ne',50,50,34]], ar:[['Ar',50,50,34]],
  kr:[['Kr',50,50,34]], xe:[['Xe',50,50,34]], rn:[['Rn',50,50,34]]
};

/* Desenha a molécula. O viewBox sai da própria tinta, então cada uma
   ocupa a caixa inteira sem sobra e sem corte. O gradiente é o mesmo das
   outras esferas do app: brilho a 34/26% e a borda escurecida. */
function MOL_SVG(key){
  const g = MOLGEO[key] || MOLGEO.h2o;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  g.forEach(([, x, y, r]) => {
    if (x - r < x0) x0 = x - r;
    if (x + r > x1) x1 = x + r;
    if (y - r < y0) y0 = y - r;
    if (y + r > y1) y1 = y + r;
  });
  const els = [...new Set(g.map(a => a[0]))];
  const defs = els.map(el => {

/* ------------------------------------------------------------
   MOLÉCULA DESMONTÁVEL
   mesma receita das outras, só que aberta: cada átomo é um
   elemento, e cada ligação uma barra que pode ser rompida.
   ------------------------------------------------------------ */
/* estilhaços do splash: ângulo, distância, tamanho, duração e cor.
   Os ângulos fogem do eixo da ligação (0° e 180°), para o esguicho
   sair para os lados, como respingo de coisa que se parte. */
const SPLASH = [
  { a:-108, d: 92, w:16, h:5, t:.62, c:'#D7E3EB' },
  { a: -64, d:118, w:22, h:6, t:.70, c:'#FFB27A' },
  { a: -22, d: 76, w:13, h:4, t:.55, c:'#C2CFD8' },
  { a:  18, d:104, w:19, h:5, t:.66, c:'#FFD3A6' },
  { a:  58, d:126, w:24, h:6, t:.72, c:'#B9C7D1' },
  { a: 104, d: 88, w:15, h:5, t:.60, c:'#FF9A63' },
  { a: 150, d:110, w:20, h:5, t:.68, c:'#D7E3EB' },
  { a:-160, d: 70, w:12, h:4, t:.52, c:'#8FA3B0' }
];
const splashHTML = (i) => SPLASH.map(p => {
  const a = i % 2 ? -p.a : p.a;            /* as duas ligações não estilhaçam igual */
  return `<b style="--a:${a}deg;--d:${p.d}px;--w:${p.w}px;--h:${p.h}px;`
       + `--t:${p.t}s;--c:${p.c}"></b>`;
}).join('');

const SPLIT_W = 320, SPLIT_H = 232;
/* Uma escala só para as duas direções: a receita antiga esticava x e y
   por larguras diferentes e a molécula saía deformada. */
const SPLIT_K = 1.72;

/* A molécula que se desmonta usa a MESMA geometria do desenho do slide
   15: ângulo de verdade e átomos encostados. A vareta da ligação fica
   escondida dentro das esferas e só aparece quando se puxa um átomo. */
function splitMol(key, x, y){
  const g = MOLGEO[key] || MOLGEO.h2o;
  const c = g[g.length - 1];               /* o central é sempre o último */
  const cx = SPLIT_W / 2, cy = SPLIT_H / 2;

  let bonds = '', atoms = '';
  g.slice(0, -1).forEach(([el, px, py, r], i) => {
    const ox = (px - c[1]) * SPLIT_K;
    const oy = (py - c[2]) * SPLIT_K;
    const len = Math.hypot(ox, oy), rot = Math.atan2(oy, ox) * 180 / Math.PI;
    bonds += `<i class="qbond" data-for="${i}" style="`
           + `--x:${cx.toFixed(1)}px;--y:${cy.toFixed(1)}px;`
           + `--len:${len.toFixed(1)}px;--rot:${rot.toFixed(1)}deg"></i>`
           + `<i class="qspark" data-for="${i}" style="`
           + `left:${(cx + ox / 2).toFixed(1)}px;top:${(cy + oy / 2).toFixed(1)}px"></i>`
           + `<i class="qsplash" data-for="${i}" style="`
           + `--x:${(cx + ox / 2).toFixed(1)}px;--y:${(cy + oy / 2).toFixed(1)}px;`
           + `--rot:${rot.toFixed(1)}deg">${splashHTML(i)}</i>`;
    atoms += `<b class="qat end" data-i="${i}"`
           + ` data-hx="${(cx + ox).toFixed(1)}" data-hy="${(cy + oy).toFixed(1)}"`
           + ` style="left:${(cx + ox).toFixed(1)}px;top:${(cy + oy).toFixed(1)}px;`
           + `--r:${(r * SPLIT_K).toFixed(1)}px;background:${sphereBg(EL_COLOR[el])}"></b>`;
  });
  const nucleo = `<b class="qat core" style="left:${cx}px;top:${cy}px;`
    + `--r:${(c[3] * SPLIT_K).toFixed(1)}px;background:${sphereBg(EL_COLOR[c[0]])}"></b>`;

  return `<div class="qmol" style="left:${x}px;top:${y}px">${bonds}${nucleo}${atoms}</div>`;
}

/* ------------------------------------------------------------
   O CAMPO QUÂNTICO
   moléculas e micropartículas espalhadas pelo palco inteiro.
   ------------------------------------------------------------ */
/* moléculas de água espalhadas dentro de uma caixa, e não na tela toda */
function MOLS_PN(w, h, n){
  const rnd = rng(51771);
  let out = '';
  for (let i = 0; i < n; i++){
    const a = rnd() * 360;
    out += `<i class="qm" style="`
      + `left:${(12 + rnd() * (w - 149)).toFixed(0)}px;`
      + `top:${(12 + rnd() * (h - 135)).toFixed(0)}px;`
      + `--fx:${(rnd() * 26 - 13).toFixed(0)}px;--fy:${(rnd() * 22 - 11).toFixed(0)}px;`
      + `--r0:${(a - 11).toFixed(0)}deg;--r1:${(a + 11).toFixed(0)}deg;`
      + `--fd:${(6 + rnd() * 4).toFixed(1)}s;--o:${(.55 + rnd() * .4).toFixed(2)}">`
      + AGUA_SVG + `</i>`;
  }
  return out;
}

function QUANTUM(cfg, extra){
  const rnd = rng(20260827);
  let mols = '';
  if (cfg && cfg.field === 'bare'){
    mols = '';                             /* o conteúdo vem da rede 3D */
  } else if (cfg && cfg.field === 'split'){
    /* poucas, grandes e bem espaçadas */
    const xs = [300, 640, 980], ys = [250, 500];
    ys.forEach(y => xs.forEach(x => { mols += splitMol(cfg.mol || 'h2o', x, y); }));
  } else
  for (let r = 0; r < 3; r++){
    for (let c = 0; c < 6; c++){
      mols += `<i class="qm" style="`
        + `left:${(110 + c * 210 + (rnd() - .5) * 120).toFixed(0)}px;`
        + `top:${(120 + r * 235 + (rnd() - .5) * 120).toFixed(0)}px;`
        + `--fx:${(rnd() * 44 - 22).toFixed(0)}px;--fy:${(rnd() * 38 - 19).toFixed(0)}px;`
        /* ângulo próprio, sorteado na volta inteira, com uma oscilação leve em torno dele */
        + (() => { const a = rnd() * 360;
             return `--r0:${(a - 11).toFixed(0)}deg;--r1:${(a + 11).toFixed(0)}deg;`; })()
        + `--fd:${(6 + rnd() * 4).toFixed(1)}s;--o:${(.5 + rnd() * .45).toFixed(2)}">`
        + AGUA_SVG + `</i>`;
    }
  }
  let parts = '';
  for (let i = 0; i < 26; i++){
    parts += `<i class="qp" style="`
      + `left:${(rnd() * 1260).toFixed(0)}px;top:${(rnd() * 700).toFixed(0)}px;`
      + `--s:${(1.5 + rnd() * 2.6).toFixed(1)}px;`
      + `--fx:${(rnd() * 90 - 45).toFixed(0)}px;--fy:${(-20 - rnd() * 70).toFixed(0)}px;`
      + `--fd:${(7 + rnd() * 7).toFixed(1)}s;--dl:${(-rnd() * 10).toFixed(1)}s"></i>`;
  }
  return `<div class="quantum" aria-hidden="true">
    <span class="q-wash"></span>
    <span class="q-aurora"></span>
    <span class="q-ring r1"></span><span class="q-ring r2"></span><span class="q-ring r3"></span>
    <div class="q-zoom">${mols}${parts}</div>
    ${BOARD()}
    ${extra || ''}
    <button class="q-board-btn" type="button" tabindex="-1"
            title="Abrir o quadro branco">Quadro</button>
  </div>`;
}

/* ------------------------------------------------------------
   OS GASES NOBRES
   Distribuição por CAMADA (K, L, M, N, O, P), com os subníveis
   dentro de cada uma — e não na ordem crescente de energia.
   ------------------------------------------------------------ */
const GASES = {
  He: { z:  2, cam: [['K','1s<sup>2</sup>']] },
  Ne: { z: 10, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>']] },
  Ar: { z: 18, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup>']] },
  Kr: { z: 36, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>10</sup>'],
                     ['N','4s<sup>2</sup> 4p<sup>6</sup>']] },
  Xe: { z: 54, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>10</sup>'],
                     ['N','4s<sup>2</sup> 4p<sup>6</sup> 4d<sup>10</sup>'],
                     ['O','5s<sup>2</sup> 5p<sup>6</sup>']] },
  Na: { z: 11, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>1</sup>']] },
  /* os outros átomos dos exemplos do octeto */
  O:  { z:  8, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>4</sup>']] },
  Cl: { z: 17, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>5</sup>']] },
  Ca: { z: 20, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup>'],
                     ['N','4s<sup>2</sup>']] },
  Rn: { z: 86, cam: [['K','1s<sup>2</sup>'],
                     ['L','2s<sup>2</sup> 2p<sup>6</sup>'],
                     ['M','3s<sup>2</sup> 3p<sup>6</sup> 3d<sup>10</sup>'],
                     ['N','4s<sup>2</sup> 4p<sup>6</sup> 4d<sup>10</sup> 4f<sup>14</sup>'],
                     ['O','5s<sup>2</sup> 5p<sup>6</sup> 5d<sup>10</sup>'],
                     ['P','6s<sup>2</sup> 6p<sup>6</sup>']] }
};

/* op.dentro -> símbolo e Z dentro da bola
   op.conta  -> embaixo da chave vai o número de elétrons, não a letra
   op.solta  -> o último subnível pode ser arrastado para fora        */
/* ---- aritmética da distribuição: pôr e tirar elétrons de verdade ----
   Um subnível é '3s<sup>2</sup> 3p<sup>5</sup>'. Lemos, mexemos e
   reescrevemos, respeitando o que cabe em cada tipo de subnível. */
const CAP = { s: 2, p: 6, d: 10, f: 14 };
const LETRAS = ['K','L','M','N','O','P','Q'];
/* limite do sandbox: no máximo quatro elétrons a mais e quatro a menos */
const MAX_E = 4;
function leSub(sub){
  return sub.trim().split(/\s+/).map(t => {
    const m = t.match(/^(\d+)([spdf])<sup>(\d+)<\/sup>$/);
    return m ? { n: m[1], l: m[2], e: +m[3] } : null;
  }).filter(Boolean);
}
const escreveSub = (ps) =>
  ps.map(p => `${p.n}${p.l}<sup>${p.e}</sup>`).join(' ');

/* enche os subníveis de trás para a frente; devolve o que não coube */
function poeSub(sub, n){
  const ps = leSub(sub);
  let k = n;
  for (let i = ps.length - 1; i >= 0 && k > 0; i--){
    const cabe = CAP[ps[i].l] - ps[i].e;
    const usa = Math.min(cabe, k);
    ps[i].e += usa; k -= usa;
  }
  return { sub: escreveSub(ps), resto: k };
}
/* esvazia de trás para a frente; subnível que zera desaparece */
function tiraSub(sub, n){
  const ps = leSub(sub);
  let k = n;
  for (let i = ps.length - 1; i >= 0 && k > 0; i--){
    const usa = Math.min(ps[i].e, k);
    ps[i].e -= usa; k -= usa;
  }
  return { sub: escreveSub(ps.filter(p => p.e > 0)), resto: k };
}

/* A distribuição do átomo com d elétrons a mais (d>0) ou a menos (d<0).
   Tirando, a camada que fica vazia some — é assim que o sódio 2-8-1
   vira 2-8, a do neônio. */
function distComDelta(sim, d){
  const g = GASES[sim] || GASES.He;
  const cam = g.cam.map(c => [c[0], c[1]]);
  if (!d) return cam;
  if (d > 0){
    const i = cam.length - 1;
    const r = poeSub(cam[i][1], d);
    cam[i][1] = r.sub;
    /* o que não coube na camada de valência começa a próxima */
    let k = r.resto;
    while (k > 0 && cam.length < LETRAS.length){
      const n = cam.length + 1;
      const s2 = Math.min(2, k); k -= s2;
      let sub = `${n}s<sup>${s2}</sup>`;
      if (k > 0){ const p2 = Math.min(6, k); k -= p2; sub += ` ${n}p<sup>${p2}</sup>`; }
      cam.push([LETRAS[cam.length], sub]);
    }
    return cam;
  }
  let k = -d;
  /* nunca some com a última camada: o átomo não se dissolve */
  while (k > 0 && cam.length > 1){
    const i = cam.length - 1;
    const r = tiraSub(cam[i][1], k);
    cam[i][1] = r.sub; k = r.resto;
    if (!cam[i][1]) cam.pop(); else break;
  }
  return cam;
}

function GAS(sim, op){
  op = op || {};
  const g = GASES[sim] || GASES.He;
  const eletrons = (sub) => [...sub.matchAll(/<sup>(\d+)<\/sup>/g)]
    .reduce((a, m) => a + +m[1], 0);
  const cam0 = op.delta ? distComDelta(sim, op.delta) : g.cam;
  const ultima = cam0.length - 1;

  const camadas = cam0.map(([c, sub], i) => {
    const rot = op.conta ? eletrons(sub) : c;
    const solta = op.solta && i === ultima;
    return `<span class="cam${solta ? ' solta' : ''}"`
         + (solta ? ` style="left:0px;top:0px"` : '')
         + `>${sub}<span class="br"></span><span class="lb">${rot}</span></span>`;
  }).join('');

  const rotulo = `<b>${sim}</b><i>${g.z}</i>`;
  return (op.dentro ? '' : `<div class="gas-id">${rotulo}</div>`)
       + `<div class="gas-ball" style="background:${sphereBg(EL_COLOR[sim])}">`
       + `${op.dentro ? rotulo : ''}</div>`
       + `<div class="gas-dist">${camadas}</div>`;
}

/* ------------------------------------------------------------
   O CUBO DOS POSTULADOS
   quatro faces para o cubo ficar fechado; as três primeiras
   levam os postulados. Cada volta de 90° traz o próximo.
   ------------------------------------------------------------ */
/* o conteúdo de cada cubo fica guardado aqui, porque as quatro faces
   físicas são reaproveitadas quando há mais postulados do que faces */
const CUBE_DATA = {};

/* uma face pode ser só o texto (vira "Postulado N") ou {n, t} com rótulo próprio */
function faceHTML(f, i){
  if (f == null) return '';
  /* face com desenho proprio (o par de elementos dos exemplos) */
  if (typeof f === 'object' && f.html) return f.html;
  const n = typeof f === 'string' ? `Postulado ${i + 1}` : f.n;
  const t = typeof f === 'string' ? f : f.t;
  if (!t) return '';
  /* extra pode ser uma função: assim ela só é chamada na montagem do
     slide, e não enquanto a lista de slides ainda está sendo criada —
     onde ainda faltava metade do arquivo para ser lida. */
  const ex = f && f.extra;
  return (n ? `<div class="n">${n}</div>` : '') + `<div class="t">${t}</div>`
       + (typeof ex === 'function' ? ex() : (ex || ''));
}

/* face com top:true encosta o texto no alto em vez de centralizar */
const faceClass = (f) => (f && f.top ? ' at-top' : '') + (f && f.cls ? ' ' + f.cls : '');

function CUBE(faces, id){
  if (id) CUBE_DATA[id] = faces;
  let panes = '';
  for (let i = 0; i < 4; i++)
    panes += `<div class="face${faceClass(faces[i])}" style="--i:${i}">`
           + `${faceHTML(faces[i], i)}</div>`;
  return `<div class="cube-stage"><div class="cube-box">${panes}</div></div>`;
}

/* Reescreve as faces físicas em torno da posição atual. A face da frente
   recebe o mesmo conteúdo que já tinha, então a troca é invisível: só as
   laterais e o fundo mudam, e a que vai entrar já chega com o texto certo. */
function paintCube(cube, F){
  const faces = CUBE_DATA[cube.dataset.id] || [];
  if (faces.length <= 4) return;           /* cabe tudo: nada a reaproveitar */
  const panes = cube.querySelectorAll('.face');
  [-1, 0, 1, 2].forEach(d => {
    const L = F + d;
    const p = ((L % 4) + 4) % 4;
    if (!panes[p]) return;
    const dentro = L >= 0 && L < faces.length;
    panes[p].className = 'face' + (dentro ? faceClass(faces[L]) : '');
    panes[p].innerHTML = dentro ? faceHTML(faces[L], L) : '';
  });
}

   treze peças básicas montadas em fiadas. Pressionar espalha as
   peças pelo palco; o botão Refazer traz todas de volta.

const RED = '#D8443A', RED2 = '#B4352D', BLUE = '#2F6FB5',
      WHITE = '#DDE6EC', YEL = '#F0B44A';

const BOAT = [
  /* casco, fiada de baixo */
  { x:  20, y: 139, w: 2, c: RED  }, { x:  68, y: 139, w: 2, c: RED  },
  { x: 116, y: 139, w: 2, c: RED  }, { x: 164, y: 139, w: 2, c: RED  },
  /* casco, segunda fiada */
  { x:  44, y: 113, w: 2, c: RED2 }, { x:  92, y: 113, w: 2, c: RED2 },
  { x: 140, y: 113, w: 2, c: RED2 },
  /* convés e proa */
  { x:  68, y:  87, w: 2, c: BLUE }, { x: 116, y:  87, w: 2, c: BLUE },
  { x: 164, y:  87, w: 1, c: WHITE },
  /* cabine */

function LEGO(){
  const bricks = BOAT.map((b, i) =>
    `<i class="brick" data-hx="${b.x}" data-hy="${b.y}" data-w="${b.w}"
        style="--w:${b.w};--c:${b.c};--hx:${b.x}px;--hy:${b.y}px;--d:${i * 16}ms"></i>`
  ).join('');
  return `<div class="lego-stage">${bricks}</div>
    <button class="lego-redo" type="button" title="Juntar as peças de novo">↺ Refazer</button>`;
}

/* monta o botão "?" e os elementos que ele revela, um por clique */
const REVEALS = (list, cfg) => {
  if (!list || !list.length) return '';
  const items = list.map(r => {
    const body = r.kind === 'rock'     ? ROCK()
      : r.kind === 'lego'     ? LEGO()
      : r.kind === 'cube'     ? CUBE(r.faces || [], r.id)
      : r.kind === 'molecule' ? MOLECULE()
      : r.kind === 'glass'    ? GLASS()
      : r.kind === 'vessel'   ? VESSEL(r)
      : r.kind === 'gas'      ? GAS(r.sim, r)
      : r.kind === 'caixa'    ? `<div class="cx"><div class="cx-tit">${r.tit || ''}</div>`
                              + `<div class="cx-corpo"${r.digita
                                  ? ` data-txt="${r.digita}"` : ''}>${
                                  r.digita ? '' : (r.corpo || '')}</div></div>`
      : r.kind === 'painel'   ? `<div class="pn ${r.estilo || 'ionica'}"${
                                  r.rede ? ` data-rede="${r.rede}"` : ''}${
                                  r.campo ? ` data-campo="${r.campo}"` : ''}>`
                              + `<div class="pn-tit">${r.tit || ''}</div>`
                              + `<div class="pn-corpo">${
                                  r.img ? `<img src="${r.img}" alt="${r.alt || ''}" draggable="false">`
                                : r.corpo === 'glass'
                                  ? `<div style="--base:${r.objBase
                                        || Math.round((r.base || 430) * 0.5)}">${GLASS()}</div>`
                                : (r.corpo || '')}</div>`
                              + `<div class="pn-q">${
                                  r.campo ? MOLS_PN(r.base || 430,
                                                    (r.base || 430) * 0.84, 11) : ''}</div>`
                              + (r.rede || r.campo
                                  ? `<button class="pn-sair" type="button" tabindex="-1"
                                             title="Sair">&#8592; Voltar</button>` : '')
                              + `</div>`
      : r.kind === 'reticulo' ? (r.lupa
          ? `<div class="rd-stage lupa"><i class="lupa-vidro"></i>`
            + `<i class="lupa-aro"></i></div>`
          : `<div class="rd-stage"></div>`)
      : r.kind === 'tabela'   ? TABELA()
      : r.kind === 'lewis'    ? `<div class="lw-stage">${LEWIS_VAZIO}</div>`
      : r.kind === 'acao'     ? ''
      : r.kind === 'ajuda'    ? `<div class="aj"><b>?</b>${r.rot || 'ajuda'}</div>`
      : r.kind === 'sphere'
        ? (() => {                         /* sem cor explícita, vale a do elemento */
            const c = r.color || EL_COLOR[r.label];
            return `<div class="ball"${c ? ` style="background:${sphereBg(c)}"` : ''}></div>`;
          })()
      : r.img
        ? `<img src="${r.img}" alt="${r.alt || r.caption || ''}" draggable="false">`
      : `<div class="txt">${r.text || ''}</div>`;
    /* símbolo de elemento é mono curto; rótulo de objeto é palavra */
    const inner = (r.label ? `<div class="${r.kind === 'sphere' ? 'sym' : 'lbl'}">${r.label}</div>` : '')
      + body
      + (r.caption ? `<div class="cap">${r.caption}</div>` : '');
    const zoomable = (r.kind === 'glass' || r.kind === 'vessel') ? ' zoomable' : '';
    return `<div class="reveal-item ${r.kind || ''} ${r.tone || ''}${r.nowrap ? ' nowrap' : ''}${r.bullet ? ' bullet' : ''}${r.flip ? ' flip' : ''}${
  r.aberto ? ' aberto' : ''}${r.fixo ? ' fixo' : ''}${r.nu ? ' nua' : ''}${zoomable}" hidden
                 data-x="${r.x}" data-y="${r.y}"
                 ${r.id   ? `data-id="${r.id}"`     : ''}
                 ${r.from ? `data-from="${r.from}"` : ''}
                 ${r.rede ? `data-rede="${r.rede}"` : ''}
                 ${r.cam  ? `data-cam="${r.cam.join(',')}"` : ''}
                 ${r.lupa ? `data-lupa="1"` : ''}
                 ${r.esq  ? `data-esq="1"`          : ''}
                 ${r.aberto ? `data-aberto="1"`     : ''}
                 ${r.eatom  ? `data-eatom="${r.eatom}"` : ''}
                 ${r.tit    ? `data-tit="${r.tit}"`       : ''}
                 ${r.estilo ? `data-estilo="${r.estilo}"` : ''}
                 ${r.corpo  ? `data-corpo="${r.corpo}"`   : ''}
                 ${r.auto ? `data-auto="1"`         : ''}
                 ${r.face !== undefined ? `data-of="${r.face}"` : ''}
                 ${r.follow !== undefined
                   ? `data-follow="${r.follow === true ? FOLLOW_MS : +r.follow}"` : ''}
                 ${r.label ? `data-label="${r.label}"` : ''}
                 ${r.color ? `data-color="${r.color}"` : ''}
                 ${r.mol   ? `data-mol="${r.mol}"`     : ''}
                 ${r.shape ? `data-shape="${r.shape}"` : ''}
                 ${r.tag   ? `data-tag="${r.tag}"`     : ''}
                 ${r.field ? `data-field="${r.field}"` : ''}
                 ${r.sim   ? `data-sim="${r.sim}"`     : ''}
                 ${r.acao  ? `data-acao="${r.acao}"`   : ''}
                 ${r.alvo  ? `data-alvo="${r.alvo}"`   : ''}
                 ${r.manual ? `data-manual="1"`        : ''}
                 ${r.kind === 'cube' ? `data-face="0" data-faces="${(r.faces || []).length}"` : ''}
                 ${r.exemplos ? `data-exemplos="1"` : ''}
                 style="left:${r.x}px;top:${r.y}px;--base:${r.base || 40};--k:1${
                   r.wch ? `;--wch:${r.wch}` : ''}${
                   r.kind === 'cube' ? `;--face:0` : ''}${
                   /* tface: tamanho que a letra deve TER NA TELA; a face
                      é escalada por base/360, então desconta-se isso */
                   r.tface ? `;--tf:${(r.tface * 360 / (r.base || 360)).toFixed(2)}` : ''
                 }">${inner}</div>`;
  }).join('');
  const comZoom = list.filter(r => r.kind === 'glass' || r.kind === 'vessel');
  const temPedra = list.some(r => r.kind === 'rock');
  const temGrao  = list.some(r => r.fixo);      /* imagem que solta grãos */
  const temPnRede = list.some(r => (r.kind === 'painel' && r.rede)
                                || r.kind === 'reticulo');
  /* a pedra usa o mesmo fundo, mas sem o campo de moléculas: o conteúdo
     ali é a rede 3D desenhada na GPU */
  const cfgQ = comZoom.find(r => r.field) || (comZoom.length ? null : { field: 'bare' });
  void temGrao;
  const tem3d = temPedra || temGrao || temPnRede;
  const quantum = (comZoom.length || tem3d)
    ? QUANTUM(cfgQ, tem3d
        ? `<canvas class="q3d" aria-hidden="true"></canvas>`
          + `<button class="q-voltar" type="button" tabindex="-1"
                     title="Sair do mundo quântico">&#8592; Voltar</button>`
          + `<button class="q-reset" type="button" tabindex="-1"
                     title="Voltar tudo ao lugar">Resetar</button>` : '')
      + (tem3d ? `<div class="cel-rot">célula unitária</div>`
               + `<div class="rede-rot">Retículo Cristalino</div>` : '')
    : '';
  /* quadro solto no slide (fora do mundo quântico), quando o slide pede */
  const quadro = cfg && cfg.quadro
    ? `<button class="q-board-btn solto" type="button" tabindex="-1"
               title="Abrir o quadro branco">Quadro</button>`
      + BOARD(cfg.quadro.x, cfg.quadro.y, cfg.quadro.k)
    : '';
  return `<button class="reveal-btn" type="button" title="Revelar o próximo elemento"
                  aria-label="Revelar o próximo elemento">?</button>${quantum}${quadro}${items}`;
};

function render(){
  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide' + (s.kind === 'cover' ? ' cover' : '')
      + ((s.reveals || []).some(r => (r.kind === 'painel' && (r.rede || r.campo))
                                  || r.kind === 'reticulo')
          ? ' q-confinado' : '');
    el.setAttribute('role','group');
    el.setAttribute('aria-label', `Slide ${i+1} de ${SLIDES.length}: ${s.title}`);

    if (s.kind === 'cover'){
      el.innerHTML = `
        <div class="left">
          <div class="kicker">Química · Apresentação</div>
          <h1>Ligações <em>Químicas</em></h1>
          <div class="bond"><span class="line a"></span><span class="line b"></span><span class="e l"></span><span class="e r"></span></div>
          <p class="prof"><span>Professor:</span> Amauri Junior</p>
        </div>
        <div class="right">${HERO}</div>`;
    } else {
      const body = `<div class="body-area solo">${s.content || ''}</div>`;
      el.innerHTML = `
        ${REVEALS(s.reveals, s)}
        <div class="elem" aria-hidden="true">
          <span>${i+1}</span><b>${ELEMENTS[i] || i+1}</b><i>slide ${i+1}</i>
        </div>
        <h2 class="title${s.tsize ? ' uma' : ''}"
            ${s.tsize ? `style="font-size:${s.tsize}px"` : ''}>${s.title}</h2>
        <div class="bond"><span class="line a"></span><span class="line b"></span><span class="e l"></span><span class="e r"></span></div>
        <p class="subtitle">${s.subtitle || ''}</p>
        ${body}
        <div class="foot">Ligações Químicas · Prof. Amauri Junior</div>`;
    }
    deck.appendChild(el);
  });
  slides = [...deck.querySelectorAll('.slide')];
  /* cubo de exemplos: a primeira face precisa nascer montada, senão o
     átomo só ganharia alvo e saldo no primeiro giro */
  slides.forEach(sl => {
    if (sl.querySelector('.reveal-item.cube[data-exemplos]')) poeExemplo(sl, 0);
  });

  grid.innerHTML = SLIDES.map((s,i) => `
    <button class="card" data-go="${i}">
      <div class="mini"><div class="mini-palco"></div></div>
      <div class="rot">
        <div class="n">${String(i+1).padStart(2,'0')} · ${ELEMENTS[i] || ''}</div>
        <div class="t">${s.mini || s.title}</div>
        ${s.subtitle ? `<div class="s">${s.subtitle}</div>` : ''}
      </div>
    </button>`).join('');
}

/* ------------------------------------------------------------
   MOTOR DE TRANSIÇÃO
   slide 1 <-> 2 ....: cubo girando
   do slide 2 em diante: empurrão, invertido ao voltar
   ------------------------------------------------------------ */
const FX_CLASSES = [
  'is-leaving',
  'fx-cube-in-next','fx-cube-out-next','fx-cube-in-prev','fx-cube-out-prev',
  'fx-desl-in-next','fx-desl-out-next','fx-desl-in-prev','fx-desl-out-prev'
];
let fxTimer;

function clearFx(){
  slides.forEach(el => el.classList.remove(...FX_CLASSES));
  fxLayer.classList.remove('run');
  /* a pedra não fica desmontada se o slide mudar com o dedo apoiado */
  deck.querySelectorAll('.reveal-item.broken, .reveal-item.pressing, .reveal-item.zoomed')
      .forEach(r => { r.classList.remove('pressing'); restoreRock(r); closeQuantum(r); });
}

function go(n, instant){
  const to = Math.max(0, Math.min(SLIDES.length - 1, n));
  const from = current;
  const animate = !instant && slides.length && to !== from;

  clearTimeout(fxTimer);
  clearFx();
  current = to;
  slides.forEach((el, i) => el.classList.toggle('is-active', i === to));

  if (animate){
    const dir  = to > from ? 'next' : 'prev';
    const cube = from === 0 || to === 0;
    const kind = cube ? 'cube' : 'desl';       /* os dois seguem o sentido */
    /* A passagem entre o slide 3 e o 4 corre a 60% da velocidade das
       outras — 0,62s viram 1,03s. Vale nos dois sentidos. */
    const lenta = (from === 2 && to === 3) || (from === 3 && to === 2);
    stage.style.setProperty('--t-desl', lenta ? '1.03s' : '');
    void stage.offsetWidth;                    /* reinicia animação interrompida */
    slides[from].classList.add('is-leaving', `fx-${kind}-out-${dir}`);
    slides[to].classList.add(`fx-${kind}-in-${dir}`);
    fxTimer = setTimeout(clearFx, cube ? 950 : (lenta ? 1250 : 750));
  }

  /* retículo que mora no slide: o laço 3D retoma ao entrar nele */
  const sl2 = slides[to];
  const cv2 = sl2 && sl2.querySelector('.q3d');
  if (cv2 && sl2.classList.contains('quantum-on') && iniciaG3(cv2)) lacoG3(cv2);

  counter.innerHTML = `<b>${current+1}</b> / ${SLIDES.length}`;
  progress.style.width = ((current+1) / SLIDES.length * 100) + '%';
  atualizaBarra();
  [...grid.children].forEach((c,i) => c.classList.toggle('current', i === current));
}

let fitScale = 1;
function fit(){
  const vv = window.visualViewport;
  const w = vv ? vv.width  : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  fitScale = Math.min(w / 1280, h / 720);
  stage.style.setProperty("--fit", fitScale);
}



/* ------------------------------------------------------------
   MOTOR 3D  (WebGL)
   Esferas e hastes de geometria real, com profundidade, luz por
   pixel e câmera em órbita livre. Serve a duas cenas: a rede da
   pedra (slide 2) e o retículo do NaCl (slide 9).
   ------------------------------------------------------------ */
const G3 = {
  gl: null, prog: null, esfera: null, bastao: null,
  atomos: [], hastes: [], laco: 0, t: 0, alvo: 0,
  az: -0.42, el: 0.28, dist: 470, px: 640, py: 360,
  canvas: null, lupa: null, lupaCv: null, lupaClip: '',
  modo: 'pedra', celOff: [0, 0, 0], celC: [0, 0, 0], cantos: [], slide: null,
  volta: 0, pulso: 0, drama: 0, voo: 0, distAlvo: 0, celQ: null,
  agita: 0, funde: 0, fundeAlvo: 0, t9: 0, cliva: 0, clivaAlvo: 0
};

/* --- álgebra --- */
function m4perspectiva(fov, aspecto, perto, longe){
  const f = 1 / Math.tan(fov / 2), d = perto - longe;
  return [f / aspecto,0,0,0, 0,f,0,0, 0,0,(longe + perto) / d,-1, 0,0,2 * longe * perto / d,0];
}
function m4olhar(olho, alvo, cima){
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const cruz = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm = (v) => { const n = Math.hypot(...v) || 1; return [v[0]/n, v[1]/n, v[2]/n]; };
  const pto = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const z = norm(sub(olho, alvo)), x = norm(cruz(cima, z)), y = cruz(z, x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
          -pto(x,olho), -pto(y,olho), -pto(z,olho), 1];
}
/* matriz de um objeto que só transladou e escalou uniformemente */
function m4esfera(c, r){
  return [r,0,0,0, 0,r,0,0, 0,0,r,0, c[0],c[1],c[2],1];
}
/* matriz de uma haste do ponto a ao ponto b, com raio dado.
   A malha do bastão vai de y=0 a y=1 com raio 1, então basta
   girar o eixo Y até a direção da haste. */
function m4haste(a, b, r){
  const d = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
  const L = Math.hypot(...d) || 1;
  const u = [d[0]/L, d[1]/L, d[2]/L];
  /* Rodrigues: gira o eixo Y da malha até a direção u.
     eixo = Y x u = (uz, 0, -ux) ;  cos = u.y ;  sen = |Y x u| */
  const s = Math.hypot(u[2], u[0]);
  let X, Y, Z;
  if (s < 1e-6){                            /* já paralelo a Y */
    const sg = u[1] >= 0 ? 1 : -1;
    X = [1,0,0]; Y = [0,sg,0]; Z = [0,0,sg];
  } else {
    const kx = u[2]/s, kz = -u[0]/s;        /* eixo normalizado (ky = 0) */
    const c = u[1], t = 1 - c;
    X = [c + kx*kx*t,  kz*s,      kz*kx*t];        /* coluna 0 */
    Y = [-kz*s,        c,         kx*s];           /* coluna 1 -> vira u */
    Z = [kx*kz*t,      -kx*s,     c + kz*kz*t];    /* coluna 2 */
  }
  return [X[0]*r, X[1]*r, X[2]*r, 0,
          Y[0]*L, Y[1]*L, Y[2]*L, 0,
          Z[0]*r, Z[1]*r, Z[2]*r, 0,
          a[0], a[1], a[2], 1];
}

/* --- malhas --- */
function malhaEsfera(fatias, aneis){
  const pos = [], idx = [];
  for (let i = 0; i <= aneis; i++){
    const fi = i * Math.PI / aneis, sf = Math.sin(fi), cf = Math.cos(fi);
    for (let j = 0; j <= fatias; j++){
      const te = j * 2 * Math.PI / fatias;
      pos.push(sf * Math.cos(te), cf, sf * Math.sin(te));
    }
  }
  for (let i = 0; i < aneis; i++)
    for (let j = 0; j < fatias; j++){
      const a = i * (fatias + 1) + j, b = a + fatias + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  /* na esfera unitária a normal é a própria posição */
  return { pos: new Float32Array(pos), nor: new Float32Array(pos),
           idx: new Uint16Array(idx), n: idx.length };
}
function malhaBastao(lados){
  const pos = [], nor = [], idx = [];
  for (let j = 0; j <= lados; j++){
    const a = j * 2 * Math.PI / lados, c = Math.cos(a), s = Math.sin(a);
    pos.push(c, 0, s); nor.push(c, 0, s);
    pos.push(c, 1, s); nor.push(c, 0, s);
  }
  for (let j = 0; j < lados; j++){
    const a = j * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  return { pos: new Float32Array(pos), nor: new Float32Array(nor),
           idx: new Uint16Array(idx), n: idx.length };
}

const VS = `
attribute vec3 aPos, aNor;
uniform mat4 uProj, uView, uModel;
varying vec3 vN, vP;
void main(){
  vec4 p = uModel * vec4(aPos, 1.0);
  vP = p.xyz;
  vN = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz) * aNor;
  gl_Position = uProj * uView * p;
}`;

/* O sinal da carga é desenhado DENTRO da esfera, pelo próprio sombreador:
   nada de 343 objetos novos na cena. Para cada ponto da superfície,
   projetamos a normal nos eixos da câmera — dá uma coordenada no disco
   que está de frente para nós — e ali pintamos a barra do menos ou a
   cruz do mais. Como os eixos são os da câmera, o sinal sempre encara
   quem olha, gire a cena para onde girar. */
const FS = `
precision mediump float;
varying vec3 vN, vP;
uniform vec3 uCor, uCam, uDir, uCim;
uniform float uOpaco, uEsp, uCarga;
void main(){
  vec3 N = normalize(vN);
  vec3 L = normalize(vec3(-0.45, 0.8, 0.62));
  vec3 V = normalize(uCam - vP);
  vec3 H = normalize(L + V);
  float dif = max(dot(N, L), 0.0);
  float esp = pow(max(dot(N, H), 0.0), 46.0) * uEsp;
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  vec3 c = uCor * (0.17 + 0.9 * dif) + vec3(1.0) * esp + vec3(0.5, 0.9, 1.0) * rim * 0.18;

  if (uCarga != 0.0){
    float frente = dot(N, normalize(uCam - vP));
    float a = dot(N, uDir), b = dot(N, uCim);
    float braco = 0.085, comp = 0.30;
    float barra = step(abs(b), braco) * step(abs(a), comp);
    float pe    = step(abs(a), braco) * step(abs(b), comp);
    float marca = (uCarga > 0.0) ? max(barra, pe) : barra;
    /* só na parte que está de frente, e sumindo perto da silhueta */
    marca *= smoothstep(0.55, 0.75, frente);
    c = mix(c, vec3(1.0), marca * 0.92);
  }
  gl_FragColor = vec4(c, uOpaco);
}`;

function compila(gl, tipo, src){
  const s = gl.createShader(tipo);
  gl.shaderSource(s, src); gl.compileShader(s);
  return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
}
function programa(gl, vs, fs){
  const p = gl.createProgram();
  const a = compila(gl, gl.VERTEX_SHADER, vs), b = compila(gl, gl.FRAGMENT_SHADER, fs);
  if (!a || !b) return null;
  gl.attachShader(p, a); gl.attachShader(p, b); gl.linkProgram(p);
  return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null;
}

/* --- cena 1: a rede da pedra --- */
function cenaPedra(){
  const rnd = rng(20260828);
  const cols = 5, fil = 4, cam = 3, ex = 46, ey = 44, ez = 60;
  const at = [], lig = [];
  for (let l = 0; l < cam; l++){
    const ox = l % 2 ? ex / 2 : 0, oy = l % 2 ? ey / 2 : 0;
    for (let r = 0; r < fil; r++)
      for (let c = 0; c < cols; c++){
        const ang = rnd() * Math.PI * 2, u = rnd(), v = rnd() * 2 - 1;
        const raio = Math.cbrt(u), sf = Math.sqrt(1 - v * v);
        at.push({
          rede:  [ (c - (cols-1)/2) * ex + ox, -((r - (fil-1)/2) * ey + oy),
                   (l - (cam-1)/2) * ez ],
          pedra: [ Math.cos(ang) * sf * raio * 96, v * raio * 62,
                   Math.sin(ang) * sf * raio * 62 ],
          atraso: rnd() * 0.3, raio: 15, cor: [0.27, 0.79, 0.70], cel: false
        });
      }
  }
  for (let i = 0; i < at.length; i++)
    if ((i % cols) !== cols - 1) lig.push([i, i + 1, 2.2]);
  return { at, lig };
}

/* Lamelas Cl–Mg–Cl empilhadas. Dentro de cada lamela, três camadas
   compactas nas posições A, B e C do empacotamento: os cloretos em A e C,
   os magnésios em B, no meio. Entre uma lamela e a seguinte há uma folga,
   que é o que faz este cristal esfoliar em placas. */
/* Corindo. Camadas compactas de oxigênio se alternando entre as posições
   A e B; entre cada duas delas há uma camada de buracos octaédricos, na
   posição C, e o alumínio ocupa dois de cada três. O terço vago gira de
   posição a cada camada, o que dá a proporção exata de 2 Al para 3 O. */
function redeCorindo(R){
  const a = 54;                          /* passo dentro da camada */
  const h = a * Math.sqrt(2 / 3);        /* altura de uma camada de O à seguinte */
  const nx = 6, nz = 6, k = 5;           /* 5 pares (camada de O + camada de Al) */
  const s3 = Math.sqrt(3);
  const A = [0, 0], B = [a / 2, a * s3 / 6], C = [a, a * s3 / 3];
  const at = [];

  for (let L = 0; L < 2 * k; L++){
    const ehO = L % 2 === 0;
    const p   = L / 2 | 0;                       /* qual par */
    const off = ehO ? (p % 2 ? B : A) : C;       /* O alterna A/B; Al sempre em C */
    const y   = ehO ? p * h : (p + 0.5) * h;
    const vaga = p % 3;                          /* o terço que fica vazio */
    const q = ehO ? R.anion : R.cation;
    for (let i = 0; i < nx; i++)
      for (let j = 0; j < nz; j++){
        /* dois de cada três buracos octaédricos recebem alumínio */
        if (!ehO && ((i - j) % 3 + 3) % 3 === vaga) continue;
        at.push({ rede: [ i * a + j * a / 2 + off[0], y, j * a * s3 / 2 + off[1] ],
                  pedra: null, atraso: 0, ijk: [i, L, j],
                  raio: q.raio, cor: q.cor, anion: ehO,
                  carga: ehO ? -1 : 1, cel: false });
      }
  }
  const c = [0,1,2].map(e => at.reduce((sm, x) => sm + x.rede[e], 0) / at.length);
  at.forEach(x => { x.rede = x.rede.map((v, e) => v - c[e]); x.pedra = x.rede; });

  /* cada alumínio se prende aos oxigênios do seu octaedro */
  const lig = [], lim = a * 0.78;
  at.forEach((al, ia) => {
    if (al.anion) return;
    at.forEach((o, io) => {
      if (!o.anion) return;
      const d = Math.hypot(o.rede[0] - al.rede[0],
                           o.rede[1] - al.rede[1],
                           o.rede[2] - al.rede[2]);
      if (d < lim) lig.push([ia, io, 3.0]);
    });
  });

  const span = e => Math.max(...at.map(x => x.rede[e])) - Math.min(...at.map(x => x.rede[e]));
  const ext = Math.max(span(0), span(1), span(2)) + 2 * R.anion.raio;
  /* o pedaço que sai é um trecho 3x3 de uma camada de O com a de Al
     acima dela: 9 oxigênios e 6 alumínios, os mesmos 2:3 do cristal */
  return { at, lig, ext, n: [nx, 2 * k, nz],
           celula: { tam: [3, 2, 3], alinha: [0, 2, 0] } };
}

function redeCamadas(R){
  const a = 54;                          /* passo dentro da camada */
  const h = a * Math.sqrt(2 / 3);        /* altura de uma camada à seguinte */
  const vao = h * 1.35;                  /* folga entre lamelas */
  const H = 2 * h + vao;
  const nx = 6, nz = 6, ns = 3;          /* 3 lamelas de 6x6 */
  const s3 = Math.sqrt(3);
  const off = [ [0, 0], [a / 2, a * s3 / 6], [a, a * s3 / 3] ];   /* A, B, C */
  const at = [], lig = [];

  for (let s = 0; s < ns; s++)
    [[0, 0, true], [h, 1, false], [2 * h, 2, true]].forEach(([dy, o, ehCl], L) => {
      const q = ehCl ? R.anion : R.cation;
      for (let i = 0; i < nx; i++)
        for (let j = 0; j < nz; j++){
          const p = [ i * a + j * a / 2 + off[o][0],
                      s * H + dy,
                      j * a * s3 / 2 + off[o][1] ];
          at.push({ rede: p, pedra: p, atraso: 0, ijk: [i, s * 3 + L, j],
                    raio: q.raio, cor: q.cor, anion: ehCl,
                    carga: ehCl ? -1 : 1, cel: false });
        }
    });

  /* centra o bloco na origem, senão a câmera olharia para o canto dele */
  const c = [0,1,2].map(e => at.reduce((sm, x) => sm + x.rede[e], 0) / at.length);
  at.forEach(x => { x.rede = x.rede.map((v, e) => v - c[e]); x.pedra = x.rede; });

  /* cada magnésio se liga aos seis cloretos do seu octaedro */
  const lim = a * 1.08;
  at.forEach((m, im) => {
    if (m.anion) return;
    at.forEach((cl, ic) => {
      if (!cl.anion) return;
      const d = Math.hypot(cl.rede[0] - m.rede[0],
                           cl.rede[1] - m.rede[1],
                           cl.rede[2] - m.rede[2]);
      if (d < lim) lig.push([im, ic, 3.4]);
    });
  });

  const span = e => Math.max(...at.map(x => x.rede[e])) - Math.min(...at.map(x => x.rede[e]));
  const ext = Math.max(span(0), span(1), span(2)) + 2 * R.anion.raio;
  /* o pedaço que se arranca é uma lamela inteira num trecho 2x2:
     4 Cl em cima, 4 Mg no meio, 4 Cl embaixo — os mesmos 1:2 do cristal */
  return { at, lig, ext, n: [nx, ns * 3, nz],
           celula: { tam: [2, 3, 2], alinha: [0, 3, 0] } };
}

/* --- cena 2: retículos do tipo cloreto de sódio ---
   NaCl e MgO têm a MESMA estrutura (sal-gema): sítios alternados, cada
   íon cercado por seis do outro. Só mudam as cores e os raios.
   Os raios saem dos raios iônicos reais, na mesma escala:
     Cl- 181pm -> 21    Na+ 102pm -> 12
     O2- 140pm -> 16    Mg2+ 72pm ->  8
   Por isso as bolas do MgO são visivelmente menores que as do NaCl. */
const CPK = {
  Cl: [0.15, 0.85, 0.15],   /* verde    */
  Na: [0.67, 0.36, 0.95],   /* roxo     */
  O:  [1.00, 0.05, 0.05],   /* vermelho */
  Mg: [0.54, 1.00, 0.00],   /* verde do magnésio */
  Al: [0.75, 0.65, 0.65]    /* cinza rosado do alumínio */
};
/* Raios na mesma escala para todos, tirados dos raios iônicos reais:
     Cl- 181pm -> 21   O2- 140pm -> 16   Na+ 102pm -> 12   Mg2+ 72pm -> 8  */
const REDES = {
  /* sal-gema: 1:1, cada íon cercado por seis do outro */
  nacl: { forma: 'salgema',
          anion:  { cor: CPK.Cl, raio: 21 },
          cation: { cor: CPK.Na, raio: 12 } },
  mgo:  { forma: 'salgema',
          anion:  { cor: CPK.O,  raio: 16 },
          cation: { cor: CPK.Mg, raio:  8 } },
  /* antifluorita: 2:1. O óxido de sódio NÃO é sal-gema — os oxigênios
     formam um cubo de faces centradas e os sódios ocupam TODOS os oito
     buracos tetraédricos, então há dois cátions para cada ânion. */
  na2o: { forma: 'antifluorita',
          anion:  { cor: CPK.O,  raio: 16 },
          cation: { cor: CPK.Na, raio: 12 } },
  /* camadas (tipo CdCl2): 1:2. O cloreto de magnésio não é sal-gema nem
     antifluorita — ele se arruma em lamelas Cl–Mg–Cl empilhadas, com uma
     folga entre elas. Cada Mg fica no centro de um octaedro de seis Cl,
     e cada Cl toca três Mg, o que dá dois cloretos por magnésio. */
  mgcl2:{ forma: 'camadas',
          anion:  { cor: CPK.Cl, raio: 21 },
          cation: { cor: CPK.Mg, raio:  8 } },
  /* corindo: 2:3. Os oxigênios se empilham em hexagonal compacta e os
     alumínios ocupam DOIS TERÇOS dos buracos octaédricos — o terço vazio
     muda de lugar a cada camada. É essa lacuna ordenada que dá a
     proporção Al2O3, e é o que faz o corindo (rubi, safira) tão duro. */
  al2o3:{ forma: 'corindo',
          anion:  { cor: CPK.O,  raio: 16 },
          cation: { cor: CPK.Al, raio:  6 } }
};

/* Onde cada íon vai parar quando o retículo desaba, e a fase própria do
   tremor térmico. O chão fica abaixo de tudo, e cada um cai num ponto
   sorteado por perto — o monte fica irregular, como monte de verdade. */
function poeChao(c){
  const rnd = rng(4242);
  const minY = Math.min(...c.at.map(a => a.rede[1]));
  const piso = minY - 76;                  /* o monte inteiro abaixo da rede */
  /* Onde passam os planos de clivagem: no vão entre as duas camadas
     centrais de cada eixo. O corte nunca atravessa uma camada de íons —
     o cristal parte entre planos, não pelo meio deles. */
  const vao = eixo => {
    const v = [...new Set(c.at.map(a => a.rede[eixo]))].sort((p, q) => p - q);
    const m = v.length >> 1;
    return (v[m] + v[m - 1]) / 2;
  };
  const corte = [vao(0), vao(1), vao(2)];
  c.at.forEach(a => {
    a.fase = rnd() * 6.283;
    a.chao = [ a.rede[0] + (rnd() - .5) * 130,
               piso + rnd() * 46,
               a.rede[2] + (rnd() - .5) * 130 ];
    a.lado = [ a.rede[0] > corte[0] ? 1 : -1,
               a.rede[1] > corte[1] ? 1 : -1,
               a.rede[2] > corte[2] ? 1 : -1 ];
  });
  return c;
}

function cenaRede(tipo){
  const R = REDES[tipo] || REDES.nacl;
  if (R.forma === 'antifluorita') return poeChao(redeAntifluorita(R));
  if (R.forma === 'camadas')      return poeChao(redeCamadas(R));
  if (R.forma === 'corindo')      return poeChao(redeCorindo(R));
  return poeChao(redeSalgema(R));
}

function redeSalgema(R){
  const n = 7, e = 54;      /* 3x3x3 celulas unitarias */
  const at = [], lig = [], idx = {};
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++)
      for (let k = 0; k < n; k++){
        const par = (i + j + k) % 2 === 0;     /* soma par = ânion, o maior */
        const q = par ? R.anion : R.cation;
        const p = [ (i - (n-1)/2) * e, (j - (n-1)/2) * e, (k - (n-1)/2) * e ];
        idx[`${i},${j},${k}`] = at.length;
        at.push({
          rede: p, pedra: p, atraso: 0, ijk: [i, j, k],
          raio: q.raio, cor: q.cor,
          carga: par ? -1 : 1,                  /* ânion e cátion */
          cel: false                            /* escolhido na hora do arrasto */
        });
      }
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++)
      for (let k = 0; k < n; k++){
        const a = idx[`${i},${j},${k}`];
        [[1,0,0],[0,1,0],[0,0,1]].forEach(([di,dj,dk]) => {
          const b = idx[`${i+di},${j+dj},${k+dk}`];
          if (b !== undefined) lig.push([a, b, 3.4]);
        });
      }
  const ext = (n - 1) * e + 2 * R.anion.raio;
  /* a célula é o bloco 3x3x3 centrado no íon tocado */
  return { at, lig, ext, n, celula: { tam: 3, alinha: 0 } };
}

/* Antifluorita, em passos de um quarto de aresta. Com índices inteiros
   nessa malha:
     os três ímpares .................. cátion (buraco tetraédrico)
     os três pares e (i+j+k)/2 par .... ânion (posição do cubo de faces
                                        centradas)
   Parando um passo antes da borda, sai a proporção exata de 2:1. */
function redeAntifluorita(R){
  const cel = 4, m = 3, N = cel * m;    /* 3x3x3 células, passo = a/4 */
  const h = 31;                          /* aresta da célula = 124 */
  const at = [], lig = [], idx = {};
  const eAnion  = (i,j,k) => i%2===0 && j%2===0 && k%2===0 && ((i+j+k)/2)%2===0;
  const eCation = (i,j,k) => i%2===1 && j%2===1 && k%2===1;
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++)
      for (let k = 0; k < N; k++){
        const an = eAnion(i,j,k), ca = eCation(i,j,k);
        if (!an && !ca) continue;
        const q = an ? R.anion : R.cation;
        const p = [ (i - (N-1)/2) * h, (j - (N-1)/2) * h, (k - (N-1)/2) * h ];
        idx[`${i},${j},${k}`] = at.length;
        at.push({
          rede: p, pedra: p, atraso: 0, ijk: [i, j, k],
          raio: q.raio, cor: q.cor, anion: an,
          carga: an ? -1 : 1,
          cel: false
        });
      }
  /* cada cátion se liga aos quatro ânions do seu tetraedro */
  at.forEach((a, ia) => {
    if (a.anion) return;
    const [i,j,k] = a.ijk;
    [-1,1].forEach(di => [-1,1].forEach(dj => [-1,1].forEach(dk => {
      const b = idx[`${i+di},${j+dj},${k+dk}`];
      if (b !== undefined && at[b].anion) lig.push([ia, b, 3.4]);
    })));
  });
  const ext = (N - 1) * h + 2 * R.anion.raio;
  /* a célula convencional é um cubo de aresta inteira, encaixado na malha */
  return { at, lig, ext, n: N, celula: { tam: cel, alinha: cel } };
}

/* deslocamento da célula unitária ao ser puxada para fora */
const CEL_MAX = 260;
const CEL_ESC = 0.8;      /* fora do retículo ela fica 20% menor */

/* Cada slide tem o seu <canvas>, e um contexto WebGL pertence a UM
   canvas só. Guardamos o contexto e as malhas de cada um: assim trocar
   de slide troca de contexto em vez de continuar desenhando no canvas
   do slide anterior — que era o motivo de o retículo aparecer só no
   primeiro slide em que se entrava. */
const G3POR = new WeakMap();

function iniciaG3(canvas){
  if (!canvas) return false;
  if (G3.gl && G3.canvas === canvas) return true;

  const feito = G3POR.get(canvas);
  if (feito){                              /* já montado antes: só reassume */
    G3.gl = feito.gl; G3.prog = feito.prog;
    G3.esfera = feito.esfera; G3.bastao = feito.bastao;
    G3.esferaP = feito.esferaP; G3.bastaoP = feito.bastaoP;
    G3.canvas = canvas;
    return true;
  }

  const gl = canvas.getContext('webgl', { alpha: true, antialias: true,
                                          premultipliedAlpha: false });
  if (!gl) return false;
  G3.gl = gl;
  G3.canvas = canvas;
  G3.prog = programa(gl, VS, FS);
  if (!G3.prog){ G3.gl = null; G3.canvas = null; return false; }

  const sobe = (m) => {
    const bp = gl.createBuffer(), bn = gl.createBuffer(), bi = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bp);
    gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bn);
    gl.bufferData(gl.ARRAY_BUFFER, m.nor, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bi);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
    return { bp, bn, bi, n: m.n };
  };
  G3.esfera = sobe(malhaEsfera(18, 13));
  G3.bastao = sobe(malhaBastao(10));
  /* No reticulo cada ion mede pouco mais de 30px: malha miuda ali nao
     aparece, e sao mais de mil desenhos por quadro a economizar. */
  G3.esferaP = sobe(malhaEsfera(11, 8));
  G3.bastaoP = sobe(malhaBastao(6));

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  G3POR.set(canvas, { gl, prog: G3.prog,
                      esfera: G3.esfera,  bastao: G3.bastao,
                      esferaP: G3.esferaP, bastaoP: G3.bastaoP });
  return true;
}

function montaCena(modo){
  const c = REDES[modo] ? cenaRede(modo) : cenaPedra();
  G3.atomos = c.at; G3.hastes = c.lig; G3.modo = modo;
  G3.celOff = [0, 0, 0];
  G3.cantos = c.cantos || [];
  G3.celC = [0, 0, 0];
  G3.volta = 0; G3.pulso = 0; G3.drama = 0;
  G3.voo = 0; G3.celQ = null;
  G3.agita = 0; G3.funde = 0; G3.fundeAlvo = 0;
  G3.cliva = 0; G3.clivaAlvo = 0;
  G3.ext = c.ext || 0;
  G3.nRede = c.n || 0;
  G3.celula = c.celula || { tam: 3, alinha: 0 };
  G3.dist = REDES[modo] ? 620 : 470;
  G3.dist0 = G3.dist;
}
/* retangulo que a rede inteira ocupa no palco, ja com o raio dos ions */
function caixaRede(){
  if (!G3.atomos.length) return null;
  const c = camG3();
  const L = Math.hypot(c.olho[0], c.olho[1], c.olho[2]) || 1;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  G3.atomos.forEach(a => {
    const p = a.rede;
    const prof = [0,1,2].reduce((sm, e) => sm + (p[e] - c.olho[e]) * (-c.olho[e] / L), 0);
    const r = a.raio * 720 / (2 * Math.max(60, prof) * Math.tan(0.85 / 2));
    const t = paraTela(p);
    if (t.x - r < x0) x0 = t.x - r;
    if (t.x + r > x1) x1 = t.x + r;
    if (t.y - r < y0) y0 = t.y - r;
    if (t.y + r > y1) y1 = t.y + r;
  });
  return { x0, y0, x1, y1 };
}
/* Poe a rede na largura e no ponto pedidos. Estimar nao serve: vista de
   canto, a diagonal projeta mais larga que a aresta, e a perspectiva
   desloca o centro. Entao mede-se o que saiu e corrige-se. */
/* o nome da estrutura, centrado embaixo dela */
function poeRotuloRede(slide){
  const rot = slide && slide.querySelector('.rede-rot');
  if (!rot) return;
  if (!REDES[G3.modo]){ rot.classList.remove('on'); return; }
  const b = caixaRede();
  if (!b) return;
  rot.style.left = ((b.x0 + b.x1) / 2).toFixed(0) + 'px';
  rot.style.top  = (b.y1 + 24).toFixed(0) + 'px';
  rot.classList.add('on');
}

function enquadraRede(cx, cy, larg, alt){
  if (!G3.ext || !G3.atomos.length) return;
  const A = Math.max(40, larg), B = Math.max(40, alt || larg);
  G3.dist = 720 * G3.ext / (2 * A * Math.tan(0.85 / 2));
  for (let i = 0; i < 6; i++){
    let b = caixaRede();
    if (!b) return;
    /* a rede tem que caber nas duas medidas do quadro, nao so na maior */
    const k = Math.max((b.x1 - b.x0) / A, (b.y1 - b.y0) / B);
    if (k > 0.01) G3.dist = Math.max(120, G3.dist * k);
    b = caixaRede();
    G3.px += cx - (b.x0 + b.x1) / 2;
    G3.py += cy - (b.y0 + b.y1) / 2;
  }
  G3.px0 = G3.px; G3.py0 = G3.py; G3.dist0 = G3.dist;
}

const suave = (x) => x * x * (3 - 2 * x);

function desenhaG3(canvas){
  /* laço de um slide que ficou para trás: o contexto já é de outro */
  if (!G3.gl || G3.canvas !== canvas) return;
  const gl = G3.gl;
  if (!gl) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(1280 * dpr), h = Math.round(720 * dpr);
  if (canvas.width !== w){ canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const ce = Math.cos(G3.el), se = Math.sin(G3.el);
  const olho = [ Math.sin(G3.az) * ce * G3.dist, se * G3.dist,
                 Math.cos(G3.az) * ce * G3.dist ];
  const proj = m4perspectiva(0.85, 1280 / 720, 10, 4000);
  /* o rompimento sacode a camera; o tremor nao se acumula porque nao
     encosta em G3.px/py, so no quadro que esta sendo desenhado */
  const tr = G3.drama * 9;
  const tx = G3.px + (Math.random() - .5) * tr;
  const ty = G3.py + (Math.random() - .5) * tr;
  proj[8] = -((tx / 1280) * 2 - 1);
  proj[9] = -(1 - (ty / 720) * 2);
  const view = m4olhar(olho, [0, 0, 0], [0, 1, 0]);

  /* a celula vai para onde o dedo levar; encolhe conforme se afasta,
     para nao ficar do tamanho do reticulo de onde saiu */
  const ag   = (G3.agita || 0) * 6.5;      /* amplitude do tremor, em unidades */
  const fu   = G3.funde || 0;
  /* fundido não cliva: um retículo derretido já não tem planos */
  const cl   = (G3.cliva || 0) * (1 - fu);
  /* Cada plano abre em dois tempos. Primeiro os dois lados DESLIZAM um
     sobre o outro meia distância entre íons — é nesse instante que
     cátion fica de frente para cátion e ânion para ânion. Aí a repulsão
     entre cargas iguais empurra, e só então os lados se AFASTAM. É a
     razão física de o cristal iônico ser quebradiço. */
  const desliza = c => Math.min(1, Math.max(0, c) / 0.45) * 27;
  const afasta  = c => Math.max(0, (c - 0.45) / 0.55) * 35;
  const c1 = Math.min(1, cl), c2 = Math.min(1, cl - 1), c3 = Math.min(1, cl - 2);
  const off  = G3.celOff;
  const dist = Math.hypot(off[0], off[1], off[2]);
  const enc  = 1 - (1 - CEL_ESC) * Math.min(1, dist / CEL_MAX);
  const cC   = G3.celC;
  const pos = G3.atomos.map(a => {
    const u = Math.max(0, Math.min(1, (G3.t - a.atraso) / (1 - a.atraso)));
    const k = suave(u);
    const p = [ a.pedra[0] + (a.rede[0] - a.pedra[0]) * k,
                a.pedra[1] + (a.rede[1] - a.pedra[1]) * k,
                a.pedra[2] + (a.rede[2] - a.pedra[2]) * k ];
    let q = p;
    /* Desabamento: os alicerces se rompem e cada íon cai para o seu
       ponto no chão. O quadrado do progresso dá a aceleração da queda. */
    if (fu > 0.001 && a.chao){
      const g = fu * fu;
      p[0] += (a.chao[0] - a.rede[0]) * g;
      p[1] += (a.chao[1] - a.rede[1]) * g;
      p[2] += (a.chao[2] - a.rede[2]) * g;
    }
    /* Agitação térmica: cresce com a temperatura, some no frio. */
    if (ag > 0.001){
      const w = G3.t9, ph = a.fase || 0;
      p[0] += Math.sin(w * 9.1 + ph) * ag;
      p[1] += Math.sin(w * 11.3 + ph * 1.7) * ag;
      p[2] += Math.sin(w * 8.4 + ph * 2.3) * ag;
    }
    /* Clivagem: o mesmo golpe que parte a pedra parte o retículo.
       Primeiro plano perpendicular a x, depois a z, depois a y — os
       mesmos três da pedra, na mesma ordem. */
    if (cl > 0.001 && a.lado){
      const L = a.lado;
      p[0] += L[0] * afasta(c1);   p[1] += L[0] * desliza(c1);
      p[2] += L[2] * afasta(c2);   p[1] += L[2] * desliza(c2);
      p[1] += L[1] * afasta(c3);   p[0] += L[1] * desliza(c3);
    }
    /* o estufado do reencaixe tambem vale com a celula ja no lugar */
    if (a.cel && (dist > 0.5 || G3.pulso > 0.002 || G3.drama > 0.002 || celGirada())){
      const z = enc * (1 + 0.24 * G3.pulso + 0.30 * G3.drama);
      const d = desloCel(p, z);
      q = [ cC[0] + d[0] + off[0],
            cC[1] + d[1] + off[1],
            cC[2] + d[2] + off[2] ];
    } else if (!a.cel && G3.drama > 0.002){
      /* os vizinhos recuam do estouro, mais perto mais forte */
      const v = [ p[0] - cC[0], p[1] - cC[1], p[2] - cC[2] ];
      const L = Math.hypot(v[0], v[1], v[2]) || 1;
      const w = G3.drama * 30 / (1 + L / 90);
      q = [ p[0] + v[0]/L * w, p[1] + v[1]/L * w, p[2] + v[2]/L * w ];
    }
    /* atomo arrancado da celula anda por conta propria */
    if (a.solto && a.off) q = [ q[0] + a.off[0], q[1] + a.off[1], q[2] + a.off[2] ];
    return q;
  });

  gl.useProgram(G3.prog);
  const L = (n) => gl.getUniformLocation(G3.prog, n);
  const uModel = L('uModel'), uCor = L('uCor'), uEsp = L('uEsp');
  const uCarga = L('uCarga');
  /* eixos da câmera: é neles que o sinal se apoia para encarar quem olha */
  const ce2 = Math.cos(G3.el), se2 = Math.sin(G3.el);
  const sa2 = Math.sin(G3.az), ca2 = Math.cos(G3.az);
  gl.uniform3f(L('uDir'), ca2, 0, -sa2);
  gl.uniform3f(L('uCim'), -sa2 * se2, ce2, -ca2 * se2);
  gl.uniformMatrix4fv(L('uProj'), false, proj);
  gl.uniformMatrix4fv(L('uView'), false, view);
  gl.uniform3f(L('uCam'), olho[0], olho[1], olho[2]);
  gl.uniform1f(L('uOpaco'), G3.t);

  const ap = gl.getAttribLocation(G3.prog, 'aPos');
  const an = gl.getAttribLocation(G3.prog, 'aNor');
  const usa = (m) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, m.bp);
    gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.bn);
    gl.enableVertexAttribArray(an); gl.vertexAttribPointer(an, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.bi);
  };

  /* cena com muitos corpos usa a malha leve */
  const ESF = G3.atomos.length > 200 && G3.esferaP ? G3.esferaP : G3.esfera;
  const BAS = G3.atomos.length > 200 && G3.bastaoP ? G3.bastaoP : G3.bastao;

  /* hastes primeiro: as esferas as cobrem nas pontas */
  if (G3.hastes.length){
    usa(BAS);
    gl.uniform3f(uCor, 0.62, 0.66, 0.70);
    gl.uniform1f(uEsp, 0.5);
    gl.uniform1f(uCarga, 0.0);
    G3.hastes.forEach(([i, j, r]) => {
      const a = G3.atomos[i], b = G3.atomos[j];
      if (fu > 0.02) return;                           /* o retículo desabou */
      if (a.solto || b.solto) return;                  /* atomo arrancado */
      /* nenhuma haste atravessa um plano que já se rompeu */
      if (cl > 0.02 && a.lado && b.lado &&
          ((a.lado[0] !== b.lado[0]) ||
           (cl > 1.02 && a.lado[2] !== b.lado[2]) ||
           (cl > 2.02 && a.lado[1] !== b.lado[1]))) return;
      if (a.cel !== b.cel && (dist > 4 || G3.drama > 0.02)) return;
      gl.uniformMatrix4fv(uModel, false,
        m4haste(pos[i], pos[j], a.cel && b.cel ? r * enc : r));
      gl.drawElements(gl.TRIANGLES, BAS.n, gl.UNSIGNED_SHORT, 0);
    });
  }

  usa(ESF);
  gl.uniform1f(uEsp, 0.85);
  G3.atomos.forEach((a, i) => {
    /* clarao curto ao arrancar e ao reencaixar */
    const fx = a.fx || 0;
    const b = 1 + 2.0 * fx + (a.cel ? 1.2 * G3.pulso + 1.6 * G3.drama : 0);
    gl.uniform3f(uCor, a.cor[0] * b, a.cor[1] * b, a.cor[2] * b);
    gl.uniform1f(uCarga, a.carga || 0);
    const rc = a.cel ? enc * (1 + 0.24 * G3.pulso + 0.30 * G3.drama) : 1;
    gl.uniformMatrix4fv(uModel, false, m4esfera(pos[i], a.raio * rc * (1 + 0.55 * fx)));
    gl.drawElements(gl.TRIANGLES, ESF.n, gl.UNSIGNED_SHORT, 0);
  });
}

function lacoG3(canvas){
  const passo = () => {
    /* Slide fora de cena não desenha. Sem isto, um retículo que fica
       aberto no slide (como o da lupa) continuava desenhando mais de mil
       chamadas por quadro para sempre, em qualquer slide — era o que
       deixava a apresentação pesada. */
    const sl = canvas.closest('.slide');
    if (sl && !sl.classList.contains('is-active')){ G3.laco = 0; return; }
    G3.t += (G3.alvo - G3.t) * 0.12;
    G3.t9 += 0.016;                          /* relógio do tremor */
    segueLupa();                             /* a cena mora na lupa */
    /* a fusão leva os mesmos ~3,3s da poça na cápsula */
    G3.funde += ((G3.fundeAlvo || 0) - G3.funde) * 0.015;
    if (Math.abs((G3.fundeAlvo || 0) - G3.funde) < 0.002)
      G3.funde = G3.fundeAlvo || 0;
    /* A clivagem do retículo segue a da pedra no mesmo compasso: 0,10
       por quadro leva ~1s por plano, que é a duração da transição das
       peças de sal na face do cubo. O que se vê na mão e o que se vê na
       lupa acontecem juntos. */
    G3.cliva += ((G3.clivaAlvo || 0) - G3.cliva) * 0.10;
    if (Math.abs((G3.clivaAlvo || 0) - G3.cliva) < 0.002)
      G3.cliva = G3.clivaAlvo || 0;
    /* voo da camera: entra no grao e recua ate o enquadramento, ou o
       contrario na saida */
    if (G3.voo){
      G3.dist += (G3.distAlvo - G3.dist) * 0.14;
      if (Math.abs(G3.distAlvo - G3.dist) < 2){ G3.dist = G3.distAlvo; G3.voo = 0; }
      if (G3.slide) poeRotuloRede(G3.slide);
    }
    /* a celula volta sozinha ao encaixe, e o clarao decai depois */
    if (G3.volta){
      for (let e = 0; e < 3; e++) G3.celOff[e] *= 0.74;
      /* o giro próprio também se desfaz: ela tem que reencaixar alinhada */
      if (G3.celQ){
        G3.celQ = qNorm([ G3.celQ[0] + (1 - G3.celQ[0]) * 0.26,
                          G3.celQ[1] * 0.74, G3.celQ[2] * 0.74, G3.celQ[3] * 0.74 ]);
      }
      if (celFora() < 1.5){
        G3.celOff = [0, 0, 0]; G3.celQ = null; G3.volta = 0; G3.pulso = 1;
      }
    }
    /* atomos a caminho de volta para a celula */
    G3.atomos.forEach(a => {
      if (!a.voltando || !a.off) return;
      for (let e = 0; e < 3; e++) a.off[e] *= 0.72;
      if (Math.hypot(a.off[0], a.off[1], a.off[2]) < 1.5){
        a.off = null; a.solto = false; a.voltando = false; a.fx = 1;
      }
    });
    G3.atomos.forEach(a => { if (a.fx) a.fx = a.fx > 0.004 ? a.fx * 0.88 : 0; });
    G3.pulso = G3.pulso > 0.004 ? G3.pulso * 0.86 : 0;
    G3.drama = G3.drama > 0.004 ? G3.drama * 0.89 : 0;
    desenhaG3(canvas);
